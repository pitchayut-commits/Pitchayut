.kpi-head h1{font-size:26px; font-weight:800; line-height:1.3; color:var(--green-dd); letter-spacing:-0.2px;
  text-shadow:0 1px 0 rgba(255,255,255,0.8), 0 3px 10px rgba(23,73,29,0.12);}
.kpi-status{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
.badge{display:inline-flex; align-items:center; gap:8px; border-radius:99px; padding:8px 16px;
  font-size:15px; font-weight:700; border:1px solid transparent;}
.badge.pass{background:rgba(234,246,235,0.95); color:var(--green-dd); border-color:rgba(46,133,54,0.45);}
.badge.fail{background:rgba(251,232,228,0.95); color:var(--red); border-color:rgba(184,65,46,0.45);}
.badge.na{background:rgba(255,255,255,0.8); color:var(--ink2); border-color:var(--line);}
.badge.over{background:var(--green-dd); color:#ffffff; border-color:var(--green-dd);}
.badge-sub{font-size:12.5px; color:var(--ink2); line-height:1.6;}

/* ป้ายสถานะในตารางแบบมีไอคอน */
.chip{display:inline-flex; align-items:center; gap:6px; border-radius:99px; font-size:12px; font-weight:600;
  padding:4px 12px; white-space:nowrap; border:1px solid transparent;}

/* ข้อความข้อจำกัดของข้อมูล */
.datalimit{display:flex; gap:8px; align-items:flex-start; margin-top:10px; padding:9px 13px;
  background:rgba(255,243,209,0.9); border:1px solid rgba(217,163,0,0.55); border-radius:var(--r-sm);
  font-size:12.5px; line-height:1.65; color:var(--ink);}
.fnbox{margin-top:14px; font-size:12.5px; color:var(--ink2); line-height:1.75;}
.fnbox .fn-head{font-weight:600; color:var(--ink); margin-bottom:6px;}
.fnbox ol{margin:0; padding-left:20px;}
.fnbox li{margin-bottom:4px;}

/* ข้อ 6 ของคำสั่ง Yuth 7 ก.ย. 2569 ป้ายหรือกล่องใดที่ใส่สี ต้องไล่ระดับสี มีแรเงา และดูนูนขึ้นมา */
.chip.pass,.badge.pass{background:linear-gradient(180deg,#f4fbf5 0%,#e0f1e3 100%);
  box-shadow:0 1px 2px rgba(23,73,29,0.16), inset 0 1px 0 rgba(255,255,255,0.9);}
.chip.fail,.badge.fail{background:linear-gradient(180deg,#fdf2ef 0%,#f6ddd7 100%);
  box-shadow:0 1px 2px rgba(184,65,46,0.18), inset 0 1px 0 rgba(255,255,255,0.9);}
.chip.over,.badge.over{background:linear-gradient(180deg,#2f8438 0%,#17491d 100%);
  box-shadow:0 2px 5px rgba(23,73,29,0.30), inset 0 1px 0 rgba(255,255,255,0.30);}
.chip-grade.gA{background:linear-gradient(180deg,#f4fbf5 0%,#e0f1e3 100%);
  box-shadow:0 1px 2px rgba(23,73,29,0.16), inset 0 1px 0 rgba(255,255,255,0.9);}
.chip-grade.gB{background:linear-gradient(180deg,#fff9e6 0%,#ffeec2 100%);
  box-shadow:0 1px 2px rgba(163,120,0,0.20), inset 0 1px 0 rgba(255,255,255,0.9);}
.chip-grade.gC{background:linear-gradient(180deg,#fdf2ef 0%,#f6ddd7 100%);
  box-shadow:0 1px 2px rgba(184,65,46,0.18), inset 0 1px 0 rgba(255,255,255,0.9);}
.hl-amber{background:linear-gradient(180deg,#fff9e6 0%,#ffeec2 100%);
  box-shadow:0 1px 2px rgba(163,120,0,0.20), inset 0 1px 0 rgba(255,255,255,0.9);}
.fchip[aria-pressed="true"]{background:linear-gradient(180deg,#f4fbf5 0%,#dcefe0 100%);
  box-shadow:0 1px 2px rgba(23,73,29,0.16), inset 0 1px 0 rgba(255,255,255,0.92);}
/* ข้อ 3 ของคำสั่งเดียวกัน การ์ดสี่ใบบนหน้าเจาะรายตัวชี้วัด ย่อให้พอดีกับเนื้อหา ไม่สูงเกินจำเป็น */
#kpiTiles .card{padding:14px 16px;}
.sparkbox{margin-top:8px;}

@media (max-width:760px){
  .title-hero{font-size:24px;}
  .kpi-head h1{font-size:22px;}
  .mbar select{min-width:0; width:100%; flex:1 1 100%;}
  .grade-key ul{grid-template-columns:1fr;}
}
@media print{
  .title-hero, .kpi-head h1{text-shadow:none !important;}
  .grade-block{background:#ffffff !important; border:1px solid var(--line) !important;}
}
/* ======================= รอบแก้ 4 ต.ค. 2569 ======================= */
/* ข3 แถบบนติดหน้าจอ ต้องกันระยะเมื่อสั่งเลื่อนไปยังเนื้อหา (กติกาข้อ 142) ค่าความสูงแถบตั้งจากสคริปต์ */
main{position:relative; scroll-margin-top:calc(var(--tbh,64px) + 8px);}
/* ค1 ปุ่มที่เลือกอยู่และชิปที่กดอยู่ มีเงาของตัวเองที่ทับวงโฟกัส จึงต้องประกาศวงโฟกัสซ้ำด้วยน้ำหนักที่สูงกว่า */
.nav button.active:focus-visible, .fchip[aria-pressed="true"]:focus-visible,
.mchip[aria-pressed="true"]:focus-visible{box-shadow:var(--ring) !important;}
tr.clickable:focus-visible{outline:3px solid var(--green-d); outline-offset:-3px; box-shadow:none;}
/* ค3 จุดกดบนกราฟใช้แป้นพิมพ์ได้ วงโฟกัสของรูปใน SVG ใช้เส้นขอบ เพราะเงาไม่แสดงบน SVG */
svg .clickable:focus{outline:none;}
svg .clickable:focus-visible{stroke:#17491d; stroke-width:2.5;}
/* รอบ 2 ตำหนิ 2.1 คอลัมน์ลำดับและคอลัมน์ข้อกว้างพอดีเลข ชื่อตัวชี้วัดจึงได้ความกว้างคืนและไม่ตัดกลางคำที่ 1280 */
@media (min-width:761px){
  #kpiTable th.seq, #kpiTable th.no, #kpiTable td.seq, #kpiTable td[data-label="ข้อ"]{width:1%; white-space:nowrap; padding-left:10px; padding-right:8px;}
}
@media (min-width:761px){
  #kpiTable th, #kpiTable td{padding-left:10px; padding-right:10px;}
  #kpiTable td[data-label="ผลจริง"]{white-space:normal;}
}
@media (min-width:1200px){ #kpiTable td.kname{min-width:304px;} }
/* จ ข้อ 136 กล่องที่ขึ้นเมื่อชี้ ถ้าสูงเกินที่ว่างให้จัดสองคอลัมน์ก่อน */
#tip.cols2{max-width:620px;}
#tip.cols2 ul{columns:2; column-gap:22px;}
#tip.cols2 li{break-inside:avoid;}
/* จ ข้อ 134 ตัวเลขกับหน่วยและคำประสมห้ามแยกบรรทัด */
.nw{white-space:nowrap;}
#subTable td.unit{white-space:nowrap;}
/* ข2 ช่องที่มีหมายเหตุคุณภาพข้อมูล ใช้เครื่องหมายเล็กแทนประโยคบนจอ (กติกาข้อ 110) รายละเอียดอยู่ในกล่องที่ขึ้นเมื่อชี้และท้ายหน้า */
/* รอบแก้ 8 ต.ค. 2569 ข้อ 10 กล่องเมื่อชี้ผูกกับค่าในช่อง ไม่ใช่ทั้งช่อง ตัวชี้เมาส์รูปช่วยเหลือจึงอยู่ที่ค่า */
td.has-note [data-tip]{cursor:help;}
.dnote{display:inline-block; margin-left:4px;}
td.num .dnote{margin-left:0; margin-right:4px;}
/* จ กติกาข้อ 34 การ์ดบทวิเคราะห์ตั้ง hidden ไว้แล้ว แต่กฎ .grid ชนะแอตทริบิวต์ hidden การ์ดเปล่าจึงค้างบนจอในเดือนที่ไม่มีบทวิเคราะห์ */
#noteWrap[hidden]{display:none;}
.dnote .ic{vertical-align:-1px !important; margin:0 !important;}
.page-foot .foot-note{margin-top:4px;}
/* จ ข้อ 125 และ 139 ไอคอนป้ายการ์ดอยู่ในชิปพื้นจาง สีตามโทนหน้า */
.lbl-ic{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:7px;
  margin-right:8px; vertical-align:-5px; background:rgba(63,174,73,0.13); color:#2e8536;}
.lbl-ic .ic{margin:0 !important; vertical-align:0 !important;}
.tile-hero .lbl-ic{background:rgba(255,255,255,0.18); color:#ffffff;}
#page-kpi .lbl-ic{background:var(--tone-wash); color:var(--tone-ink);}
.title-ic{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:11px;
  flex:none; margin-right:-4px; background:var(--tone-wash,rgba(63,174,73,0.13)); color:var(--tone-ink,#2e8536);}
.title-ic .ic{margin:0 !important; vertical-align:0 !important;}
/* จ ข้อ 121 ตารางข้อมูลประกอบต้องไม่มีแถบเลื่อนแนวนอนที่จอคอม ลดระยะขอบในของเซลล์ และให้หัวคอลัมน์ตัดบรรทัดที่รอยต่อคำ */
@media (min-width:761px){
  #subTable th, #subTable td{padding-left:8px; padding-right:8px;}
  #subTable th{white-space:normal;}
  #subTable td:first-child{min-width:120px;}
}
/* ง ภาพเคลื่อนไหว กติกาข้อ 124 ใช้เฉพาะ transform opacity stroke-dashoffset และเงา แต่ละชิ้นไม่เกิน 600 มิลลิวินาที */
.page.pg-in{animation:pgIn 0.22s ease-out both;}
.page.pg-out{display:block; position:absolute; left:32px; right:32px; pointer-events:none; animation:pgOut 0.15s ease-in both;}
@keyframes pgIn{from{opacity:0; transform:translateY(6px);}}
@keyframes pgOut{to{opacity:0;}}
.v-out{animation:pgOut 0.12s ease-in both;}
.v-in{animation:vIn 0.18s ease-out both;}
@keyframes vIn{from{opacity:0;}}
/* การ์ดที่อยู่นอกจอตอนโหลด ค่อยปรากฏเมื่อเลื่อนมาถึง การ์ดในจอแรกไม่ถูกซ่อน */
.rv-pend{opacity:0; transform:translateY(14px);}
.card.rv-in{transition:opacity 0.42s ease-out, transform 0.42s ease-out, box-shadow 0.18s ease;}
/* การ์ดยกขึ้น 1 จุดภาพเมื่อชี้ อยู่ในขอบเขตกติกาข้อ 3 และ 4 ไม่ใช้ค่ายก 3 จุดภาพ */
@media (hover:hover){ .card:hover{transform:translateY(-1px);} }
.help-btn,.viewlink,.grp-more,.limit-btn{transition:transform 0.12s ease;}
.btn:active,.help-btn:active,.viewlink:active,.grp-more:active,.limit-btn:active,
.nav button:active,.fchip:active,.mchip:active{transform:scale(0.97);}
/* แถบเทียบเป้าเติมจากศูนย์ ใช้การย่อแนวนอน ไม่เคลื่อนความกว้าง */
.fill-anim .wbar .got,.fill-anim .wbar .lost{animation:fillX 0.5s cubic-bezier(0.25,0.6,0.3,1) both;}
@keyframes fillX{from{transform:scaleX(0);}}
/* แท่งและเส้นกราฟวาดเข้า เมื่อเข้าจอครั้งแรก และเมื่อเปลี่ยนเดือน ข้อ หรือวิธีคิด */
svg .bar-in{transform-box:fill-box; transform-origin:50% 100%;}
.ch-pend .bar-in{transform:scaleY(0);}
.ch-pend .ln-path,.ch-pend .sp-path{stroke-dasharray:1; stroke-dashoffset:1;}
.ch-anim .bar-in{animation:barUp 0.38s cubic-bezier(0.2,0.7,0.3,1) both; animation-delay:var(--d,0ms);}
.ch-anim .ln-path,.ch-anim .sp-path{stroke-dasharray:1; animation:lnDraw 0.55s ease-out both;}
.ch-anim .ln-area{animation:fadeIn 0.5s ease-out both;}
.ch-anim .ln-pt{animation:fadeIn 0.3s ease-out 0.25s both;}
@keyframes barUp{from{transform:scaleY(0);}}
@keyframes lnDraw{from{stroke-dashoffset:1;} to{stroke-dashoffset:0;}}
@keyframes fadeIn{from{opacity:0;}}
@media (max-width:760px){ .page.pg-out{left:16px; right:16px;} }
/* งานพิมพ์ต้องแสดงครบ ไม่มีชิ้นใดค้างอยู่ในสถานะก่อนเคลื่อนไหว */
@media print{
  *,*::before,*::after{animation:none !important; transition:none !important;}

const tip = $("tip");
/* ก1 รอบ 4 ต.ค. 2569 ช่องโหว่ฝังโค้ดผ่านข้อมูล เดิมอ่าน data-tip กลับมาใส่ innerHTML ตรงๆ
   ค่าแอตทริบิวต์ถูกถอดรหัสหนึ่งชั้นตอนอ่าน ข้อความที่หนีไว้จึงกลับเป็นแท็กจริงแล้วทำงาน
   แก้สองชั้น ชั้นแรกทุกจุดที่ตั้ง data-tip หนีเอชทีเอ็มแอลของคำอธิบายอีกชั้นสำหรับค่าแอตทริบิวต์
   ชั้นสองตัวแสดงผลรับเฉพาะแท็กที่อนุญาต span ul li br b strong โดยคงเฉพาะ class ของ span
   แท็กอื่นทั้งหมดถูกถอดเหลือเพียงตัวอักษร แยกวิเคราะห์ใน template ซึ่งไม่โหลดภาพและไม่รันสคริปต์ */
const TIP_TAGS = {SPAN:1, UL:1, LI:1, BR:1, B:1, STRONG:1};
let tipOwner = null;
function tipSafe(html){
  const tpl = document.createElement("template");
  tpl.innerHTML = String(html==null? "" : html);
  const out = document.createDocumentFragment();
  const copy = (src, dst) => {
    Array.from(src.childNodes).forEach(n=>{
      if(n.nodeType===3){ dst.appendChild(document.createTextNode(n.nodeValue)); return; }
      if(n.nodeType!==1) return;
      if(TIP_TAGS[n.tagName]){
        const el = document.createElement(n.tagName.toLowerCase());
        const c = n.getAttribute("class");
        if(n.tagName==="SPAN" && c && /^[a-z0-9 -]+$/.test(c)) el.className = c;
        copy(n, el);
        dst.appendChild(el);
      } else copy(n, dst);
    });
  };
  copy(tpl.content, out);
  return out;
}
/* จ กติกาข้อ 136 กล่องที่ขึ้นเมื่อชี้ห้ามบังแถวที่ชี้ หัวตาราง และช่องค้นหา
   ช่องในตารางวางกล่องใต้หรือเหนือแถว จุดบนกราฟและตัวเลขบนการ์ดวางข้างจุดที่ชี้
   ถ้าไม่พอทุกตำแหน่ง จัดรายการเป็นสองคอลัมน์ก่อน แล้วจึงเลื่อนขึ้นเท่าที่จำเป็น และหนีขอบหน้าต่างทั้งสี่ด้าน */
function placeTip(el){
  const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  const M = 8, G = 10;
  const tb = $("topbar");
  const topMin = Math.max(M, (tb && !sideNav())? tb.getBoundingClientRect().bottom + 4 : M);
  const er = el.getBoundingClientRect();
  const row = !el.closest("svg") && el.closest("tr");
  const anchor = row? row.getBoundingClientRect() : er;
  const avoid = [anchor];
  const tbl = el.closest("table"), thd = tbl && tbl.querySelector("thead");
  if(thd) avoid.push(thd.getBoundingClientRect());
  const card = el.closest(".card"), sr = card && card.querySelector('input[type="search"]');
  if(sr) avoid.push(sr.getBoundingClientRect());
  const attempt = () => {
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const cands = row
      ? [{x:er.left, y:anchor.bottom+G}, {x:er.left, y:anchor.top-G-th}]
      : [{x:er.right+G, y:er.top}, {x:er.left-G-tw, y:er.top}, {x:er.left, y:er.bottom+G}, {x:er.left, y:er.top-G-th}];
    for(const c of cands){
      const x = Math.max(M, Math.min(c.x, vw-tw-M)), y = c.y;
      if(y < topMin || y+th > vh-M) continue;
      const b = {l:x, t:y, r:x+tw, b:y+th};
      if(avoid.some(r=>!(b.r<=r.left || b.l>=r.right || b.b<=r.top || b.t>=r.bottom))) continue;
      return {x:x, y:y};
    }
    return null;
  };
  tip.classList.remove("cols2");
  let pos = attempt();
  if(!pos && tip.querySelectorAll("li").length>3){ tip.classList.add("cols2"); pos = attempt(); }
  if(!pos){
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    pos = {x:Math.max(M, Math.min(er.left, vw-tw-M)), y:Math.max(topMin, Math.min(anchor.bottom+G, vh-th-M))};
  }
  tip.style.left = pos.x+"px"; tip.style.top = pos.y+"px";
}
function showTipFor(el){
  if(!el || !el.isConnected) return;
  if(tipOwner!==el){
    tip.replaceChildren(tipSafe(el.getAttribute("data-tip")));
    tipOwner = el;
  }
  tip.style.display = "block";
  placeTip(el);
}
function hideTip(){ tip.style.display = "none"; tipOwner = null; }
/* ค3 คำอธิบายลอยเปิดได้ด้วยแป้นพิมพ์ ธาตุที่ยังโฟกัสไม่ได้ได้รับ tabindex ยกเว้นธาตุที่อยู่ในแถวหรือปุ่มที่โฟกัสได้อยู่แล้ว
   ค10 ผูกตัวฟังกับธาตุละหนึ่งครั้งเท่านั้น */
function bindTips(root){
  if(!root) return;
  root.querySelectorAll("[data-tip]").forEach(el=>{
    if(el.__tipOn) return;
    el.__tipOn = true;
    el.addEventListener("mouseenter", ()=>showTipFor(el));
    el.addEventListener("mousemove", ()=>{ if(tipOwner!==el || tip.style.display!=="block") showTipFor(el); });
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("focus", ()=>showTipFor(el));
    el.addEventListener("blur", hideTip);
    /* ธาตุแม่ที่ tabindex ติดลบ เช่น main ไม่ได้อยู่ในลำดับแป้น Tab จึงไม่นับเป็นแม่ที่โฟกัสได้ */
    if(!el.closest('[tabindex]:not([tabindex^="-"]),button,a,select,input')) el.setAttribute("tabindex","0");
    el.setAttribute("aria-describedby","tip");
  });
}
/* ค3 บนจอสัมผัส แตะที่อื่นแล้วปิด กด Escape ปิด เลื่อนหน้าแล้วตามธาตุเจ้าของ ธาตุถูกวาดใหม่แล้วปิด */
document.addEventListener("pointerdown", e=>{
  if(tipOwner && !(e.target && e.target.closest && e.target.closest("[data-tip]"))) hideTip();
}, true);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") hideTip(); });
window.addEventListener("scroll", ()=>{
  if(!tipOwner) return;
  if(tipOwner.isConnected && tipOwner.getClientRects().length) placeTip(tipOwner); else hideTip();
}, {passive:true});

   วิ่งเฉพาะเมื่อผู้ใช้เปลี่ยนเดือนหรือวิธีคิด */
function countUp(el, target, fmt){
  const fin = fmt(target);
  if(REDUCED || target==null || !animCharts){ el.textContent = fin; return; }
  const t0 = performance.now(), dur = 420, from = target*0.6;
  function step(t){
    const p = Math.min(1,(t-t0)/dur), v = from + (target-from)*(1-Math.pow(1-p,3));
    el.textContent = p<1? fmt(v) : fin;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
/* ง ภาพเคลื่อนไหวของกราฟและแถบ เล่นเฉพาะรอบวาดที่ผู้ใช้สั่งเปลี่ยนเดือน ข้อ วิธีคิด หรือเปิดแท็บ */
let animCharts = false;
function withAnim(fn){ animCharts = true; try{ fn(); } finally{ animCharts = false; } }
let chartIO = null;
function playChart(el){
  if(!animCharts || REDUCED || !el || !el.offsetParent) return;
  const sv = el.querySelector("svg");
  if(!sv) return;
  const r = el.getBoundingClientRect();
  if(r.bottom > 0 && r.top < document.documentElement.clientHeight){ sv.classList.add("ch-anim"); return; }
  if(!("IntersectionObserver" in window)) return;
  if(!chartIO) chartIO = new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting) return;
    chartIO.unobserve(en.target);
    en.target.classList.remove("ch-pend"); en.target.classList.add("ch-anim");
  }), {threshold:0.15});
  sv.classList.add("ch-pend");
  chartIO.observe(sv);
}
function pulseFill(el){

/* ประมาณความกว้างข้อความเป็นพิกเซล สำหรับจองพื้นที่ป้ายในกราฟ
   สระบนสระล่างและวรรณยุกต์ไทยไม่กินความกว้าง อักษรไทยกว้างกว่าเลขและอักษรละติน */
/* ค่าประมาณสำรอง ใช้เมื่อเบราว์เซอร์วัดให้ไม่ได้ */
function txtWEst(str, size){
  const sz = size||12;
  let u = 0;
  for(const ch of String(str||"")){
    const c = ch.codePointAt(0);
    if(c===0x0E31 || (c>=0x0E33 && c<=0x0E3A) || (c>=0x0E47 && c<=0x0E4E)) continue;
    if(c===0x20) { u += 0.30; continue; }
    if(c>=0x0E00 && c<=0x0E7F) { u += 0.62; continue; }
    if(c>=0x41 && c<=0x5A) { u += 0.64; continue; }
    u += 0.58;
  }
  return u*sz;
}
/* วัดความกว้างข้อความจากของจริง ผลจึงตรงกับฟอนต์ที่เครื่องปลายทางโหลดได้จริง
   เก็บผลไว้ในทะเบียน เพราะกราฟหนึ่งใบเรียกซ้ำหลายสิบครั้ง */
let _mwSvg = null, _mwTxt = null, _mwCache = {};
function txtW(str, size){
  const sz = size||12;
  const key = sz+"|"+String(str==null?"":str);
  if(_mwCache[key]!=null) return _mwCache[key];
  let w = null;
  try{
    if(!_mwSvg){
      _mwSvg = document.createElementNS("http://www.w3.org/2000/svg","svg");
      _mwSvg.setAttribute("aria-hidden","true");
      _mwSvg.setAttribute("style","position:absolute; left:-9999px; top:-9999px; width:0; height:0; overflow:hidden;");
      _mwTxt = document.createElementNS("http://www.w3.org/2000/svg","text");
      _mwSvg.appendChild(_mwTxt);
      document.body.appendChild(_mwSvg);
    }
    _mwTxt.setAttribute("font-size", sz);
    _mwTxt.textContent = String(str==null?"":str);
    const m = _mwTxt.getComputedTextLength();
    if(m>0 || !String(str==null?"":str).length) w = m;
  }catch(e){ w = null; }
  if(w==null) w = txtWEst(str, sz);
  _mwCache[key] = w;
  return w;
}
/* เลือกช่วงแกนตั้งที่พอดีข้อมูลที่สุด ไม่ใช่แค่ปัดขึ้นตามขั้นแรกที่เจอ
   วิธีเดิมใช้ขั้นแรกที่กว้างพอ จึงได้เพดาน 150 ทั้งที่ค่าสูงสุดคือ 90 เหลือที่ว่างเปล่าเกินครึ่งกราฟ
   วิธีใหม่ลองทุกขั้นที่เป็นไปได้ แล้วเลือกเพดานต่ำที่สุดที่ยังได้จำนวนช่วงแกนระหว่างสามถึงเจ็ดช่วง
   แก้ตามคำสั่ง Yuth 8 ก.ย. 2569 ข้อ 3 */
function fitScale(lo, hi, nMin, nMax){
  if(hi<=lo) hi = lo + 1;
  const span = hi - lo;
  let best = null;
  for(let k=-6; k<=9; k++){
    const mag = Math.pow(10,k);
    for(const m of [1,1.5,2,2.5,3,4,5,6,8]){
      const step = mag*m;
      if(step<=0 || !isFinite(step)) continue;
      if(span/step > 40) continue;
      const mn = Math.floor(lo/step)*step;
      const mx = Math.ceil(hi/step)*step;
      const n = Math.round((mx-mn)/step);
      if(n<nMin || n>nMax) continue;
      if(!best || mx < best.max - 1e-9 || (Math.abs(mx-best.max)<1e-9 && n > best.n)){
        best = {min:mn, max:mx, step:step, n:n};
      }
    }
  }
  if(!best) return niceScale(lo,hi,4);
  const ticks = [];
  for(let i=0;i<=best.n;i++) ticks.push(Number((best.min + i*best.step).toPrecision(12)));
  return {min:best.min, max:best.max, step:best.step, ticks:ticks};
}
function chartFrame(w,h,pad){ return {w,h,l:pad.l,r:pad.r,t:pad.t,b:pad.b, iw:w-pad.l-pad.r, ih:h-pad.t-pad.b}; }
function niceScale(lo, hi, n){
  if(hi<=lo) hi = lo+1;
  const raw = (hi-lo)/n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  let step = mag;
  for(const m of [1,2,2.5,5,10]){ if(mag*m>=raw){ step = mag*m; break; } }
  const min = Math.floor(lo/step)*step;
  const max = Math.ceil(hi/step)*step;
  const ticks=[];
  for(let v=min; v<=max+step/1000; v+=step) ticks.push(Math.round(v*1000)/1000);
  return {min, max, ticks};
}
function tickLabel(v){
  if(Math.abs(v)>=1e6) return numf(v/1e6,1)+" ล้าน";
  if(Math.abs(v)>=1e4) return nf0.format(v);
  return numf(v, Math.abs(v)<10 && !Number.isInteger(v) ? 1:0);
}
/* ป้ายแกนตั้งทุกขีดต้องใช้หน่วยและจำนวนทศนิยมชุดเดียวกันทั้งแกน
   ถ้าตัดสินทีละขีด จะได้แกนที่ปนกัน เช่น 2.1 ล้าน อยู่เหนือ 900,000 ซึ่งอ่านเทียบกันไม่ได้ทันที
   แก้ตามคำสั่ง Yuth 8 ก.ย. 2569 */
function axisFormatter(ticks){
  const hi = Math.max.apply(null, ticks.map(t=>Math.abs(t)).concat([0]));
  if(hi>=1e6){
    const dec = ticks.some(t=>Math.abs((t/1e6)*10 - Math.round((t/1e6)*10))>1e-6) ? 2 : 1;
    return v => v===0? "0" : numf(v/1e6, dec)+" ล้าน";
  }
  if(hi>=1e4) return v => nf0.format(v);
  /* จำนวนทศนิยมยึดขีดที่ละเอียดที่สุด แล้วใช้เท่ากันทุกขีด เช่นได้ 2.0 ไม่ใช่ 2 เมื่อขีดอื่นเป็น 0.4 */
  let dec = 0;
  ticks.forEach(t=>{
    for(let d=0; d<=2; d++){ if(Math.abs(t - Number(t.toFixed(d))) < 1e-9){ if(d>dec) dec = d; break; } }
  });
  return v => v===0? "0" : numf(v, dec);
}
function gridLines(f,ticks,min,max,suffix){
  let s="";
  const fmt = axisFormatter(ticks);
  ticks.forEach(tv=>{
    const y = f.t + f.ih - ((tv-min)/(max-min))*f.ih;
    s += `<line x1="${f.l}" y1="${y}" x2="${f.l+f.iw}" y2="${y}" stroke="${TH.grid}" stroke-width="1"/>`;
    s += `<text x="${f.l-8}" y="${y+4}" text-anchor="end" font-size="12" fill="${TH.ink2}">${fmt(tv)+(suffix||"")}</text>`;
  });
  return s;
}
/* ข1 รอบ 4 ต.ค. 2569 กราฟที่ถูกวาดตอนอยู่ในมุมมองตาราง เคยวัดความกว้างได้ศูนย์แล้วใช้ค่าประมาณ
   จึงวัดจากกล่องบรรพบุรุษตัวแรกที่มองเห็น หักระยะขอบในและเส้นขอบ แล้วปัดลง
   ปัดลงเพื่อให้สเกลที่แสดงไม่ต่ำกว่าหนึ่ง ตัวอักษร 12 จุดภาพจึงไม่ถูกย่อ */
function boxWidth(el){
  let e = el;
  while(e && e.getClientRects().length===0) e = e.parentElement;
  if(!e) return 0;
  const w = e.getBoundingClientRect().width;
  if(e===el) return Math.floor(w);
  const cs = getComputedStyle(e);
  return Math.floor(w - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)
    - parseFloat(cs.borderLeftWidth) - parseFloat(cs.borderRightWidth));
}
function chartWidth(id, fallback){
  const el = $(id);
  let w = el? boxWidth(el) : 0;
  if(!w) w = fallback;
  /* เพดานเดิม 1160 ทำให้จอกว้างกว่านั้นถูกเบราว์เซอร์ขยายภาพทั้งรูป กราฟจึงสูงเกินที่ตั้งไว้
     และการ์ดข้างบนกับกราฟหลุดออกนอกหน้าจอ แก้ตามข้อ 4 ของคำสั่ง Yuth 8 ก.ย. 2569 */
  return Math.max(320, Math.min(2200, w));
}
/* ความกว้างของกราฟเล็กในการ์ด ต้องเท่ากับความกว้างจริงของกล่อง ห้ามใช้ขั้นต่ำ 320 ของกราฟใหญ่
   ถ้ากรอบภาพกว้างกว่ากล่อง เบราว์เซอร์จะย่อทั้งภาพ ตัวอักษรบนเส้นจึงเล็กกว่าที่ตั้งไว้ */
function sparkWidth(id, fallback){
  const el = $(id);
  let w = el? boxWidth(el) : 0;
  if(!w) w = fallback;
  /* ไม่ตั้งขั้นต่ำที่กว้างกว่ากล่องจริง เพราะกรอบภาพที่กว้างกว่ากล่องจะถูกย่อทั้งภาพ
     ตัวอักษรบนเส้นจึงเล็กกว่าที่ตั้งไว้ เมื่อกล่องแคบให้ไปลดจำนวนป้ายแทน ไม่ใช่ย่อภาพ */
  return Math.max(60, Math.min(460, w));
}
/* วางป้ายค่าไม่ให้ทับกันและไม่หลุดกรอบ */
function placeLabels(pts, f, fmt){
  let s = "", lastBox = null;
  pts.forEach(p=>{
    const txt = fmt(p.v);
    const w = txt.length*6.8;
    let x = Math.max(f.l+w/2+2, Math.min(f.l+f.iw-w/2-2, p.x));
    let y = p.y-11, below = false;
    if(lastBox && Math.abs(p.y-lastBox.py)<15 && (x-w/2)<lastBox.x2+6){ y = p.y+20; below = true; }
    if(y < f.t+10) { y = p.y+20; below = true; }
    if(y > f.t+f.ih-2) y = p.y-11;
    s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="${TH.ink}">${esc(txt)}</text>`;
    lastBox = below? lastBox : {x2:x+w/2, py:p.y};
  });
  return s;
}

/* รอบ 8 ต.ค. 2569 r5 เส้นกราฟเป็นเส้นโค้งตามภาพอ้างอิงของ Yuth ใช้เส้นโค้งแบบไม่ล้ำค่า (monotone cubic)
   เส้นผ่านทุกจุดจริง และไม่โค้งเลยค่าสูงสุดหรือต่ำสุดของช่วงระหว่างสองจุด จึงไม่สร้างยอดหรือหุบที่ข้อมูลไม่มี */
function smoothPath(pts){
  const n = pts.length;
  if(n<3) return pts.map((p,j)=>(j?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const dx = [], m = [], t = [];
  for(let i=0;i<n-1;i++){ dx[i] = pts[i+1].x-pts[i].x; m[i] = (pts[i+1].y-pts[i].y)/(dx[i]||1); }
  t[0] = m[0]; t[n-1] = m[n-2];
  for(let i=1;i<n-1;i++) t[i] = (m[i-1]*m[i]<=0)? 0 : (m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){
    if(m[i]===0){ t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i]/m[i], b = t[i+1]/m[i], q = a*a+b*b;
    if(q>9){ const k = 3/Math.sqrt(q); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; }
  }
  let d = "M"+pts[0].x.toFixed(1)+" "+pts[0].y.toFixed(1);
  for(let i=0;i<n-1;i++){
    const h = dx[i]/3;
    d += " C"+(pts[i].x+h).toFixed(1)+" "+(pts[i].y+t[i]*h).toFixed(1)+" "+(pts[i+1].x-h).toFixed(1)+" "+(pts[i+1].y-t[i+1]*h).toFixed(1)
      +" "+pts[i+1].x.toFixed(1)+" "+pts[i+1].y.toFixed(1);
  }
  return d;
}
/* รอบ 11 พ.ย. 2569 เส้นแนวโน้มวางซ้อนบนแท่งของกราฟชั่วโมงโอทีรายเดือน (otTrend) เชื่อมค่าทุกเดือนตามลำดับ ใช้ smoothPath ตัวเดิม
   เดือนที่ค่าเป็น null เว้นช่วงเส้น ไม่ลากผ่านศูนย์ จุดทำเป็น svg ขนาดคงที่ แยกจากเส้นที่ยืดตามกรอบ จึงไม่เบี้ยว
   y คิดเป็นร้อยละจากขอบบนของพื้นที่วาด (100 ลบ v หาร top คูณ 100) ฐานเดียวกับความสูงแท่ง x คิดเป็นหน่วยดัชนีเดือนคูณ 100 */
function otTrendLine(vals, top, n){
  if(n<2 || !(top>0)) return "";
  const y = v => 100 - v/top*100;
  const runs = []; let cur = [];
  vals.forEach((v,i)=>{ if(v==null){ if(cur.length) runs.push(cur); cur = []; } else cur.push({x:i*100, y:y(v)}); });
  if(cur.length) runs.push(cur);
  const d = runs.filter(r=>r.length>1).map(smoothPath).join(" ");
  const dots = vals.map((v,i)=> v==null? "" :
    /* รอบ 12 พ.ย. 2569 ข้อ 12 จุดรัศมี 5.5 จุดเดือนล่าสุดรัศมี 7.5 วงแหวนสีพื้น */
    (i===n-1? `<svg class="dot cur" aria-hidden="true" viewBox="0 0 22 22" style="left:${(i/(n-1)*100).toFixed(4)}%; top:${y(v).toFixed(3)}%"><circle cx="11" cy="11" r="7.5" fill="${TH.blueInk}" stroke="${TH.ring}" stroke-width="2.5"/></svg>`
      : `<svg class="dot" aria-hidden="true" viewBox="0 0 18 18" style="left:${(i/(n-1)*100).toFixed(4)}%; top:${y(v).toFixed(3)}%"><circle cx="9" cy="9" r="5.5" fill="${TH.blueInk}" stroke="${TH.ring}" stroke-width="2"/></svg>`)).join("");
  return `<div class="ot-trend" aria-hidden="true" style="left:calc(var(--otpl) + (100% - var(--otpl) - var(--otpr) - var(--otg)*${n-1})/${2*n}); width:calc((100% - var(--otpl) - var(--otpr) + var(--otg))*${n-1}/${n});">`
    + (d? `<svg class="ln" viewBox="0 0 ${(n-1)*100} 100" preserveAspectRatio="none"><path d="${d}" stroke="${TH.ring}" stroke-width="7.4" stroke-opacity="0.92"/><path d="${d}" stroke="${TH.blueInk}" stroke-width="3.8"/></svg>` : "")
    + dots + `</div>`;
}
/* กราฟเส้น รองรับแถบเกรด เส้นเกณฑ์หลายเส้น จุดเด่นเดือนที่เลือก และการแตะเลือกเดือน
   ป้ายทุกชนิดจองพื้นที่ในทะเบียนกล่องเดียวกัน ป้ายที่ชนของเดิมจะไม่ถูกวาด */
function lineChart(vals, labels, opt){
  const w = opt.width||720, h = opt.height|| Math.round(Math.max(220, Math.min(300, w*0.4)));
  const f = chartFrame(w,h,opt.pad||{l:56,r:44,t:30,b:34});
  let min, max, ticks;
  if(opt.yMin!=null && opt.yMax!=null){
    min = opt.yMin; max = opt.yMax;
    const ns = niceScale(min,max,4); ticks = ns.ticks.filter(t=>t>=min&&t<=max);
  } else {
    const hi = Math.max.apply(null, vals.filter(v=>v!=null).concat(opt.refs? opt.refs.map(r=>r.v):[0]))*1.12;
    const ns = niceScale(opt.yMin!=null?opt.yMin:0, hi, 4);
    min = ns.min; max = ns.max; ticks = ns.ticks;
  }
  const Y = v => f.t + f.ih - ((v-min)/(max-min))*f.ih;
  const taken = [];
  let hitTxt = "";
  /* own คือหมายเลขจุดที่เป็นเจ้าของป้ายนั้น กล่องของจุดตัวเองไม่ถือว่าชน */
  const hits = (b, own) => taken.some(t =>
    (own==null || t.pi==null || t.pi!==own) &&
    !(b.x2<t.x1||b.x1>t.x2||b.y2<t.y1||b.y1>t.y2));
  const claim = b => { taken.push(b); };
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" role="img">`;
  let bandTxt = "", refTxt = "";
  (opt.bands||[]).forEach(b=>{
    const y1 = Y(Math.min(b.to,max)), y2 = Y(Math.max(b.from,min));
    if(y2<=y1) return;
    s += `<rect x="${f.l}" y="${y1.toFixed(1)}" width="${f.iw}" height="${(y2-y1).toFixed(1)}" fill="${b.color}"/>`;
    if(b.label) b._y = y1;
  });
  /* พื้นกราฟสีขาว ให้ตัวเลขและเส้นอ่านง่าย ไม่ให้พื้นหลังของหน้ามารบกวน */
  if(opt.plotBg) s = `<svg viewBox="0 0 ${f.w} ${f.h}" role="img">`
    + `<rect x="${f.l}" y="${f.t}" width="${f.iw}" height="${f.ih}" rx="12" fill="${opt.plotBg}"/>`
    + s.slice(s.indexOf(">")+1);
  s += gridLines(f,ticks,min,max,opt.tickSuffix);
  /* ข้อ 7 ของคำสั่ง Yuth 7 ก.ย. 2569 ชุดไล่เฉดและเงาของเส้นกราฟกับจุดเดือนที่เลือก
     ประกาศไว้ตรงนี้เสมอ ไม่ผูกกับเงื่อนไขจำนวนจุด เพราะการอ้างถึงตัวกรองที่ไม่มีอยู่จะทำให้รูปไม่ขึ้น */
  const gsid = (opt.gid||"ag");
  s += `<defs><linearGradient id="${gsid}" x1="0" y1="0" x2="0" y2="1">`
    + `<stop offset="0" stop-color="${TH.lnA}" stop-opacity="${TH.areaOp}"/>`
    + `<stop offset="1" stop-color="${TH.lnA}" stop-opacity="0"/></linearGradient>`
    + `<linearGradient id="${gsid}_ln" x1="0" y1="0" x2="1" y2="0">`
    + `<stop offset="0" stop-color="${TH.lnA}"/><stop offset="0.52" stop-color="${TH.lnB}"/>`
    + `<stop offset="1" stop-color="${TH.lnC}"/></linearGradient>`
    + `<radialGradient id="${gsid}_pt" cx="0.35" cy="0.3" r="0.9">`
    + `<stop offset="0" stop-color="${TH.ptA}"/><stop offset="1" stop-color="${TH.ptB}"/></radialGradient>`
    + `<filter id="${gsid}_sh" x="-40%" y="-40%" width="180%" height="180%">`
    + `<feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="${TH.shadow}" flood-opacity="${TH.shadowOp}"/></filter></defs>`;
  /* เก็บเส้นอ้างอิงไว้วาดหลังเส้นข้อมูล เดือนที่ค่าทับเส้นพอดีจะได้ยังเห็นเส้นประ */
  let refLines = "";
  (opt.refs||[]).forEach(rf=>{
    if(rf.v<min||rf.v>max) return;
    const y = Y(rf.v);
    const col = rf.color || TH.amber;
    /* เส้นเกณฑ์เป็นฉากหลัง ไม่ใช่สาร จึงจางกว่าเส้นข้อมูลชัดเจน */
    refLines += `<line x1="${f.l}" y1="${y}" x2="${f.l+f.iw}" y2="${y}" stroke="${col}" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.24"/>`;
  });
  const pts=[];
  vals.forEach((v,i)=>{
    if(v==null) return;
    const x = f.l + (vals.length===1?f.iw/2 : (i/(vals.length-1))*f.iw);
    pts.push({x, y:Y(v), v, i});
  });
  if(pts.length>1){
    const path = smoothPath(pts);
    const area = path + ` L ${pts[pts.length-1].x.toFixed(1)} ${f.t+f.ih} L ${pts[0].x.toFixed(1)} ${f.t+f.ih} Z`;
    s += `<path class="ln-area" d="${area}" fill="url(#${gsid})"/>`;
    /* เส้นข้อมูลหนาขึ้น ไล่เฉดจากอ่อนไปเข้ม และมีเงาใต้เส้น จึงดูนูนขึ้นมาจากพื้น */
    s += `<path class="ln-path" pathLength="1" d="${path}" fill="none" stroke="url(#${gsid}_ln)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#${gsid}_sh)"/>`;
  }
  s += refLines;
  /* จุดข้อมูลจองพื้นที่ของตัวเองก่อน ป้ายชนิดอื่นจะหลบ */
  pts.forEach(p=>{
    /* เดือนที่เลือกเด่นตั้งแต่เปิดหน้า ไม่ต้องรอให้ผู้ใช้กดเลือกก่อน */
    const hl = !!(opt.highlight && opt.highlight.has(p.i));
    if(hl) s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="10.5" fill="${TH.halo}"/>`;
    const pc = opt.ptColors? opt.ptColors[p.i] : null;
    const fade = opt.dim && !hl? 0.42 : 1;
    s += hl
      ? `<circle class="ln-pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7" fill="${pc? pc[1] : "url(#"+gsid+"_pt)"}" stroke="${TH.ring}" stroke-width="2.2" filter="url(#${gsid}_sh)"/>`
      : `<circle class="ln-pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${pc? pc[0] : TH.passD}" stroke="${TH.ring}" stroke-width="1.6" opacity="${fade}"/>`;
    /* พื้นที่รับการกดต้องไม่เล็กกว่า 26 พิกเซล เพื่อให้แตะได้จริงบนมือถือ */
    /* ก1 ข้อความคำอธิบายลอยเป็นเอชทีเอ็มแอลที่หนีข้อมูลแล้วหนึ่งชั้น แล้วหนีอีกชั้นสำหรับค่าแอตทริบิวต์
       ค่าที่อ่านกลับด้วย getAttribute จึงเป็นเอชทีเอ็มแอลที่ข้อมูลยังหนีอยู่ ค3 จุดกดรับแป้นพิมพ์ได้ */
    const tipH = esc(labels[p.i])+" "+esc(opt.fmt(p.v))+(opt.tipExtra? "<br>"+esc(opt.tipExtra(p.i)) : "");
    hitTxt += `<rect class="clickable" data-mi="${p.i}" tabindex="0" role="button" aria-label="${esc("เลือกเดือน "+labels[p.i])}" x="${(p.x-13).toFixed(1)}" y="${(p.y-13).toFixed(1)}" width="26" height="26" fill="transparent" data-tip="${esc(tipH)}"/>`;
    taken.push({x1:p.x-9, x2:p.x+9, y1:p.y-9, y2:p.y+9, pi:p.i});
  });
  /* ป้ายเส้นเกณฑ์ มีพื้นรองสีขาว วาดเมื่อไม่ชนของเดิม */
  (opt.refs||[]).forEach(rf=>{
    if(rf.v<min||rf.v>max || !rf.label) return;
    const y = Y(rf.v);
    const col = rf.color || TH.amber;
    const txt = rf.ink || TH.amberInk;
    const wpx = txtW(rf.label,12) + 16;
    for(const ly of [y-8, y+19]){
      if(ly < f.t+12 || ly > f.t+f.ih-3) continue;
      const box = {x1:f.l+1, x2:f.l+5+wpx, y1:ly-15, y2:ly+7};
      if(hits(box)) continue;
      refTxt += `<rect x="${f.l+3}" y="${(ly-12).toFixed(1)}" width="${wpx.toFixed(0)}" height="17" rx="8" fill="${TH.plate}" opacity="0.9"/>`
        + `<text x="${f.l+10}" y="${ly.toFixed(1)}" text-anchor="start" font-size="12" font-weight="600" fill="${txt}">${esc(rf.label)}</text>`;
      claim(box);
      break;
    }
  });
  /* ป้ายค่าประจำจุด เดือนที่เลือกได้สิทธิ์วางก่อน ลองเหนือจุดก่อน ถ้าชนจึงลองใต้จุด
     ป้ายที่ยังชนหลังลองสองระดับจะไม่ถูกวาด ตัวเลขยังอ่านได้จากตารางและจากการแตะจุด */
  let valTxt = "";
  pts.slice().sort((a,b)=>{
    const ha = opt.highlight && opt.highlight.has(a.i) ? 1 : 0;
    const hb = opt.highlight && opt.highlight.has(b.i) ? 1 : 0;
    return hb-ha || a.i-b.i;
  }).forEach(p=>{
    const txt = opt.fmt(p.v);
    const pHl = !!(opt.highlight && opt.highlight.has(p.i));
    const fs = pHl? 15 : 12;
    const wpx = txtW(txt,fs);
    const x = Math.max(f.l+wpx/2+2, Math.min(f.l+f.iw-wpx/2-2, p.x));
    for(const cy of [p.y-15, p.y+25]){
      if(cy < f.t+11 || cy > f.t+f.ih-1) continue;
      const box = {x1:x-wpx/2-6, x2:x+wpx/2+6, y1:cy-14, y2:cy+6};
      if(hits(box, p.i)) continue;
      /* ป้ายค่าโปร่งแสง ตามคำสั่ง Yuth 8 ก.ย. 2569 พื้นรองจางลงจนเห็นเส้นกริดผ่าน
         ตัวอักษรยังเป็นสีหมึกเข้มและไม่จางเกินเกณฑ์ความคมชัด */
      valTxt += `<rect x="${(x-wpx/2-7).toFixed(1)}" y="${(cy-15).toFixed(1)}" width="${(wpx+14).toFixed(0)}" height="${pHl?23:20}" rx="9" fill="${TH.plate}" opacity="${pHl?TH.plateHi:TH.plateLo}"/>`
        + `<text x="${x.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="${pHl?800:600}" fill="${TH.ink}" fill-opacity="${pHl?1:0.78}">${esc(txt)}</text>`;
      claim(box);
      break;
    }
  });
  /* ป้ายชื่อแถบเกรด ชิดขวา วาดเมื่อไม่ชนของเดิม */
  (opt.bands||[]).forEach(b=>{
    if(!b.label || b._y==null) return;
    const wpx = txtW(b.label,12);
    for(const ly of [b._y+15, b._y+30]){
      if(ly > f.t+f.ih-3) continue;
      const box = {x1:f.l+f.iw-wpx-11, x2:f.l+f.iw-2, y1:ly-15, y2:ly+7};
      if(hits(box)) continue;
      bandTxt += `<text x="${f.l+f.iw-6}" y="${ly.toFixed(1)}" text-anchor="end" font-size="12" font-weight="600" fill="${b.labelColor||TH.ink2}">${esc(b.label)}</text>`;
      claim(box);
      break;
    }
  });
  /* ป้ายชื่อเดือน เดือนที่เลือกได้สิทธิ์วางก่อน ที่เหลือวางเมื่อไม่ชนของเดิม */
  const every = opt.labelEvery||1;
  const mTaken = [];
  const mHits = b => mTaken.some(t=>!(b.x2<t.x1||b.x1>t.x2));
  const my = f.t+f.ih+22;
  vals.map((v,i)=>({i, hl:!!(opt.highlight && opt.highlight.has(i)),
      x: f.l + (vals.length===1?f.iw/2 : (i/(vals.length-1))*f.iw)}))
    .sort((a,b)=>{
      const pa = a.hl?2:((a.i%every===0||a.i===vals.length-1)?1:0);
      const pb = b.hl?2:((b.i%every===0||b.i===vals.length-1)?1:0);
      return pb-pa || a.i-b.i;
    }).forEach(c=>{
      if(!c.hl && c.i%every!==0 && c.i!==vals.length-1) return;
      const wpx = txtW(labels[c.i], c.hl?14.5:12);
      const box = {x1:c.x-wpx/2-3, x2:c.x+wpx/2+3};
      if(mHits(box)) return;
      mTaken.push(box);
      s += `<text x="${c.x.toFixed(1)}" y="${(c.hl? my+1 : my).toFixed(1)}" text-anchor="middle" font-size="${c.hl?14.5:12}" font-weight="${c.hl?800:400}" fill="${c.hl?TH.sel:TH.ink2}">${esc(labels[c.i])}</text>`;
    });
  return s+valTxt+bandTxt+refTxt+hitTxt+"</svg>";
}
/* กราฟแท่ง รองรับจุดเด่นเดือนที่เลือกและการแตะเลือกเดือน
   ป้ายค่าจองพื้นที่ในทะเบียนกล่องเดียวกัน เดือนที่เลือกได้สิทธิ์ก่อน
   ป้ายที่ยังชนหลังลองสองระดับจะไม่ถูกวาด ตัวเลขยังอ่านได้จากตารางด้านล่างและจากการแตะแท่ง */
/* ปรับเฉดสีให้อ่อนลงไปทางขาว เมื่อ t เป็นบวก และเข้มลงไปทางดำ เมื่อ t เป็นลบ
   ใช้ทำแถบไล่เฉดของกราฟแท่ง โดยไม่ต้องเพิ่มค่าสีใหม่นอกชุด CI */
function shadeHex(hex, t){
  const h = String(hex||"").replace("#","");
  if(h.length!==6) return hex;
  const n = parseInt(h,16);
  const ch = [(n>>16)&255,(n>>8)&255,n&255].map(v=>{
    const x = t>=0 ? v + (255-v)*t : v*(1+t);
    return Math.max(0, Math.min(255, Math.round(x)));
  });
  return "#" + ch.map(v=>v.toString(16).padStart(2,"0")).join("");
}
/* ชุดสี่ 12 พ.ย. 2569 ข้อ ก1 คำสั่ง Yuth "กราฟในลักษณะ นี้ อยากให้เห็นเส้นเทรนกราฟให้ชัดเจน ขึ้น ลง แรง" และคำตัดสิน "เปลี่ยนทั้ง 10 ข้อ"
   แกนตั้งของกราฟเส้นผลจริง ครอบค่าจริงทุกเดือนกับเป้าหมาย เผื่อ 8% ของช่วงทั้งบนและล่าง แล้วปัดเป็นขั้นเลขกลม 4 ถึง 6 ขีด เลือกช่วงที่แคบที่สุด
   เริ่มที่ 0 เมื่อขอบล่างที่คิดได้ไม่เกิน 0 หรือค่าต่ำสุดไม่เกินครึ่งของค่าสูงสุด ข้อจำนวนนับ (intT) ขั้นแกนเป็นจำนวนเต็ม
   รอบส่งคืนครั้งที่ 1 (12 พ.ย. 2569 ผู้จัดการตีกลับ ก1.6) แกนที่ไม่เริ่มที่ 0 ใช้ขั้น 1 2 2.5 5 คูณสิบยกกำลังเท่านั้น 4 ถึง 7 ขีด
   เลือกตัวที่ช่วงข้อมูลรวมเป้ากินไม่ต่ำกว่า 70% ของแกน ถ้ามีหลายตัวเลือกเอาตัวที่ขีดน้อยกว่า ถ้าไม่มีตัวใดถึง 70% เอาเลขกลมที่ช่วงข้อมูลสูงสุด
   แกนที่เริ่มที่ 0 คงวิธีเดิม */
function zoomScale(vals, ref, intT){
  const nn = vals.filter(v=>v!=null).concat(ref!=null? [ref] : []);
  let a = Math.min.apply(null, nn), b = Math.max.apply(null, nn);
  if(!(b > a)) b = a + Math.max(1, Math.abs(a)*0.1);
  const sp = b - a, lowT = a - 0.08*sp, highT = b + 0.08*sp;
  const zero = lowT <= 0 || a <= b/2;
  let best = null;
  if(!zero){
    for(let k=-6; k<=9; k++){
      const mag = Math.pow(10,k);
      for(const m of [1,2,2.5,5]){
        const step = mag*m;
        if(intT && (step < 1 || Math.round(step) !== step)) continue;
        const mn = Math.floor(lowT/step)*step, mx = Math.ceil(highT/step)*step, n = Math.round((mx-mn)/step);
        if(n < 3 || n > 6) continue;
        const share = sp/(mx-mn), ok = share >= 0.7 - 1e-9;
        /* ผ่าน 70% ชนะไม่ผ่าน ผ่านทั้งคู่ขีดน้อยกว่าชนะ ไม่ผ่านทั้งคู่ช่วงข้อมูลสูงกว่าชนะ */
        if(!best || (ok && !best.ok) || (ok && best.ok && (n < best.n || (n === best.n && share > best.share))) || (!ok && !best.ok && share > best.share))
          best = {min:Number(mn.toPrecision(12)), max:Number(mx.toPrecision(12)), step:step, n:n, share:share, ok:ok};
      }
    }
  }
  if(!best) for(let k=-6; k<=9; k++){
    const mag = Math.pow(10,k);
    for(const m of [1,1.5,2,2.5,3,4,5,6,8]){   /* ชุดขั้นเลขกลมชุดเดียวกับ fitScale ของหน้า */
      const step = mag*m;
      if(intT && (step < 1 || Math.round(step) !== step)) continue;
      const mn = zero? 0 : Math.floor(lowT/step)*step, mx = Math.ceil(highT/step)*step, n = Math.round((mx-mn)/step);
      if(n < 3 || n > 5) continue;
      const rd = [1,2,2.5,5].indexOf(m) >= 0, rg = mx - mn, eps = 1e-9*Math.max(1, Math.abs(rg));
      /* ช่วงแคบที่สุดชนะ ถ้าเท่ากัน ขั้น 1 2 2.5 5 ชนะขั้นอื่น */
      if(!best || rg < best.rg - eps || (Math.abs(rg - best.rg) <= eps && rd && !best.rd)) best = {min:Number(mn.toPrecision(12)), max:Number(mx.toPrecision(12)), step:step, n:n, rg:rg, rd:rd};
    }
  }
  if(!best){
    if(intT){ const mn = zero? 0 : Math.floor(lowT), mx = Math.max(Math.ceil(highT), mn+3); best = {min:mn, max:mx, step:1, n:mx-mn}; }
    else return fitScale(zero? 0 : lowT, highT, 3, 5);
  }
  const ticks = [];
  for(let i=0;i<=best.n;i++) ticks.push(Number((best.min + i*best.step).toPrecision(12)));
  return {min:best.min, max:best.max, step:best.step, ticks:ticks};
}
function barChart(vals, labels, colors, opt){
  /* ข้อ 4 ของคำสั่ง Yuth 8 ก.ย. 2569 ย่อความสูงกราฟ ให้การ์ดข้างบนกับกราฟอยู่ในหน้าจอเดียว */
  const hMax = opt.hMax||240, hMin = Math.min(opt.hMin||190, hMax);
  /* รอบ 12 พ.ย. 2569 ข้อ ส2 opt.hFix คือความสูงที่คิดจากจอ (actHFix) ถ้าไม่มีใช้สูตรเดิม */
  const w = opt.width||720, h = opt.hFix || Math.round(Math.max(hMin, Math.min(hMax, w*0.24)));
  /* ถ้ามีเส้นคะแนนซ้อน ต้องเว้นขอบขวาให้ป้ายแกนขวา */
  /* มีป้ายชื่อแกน จึงต้องเว้นที่ทั้งซ้ายและขวาเพิ่ม */
  /* รอบ 8 ต.ค. 2569 r5 ขอบขวากว้างพอให้ป้ายเลขของเส้นเป้าหมายอยู่นอกกรอบวาดเสมอ เดิมป้ายที่ยาวกว่าขอบ 44 จุดภาพ (เช่น 3.00%) ถอยเข้ามาในกรอบ
     แล้วถูกป้ายค่าของเดือนล่าสุดทับ (ข้อ 2 เดือน ก.ย. 69) */
  const refTxt0 = opt.ref==null? "" : (opt.refShort!=null? String(opt.refShort) : (opt.fmtShort? String(opt.fmtShort(opt.ref)) : numf(opt.ref,1)));
  const padR = Math.max(opt.line? 84:44, refTxt0? Math.ceil(txtW(refTxt0,12))+24 : 0);
  const f = chartFrame(w,h,{l:opt.axisLeft? 76:56, r:padR, t:opt.axisLeft? 34:26, b:34});
  const nums = vals.filter(v=>v!=null);
  /* เผื่อที่ว่างเหนือค่าสูงสุดเพียงพอสำหรับป้ายค่า ไม่เผื่อเกินจนกราฟดูโล่ง */
  /* ข้อ 1 ของคำสั่ง Yuth 10 ก.ย. 2569 รอบสอง ป้ายค่าต้องอยู่เหนือแท่งเสมอและห้ามทับเส้นเป้าหมาย
     จึงต้องเผื่อที่ว่างเหนือค่าสูงสุด และเผื่อเพิ่มอีกชั้นเมื่อค่าสูงสุดอยู่ใกล้เส้นเป้าหมาย */
  const topBar = Math.max.apply(null, nums.concat([0]));
  let hiRaw = Math.max(topBar*1.08, (opt.ref!=null? opt.ref:0)*1.04, 0);
  /* ถ้ามีเส้นคะแนนซ้อน ต้องเผื่อความสูงให้คะแนนสูงสุดอยู่ในกรอบ
     เพราะเส้นคะแนนผูกไว้กับเส้นเป้าหมาย คือคะแนน 100 อยู่ที่ระดับเส้นเป้าหมายพอดี */
  if(opt.line && opt.ref!=null && opt.ref>0){
    const lm = Math.max.apply(null, opt.line.vals.filter(v=>v!=null).concat([100]));
    hiRaw = Math.max(hiRaw, opt.ref*(lm/100)*1.10);
  }
  let loRaw = Math.min.apply(null, nums.concat([0]));
  /* คำสั่ง Yuth 10 ก.ย. 2569 รอบสาม ข้อ 3 ป้ายค่าต้องอยู่ชิดยอดแท่ง
     ทับเส้นประเป้าหมายได้ แต่ห้ามให้ป้ายหรือพื้นรองทับตัวแท่ง
     จึงไม่ขยายเพดานแกนเพื่อหลบเส้นอีกต่อไป แกนพอดีข้อมูลตามกติกาข้อ 28 */
  let ns = fitScale(loRaw, hiRaw, 3, 7);
  /* เผื่อที่ว่างเหนือแท่งสูงสุดพอวางป้ายหนึ่งแถว วัดเป็นจุดภาพจริง ไม่ใช่เผื่อเป็นสัดส่วน
     เพราะป้ายทับเส้นประได้แล้ว ที่ว่างที่ต้องการจึงเหลือแค่ความสูงของป้ายเอง */
  const NEED = opt.trend? 32 : 23;   /* รอบ 12 พ.ย. 2569 ข้อ ส2.4 ป้ายยกสูงขึ้น 9 จุดภาพเพื่อหลบจุดของเส้น จึงเผื่อที่เหนือแท่งสูงสุดเพิ่มเท่ากัน */
  if(f.ih > NEED*2 && topBar > loRaw){
    const frac = (topBar - ns.min) / ((ns.max - ns.min) || 1);
    if(frac > 1 - NEED/f.ih) ns = fitScale(loRaw, ns.min + (topBar - ns.min)/(1 - NEED/f.ih), 3, 7);
  }
  if(opt.lineMode){ ns = zoomScale(vals, opt.ref, opt.intTicks); if(opt.axisOut){ opt.axisOut.min = ns.min; opt.axisOut.txt = axisFormatter(ns.ticks)(ns.min) + (opt.tickSuffix||""); } }   /* ชุดสี่ ข้อ ก1.6 ก1.7 */
  const lo = ns.min, hi = ns.max;
  const taken = [];
  let hitTxt = "";
  const hitRec = [];   /* ชุดสี่ ข้อ ก1.12 พื้นที่รับชี้ของกราฟเส้นผูกกับจุดและป้ายตัวเลข */
  const hits = b => taken.some(t=>!(b.x2<t.x1||b.x1>t.x2||b.y2<t.y1||b.y1>t.y2));
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" role="img"${opt.aria? ` aria-label="${esc(opt.aria)}"` : ""}>` + gridLines(f,ns.ticks,lo,hi,opt.tickSuffix);
  /* แถบไล่เฉดของแท่งที่เน้น เก็บไว้ในตัวแปรนี้ก่อน แล้วแทรกเป็น defs ตอนปิดรูป */
  let gradDefs = "";
  /* จางเดือนที่ไม่ได้เลือกเสมอ ไม่ต้องรอให้ผู้ใช้กดเลือกก่อน เดือนล่าสุดจึงเด่นตั้งแต่เปิดหน้า */
  const dim = !!(opt.highlight);
  /* รอบ 12 พ.ย. 2569 ข้อ ส2.8 กราฟผลจริง (opt.wideBars) แท่งกว้าง 62% ของคอลัมน์ เพดาน 160 จุดภาพ กว้างกว่าช่องว่างระหว่างแท่ง */
  const bw = opt.wideBars? Math.min(160, f.iw/vals.length*0.62) : Math.min(46, f.iw/vals.length*0.55);
  /* รอบ 8 ต.ค. 2569 r5 แท่งปลายมนตามภาพอ้างอิง รัศมีไม่เกินครึ่งความกว้างแท่ง */
  const brx = Math.min(9, bw/2).toFixed(1);
  /* รอบ 2 ตำหนิ 1.2 ก้าวหน่วงทยอยไม่เกิน 25 มิลลิวินาที และรวมทั้งชุดไม่เกิน 200 จึงไม่เกิน 600 แม้ครบ 12 เดือน (กติกาข้อ 124 ข้อสาม) */
  const stagger = Math.min(25, 200/Math.max(1, vals.length-1));
  const y0 = f.t + f.ih - ((0-lo)/(hi-lo))*f.ih;
  const every = opt.labelEvery||1;
  const refY = (opt.ref!=null && opt.ref>=lo && opt.ref<=hi)
      ? f.t + f.ih - ((opt.ref-lo)/(hi-lo))*f.ih : null;

  const refTxt = "";

  const cands = [], monthCands = [];
  vals.forEach((v,i)=>{
    const cx = f.l + (i+0.5)*(f.iw/vals.length);
    const x = cx-bw/2;
    const hl = !!(opt.highlight && opt.highlight.has(i));
    let top = y0;
    if(v==null){
      cands.push({i, hl, cx, top:opt.lineMode? f.t+f.ih : y0, txt:"ไม่มีข้อมูล", weak:true});
    }else{
      const y = f.t + f.ih - ((v-lo)/(hi-lo))*f.ih;
      top = Math.min(y,y0);
      const hgt = Math.max(2,Math.abs(y0-y));
      /* เดือนที่ไม่ได้เลือกจางเฉพาะเนื้อแท่ง แต่คงเส้นขอบสีเต็มไว้
         ผู้อ่านจึงยังแยกออกว่าเดือนนั้นถึงเป้าหรือไม่ถึงเป้า */
      /* เดือนที่เลือก ใช้แถบไล่เฉดจากอ่อนบนไปเข้มล่าง ขอบเข้มหนา จึงเด่นออกมาจากเดือนอื่น
         เดือนที่ไม่ได้เลือก จางทั้งเนื้อและขอบ ไม่ใช่จางแต่เนื้อแล้วขอบยังเข้ม
         แก้ตามคำสั่ง Yuth 7 ก.ย. 2569 */
      const gidB = (opt.gid||"bar") + "_" + i;
      if(opt.lineMode){ /* ชุดสี่ ข้อ ก1.1 ไม่มีแท่ง */ } else if(hl || !dim){
        gradDefs += `<linearGradient id="${gidB}" x1="0" y1="0" x2="0" y2="1">`
          + `<stop offset="0" stop-color="${shadeHex(colors[i],0.30)}"/>`
          + `<stop offset="1" stop-color="${shadeHex(colors[i],-0.06)}"/></linearGradient>`;
        s += `<rect class="bar-in" data-bi="${i}" style="--d:${(i*stagger).toFixed(0)}ms" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="${brx}" fill="url(#${gidB})" stroke="${shadeHex(colors[i],TH.barEdge)}" stroke-width="${hl?2.2:1.4}"/>`;
      } else {
        s += `<rect class="bar-in" data-bi="${i}" style="--d:${(i*stagger).toFixed(0)}ms" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="${brx}" fill="${colors[i]}" fill-opacity="0.20" stroke="${colors[i]}" stroke-opacity="0.34" stroke-width="1"/>`;
      }
      /* พื้นที่รับการกดกว้างเต็มช่องของเดือนนั้น และสูงเต็มกราฟ เพื่อให้แตะได้จริงบนมือถือ */
      /* opt.tipExtra คืนค่าเป็นเอชทีเอ็มแอลที่หนีอักขระมาแล้ว และห้ามมีเครื่องหมายคำพูดคู่
         เพราะทั้งก้อนอยู่ในค่าของแอตทริบิวต์ที่คร่อมด้วยเครื่องหมายคำพูดคู่ */
      const tipH = esc(labels[i])+" "+esc(opt.fmt(v))+(opt.tipExtra? opt.tipExtra(i) : "");
      if(opt.lineMode) hitRec.push({i:i, cx:cx, tip:tipH}); else
      hitTxt += `<rect class="clickable" data-mi="${i}" tabindex="0" role="button" aria-label="${esc("เลือกเดือน "+labels[i])}" x="${(cx-Math.max(13,f.iw/vals.length/2)).toFixed(1)}" y="${f.t}" width="${(Math.max(26,f.iw/vals.length)).toFixed(1)}" height="${f.ih}" fill="transparent" data-tip="${esc(tipH)}"/>`;
      cands.push({i, hl, cx, top, txt:opt.fmtShort(v), weak:false});
    }
    monthCands.push({i, hl, cx, txt:labels[i]});
  });

  /* ป้ายชื่อเดือน เดือนที่เลือกได้สิทธิ์วางก่อน เดือนที่เหลือวางเมื่อไม่ชนของเดิม
     จึงไม่มีชื่อเดือนทับกันแม้จอแคบ */
  const mTaken = [];
  const mHits = b => mTaken.some(t=>!(b.x2<t.x1||b.x1>t.x2));
  const my = f.t+f.ih+22;
  monthCands.slice().sort((a,b)=>{
    const pa = a.hl?2:((a.i%every===0||a.i===vals.length-1)?1:0);
    const pb = b.hl?2:((b.i%every===0||b.i===vals.length-1)?1:0);
    return pb-pa || a.i-b.i;
  }).forEach(c=>{
    if(!c.hl && c.i%every!==0 && c.i!==vals.length-1) return;
    const wpx = txtW(c.txt,12);
    const box = {x1:c.cx-wpx/2-4, x2:c.cx+wpx/2+4};
    if(mHits(box)) return;
    mTaken.push(box);
    /* คำสั่ง Yuth 10 ก.ย. 2569 ข้อ 14 เดือนที่เลือกต้องอ่านออกทันทีว่าเป็นเดือนไหน
       จึงขยายทั้งชื่อเดือนและตัวเลขบนแท่ง ไม่ใช่ขนาดเท่ากันหมด */
    s += `<text x="${c.cx.toFixed(1)}" y="${(c.hl? my+1 : my).toFixed(1)}" text-anchor="middle" font-size="${c.hl?14.5:12}" font-weight="${c.hl?800:400}" fill="${c.hl?TH.sel:TH.ink2}">${esc(c.txt)}</text>`;
  });

  /* ลำดับสิทธิ์ ป้ายค่าแท่งของเดือนที่เลือก แล้วจุดของเส้น แล้วป้ายค่าแท่งที่เหลือ */
  cands.sort((a,b)=> (b.hl?1:0)-(a.hl?1:0) || a.i-b.i);
  let valTxt = "";
  const placeVal = c=>{
    const fs = c.hl? 15 : 12;
    const wpx = txtW(c.txt,fs);
    const lx = Math.max(f.l+wpx/2+2, Math.min(f.l+f.iw-wpx/2-2, c.cx));
    /* ยอดของแท่งต้องอยู่เหนือยอดแท่งเสมอ ตามคำสั่ง 25 ส.ค. 2569
       ถ้าที่ตรงนั้นถูกจองไว้ ให้ขยับสูงขึ้นทีละระดับ ห้ามย้ายลงไปอยู่ในตัวแท่ง */
    /* ขอบล่างของพื้นรองอยู่ที่ระยะ 8 จุดใต้เส้นฐานตัวอักษร จึงต้องยกขึ้นอย่างน้อย 9 จุด
       พื้นรองจะได้ไม่ทับยอดแท่ง ตามข้อ 3 ของคำสั่ง Yuth 10 ก.ย. 2569 รอบสาม */
    const base = Math.max(f.t+13, c.top-10-(opt.trend && !c.weak? 9 : 0));   /* ข้อ ส2.4 */
    const levels = [];
    (opt.trend? Array.from({length:30}, (_,j)=>base-8*j) : [base, base-19, base-38]).forEach(ly=>{   /* รอบ 12 พ.ย. 2569 ข้อ ส2.4 รอบส่งคืนครั้งที่ 1 ลองทุก 8 จุดภาพขึ้นไปถึงขอบบนของภาพ */
      const cy = Math.max(opt.trend? 16 : f.t+13, ly);   /* รอบส่งคืนครั้งที่ 1 ส2.4 */
      if(levels.indexOf(cy) < 0) levels.push(cy);
    });
    if(opt.lineMode && !c.weak) for(let j=0;j<8;j++){ const cy = c.top + 26 + 8*j; if(cy + 7 <= f.t + f.ih) levels.push(cy); }   /* ชุดสี่ ข้อ ก1.14 ลองใต้จุดเมื่อเหนือจุดเต็ม */
    for(const cy of levels){
      const box = {x1:lx-wpx/2-7, x2:lx+wpx/2+7, y1:cy-15, y2:cy+7};
      if(hits(box)) continue;
      /* ป้ายค่าโปร่งแสง ตามคำสั่ง Yuth 8 ก.ย. 2569 เดือนที่เลือกทึบและใหญ่กว่า ตามข้อ 14 ของคำสั่ง 10 ก.ย. 2569 */
      valTxt += `<rect x="${(lx-wpx/2-7).toFixed(1)}" y="${(cy-15).toFixed(1)}" width="${(wpx+14).toFixed(0)}" height="${c.hl?23:20}" rx="9" fill="${TH.plate}" opacity="${c.hl?TH.plateHi:TH.plateLo}"/>`
        + `<text x="${lx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="${c.hl?800:(c.weak?400:600)}" fill="${c.weak?TH.ink2:TH.ink}" fill-opacity="${c.weak?0.7:(c.hl?1:0.78)}">${esc(c.txt)}</text>`;
      taken.push(box); c.lb = box;
      return;
    }
    /* ทุกระดับถูกจองหมด ให้พิมพ์เหนือยอดแท่งพร้อมพื้นรองทึบ ดีกว่าปล่อยแท่งไม่มีตัวเลข */
    let cy = Math.max(f.t+13, c.top-10-(opt.trend && !c.weak? 9 : 0));
    if(opt.trend){ let bc = 1e9; for(const ly of levels){ const bx = {x1:lx-wpx/2-7, x2:lx+wpx/2+7, y1:ly-15, y2:ly+7}; const nh = taken.filter(t=>!(bx.x2<t.x1||bx.x1>t.x2||bx.y2<t.y1||bx.y1>t.y2)).length; if(nh < bc){ bc = nh; cy = ly; } } }   /* รอบส่งคืนครั้งที่ 1 ส2.4 */
    valTxt += `<rect x="${(lx-wpx/2-7).toFixed(1)}" y="${(cy-15).toFixed(1)}" width="${(wpx+14).toFixed(0)}" height="${c.hl?23:20}" rx="9" fill="${TH.plate}" opacity="0.94"/>`
      + `<text x="${lx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="${c.hl?800:600}" fill="${TH.ink}">${esc(c.txt)}</text>`;
    taken.push({x1:lx-wpx/2-7, x2:lx+wpx/2+7, y1:cy-15, y2:cy+7}); c.lb = taken[taken.length-1];
  };
  /* คะแนน 0 อยู่ที่เส้นศูนย์ของแกนซ้าย และคะแนน 100 อยู่ที่ระดับเส้นเป้าหมายพอดี
     เส้นคะแนนจึงอยู่ในย่านเดียวกับแท่ง และตัดเส้นเป้าหมายเมื่อคะแนนเท่ากับ 100
     ถ้าเป้าหมายเป็นศูนย์ เส้นเป้าหมายจะทับเส้นศูนย์ ผูกกันไม่ได้ ต้องใช้มาตราสำรองที่กระจายเต็มกรอบ */
  const lineSpan = (opt.line && refY!=null)? (y0-refY) : 0;
  const lineTop = (opt.line && opt.line.max)? opt.line.max : 100;
  const Y2 = v => lineSpan >= 20
    ? y0 - (v/100)*lineSpan
    : y0 - (v/lineTop)*(y0 - f.t - 10);
  let linePts = [];
  if(opt.line){
    const L = opt.line;
    L.vals.forEach((v,i)=>{
      if(v==null) return;
      const p = {x:f.l+(i+0.5)*(f.iw/L.vals.length), y:Y2(v), v, i};
      linePts.push(p);
      taken.push({x1:p.x-7, x2:p.x+7, y1:p.y-7, y2:p.y+7, pi:p.i});
    });
  }

  /* รอบ 12 พ.ย. 2569 ข้อ ส2 คำสั่ง Yuth "รุป 2  ให้ใส่เส้นกราฟ เพื่อให้เห็นเทรนด้วย และขยายกราฟให้ใหญ่พอดีหน้าจอ"
     เส้นเชื่อมยอดแท่งทุกเดือนตามลำดับ หน้าตาเดียวกับเส้นแนวโน้มของกราฟโอที เส้น 3.8 จุดภาพ สี TH.blueInk ขอบขาวรอง 7.4 จุดภาพ
     จุดรัศมี 5.5 จุดเดือนล่าสุด 7.5 เส้นโค้งแบบไม่ล้ำค่า (smoothPath) เดือน null เว้นช่วง ไม่วางจุด ไม่รับเมาส์
     จองพื้นที่ของเส้นและจุดในทะเบียนกล่องก่อนวางป้ายตัวเลข ป้ายจึงหลบเส้น */
  let trendTxt = "";
  if(opt.trend){
    const pts = vals.map((v,i)=> v==null? null : {x:f.l+(i+0.5)*(f.iw/vals.length), y:f.t+f.ih-((v-lo)/(hi-lo))*f.ih, i:i});
    const runs = []; let run = [];
    pts.forEach(p=>{ if(!p){ if(run.length) runs.push(run); run = []; } else run.push(p); });
    if(run.length) runs.push(run);
    const nar = f.w < 560 && !opt.lineMode, rL = nar? 5.5 : 7.5, rP = nar? 4 : 5.5,   /* ชุดสี่ ข้อ ก1.2 กราฟเส้นใช้จุดรัศมี 5.5 และ 7.5 ทุกความกว้าง */
    lw = nar? 3.5 : 3.8, hw = nar? 6.6 : 7.4, by = hw/2 + 1;   /* จอแคบใช้ขนาดขั้นต่ำ by คือครึ่งความหนาของขอบขาวบวก 1 */
    pts.forEach(p=>{ if(p){ const rr = (p.i===vals.length-1? rL : rP) + 2.5; taken.push({x1:p.x-rr, x2:p.x+rr, y1:p.y-rr, y2:p.y+rr}); } });
    const d = runs.filter(r=>r.length>1).map(smoothPath).join(" ");
    /* รอบส่งคืนครั้งที่ 1 ส2.4 จองพื้นที่ตามเส้นโค้งจริง อ่านคำสั่ง M L C ของ d แล้วสุ่มจุดบนเบซิเยร์ */
    const tk = d.match(/[MLC]|-?\d+(?:\.\d+)?/g) || []; let px = 0, py = 0, ti = 0;
    const addS = (x,y)=>taken.push({x1:x-2, x2:x+2, y1:y-by, y2:y+by});
    while(ti < tk.length){ const c = tk[ti++];
      if(c==="M"){ px = +tk[ti++]; py = +tk[ti++]; }
      else if(c==="L"){ const x = +tk[ti++], y = +tk[ti++]; for(let q=0;q<=20;q++) addS(px+(x-px)*q/20, py+(y-py)*q/20); px = x; py = y; }
      else if(c==="C"){ const a = [+tk[ti++],+tk[ti++],+tk[ti++],+tk[ti++],+tk[ti++],+tk[ti++]]; for(let q=0;q<=30;q++){ const t = q/30, u = 1-t;
          addS(u*u*u*px+3*u*u*t*a[0]+3*u*t*t*a[2]+t*t*t*a[4], u*u*u*py+3*u*u*t*a[1]+3*u*t*t*a[3]+t*t*t*a[5]); } px = a[4]; py = a[5]; }
      else ti++; }
    /* ชุดสี่ ข้อ ก1.2 สีจุดตามสถานะเดิมของแท่ง (colors ถึงเป้าหมาย TH.pass ไม่ถึงเป้าหมาย TH.fail) ใช้เฉดเข้มของแต่ละสี ข้อ ก1.3 พื้นจางใต้เส้นทึบ 0.10 ลงถึงฐานพื้นที่วาด */
    const dotCol = i => !opt.lineMode? TH.blueInk : (colors[i]===TH.pass? TH.passD : (colors[i]===TH.fail? TH.fail : TH.ink2));
    const area = !opt.lineMode? "" : runs.filter(r=>r.length>1).map(r=> smoothPath(r) + " L"+r[r.length-1].x.toFixed(1)+" "+(f.t+f.ih).toFixed(1)+" L"+r[0].x.toFixed(1)+" "+(f.t+f.ih).toFixed(1)+" Z").join(" ");
    trendTxt = `<g class="act-trend" pointer-events="none" aria-hidden="true">`
      + (area? `<path class="act-area" d="${area}" fill="${TH.blueInk}" fill-opacity="0.10" stroke="none"/>` : "")
      + (d? `<path d="${d}" fill="none" stroke="${TH.ring}" stroke-width="${hw}" stroke-opacity="0.92" stroke-linecap="round" stroke-linejoin="round"/><path class="act-trend-ln" d="${d}" fill="none" stroke="${TH.blueInk}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/>` : "")
      + pts.map(p=> p? `<circle class="act-trend-pt" data-ti="${p.i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.i===vals.length-1? rL : rP}" fill="${dotCol(p.i)}" stroke="${TH.ring}" stroke-width="${p.i===vals.length-1? 2.5 : 2}"/>` : "").join("")
      + `</g>`;
  }
  cands.forEach(placeVal);
  /* ชุดสี่ ข้อ ก1.12 พื้นที่รับชี้ครอบจุด (อย่างน้อย 28 จุดภาพ) และป้ายตัวเลขของเดือนนั้น เนื้อหาในกล่องเมื่อชี้เท่าเดิม */
  if(opt.lineMode) hitRec.forEach(hr=>{ const c = cands.find(q=>q.i===hr.i); if(!c) return; const py = c.top, lb = c.lb || {x1:hr.cx-14, x2:hr.cx+14, y1:py-14, y2:py};
    const x1 = Math.min(lb.x1, hr.cx-14), x2 = Math.max(lb.x2, hr.cx+14), y1 = Math.min(lb.y1, py-14), y2 = py+14;
    hitTxt += `<rect class="clickable" data-mi="${hr.i}" tabindex="0" role="button" aria-label="${esc("เลือกเดือน "+labels[hr.i])}" x="${x1.toFixed(1)}" y="${y1.toFixed(1)}" width="${(x2-x1).toFixed(1)}" height="${(y2-y1).toFixed(1)}" fill="transparent" data-tip="${esc(hr.tip)}"/>`; });
  s += trendTxt;   /* รอบ 12 พ.ย. 2569 ข้อ ส2 เส้นอยู่เหนือแท่ง ใต้เส้นประ ป้ายเป้าหมาย และป้ายตัวเลข */

  if(refY!=null){
    s += `<line x1="${f.l}" y1="${refY}" x2="${f.l+f.iw}" y2="${refY}" stroke="${TH.amberLine}" stroke-width="2" stroke-dasharray="6 5"/>`;
    /* ข้อ 1 ของคำสั่ง Yuth 7 ก.ย. 2569 เส้นประต้องมีเลขกำกับที่ปลายเส้น
       วางในขอบขวาเมื่อกว้างพอ ถ้าไม่พอให้ถอยเข้ามาอยู่เหนือเส้นในกรอบกราฟ */
    const rTxt = opt.refShort!=null? String(opt.refShort)
      : (opt.fmtShort? String(opt.fmtShort(opt.ref)) : numf(opt.ref,1));
    const rW = txtW(rTxt,12)+12;
    const outside = (rW+10) <= f.r;
    const rX = outside? f.l+f.iw+6 : f.l+f.iw-rW-4;
    const rY = outside? refY : refY-14;
    s += `<rect x="${rX.toFixed(1)}" y="${(rY-9).toFixed(1)}" width="${rW.toFixed(0)}" height="18" rx="8" fill="${TH.plate}" opacity="0.94" stroke="${TH.amberEdge}"/>`
      + `<text x="${(rX+rW/2).toFixed(1)}" y="${(rY+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${TH.amberInk}">${esc(rTxt)}</text>`;
  }

  /* เส้นคะแนนซ้อนบนแท่งผลจริง อ่านค่าที่แกนขวา
     แกนซ้ายเป็นหน่วยของผลจริง แกนขวาเป็นคะแนน สองอย่างนี้คนละหน่วย จึงต้องมีป้ายแกนกำกับทั้งสองฝั่ง */
  let lineTxt = "";
  if(opt.line){
    const L = opt.line;
    const col = L.color || TH.blue;
    const txtCol = L.textColor || TH.blueInk;
    /* แกนขวาไม่ได้ใช้เส้นกริดชุดเดียวกับแกนซ้าย จึงต้องมีเส้นอ้างอิงของตัวเอง
       ไม่งั้นผู้อ่านจะลากสายตาไปตกที่ตัวเลขของแกนซ้าย */
    /* ขีดแกนขวา วางตามมาตราของคะแนน ไม่ต้องมีเส้นกริดของตัวเอง
       เพราะคะแนน 100 ตรงกับเส้นเป้าหมายที่วาดไว้แล้ว */
    (L.ticks||[]).forEach(tv=>{
      const y = Y2(tv);
      if(y < f.t-2 || y > f.t+f.ih+2) return;
      lineTxt += `<text x="${(f.l+f.iw+8).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="start" font-size="12" fill="${txtCol}">${esc(L.fmtTick? L.fmtTick(tv) : String(tv))}</text>`;
    });
    const pts = linePts;
    if(pts.length>1){
      lineTxt += `<path d="${pts.map((p,j)=>(j?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" opacity="${dim? 0.55 : 1}"/>`;
    }
    pts.forEach(p=>{
      const hl = !!(opt.highlight && opt.highlight.has(p.i));
      lineTxt += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${hl?6:4.5}" fill="${hl? (L.dark||TH.blueInk) : col}" stroke="${TH.ring}" stroke-width="1.6" opacity="${dim && !hl? 0.42 : 1}"/>`;
    });
    /* ป้ายค่าของเส้น เดือนที่เลือกได้สิทธิ์วางก่อน ป้ายที่ยังชนจะไม่วาด ค่ายังอ่านได้จากตาราง */
    let lv = "";
    pts.slice().sort((a,b)=>{
      const ha = dim && opt.highlight && opt.highlight.has(a.i)?1:0;
      const hb = dim && opt.highlight && opt.highlight.has(b.i)?1:0;
      return hb-ha || a.i-b.i;
    }).forEach(p=>{
      const txt = L.fmt(p.v);
      const wpx = txtW(txt,12);
      const lx = Math.max(f.l+wpx/2+2, Math.min(f.l+f.iw-wpx/2-2, p.x));
      for(const cy of [p.y-15, p.y+25]){
        if(cy < f.t+11 || cy > f.t+f.ih-2) continue;
        const box = {x1:lx-wpx/2-6, x2:lx+wpx/2+6, y1:cy-14, y2:cy+6};
        if(taken.some(t=>t.pi!==p.i && !(box.x2<t.x1||box.x1>t.x2||box.y2<t.y1||box.y1>t.y2))) continue;
        lv += `<rect x="${(lx-wpx/2-6).toFixed(1)}" y="${(cy-14).toFixed(1)}" width="${(wpx+12).toFixed(0)}" height="20" rx="8" fill="${TH.plate}" opacity="0.96"/>`
          + `<text x="${lx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="${txtCol}">${esc(txt)}</text>`;
        taken.push(box);
        break;
      }
    });
    lineTxt += lv;
  }
  /* ป้ายค่าของแท่งวาดเป็นชั้นบนสุด เส้นคะแนนจึงไม่พาดทับตัวเลข */
  /* ป้ายชื่อแกน วางตั้งฉากที่ขอบซ้ายและขอบขวา บอกว่าแต่ละแกนคือข้อมูลอะไร */
  let axisTxt = "";
  if(opt.axisLeft){
    const cy = f.t + f.ih/2;
    axisTxt += `<text transform="translate(14 ${cy.toFixed(1)}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600" fill="${TH.ink2}">${esc(opt.axisLeft)}</text>`;
  }
  if(opt.axisRight){
    const cy = f.t + f.ih/2;
    axisTxt += `<text transform="translate(${(f.w-12).toFixed(1)} ${cy.toFixed(1)}) rotate(90)" text-anchor="middle" font-size="12" font-weight="600" fill="${TH.blueInk}">${esc(opt.axisRight)}</text>`;
  }
  /* แถบไล่เฉดต้องประกาศไว้ใน defs ก่อนถูกอ้างถึง จึงแทรกไว้ต้นรูปหลังแท็กเปิด */
  if(gradDefs){
    const cut = s.indexOf(">") + 1;
    s = s.slice(0, cut) + "<defs>" + gradDefs + "</defs>" + s.slice(cut);
  }
  return s+refTxt+lineTxt+valTxt+axisTxt+hitTxt+"</svg>";
}
function bindMonthClicks(rootId){
  $(rootId).querySelectorAll("[data-mi]").forEach(el=>{
    /* ค3 รับทั้งเมาส์และแป้น Enter หรือเว้นวรรค ค2 กดด้วยแป้นแล้วโฟกัสกลับมาที่จุดเดือนเดิมหลังวาดใหม่ */
    const go = kb=>{
      const mi = parseInt(el.getAttribute("data-mi"),10);
      selMonths = [mi];
      monthPicked = true;
      hideTip();
      busy(()=>withAnim(renderAll), kb? ()=>{ const t = $(rootId).querySelector('[data-mi="'+mi+'"]'); if(t) t.focus(); } : null);
    };
    el.addEventListener("click",()=>go(false));
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(true); } });
  });
}

/* ---------- สลับหน้า ---------- */
/* ง สลับแท็บด้วยการจางออกของหน้าเดิมและจางเข้าของหน้าใหม่ สถานะของหน้าเปลี่ยนทันที เฉพาะภาพที่ค่อยเปลี่ยน
   หน้าเดิมถูกวางลอยไว้ตำแหน่งเดิมระหว่างจางออก 150 มิลลิวินาที จึงไม่ดันหน้าใหม่ลง */
function swapPage(newId){
  const nw = $(newId), old = document.querySelector(".page.show");
  if(!nw || old===nw) return;
  if(newId==="page-kpi") fxStop();   /* รอบส่งคืนครั้งที่ 2 ของชุดสี่ รายการ 1 เข้าหน้าเจาะรายตัวชี้วัดจากเมนูใดก็ล้างพลุของหน้าภาพรวม */
  if(old){
    const top = old.offsetTop;
    old.classList.remove("show","pg-in");
    if(!REDUCED){
      clearTimeout(old.__pgT);
      old.style.top = top+"px";
      old.setAttribute("aria-hidden","true");
      old.classList.add("pg-out");
      old.__pgT = setTimeout(()=>{ old.classList.remove("pg-out"); old.style.top = ""; old.removeAttribute("aria-hidden"); }, 160);
    }
  }
  clearTimeout(nw.__pgT);
  nw.classList.remove("pg-out"); nw.style.top = ""; nw.removeAttribute("aria-hidden");
  nw.classList.add("show");
  if(!REDUCED){ nw.classList.remove("pg-in"); void nw.offsetWidth; nw.classList.add("pg-in"); }
}
/* ข3 สลับแท็บขณะเลื่อนหน้าอยู่ ต้องให้ส่วนบนของหน้าใหม่ไม่อยู่ใต้แถบบน */
function keepMainInView(){
  const mn = $("main"), tb = $("topbar");
  if(mn && tb && mn.getBoundingClientRect().top < (sideNav()? 0 : tb.offsetHeight) - 1) mn.scrollIntoView({block:"start"});
}
const revealDone = new Set();
function setupReveal(pageId){
  if(revealDone.has(pageId)) return;
  revealDone.add(pageId);
  if(REDUCED || !("IntersectionObserver" in window)) return;
  const scope = $(pageId); if(!scope) return;
  const vh = document.documentElement.clientHeight;
  const io = new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting) return;
    const c = en.target;
    io.unobserve(c);
    c.classList.add("rv-in"); c.classList.remove("rv-pend");
    pulseFill(c);
    setTimeout(()=>c.classList.remove("rv-in"), 480);
  }), {threshold:0.06});
  scope.querySelectorAll(".card").forEach(c=>{
    const r = c.getBoundingClientRect();
    if(r.height>0 && r.top >= vh){ c.classList.add("rv-pend"); io.observe(c); }
  });
}
document.querySelectorAll("#nav button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const pg = btn.dataset.page, wasOn = pageOn("page-"+pg);
    hideTip();
    document.querySelectorAll("#nav button").forEach(b=>{b.classList.remove("active");b.removeAttribute("aria-current");});
    btn.classList.add("active"); btn.setAttribute("aria-current","page");
    swapPage("page-"+pg);
    if(!wasOn) keepMainInView();
    /* วาดกราฟใหม่หลังหน้าถูกแสดง มิฉะนั้นความกว้างที่วัดได้เป็นศูนย์ แล้วตัวอักษรในกราฟจะถูกย่อจนเล็กกว่าเกณฑ์
       ง กราฟของหน้าที่เพิ่งเข้าจอวาดเข้าแบบเคลื่อนไหว */
    if(pg==="kpi"){ if(wasOn) renderKpiPage(); else withAnim(renderKpiPage); }
    else document.body.classList.remove("tone-fail");
    if(pg==="overview"){ if(wasOn) renderTrend(); else withAnim(renderTrend); }
    if(pg==="ot") renderOt();
    if(!wasOn) setupReveal("page-"+pg);
  });
});

/* ---------- ตัวเลือกช่วงเวลา แบบรายการเลื่อนลง พร้อมโหมดกำหนดเอง ---------- */
let customMode = false;
function rangeOptions(){
  const n = S.months.length;
  let o = S.months.map((m,i)=>
    `<option value="m${i}">${esc(m)}${i===n-1?" (เดือนล่าสุด)":""}</option>`).join("");
  return o;
}
function currentRangeValue(){
  if(customMode) return "custom";
  const n = S.months.length;
  if(selMonths.length===1) return "m"+selMonths[0];
  const want2 = [n-2,n-1].join(","), want3 = [n-3,n-2,n-1].join(",");
  const cur = selSorted().join(",");
  if(cur===want2) return "c2";
  if(cur===want3) return "c3";
  return "custom";
}
function renderRange(){
  const sel = $("selRange");
  sel.innerHTML = rangeOptions();
  sel.value = currentRangeValue();
  const selK = $("selRangeK");
  if(selK){ selK.innerHTML = rangeOptions(); selK.value = currentRangeValue(); }
  const chips = $("mchips");
  if(customMode){
    chips.hidden = false;
    chips.innerHTML = S.months.map((m,i)=>
      `<button type="button" class="mchip" data-mi="${i}" aria-pressed="${selMonths.includes(i)?"true":"false"}">${esc(m)}</button>`).join("");
    chips.querySelectorAll(".mchip").forEach(ch=>{
      ch.addEventListener("click",()=>{
        const i = parseInt(ch.getAttribute("data-mi"),10);
        const at = selMonths.indexOf(i);
        if(at>=0){ if(selMonths.length>1) selMonths.splice(at,1); }
        else { selMonths.push(i); if(selMonths.length>3) selMonths.shift(); }
        monthPicked = true;
        busy(renderAll);
      });
    });
    $("mhint").textContent = "";
  } else {
    chips.hidden = true;
    chips.innerHTML = "";
    $("mhint").textContent = compareMode()
      ? "กำลังเทียบ "+selSorted().map(x=>S.months[x]).join(" กับ ")
      : "";
  }
}
function onRangeChange(v){
  const n = S.months.length;
  if(v==="custom"){ customMode = true; }
  else if(v==="c2"){ customMode=false; selMonths=[n-2,n-1]; monthPicked=true; }
  else if(v==="c3"){ customMode=false; selMonths=[n-3,n-2,n-1]; monthPicked=true; }
  else { customMode=false; selMonths=[parseInt(v.slice(1),10)]; monthPicked=true; }
  busy(()=>withAnim(renderAll));
}

/* ---------- การ์ดตัวเลขสำคัญ ---------- */
function cmpText(cur,prev,label){
  if(cur==null||prev==null) return "";
  const d = (cur-prev)*100;
  const w = d>=0 ? `<span class="up">เพิ่มขึ้น ${numf(Math.abs(d),1)} คะแนน</span>` : `<span class="down">ลดลง ${numf(Math.abs(d),1)} คะแนน</span>`;
  return w+" "+label;
}
/* สถานะกางหรือย่อรายละเอียดของการ์ดกลุ่มงาน ค่าตั้งต้นคือย่อไว้ ตามคำสั่ง Yuth 7 ก.ย. 2569 */
let grpOpen = false;
/* คะแนนที่เก็บได้ของตัวชี้วัดข้อหนึ่ง ต้องเดินตามวิธีคิดที่ผู้ใช้เลือกไว้
   แบบตามชีท ใช้คอลัมน์คะแนนถ่วงน้ำหนักของชีท ซึ่งตัดไว้ที่น้ำหนักเต็มของข้อ
   แบบไม่ตัดเพดาน ใช้น้ำหนักคูณคะแนนจริง คะแนนของข้อจึงเกินน้ำหนักเต็มได้
   ถ้าจุดใดไม่เดินตาม จอเดียวกันจะบอกคนละคะแนน */
function gotPts(k, mi){
  if(trendMode==="full"){
    const r = k.m[mi][2];
    return r==null? null : (k.weight||0)*r;
  }
  return k.m[mi][3];
}
function modeWord(){
  return trendMode==="full"? "แบบไม่ตัดเพดาน" : "แบบตัดเพดาน 100 คะแนน";
}
function renderTiles(){
  const i = mainM();
  const cmp = compareMode();
  const others = selSorted().filter(x=>x!==i);
  /* วิธีคิดคะแนนรวมที่ผู้ใช้เลือกไว้ ต้องใช้กับการ์ดนี้ด้วย ไม่งั้นจอเดียวกันจะบอกคนละคะแนน */
  const full = trendMode==="full";
  const tot = full? totalsFull() : null;
  const gsum = (mi, grp) => {
    let sum = 0, any = false;
    S.kpis.slice().sort((a,b)=>a.no-b.no).forEach(k=>{
      if(k.type!==grp) return;
      const r = k.m[mi][2];
      if(r==null) return;
      any = true; sum += (k.weight||0)*r;
    });
    return any? sum : null;
  };
  const totAt = mi => full? (tot[mi]!=null? tot[mi]/100 : null) : S.totals.total[mi][2];
  const fin = totAt(i);
  const finPrev = i>0 ? totAt(i-1) : null;
  const finPct = fin!=null ? fin*100 : null;
  const g = full? deriveGrade(finPct) : (S.grades[i] || deriveGrade(finPct));
  const outp = full? [null,null,gsum(i,"Output")] : S.totals.out[i];
  const inp  = full? [null,null,gsum(i,"Input")] : S.totals.inp[i];
  /* เลขข้อที่แสดงของแต่ละกลุ่ม เรียงจากน้อยไปมาก เช่น 1 2 7 8 9 */
  const grpNos = t => S.kpis.filter(k=>k.type===t).map(dispNo).sort((a,b)=>a-b).join(" ");
  const passList=[], failList=[];
  S.kpis.forEach(k=>{
    const r = k.m[i][2];
    if(r==null) return;
    (r>=1?passList:failList).push({n:dispNo(k), t:k.type});
  });
  const heroCmp = cmp
    ? others.map(o=>{
        const v = totAt(o);
        return `<div>${esc(S.months[o])} ได้ ${fmtTotal(v!=null? v*100 : null)} คะแนน</div>`;
      }).join("")
    : cmpText(fin,finPrev,"จากเดือนก่อน");
  /* แถบของกลุ่ม ต้องเล่าเรื่องเดียวกับวิธีคิดที่เลือกอยู่
     แบบตามชีท คะแนนกลุ่มเกินน้ำหนักเต็มไม่ได้ แถบจึงเต็มที่ร้อยละร้อย
     แบบไม่ตัดเพดาน คะแนนกลุ่มเกินน้ำหนักเต็มได้ แถบจึงต้องยาวเกินขีดน้ำหนักเต็ม
     ถ้ายังตัดที่ร้อยละร้อยเหมือนเดิม การ์ดจะบอกว่าเต็มพอดี ทั้งที่ตัวเลขข้างบนเกินไปแล้ว */
  const rawPct = v => v!=null? v*100 : 0;
  const outRaw = outp[2]!=null? outp[2]/0.70*100 : 0;
  const inRaw  = inp[2]!=null? inp[2]/0.30*100 : 0;
  const barMax = full? Math.max(100, outRaw, inRaw) : 100;
  const overflow = barMax > 100.05;
  /* การ์ดกลุ่มงาน ตัวเลขใหญ่คือคะแนนที่กลุ่มนั้นเก็บได้ แถบคือสัดส่วนเทียบน้ำหนักเต็มของกลุ่ม */
  const grpTile = (elId, nm, pctRaw, gotPt, prevPt, fullPt, grp, note, icKind) => {
    const el = $(elId);
    if(!el) return;
    const wpc = Math.max(0, Math.min(100, pctRaw/barMax*100));
    const tick = overflow? `<i style="left:${(100/barMax*100).toFixed(2)}%"></i>` : "";
    const word = full? "จากน้ำหนักเต็ม" : "จาก";
    const cm = cmp? "" : cmpText(gotPt, prevPt, "จากเดือนก่อน");
    const gp = passList.filter(o=>o.t===grp).map(o=>o.n).sort((a,b)=>a-b), gf = failList.filter(o=>o.t===grp).map(o=>o.n).sort((a,b)=>a-b);
    const passTxt = (gp.length+gf.length)===0 ? "ยังไม่มีข้อมูลของเดือนนี้"
      : (gf.length? "ผ่านเกณฑ์ "+gp.length+" ข้อ จาก "+(gp.length+gf.length)+" ข้อ ยังไม่ผ่าน ข้อ "+gf.join(", ")
                  : "ผ่านเกณฑ์ครบทั้ง "+gp.length+" ข้อ");
    const tipGrp = tipList([
      "กลุ่มนี้คือตัวชี้วัดข้อ " + grpNos(grp),
      "น้ำหนักเต็มของกลุ่ม " + fullPt + " คะแนน",
      /* จ ข้อ 108 ร้อยละที่ขยายความจำนวนอยู่ในวงเล็บต่อท้ายจำนวน และไม่ซ้ำสองบรรทัด */
      "เก็บได้จริง " + (gotPt==null? "ไม่มีข้อมูล" : fmtPts(gotPt) + " คะแนน (" + numf(pctRaw,1) + "%)"),
      esc(passTxt)
    ]);
    el.removeAttribute("data-tip");
    el.classList.remove("clickable");
    el.innerHTML = `
      <div class="lbl"><span class="lbl-ic">${icon(icKind||"bars",15,"currentColor")}</span>${esc(nm)}</div>
      <div class="grp-score"><span class="num clickable" data-tip="${esc(tipGrp)}">${gotPt==null? "ไม่มีข้อมูล" : fmtPts(gotPt)}</span><span class="grp-full">${word} ${fullPt} คะแนน</span></div>
      <div class="cmp grp-cmp">${cm}</div>
      <div class="wbar"><span class="got" data-w="${wpc}" style="width:${wpc}%"></span><span class="rest" style="flex:1"></span>${tick}</div>
      <div class="grp-pass">${esc(passTxt)}</div>
      <button type="button" class="grp-more" aria-expanded="${grpOpen?"true":"false"}">${grpOpen? "ซ่อนรายละเอียด" : "ดูรายละเอียด"}</button>
      <div class="grp-detail" ${grpOpen? "" : "hidden"}>
        <div class="grp-note">${esc(note)}</div>
        ${overflow? `<div class="grp-foot">ขีดในแถบ คือระดับน้ำหนักเต็มของกลุ่ม ส่วนที่ยาวเลยขีดไป คือคะแนนที่เก็บเกินน้ำหนักเต็ม</div>` : ""}
      </div>`;
  };
  /* คำสั่ง Yuth 10 ก.ย. 2569 ข้อ 24 การ์ดที่แสดงตัวเลข ต้องบอกวิธีคิดเป็นข้อเมื่อชี้ */
  const tipHero = tipList([
    full? "คะแนนรวม คือผลบวกคะแนนที่เก็บได้ของตัวชี้วัดทั้ง 10 ข้อ" : "คะแนนรวม ใช้ตามแถวคะแนนรวมของแผ่น KPI ในไฟล์ต้นทางตรงตัว",
    full? "แต่ละข้อคิดจาก น้ำหนักของข้อ คูณ สัดส่วนที่ทำได้เทียบเป้า" : "คะแนนที่เก็บได้ของแต่ละข้อใช้ตามแผ่น KPI ยกเว้นข้อ 10 ที่คิดเองแบบยิ่งสูงยิ่งดี ผลบวกรายข้อจึงต่ำกว่าคะแนนรวมได้ถึงประมาณ 1 คะแนน เกรดใช้ตามแผ่น KPI",
    "งานที่ส่งผลถึงองค์กร ข้อ " + grpNos("Output") + " เก็บได้ " + (outp[2]==null?"ไม่มีข้อมูล":fmtPts(outp[2])) + " จาก 70 คะแนน",
    "งานประจำของแผนก ข้อ " + grpNos("Input") + " เก็บได้ " + (inp[2]==null?"ไม่มีข้อมูล":fmtPts(inp[2])) + " จาก 30 คะแนน",
    "รวมเป็น " + fmtTotal(finPct) + " คะแนน จากคะแนนเต็ม 100",
    "ตอนนี้หน้านี้ใช้" + modeWord()
  ]);
  $("heroCard").removeAttribute("data-tip");
  $("heroCard").classList.remove("clickable");
  /* รอบ 12 พ.ย. 2569 ข้อ ส6 คำสั่ง Yuth "รูป 6 ตัดข้อความ ใต้ภาษาอังกฤษออก แล้วจัดใหม่" ตัดคำอธิบายเกรด (gradeWord) ใต้ตัวอักษรเกรด
     ความหมายของเกรดยังอยู่ใน aria-label ของป้าย เดือนที่ไม่มีเกรดยังแสดง ยังไม่มีข้อมูล ตามรอบ r4 */
  /* รอบแก้ 8 ต.ค. 2569 ข้อ 8 ป้ายเกรดเป็นป้ายทึบสีตามเกรด อ่านต่อกันได้ว่า เกรด ตัวอักษรเกรด และคำอธิบายเกรด ข้อมูลในการ์ดเท่าเดิมทุกชิ้น */
  $("heroCard").innerHTML = `
    <div class="hero-art" aria-hidden="true">${heroArt()}</div>
    <div class="lbl"><span class="lbl-ic">${icon("gauge",15,"currentColor")}</span>คะแนนรวมเดือน ${esc(S.months[i])}</div>
    <div class="hero-score"><span class="num clickable" id="heroNum" data-tip="${esc(tipHero)}">${fmtTotal(finPct)}</span><span class="hero-full">จากคะแนนเต็ม 100</span></div>
    <div class="cmp">${heroCmp}</div>
    <div class="grade-block ${g? gradeClass(g)+" gnw" : "gN"}"${g? ` role="img" aria-label="${esc("เกรด "+g+" "+gradeWord(g))}"` : ""}>
      <div class="gcap">${g? gradeIcon(g,18) : ""}เกรด</div>
      ${g? `<div class="gname">${esc(g)}</div>` : `<div class="gword">ยังไม่มีข้อมูล</div>`}
    </div>
    <div class="hero-sub">
      <div class="hs-head">ทำได้ตามเกณฑ์ ${passList.length} ข้อ จาก ${passList.length+failList.length} ข้อ</div>
    </div>`;
  /* สองกลุ่มงานเป็นชั้นถัดจากคะแนนรวม จึงวางเป็นการ์ดข้างกันในแถวเดียวกัน แก้ 7 ก.ย. 2569 */
  /* คะแนนกลุ่มของเดือนก่อน ใช้บอกทิศทาง ต้องคิดด้วยวิธีเดียวกับเดือนที่แสดงอยู่ */
  const outPrev = i>0? (full? gsum(i-1,"Output")  : (S.totals.out[i-1]? S.totals.out[i-1][2] : null)) : null;
  const inPrev  = i>0? (full? gsum(i-1,"Input") : (S.totals.inp[i-1]? S.totals.inp[i-1][2] : null)) : null;
  /* จ กติกาข้อ 6 สองกลุ่มเป็นคนละเรื่อง จึงใช้ภาพต่างกัน อาคารคือผลถึงองค์กร ปฏิทินคืองานประจำ */
  grpTile("grpOut", "งานที่ส่งผลถึงองค์กร", outRaw, outp[2], outPrev, 70, "Output", "ข้อ " + grpNos("Output") + " การลาออก ความพึงพอใจ ค่าใช้จ่าย การทำตามกฎหมาย และอุบัติเหตุ", "org");
  grpTile("grpIn",  "งานประจำของแผนก",   inRaw,  inp[2],  inPrev,  30, "Input", "ข้อ " + grpNos("Input") + " การเติมคน การขาดงาน ความผิดพลาดจ่ายค่าตอบแทน กิจกรรม และงาน 5 ส.", "calendar");
  /* ค10 heroCard อยู่ใน tileRow อยู่แล้ว การผูกซ้ำทำให้ตัวฟัง mousemove ซ้อนสองชั้น จึงผูกครั้งเดียว */
  bindTips($("tileRow") || document);
  document.querySelectorAll(".tile-grp .grp-more").forEach(btn=>{
    btn.addEventListener("click",()=>{
      /* ค2 การ์ดถูกวาดใหม่ทั้งใบ โฟกัสจึงต้องคืนให้ปุ่มเดิมของการ์ดเดิม ไม่หลุดไป body */
      const host = btn.closest(".tile-grp").id;
      grpOpen = !grpOpen; renderTiles();
      const nb = document.querySelector("#"+host+" .grp-more");
      if(nb) nb.focus();
    });
  });
  if(finPct!=null) countUp($("heroNum"), finPct, fmtTotal);
  /* ข้อ 7 ของคำสั่ง 7 ก.ย. 2569 คะแนนรวมตั้งแต่ 100 คะแนนขึ้นไป ให้มีพลุแสดงความยินดีครั้งเดียว */
  if(finPct!=null && finPct>=100 && pageOn("page-overview"))
    celebrate("total|"+S.months[i]+"|"+trendMode, g==="A++"? "crown" : null);
  /* ง แถบตั้งความกว้างจริงตั้งแต่ตอนวาด แล้วเล่นการเติมจากศูนย์ด้วย transform เฉพาะรอบที่ผู้ใช้เปลี่ยนเดือนหรือวิธีคิด */
  if(animCharts) pulseFill($("tileRow"));
}

/* ---------- คะแนนรวมรายเดือน ---------- */
/* สองแบบ ตามคำสั่ง 25 ส.ค. 2569
   sheet คือค่าที่ชีทบันทึก ซึ่งตัดเพดานคะแนนของแต่ละข้อไว้ที่น้ำหนักของข้อนั้น คะแนนรวมจึงเกิน 100 ไม่ได้
   full คือคิดใหม่โดยไม่ตัดเพดาน เอาน้ำหนักคูณคะแนนจริงของแต่ละข้อ คะแนนรวมจึงเกิน 100 ได้ */
let trendMode = "sheet";
function totalsFull(){
  return S.months.map((m,mi)=>{
    let sum = 0, any = false;
    S.kpis.forEach(k=>{
      const r = k.m[mi][2];
      if(r==null) return;
      any = true;
      sum += (k.weight||0) * r;
    });
    return any? sum*100 : null;
  });
}
/* กล่องอธิบายวิธีคิดคะแนนรวม ตามคำสั่ง 25 ส.ค. 2569 ข้อ 2
   ยกตัวอย่างด้วยตัวเลขจริงของเดือนที่เลือกอยู่ ผู้อ่านจึงกดเครื่องคิดเลขตามได้ทันที */
/* กล่องวิธีคิด แสดงการคำนวณจริงทีละบรรทัดเหมือนกดเครื่องคิดเลข ตามคำสั่ง Yuth 7 ก.ย. 2569
   ทุกตัวเลขในตารางนี้คิดสดจากข้อมูลของเดือนที่เลือกอยู่ ไม่ได้พิมพ์ตายตัว */
function modeHelpHtml(){
  const i = mainM();
  const mn = S.months[i];
  const full = trendMode==="full";
  const sheetV = S.totals.total[i][2];
  const fullV = totalsFull()[i];
  const sTxt = fmtTotal(sheetV!=null? sheetV*100 : null);
  const fTxt = fmtTotal(fullV);
  let rows = "", sum = 0, wsum = 0, any = false;
  const ptBy = {};
  S.kpis.slice().sort((a,b)=>dispNo(a)-dispNo(b)).forEach(k=>{
    const r = k.m[i][2];
    const w = k.weight*100;
    if(r==null){
      rows += `<tr><td class="n">${dispNo(k)}</td><td class="n">${numf(w,0)}</td><td>ไม่มีข้อมูล</td><td class="n">ไม่มีข้อมูล</td></tr>`;
      return;
    }
    any = true;
    /* รอบ 7 ต.ค. 2569 r1 รูป 1 แบบตัดเพดาน ใช้คะแนนที่เก็บได้ตามแผ่น KPI ตรงตัว ช่องตัวคูณแสดงสัดส่วนที่แผ่นใช้ (คะแนนหารน้ำหนัก) */
    const pt = full? w*r : (k.m[i][3]!=null? k.m[i][3]*100 : 0);
    ptBy[k.no] = pt;
    const usedTxt = full? fmtCut(r*100, 0, SCORE_CUTS)+"%" : (w>0? numf(pt/w*100,0)+"%" : "-");
    const note = (!full && Math.abs(pt - w*Math.min(1,r)) > 0.05)? ` <span class="cut">ช่องทำได้เทียบเป้า ${fmtCut(r*100,0,SCORE_CUTS)}% แผ่น KPI ให้ ${numf(pt,1)} คะแนน</span>` : "";
    rows += `<tr><td class="n">${dispNo(k)}</td><td class="n">${numf(w,0)}</td>`
      + `<td>คูณ ${usedTxt}${note}</td><td class="n">${numf(pt,1)}</td></tr>`;
  });
  S.kpis.slice().sort((a,b)=>a.no-b.no).forEach(k=>{ wsum += k.weight*100; if(ptBy[k.no]!=null) sum += ptBy[k.no]; });
  /* แบบตัดเพดาน แถวรวมใช้คะแนนรวมของแผ่น KPI ตรงตัว ผลบวกรายข้อที่ปัดแล้วอาจต่างไม่เกิน 0.1 คะแนน */
  const sumTxt = !any? "ไม่มีข้อมูล" : (full? fmtTotal(sum) : sTxt);
  return '<div class="nt-head">คะแนนรวมเดือน ' + esc(mn) + ' คิดมาอย่างนี้</div>'
    + '<p class="calc-lead">' + (full? 'แต่ละข้อ เอาน้ำหนักของข้อนั้น คูณกับเปอร์เซ็นต์ที่ทำได้เทียบเป้า แล้วเอาคะแนนทั้งสิบข้อมาบวกกัน'
        : 'แบบตัดเพดาน ใช้คะแนนที่เก็บได้ของแต่ละข้อตามแผ่น KPI ของไฟล์ต้นทาง ยกเว้นข้อ 10 ที่คิดเองแบบยิ่งสูงยิ่งดี ส่วนแถวรวมใช้คะแนนรวมของแผ่น KPI ตรงตัว') + '</p>'
    + '<table class="calc-tbl"><thead><tr><th class="n">ข้อ</th><th class="n">น้ำหนัก</th><th>ตัวคูณที่ใช้</th><th class="n">คะแนนที่ได้</th></tr></thead>'
    + '<tbody>' + rows
    + '<tr class="sum"><td class="n">รวม</td><td class="n">' + numf(wsum,0) + '</td><td>คะแนนรวมของเดือนนี้</td><td class="n">' + sumTxt + '</td></tr>'
    + '</tbody></table>'
    /* รอบ r1 ตำหนิผู้ตรวจข้อ 1 แผ่น KPI ปัดคะแนนรายข้อ แต่ยอดรวมคิดจากค่าก่อนปัด ผลบวกรายข้อจึงต่างได้ไม่เกิน 0.1 คะแนน ต้องบอกบนจอ */
    + ((!full && any && Math.abs(Math.round(sum*10)/10 - Math.round(sheetV*1000)/10) >= 0.05)
        ? '<p class="calc-lead">ผลบวกคะแนนรายข้อในตารางได้ ' + numf(sum,1) + ' คะแนน ส่วนคะแนนรวมที่ใช้คือ ' + sTxt + ' คะแนน ต่างกันเพราะคะแนนรวมใช้ตามแผ่น KPI ซึ่งให้ข้อ 10 เต็ม 5 คะแนน ขณะที่ตารางนี้คิดข้อ 10 ตามผลจริงเทียบเป้า และแผ่น KPI ปัดคะแนนรายข้อ</p>' : '')
    + '<ul>'
    + '<li>ปุ่มซ้าย แบบตัดเพดาน 100 คะแนน หมายถึง ข้อที่ทำได้เกินเป้าหมาย จะได้คะแนนไม่เกินน้ำหนักเต็มของข้อนั้น คะแนนรวมจึงไม่เกิน 100 คะแนน</li>'
    + '<li>ปุ่มขวา แบบไม่ตัดเพดาน หมายถึง ข้อที่ทำได้เกินเป้าหมาย จะได้คะแนนเกินน้ำหนักเต็มของข้อนั้น คะแนนรวมจึงเกิน 100 คะแนนได้</li>'
    + '<li>เดือน ' + esc(mn) + ' แบบซ้ายได้ ' + sTxt + ' คะแนน แบบขวาได้ ' + fTxt + ' คะแนน ตอนนี้ตารางข้างบนแสดง' + esc(modeWord()) + '</li>'
    + '<li>ทำได้เทียบเป้า 100% คือทำได้ตามเป้าพอดี ตัวเลขในคอลัมน์ทำได้เทียบเป้าของตารางตัวชี้วัดอ่านแบบเดียวกัน</li>'
    + '<li>แบบซ้ายใช้คะแนนตามแผ่น KPI ตามคำตัดสินของเจ้าของงาน 7 ต.ค. 2569 ยกเว้นข้อ 10 ที่แผ่น KPI ตั้งทิศทางผิด (ได้เต็ม 5 ทุกเดือนแม้ต่ำกว่าเป้า) หน้านี้คิดคะแนนข้อ 10 เองแบบยิ่งสูงยิ่งดี ส่วนคะแนนรวมและเกรดใช้ตามแผ่น KPI ตรงตัว ตามคำตัดสิน 8 ต.ค. 2569 ผลบวกรายข้อจึงต่ำกว่าคะแนนรวมประมาณ 0.3 ถึง 1 คะแนนต่อเดือน ข้อ 7 แผ่น KPI กรอกเป้าเป็นเปอร์เซ็นต์ ช่องทำได้เทียบเป้าของข้อ 7 จึงไม่สอดคล้องกับคะแนนที่เก็บได้</li>'
    + '</ul>';
}
