function renderTrend(){
  const full = trendMode==="full";
  const vals = full? totalsFull() : S.totals.total.map(t=>t[2]!=null? t[2]*100 : null);
  const w = chartWidth("trendChart", 760);
  const hl = new Set(selMonths);
  /* ประโยคสรุปเหนือกราฟ ตัดออกตามคำสั่ง Yuth 7 ก.ย. 2569 เพราะซ้ำกับการ์ดคะแนนรวมและกราฟ */
  /* รอบ 3 ข้อ 2 กติกาข้อ 110 ประโยควิธีคิดใต้หัวการ์ดตัดออก ข้อความเดียวกันอยู่ในกล่องวิธีคิด (modeHelpHtml ปุ่มซ้าย ปุ่มขวา) */
  $("trendSub").textContent = "";
  $("trendModes").querySelectorAll(".fchip").forEach(c=>{
    c.setAttribute("aria-pressed", c.getAttribute("data-tm")===trendMode? "true":"false");
  });
  renderModeHelp();
  /* ช่วงแกนตั้ง คิดจากข้อมูลจริงของโหมดที่เลือก ไม่ตรึงไว้ที่ 70 ถึง 120 อีก
     ยังบังคับให้เห็นเส้น 100 เสมอ เพราะเป็นเส้นตัดสินว่าถึงเป้าหรือไม่
     เส้นเกณฑ์และแถบเกรดที่อยู่นอกช่วงนี้ จะไม่ถูกวาดเอง เช่นเกรด C ที่ยังไม่มีเดือนไหนไปถึง
     แก้ตามคำสั่ง Yuth 7 ก.ย. 2569 */
  const nums = vals.filter(v=>v!=null);
  let yMax = nums.length? Math.ceil((Math.max.apply(null,nums)+4)/5)*5 : 110;
  let yMin = nums.length? Math.floor((Math.min.apply(null,nums)-4)/5)*5 : 90;
  yMax = Math.max(yMax, 105); yMin = Math.min(yMin, 95);
  /* เส้นเกณฑ์และแถบเกรด แสดงเฉพาะเส้นที่อยู่ในกรอบจริง เกรดที่ยังไม่มีเดือนไหนไปถึง จึงไม่รกกราฟ */
  const refAll = [{v:80,label:"ต่ำกว่า 80 คือเกรด C",color:TH.refC,ink:TH.refCInk},
                  {v:100,label:"ถึง 100 คือเกรด A",color:TH.amber,ink:TH.amberInk},

                  {v:110,label:"ถึง 110 คือเกรด A+",color:TH.passD,ink:TH.strong},
                  {v:120,label:"ถึง 120 คือเกรด A++",color:TH.passD,ink:TH.strong}];
  const refUse = refAll.filter(r=>r.v>yMin && r.v<yMax);
  const bandUse = yMin < 80 ? [{from:yMin,to:80,color:TH.bandC,label:"เกรด C",labelColor:TH.refCInk}] : [];
  $("trendChart").innerHTML = lineChart(vals, S.months, {
    /* รอบ 12 พ.ย. 2569 ข้อ ส5 คำสั่ง Yuth "รูป 5 ปรับกราฟให้ใหญ่พอดีจอ" ความสูงจาก trendHFix จอแคบกว่า 1280 ใช้สูตรเดิม */
    width:w, height: trendHFix(w),
    /* ขอบในแคบลงจากค่ามาตรฐาน เพื่อให้พื้นที่วาดเส้นกว้างขึ้นโดยการ์ดยังเท่าเดิม
       ตามคำสั่ง Yuth 8 ก.ย. 2569 ข้อ 2 ซ้ายเผื่อป้ายแกนสามหลัก ขวาเผื่อครึ่งป้ายค่าจุดสุดท้าย */
    pad:{l:40, r:26, t:26, b:32},
    yMin:yMin, yMax:yMax, gid:"trendg",
    refs:refUse,
    plotBg:TH.plot,
    /* แรเงาเฉพาะช่วงต่ำกว่า 80 ซึ่งเป็นเกรด C และเฉพาะเมื่อกรอบกราฟลงไปถึงช่วงนั้นจริง */
    bands:bandUse,
    highlight:hl, dim:monthPicked, labelEvery: w<560?2:1,
    fmt:v=>fmtTotal(v),
    tipExtra:i=>"เกรด "+(full? deriveGrade(vals[i]) : (S.grades[i]||deriveGrade(vals[i])))
  });
  let rows = S.months.map((m,i)=>{
    const v = vals[i], g = full? deriveGrade(v) : (S.grades[i]||deriveGrade(v));
    const prev = i>0? vals[i-1]:null;
    const d = (v!=null&&prev!=null)? v-prev : null;
    const dTxt = d==null? "" : (d>=0? `<span class="delta-up">เพิ่มขึ้น ${numf(Math.abs(d),1)}</span>` : `<span class="delta-down">ลดลง ${numf(Math.abs(d),1)}</span>`);
    return `<tr class="${selMonths.includes(i)?"mon-hl":""}"><td>${esc(m)}</td><td class="num">${fmtTotal(v)}</td><td>${gradeIcon(g,15)} เกรด ${esc(g)}</td><td>${dTxt}</td></tr>`;
  }).join("");
  $("trendTable").innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>เดือน</th><th class="num">คะแนนรวม${full? " แบบไม่ตัดเพดาน":" แบบตัดเพดาน 100 คะแนน"}</th><th>เกรด</th><th>เทียบเดือนก่อน</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  /* ย่อคำอธิบายเกรดเป็นแถวชิปแถวเดียว แก้ 3 ก.ย. 2569 คำอธิบายเต็มอยู่ในข้อความกำกับเมื่อชี้
     รอบแก้ 8 ต.ค. 2569 ข้อ 10 ข้อความกำกับเมื่อชี้ผูกกับข้อความช่วงคะแนนของเกรด ไม่ใช่ทั้งชิป */
  const items = S.legend.map(l=>{
    const rng = gradeRange(l[1]);
    return `<li>${gradeIcon(l[1],16)}<span class="gk-range" title="${esc(l[2])}">เกรด ${esc(l[1])} ${rng}</span></li>`;
  }).join("");
  $("gradeLegend").innerHTML =
    `<div class="gk-head">เกณฑ์เกรด</div><ul class="gk-row">${items}</ul>`;
  bindTips($("trendChart"));
  bindMonthClicks("trendChart");
  syncView("trendChart","trendTable","trendToggle");
  playChart($("trendChart"));
}

/* ---------- ข้อที่เสียคะแนนมากที่สุด แท่งเต็มคือน้ำหนัก ---------- */
function shortName(k){ return "ข้อ "+dispNo(k)+" "+k.name; }
/* การ์ดแถบคะแนนรายตัวชี้วัดถูกตัดออก 7 ก.ย. 2569 เพราะรายการชุดเดียวกันมีอยู่แล้วในตารางข้างล่าง
   คะแนนที่เก็บได้รายข้อ ย้ายไปเป็นคอลัมน์หนึ่งของตาราง ข้อมูลชุดหนึ่งจึงอยู่ที่เดียว */
function statusWord(r, no){
  if(r==null) return {cls:"na", ic:"note", col:TH.ink2, w:"ไม่มีข้อมูล"};
  /* สามสถานะ ตามคำสั่ง Yuth 4 ก.ย. 2569 ใช้ช่วงเดียวกับเกณฑ์เกรดของหน้านี้
     ต่ำกว่า 100 คือไม่ถึงเป้าหมาย 100 ถึง 109 คือถึงเป้าหมาย 110 ขึ้นไปคือเกินเป้าหมาย */
  if(r>=1.10) return {cls:"over", ic:"starburst", col:TH.strong, onDark:true, w:"เกินเป้าหมาย"};
  return r>=1
    ? {cls:"pass", ic:"check", col:TH.passIc, w:"ถึงเป้าหมาย"}
    : {cls:"fail", ic:"warn", col:TH.failIc, w:"ไม่ถึงเป้าหมาย"};
}

/* แถบเทียบคะแนนในตาราง ความยาวเต็มรางเท่ากับคะแนนสูงสุดที่มีในตารางรอบนั้น

   ขีดบางบนรางคือตำแหน่ง 100 ซึ่งแปลว่าทำได้ตามเป้าพอดี */
/* ช่องคะแนนที่เก็บได้ในตาราง รับงานต่อจากการ์ดแถบคะแนนที่ตัดออก
   ตัวเลขคือคะแนนที่เก็บได้เทียบน้ำหนักของข้อ แถบเขียวคือส่วนที่เก็บได้ แถบลายคือส่วนที่เสียไป
   คิดตามวิธีคิดคะแนนรวมที่ผู้ใช้เลือกอยู่ ไม่งั้นจอเดียวกันจะบอกคนละคะแนน */
/* รอบแก้ 8 ต.ค. 2569 ข้อ 10 tipAttr คือค่าแอตทริบิวต์ data-tip ที่หนีอักขระแล้ว ผูกกับตัวเลขคะแนน ไม่ใช่ทั้งช่องหรือแถบ */
function ptsCell(k, mi, maxW, tipAttr){
  const gp = gotPts(k, mi);
  const wfull = k.weight*100;
  const tp = tipAttr? ` data-tip="${tipAttr}"` : "";
  if(gp==null) return `<span class="pts-val"${tp}>ไม่มีข้อมูล</span>`;
  const got = gp*100;
  const lost = Math.max(0, wfull-got);
  const trackW = maxW>0? Math.max(12, (k.weight/maxW)*100) : 100;
  const gotW = wfull>0? Math.min(100, (got/wfull)*100) : 0;
  const lostW = wfull>0? Math.min(100, (lost/wfull)*100) : 0;
  const word = trendMode==="full"? "จากน้ำหนักเต็ม" : "จาก";
  return `<div class="ptscell">`
    + `<span class="pts-val ${lost<0.05?"zero":"loss"}"${tp}>${fmtPts(gp)} ${word} ${numf(wfull,0)} คะแนน</span>`
    + `<span class="wbar sm" style="width:${trackW.toFixed(1)}%">`
    + `<span class="got" data-w="${gotW.toFixed(1)}" style="width:${gotW.toFixed(1)}%"></span><span class="lost" data-w="${lostW.toFixed(1)}" style="width:${lostW.toFixed(1)}%"></span></span>`
    + `</div>`;
}
function filteredKpis(){
  const i = mainM();
  let list = S.kpis.map((k,idx)=>({k,idx}));
  if(tblF.pick.length) list = list.filter(o=>tblF.pick.indexOf(dispNo(o.k))>=0);
  if(tblF.status!=="all") list = list.filter(o=>{
    const r = o.k.m[i][2];
    return tblF.status==="pass"? r!=null&&r>=1 : r!=null&&r<1;
  });
  if(tblF.group!=="all") list = list.filter(o=>o.k.type===tblF.group);
  if(tblF.q.trim()!==""){
    const q = tblF.q.trim().toLowerCase();
    list = list.filter(o=>(dispNo(o.k)+" "+o.k.name).toLowerCase().includes(q));
  }
  const r = o => o.k.m[i][2];
  const loss = o => r(o)==null? -1 : (1-capR(r(o)))*o.k.weight*100;
  if(tblF.sort==="no") list.sort((a,b)=>dispNo(a.k)-dispNo(b.k));
  if(tblF.sort==="lossDesc") list.sort((a,b)=>loss(b)-loss(a) || dispNo(a.k)-dispNo(b.k));
  if(tblF.sort==="scoreDesc") list.sort((a,b)=>(r(b)==null?-9:r(b))-(r(a)==null?-9:r(a)));
  if(tblF.sort==="weightDesc") list.sort((a,b)=>b.k.weight-a.k.weight);
  return list;
}
/* ข้อ 24 ของคำสั่ง Yuth 10 ก.ย. 2569 ช่องตัวเลขในตารางภาพรวม ต้องบอกวิธีคิดเป็นข้อเมื่อชี้ */
function rowTip(k, i){
  const [act,,ratio] = k.m[i];
  const dr = DIR_FIX[k.no] || k.dir;
  return tipList([
    "เป้าหมาย " + esc(fmtTargetDisplay(k)),
    "ผลจริงเดือน " + esc(S.months[i]) + " " + esc(fmtActUnit(k,act)),
    /* ค8 ข้อที่ตั้งเป้าเป็นศูนย์ หารด้วยเป้าไม่ได้ จึงบอกกติกาให้คะแนนตามจริง */
    k.target===0 ? "ข้อนี้ตั้งเป้าเป็นศูนย์ จึงไม่คิดด้วยการหาร ไม่มีเหตุการณ์ได้ 100% มีเหตุการณ์ได้ 0%"
      : SHEET_RATIO[k.no] ? (dr==="<=" ? "ยิ่งต่ำยิ่งดี ใช้อัตราส่วนคะแนน (Score Ratio) ของแผ่น KPI ซึ่งแผ่นคิดจากคอลัมน์ผลลัพธ์ (Result)"
                                        : "ยิ่งสูงยิ่งดี ใช้อัตราส่วนคะแนน (Score Ratio) ของแผ่น KPI ซึ่งแผ่นคิดจากคอลัมน์ผลลัพธ์ (Result)")
      : (dr==="<=" ? "ยิ่งต่ำยิ่งดี คิดจาก 2 ลบ ผลจริงหารเป้า"
                   : "ยิ่งสูงยิ่งดี คิดจาก ผลจริงหารเป้า"),
    "ทำได้เทียบเป้า " + esc(fmtScore(ratio,k.no)) + " (100% คือทำได้ตามเป้าพอดี)",
    "ข้อนี้มีน้ำหนัก " + numf(k.weight*100,0) + " คะแนน ในคะแนนรวม 100 คะแนน",
    "คะแนนที่เก็บได้ " + fmtPts(gotPts(k,i)) + " คะแนน",
    "ตอนนี้หน้านี้ใช้" + modeWord()
  ]);
}

  $("tblSub").textContent = "";
  /* รอบ 3 ข้อ 1 ผู้ใช้ตัดสิน 4 ต.ค. 2569 คอลัมน์ลำดับซ้ำกับคอลัมน์ข้อเมื่อเรียงตามข้อและไม่กรอง

  const maxW = Math.max.apply(null, S.kpis.map(kk=>kk.weight||0));
  let head, rows="";
  const limNotes = [];
  if(!cmp){

    head = `<tr>${thSeq}<th class="num no">ข้อ</th><th>ตัวชี้วัด</th><th>เป้าหมาย</th><th class="num">ผลจริง</th><th class="num">ทำได้เทียบเป้า</th><th>คะแนนที่เก็บได้</th><th>สถานะ</th></tr>`;

        <td class="num" data-label="ข้อ">${esc(dispNo(k))}</td>

    list.forEach((o,ri)=>{
      const k=o.k;
      const cells = sel.map(mi=>{

      rows += `<tr class="clickable" data-kpi="${o.idx}" tabindex="0" role="button" aria-label="เปิดรายละเอียดข้อ ${esc(dispNo(k))}">

      </tr>`;
    });
  }
  /* จำนวนคอลัมน์ต้องนับจากหัวตารางชุดที่กำลังจะวาด ไม่ใช่ค่าคงที่ เพราะโหมดเทียบเดือนมีคอลัมน์ไม่เท่ากัน */
  const nCol = (head.match(/<th/g)||[]).length || 7;
  if(!rows) rows = `<tr><td colspan="${nCol}" style="text-align:center; color:var(--ink2)">ไม่มีข้อที่ตรงกับตัวกรอง</td></tr>`;
  $("kpiTable").innerHTML = `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
  $("tblLegend").innerHTML = cmp? "" :
    `<span><span class="key"></span>คะแนนที่เก็บได้</span>`
    + `<span><span class="key hatch"></span>คะแนนที่เสียไป</span>`
    + `<span><span class="lgi">${icon("scale",14,"currentColor")}</span>ความยาวรางเทียบตามน้ำหนักของข้อ</span>`;   /* รอบ r2 ข้อ 8 */
  if(animCharts) pulseFill($("kpiTable"));
  /* ข้อความข้อจำกัดของข้อมูล ยกมารวมไว้ใต้ตารางเป็นเชิงอรรถ แก้ 3 ก.ย. 2569 */
  /* ข้อ 9 ของคำสั่ง Yuth 7 ก.ย. 2569 เชิงอรรถนี้ซ่อนไว้ก่อน ผู้อ่านกดเปิดเองเมื่ออยากรู้ */
  $("kpiLimits").innerHTML = limNotes.length
    ? `<button type="button" class="help-btn" id="limMore" aria-expanded="${limOpen?"true":"false"}" aria-controls="limBody">`
      + `${icon("note",15,"currentColor")}${limOpen? "ซ่อนข้อจำกัดของข้อมูล" : "ดูข้อจำกัดของข้อมูล"} ${limNotes.length} ข้อ</button>`
      + `<div id="limBody" ${limOpen? "" : "hidden"}><ol>${limNotes.map(o=>`<li>ข้อ ${o.no} ${esc(o.text)}</li>`).join("")}</ol></div>`
    : "";
  $("kpiTable").querySelectorAll("tr.clickable").forEach(tr=>{
    const go = ()=>openKpi(parseInt(tr.getAttribute("data-kpi"),10));
    tr.addEventListener("click",go);
    tr.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
    /* ค3 แถวที่ได้โฟกัสจากแป้นพิมพ์ เปิดคำอธิบายลอยของช่องคะแนนในแถวนั้น ช่องในแถวจึงไม่ต้องเป็นจุดโฟกัสซ้อน */
    tr.addEventListener("focus",()=>{ const c = tr.querySelector("[data-tip]"); if(c) showTipFor(c); });
    tr.addEventListener("blur",hideTip);
  });
  bindTips($("kpiTable"));
}

/* กราฟคะแนนขนาดเล็กในการ์ดคะแนนเดือน ตามคำสั่ง 25 ส.ค. 2569 ข้อ 5
   ย้ายมาจากเส้นซ้อนในกราฟแท่ง เพื่อให้กราฟแท่งเหลือหน่วยเดียว คือผลจริง
   เส้นประคือระดับคะแนน 100 ซึ่งแปลว่าทำได้ตามเป้าพอดี */
function sparkScore(vals, labels, hlSet, w){
  /* Yuth สั่งเมื่อ 28 ส.ค. 2569 ให้พิมพ์ตัวเลขคะแนนลงบนเส้นด้วย
     จึงต้องเผื่อที่ว่างด้านบนให้ตัวเลข และเพิ่มขอบซ้ายขวาไม่ให้ตัวเลขล้นกรอบ */
  /* รอบ 4 ต.ค. 2569 เพิ่มความสูงจาก 50 เป็น 54 จุดภาพ กรอบตัวอักษรของป้ายบนสุดและชื่อเดือนจึงอยู่ในกรอบภาพครบ */
  const W = Math.max(60, w||220), H = 54;
  const pad = {l:14, r:14, t:20, b:18};
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const nums = vals.filter(v=>v!=null);
  if(!nums.length) return '<div class="spark-na">ไม่มีข้อมูลคะแนนรายเดือน</div>';
  /* มาตราของกราฟเล็ก ต้องคลุมทั้งช่วงคะแนนจริงและระดับ 100 แล้วเผื่อขอบ
     ถ้าเริ่มที่ศูนย์เสมอ เส้นจะแบนจนมองไม่เห็นความต่างระหว่างเดือน */
  let hi = Math.max(100, Math.max.apply(null, nums));
  let lo = Math.min(100, Math.min.apply(null, nums));
  const padv = Math.max(5, (hi-lo)*0.22);
  hi += padv; lo = Math.max(0, lo - padv);
  if(hi-lo < 1) hi = lo + 1;
  const X = i => pad.l + (vals.length<2? iw/2 : (i/(vals.length-1))*iw);
  const Y = v => pad.t + ih - ((v-lo)/(hi-lo||1))*ih;
  /* รอบ 8 ต.ค. 2569 r5 เส้นโค้งแบบเดียวกับกราฟคะแนนรวม ช่วงที่ไม่มีข้อมูลยังเว้นขาดตามเดิม */
  let d = "", g = "", seg = [];
  const flush = ()=>{ if(seg.length) d += " " + smoothPath(seg); seg = []; };
  vals.forEach((v,i)=>{ if(v==null){ flush(); return; } seg.push({x:X(i), y:Y(v)}); });
  flush();
  const y100 = Y(100);
  /* คำสั่ง Yuth 10 ก.ย. 2569 ข้อ 9 กราฟเล็กใช้เส้นเทาอ่อน ให้เป็นฉากหลัง ไม่แย่งสายตาจากตัวเลขใหญ่ */
  g += `<line x1="${pad.l}" y1="${y100.toFixed(1)}" x2="${(pad.l+iw).toFixed(1)}" y2="${y100.toFixed(1)}" stroke="${TH.spRef}" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  g += `<path class="sp-path" pathLength="1" d="${d.trim()}" fill="none" stroke="${TH.spLine}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  /* ป้ายตัวเลขต้องไม่ทับกัน วิธีที่ใช้คือจองพื้นที่แนวนอนทีละป้าย ไม่ใช่เว้นเป็นจังหวะคงที่
     เพราะการเว้นเป็นจังหวะคุมเฉพาะป้ายที่มาจากจังหวะ แต่ป้ายบังคับ คือเดือนที่ผู้ใช้เลือกและเดือนสุดท้าย
     อาจตกลงมาติดกับป้ายอื่นได้ ป้ายที่จองพื้นที่ไม่ได้ให้ข้ามไป ดีกว่าพิมพ์ทับกัน */
  const takenTop = [], takenBot = [];
  const fits = (arr,a,b)=> !arr.some(t=> b > t[0]+0.5 && a < t[1]-0.5);
  const anchOf = i => i===0? "start" : (i===vals.length-1? "end" : "middle");
  const boxOf = (cx, wpx, anch)=> anch==="start"? [cx, cx+wpx] : (anch==="end"? [cx-wpx, cx] : [cx-wpx/2, cx+wpx/2]);
  vals.forEach((v,i)=>{
    if(v==null) return;
    const on = hlSet && hlSet.has(i);
    g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${on?4.6:2.4}" fill="${on?TH.ink:TH.spLine}"${on?' stroke="'+TH.ring+'" stroke-width="1.6"':""}/>`;
  });
  /* ลำดับสิทธิ์ในการจองพื้นที่ เดือนที่ผู้ใช้เลือกก่อน แล้วเดือนสุดท้าย แล้วจึงเดือนที่เหลือจากซ้ายไปขวา */
  const order = [];
  const push = i => { if(i>=0 && vals[i]!=null && order.indexOf(i)<0) order.push(i); };
  /* เดือนที่เลือกไล่จากใหม่ไปเก่า ให้ตรงลำดับกับชื่อเดือนที่ขอบล่าง

  const actAxis = {};   /* ชุดสี่ ข้อ ก1.10 ค่าต่ำสุดของแกนจากตัววาด ใช้เขียนบรรทัดในแถบสัญลักษณ์ */
  redrawAct = () => {

  /* คำอธิบายชุดสีใบเดียว ใช้ร่วมกับกราฟทั้งสองใบที่วางคู่กัน */
  /* เส้นประต้องบอกค่าเป้าหมายด้วย ตามคำสั่ง 25 ส.ค. 2569

  /* เส้นคะแนนย้ายไปการ์ดคะแนนเดือนแล้ว กราฟแท่งจึงไม่มีมาตราคะแนนอีก

  const refWord = "เส้นประ คือเป้าหมาย "+fmtTargetDisplay(k);

    + `<span><span class="key linekey" style="border-top-color:${TH.blueInk}"></span>เส้นทึบ คือผลจริงรายเดือน</span>`

    + (actAxis.min? `<span><span class="lgi">${icon("scale",14,"currentColor")}</span>แกนตั้งเริ่มที่ ${esc(actAxis.txt)}${/%$/.test(actAxis.txt)? "" : " "+esc(unitDisplay(k))} ไม่ได้เริ่มที่ศูนย์</span>` : "");
  bindTips($("kpiTiles"));
  fitTileNums();

  /* มุมมองตารางของกราฟรวม เก็บทั้งผลจริงและคะแนนไว้ในตารางเดียว */
  const actRows = S.months.map((m,mi)=>{

  $("actTable").innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>เดือน</th>`

  syncView("actChart","actTable","actToggle");

  const blk = (S.dept||[]).find(b=>b.no===k.no);
  const head = S.months.map((m,mi)=>`<th class="num ${selMonths.includes(mi)?"mon-hl":""}">${esc(m)}</th>`).join("");
  /* คำสั่ง Yuth 9 ก.ย. 2569 ข้อ 1 ย้ายยอดสะสมกับค่าเฉลี่ยเข้ามาเป็นสองคอลัมน์ท้ายตาราง
     ต่อจากเดือนล่าสุด ใช้เฉพาะตัวชี้วัดที่หน่วยบวกสะสมได้ ตอนนี้คือหน่วยบาท */
  const cumOn = (String(unitDisplay(k)||"")+" "+String(k.unit||"")).indexOf("บาท")>=0;
  const cumHead = cumOn? `<th class="num cumcol">สะสม</th><th class="num cumcol">เฉลี่ยต่อเดือน</th>` : "";
  const cumCells = (r, force)=>{
    if(!cumOn) return "";
    if(force || String(r.unit||"").indexOf("บาท")<0) return `<td class="num cumcol"></td><td class="num cumcol"></td>`;
    const used = [];
    S.months.forEach((mn,mi)=>{ const v=r.vals[mi]; if(typeof v==="number") used.push({mn, v}); });
    if(!used.length) return `<td class="num cumcol"></td><td class="num cumcol"></td>`;
    const sum = used.reduce((a,x)=>a+x.v,0), avg = sum/used.length;
    /* ก1 ชื่อเดือนมาจากข้อมูล ต้องหนีอักขระก่อนเข้ากล่องคำอธิบายลอย */
    const span = used.length===1? ("เดือน "+esc(used[0].mn))
      : ("เดือน "+esc(used[0].mn)+" ถึง "+esc(used[used.length-1].mn));
    const tl = items => "<span class='tip-head'>วิธีคิด</span><ul>"
      + items.map(x=>"<li>"+x+"</li>").join("") + "</ul>";
    const tipSum = tl(["รวมผลจริง "+used.length+" เดือน คือ "+span,
      "ยอดสะสม เท่ากับ "+nf0.format(Math.round(sum))+" บาท",
      "เดือนที่ยังไม่มีข้อมูล ไม่ถูกนับเข้ามาและไม่ถูกนับเป็นศูนย์"]);
    const tipAvg = tl(["ค่าเฉลี่ย เท่ากับ "+nf0.format(Math.round(sum))+" หาร "+used.length,
      "เท่ากับ "+nf0.format(Math.round(avg))+" บาทต่อเดือน",
      "หารด้วยจำนวนเดือนที่มีข้อมูลเท่านั้น"]);
    /* รอบแก้ 8 ต.ค. 2569 ข้อ 10 กล่องเมื่อชี้ผูกกับตัวเลข ไม่ใช่ทั้งช่อง */
    return `<td class="num cumcol"><span class="tipv" data-tip="${esc(tipSum)}">${nf0.format(Math.round(sum))}</span></td>`
      + `<td class="num cumcol"><span class="tipv" data-tip="${esc(tipAvg)}">${nf0.format(Math.round(avg))}</span></td>`;
  };
  /* ลำดับความสำคัญของตาราง ตามคำสั่ง Yuth 28 ส.ค. 2569 ข้อ 5
     แถวหลักคือตัวชี้วัดข้อนี้ แถวรองคือคะแนนเทียบเป้า ส่วนแถวย่อยเป็นตัวประกอบ ซ่อนไว้ก่อน */
  /* ข2 รอบ 4 ต.ค. 2569 หมายเหตุคุณภาพข้อมูลเดิมคำนวณไว้แต่ไม่เคยแสดง ตามเจตนาในคอมเมนต์ข้างล่าง
     ตอนนี้ผูกกับช่องที่เกี่ยวข้องเป็นกล่องที่ขึ้นเมื่อชี้ มีเครื่องหมายเล็กในช่อง และแสดงในท้ายหน้า ไม่วางเป็นประโยคบนจอ (กติกาข้อ 110)
     ตัวเลขในตารางไม่ถูกแก้ ค่าตาม EMBED ทุกตัว */
  const cellNote = {};
  const addNote = (key, txt) => { (cellNote[key] = cellNote[key] || []).push(txt); };
  const noteCell = (key, inner, cls) => {
    const ns = cellNote[key];
    if(!ns) return `<td class="${cls}">${inner}</td>`;
    const tipH = "<span class='tip-head'>หมายเหตุข้อมูล</span><ul>" + ns.map(x=>"<li>"+esc(x)+"</li>").join("") + "</ul>";
    /* เครื่องหมายวางหน้าตัวเลขในช่องตัวเลข ขอบขวาของตัวเลขจึงยังตรงแนวกับช่องอื่น (กติกาข้อ 119) ช่องชื่อวางหลังชื่อ */
    /* รอบแก้ 7 ต.ค. 2569 r3 ข้อ 4 Yuth สั่งลบสัญลักษณ์หมายเหตุ (วงกลม i สีทอง) ทุกจุด กล่องข้อความเมื่อชี้ยังอยู่ */
    const mk = "";
    /* รอบแก้ 8 ต.ค. 2569 ข้อ 10 กล่องเมื่อชี้ผูกกับค่าในช่อง ไม่ใช่ทั้งช่อง */
    return `<td class="${cls} has-note"><span class="tipv" data-tip="${esc(tipH)}">${/num/.test(cls)? mk+inner : inner+mk}</span></td>`;
  };
  /* ค7 แถวหลักใช้ตัวจัดรูปเดียวกับการ์ดผลจริง ทศนิยมของตัวเลขเดียวกันจึงเท่ากันทุกจุด (กติกาข้อ 123)
     ช่องเป้าที่ตรงกับเป้าของการ์ด ใช้ตัวจัดรูปเดียวกับการ์ด ส่วนเป้าที่ต่างกันแสดงตามชีทพร้อมหมายเหตุ */
  const rowHtml = (r, cls, force, key, valFmt)=>{
    const fv = v => (valFmt && typeof v==="number")? valFmt(v) : fmtGeneric(v, r.unit);
    const cells = S.months.map((m,mi)=>noteCell(key+"|"+mi, esc(force? force(mi) : fv(r.vals[mi])), "num "+(selMonths.includes(mi)?"mon-hl":""))).join("");
    let tg = force? "100%" : (r.target!=null? fmtGeneric(r.target, r.unit) : "");
    if(key==="m" && r.target!=null && !cellNote.tgt) tg = tgtNumText(k);
    return `<tr class="${cls}${SUB_CHILD[r.name]? " sub2" : ""}">${noteCell(key==="m"? "name" : "-", esc(SUB_LABEL[r.name]||r.name), "")}${noteCell(key==="m"? "tgt" : "-", esc(tg), "num")}<td class="unit">${esc(r.unit||"")}</td>${cells}${cumCells(r, force)}</tr>`;
  };
  deptDiffNote = "";
  $("subTblSub").textContent = "";
  let mainRows = "", subRows = "", subCount = 0;
  if(blk){
    const diffs = [];
    S.months.forEach((mn,mi)=>{
      const a = k.m[mi][0], b = blk.vals[mi];
      if(a==null||b==null||typeof a!=="number"||typeof b!=="number") return;
      const av = a*(ACT_SCALE[k.no]||1);
      /* ค4 ตารางข้อมูลประกอบเก็บผลจริงแบบเดียวกับชีท KPI (FRACT ของ rebuild_kpi.py) จึงใช้สเกลที่ประกาศชุดเดียวกัน */
      const bv = b*(ACT_SCALE[k.no]||1);
      const base = Math.max(Math.abs(av), Math.abs(bv), 1e-9);
      if(Math.abs(av-bv)/base > 0.006){
        diffs.push(mn);
        addNote("m|"+mi, "เดือน "+mn+" ชีท KPI บันทึกผลจริง "+fmtAct(k.no,a)+" ส่วนตารางนี้ใช้ "+fmtAct(k.no,b));
      }
    });
    const notes = [];
    if(diffs.length) notes.push("บันทึกผลจริงไม่ตรงกันในเดือน "+diffs.join(" "));
    /* เดือนที่แถวหลักเป็นศูนย์ แต่แถวย่อยกลับมีค่า เป็นข้อขัดแย้งในตัวข้อมูลเอง
       ไม่ว่าหน่วยจะเป็นอะไร ถ้าจำนวนรวมเป็นศูนย์ ส่วนย่อยจะมากกว่าศูนย์ไม่ได้ */
    const zeroBad = [];
    S.months.forEach((mn,mi)=>{
      if(blk.vals[mi]!==0) return;
      const over = blk.subs.some(r=>typeof r.vals[mi]==="number" && r.vals[mi]>0);
      if(over){
        zeroBad.push(mn);
        addNote("m|"+mi, "เดือน "+mn+" แถวย่อยมีค่าแต่แถวหลักบันทึกเป็นศูนย์ หน้านี้ยึดแถวหลักเป็นค่าจริง ตามที่หุ้นส่วนธุรกิจด้านทรัพยากรบุคคล (HR Business Partner) ตัดสินเมื่อ 27 สิงหาคม 2569");
      }
    });
    /* Yuth ตัดสินเมื่อ 27 ส.ค. 2569 ว่าให้ยึดแถวหลักซึ่งเป็นค่าจริง จึงไม่ใช่ข้อขัดแย้งที่ค้างอยู่อีก
       แต่ยังต้องบอกไว้ ไม่งั้นผู้อ่านที่เห็นแถวย่อยมีค่าจะสงสัยว่าทำไมแถวหลักเป็นศูนย์ */
    if(zeroBad.length) notes.push("เดือน "+zeroBad.join(" ")+" แถวย่อยมีค่าแต่แถวหลักบันทึกเป็นศูนย์ หน้านี้ยึดแถวหลักเป็นค่าจริง ตามที่หุ้นส่วนธุรกิจด้านทรัพยากรบุคคล (HR Business Partner) ตัดสินเมื่อ 27 สิงหาคม 2569");
    /* แถวย่อยที่เป็นส่วนต่างจากเป้า ต้องเท่ากับ ผลจริง ลบ เป้า ของแถวหลักเสมอ
       ถ้าไม่เท่า แปลว่าเซลล์ในชีทพิมพ์คลาด ต้องบอกไว้
       เพราะผู้อ่านจะเห็นตัวเลขนี้อยู่บนจอเดียวกับร้อยละที่การ์ดคำนวณจากผลจริงกับเป้า
       Yuth สั่งเมื่อ 27 ส.ค. 2569 ว่าให้คงค่าตามชีทไว้ แต่ต้องมีหมายเหตุกำกับ */
    const diffBad = [];
    if(blk.target!=null){
      blk.subs.forEach((r,si)=>{
        if(String(r.name||"").trim().toLowerCase().indexOf("diff")!==0) return;
        S.months.forEach((mn,mi)=>{
          const v = r.vals[mi], main = blk.vals[mi];
          if(typeof v!=="number" || typeof main!=="number") return;
          const want = main - blk.target;
          if(Math.abs(v-want) > Math.max(1, Math.abs(want)*0.001)){
            const t1 = mn+" ชีทบันทึก "+fmtGeneric(v, r.unit)+" แต่คำนวณได้ "+fmtGeneric(want, r.unit);
            diffBad.push(t1);
            addNote("s"+si+"|"+mi, "แถวส่วนต่างจากเป้า เดือน "+t1+" หน้านี้คงค่าตามชีท");
          }
        });
      });
    }
    /* Yuth สั่งเมื่อ 27 ส.ค. 2569 ว่าให้เป็นหมายเหตุเล็กๆ พอ จึงเขียนสั้นที่สุดที่ยังตามรอยได้ */
    if(diffBad.length) notes.push("แถวส่วนต่างจากเป้า "+diffBad.join(" และ ")+" หน้านี้คงค่าตามชีท");
    const norm = t => String(t==null?"":t).replace(/\s+/g,"").toLowerCase();

      const tbv = (FMT[k.no] && FMT[k.no].t==="int")? Math.round(tb) : tb;

    $("subNote").innerHTML = `<div class="subs-bar">`

      + `${icon("list",15,"currentColor")}<span class="tipv">ดูรายละเอียดย่อย ${subCount} รายการ</span></button></div>`;
    /* รอบ 3 ข้อ 2 กติกาข้อ 110 ประโยคใต้ตารางย้ายเข้ากล่องที่ขึ้นเมื่อชี้ของปุ่ม */
    const smBtn = $("subMore"), smLab = smBtn.querySelector(".tipv");

/* บทวิเคราะห์ WHAT WHY HOW ยกจากแผ่นงาน D_บันทึก ของไฟล์ต้นทาง คอลัมน์ข้อความ
   แถว WHY ที่มีขีดตั้งคั่น จะกลายเป็นตาราง ช่องแรกเป็นหัวข้อ ที่เหลือเป็นค่ารายคอลัมน์
   แถวแรกของตารางถือเป็นหัวตาราง และแถวที่ช่องแรกเป็นคำว่ารวม ถือเป็นแถวยอดรวม
   แถว WHY ที่ไม่มีขีดตั้ง แสดงเป็นรายการบรรทัดตามเดิม จึงรองรับข้อมูลที่ยังไม่ได้ใส่ขีด */
function noteList(lines){
  /* บรรทัดที่ต้นทางขึ้นต้นด้วยขีดหรือวงเล็บ ถือเป็นข้อย่อย เยื้องเข้าไปหนึ่งระดับ
     สัญลักษณ์นำหน้าเดิมของต้นทางตัดออก แล้ววาดจุดนำด้วยรูปแบบของหน้าเว็บแทน
     จึงได้จุดนำที่ตรงกันทุกบรรทัด ตามคำสั่ง Yuth 8 ก.ย. 2569 */
  /* รอบแก้ 8 ต.ค. 2569 ข้อ 2 และข้อ 7 Yuth สั่ง "การเอาข้อมูลไปต่อท้าย เพื่อให้อ่านรู้เรื่อง"
     บรรทัดที่ขึ้นต้นด้วยขีดตามด้วยคำว่า ความเสียหาย หรือ สิ่งที่ได้ เป็นส่วนขยายของบรรทัดก่อนหน้า จึงรวมเข้าท้ายบรรทัดก่อนหน้าใน li เดียวกัน
     ตัวคั่นวาดด้วย CSS (.tail) ไม่พิมพ์อักขระเพิ่ม บรรทัดแบบนี้ที่ไม่มีบรรทัดก่อนหน้า วาดเป็นบรรทัดปกติ ข้อความไม่หาย ข้อมูลใน EMBED ไม่ถูกแก้ */
  const items = [];
  lines.forEach(t=>{
    const raw = String(t);
    const tl = raw.trim().match(/^-\s*((?:ความเสียหาย|สิ่งที่ได้)[\s\S]*)$/);
    if(tl && items.length){ items[items.length-1].tails.push(tl[1].trim()); return; }
    items.push({raw:raw, tails:[]});
  });
  /* ระดับของบรรทัดและการตัดสินว่ามีข้อย่อยตามหลังหรือไม่ คิดจากรายการหลังรวมบรรทัดแล้ว */
  return "<ul class=\"bul\">" + items.map((it,i)=>{
    const raw = it.raw;
    /* ระดับหัวข้อดูจากช่องไฟนำหน้าที่ตัวดึงข้อมูลใส่มาให้เท่านั้น
       ห้ามดูจากขีดนำหน้า เพราะบางบล็อกใช้ขีดเป็นหัวข้อหลักทั้งบล็อก
       แก้ตามคำสั่ง Yuth 10 ก.ย. 2569 ข้อ 13 และข้อ 15 */
    const lead = /^\s{2,}/.test(raw);
    const txt = raw.trim().replace(/^[-\u2022]\s*/, "");
    const nxtLead = /^\s{2,}/.test(String(items[i+1]==null? "" : items[i+1].raw));
    /* ประเด็นหลักที่ต้นทางกำกับหมายเลขข้อไว้ ถือเป็นหัวข้อที่ต้องเห็นก่อน
       ส่วนบรรทัดที่เป็นคำอธิบายลอยและไม่มีหมายเลข ใช้จุดนำระดับกลาง
       รอบแก้ 8 ต.ค. 2569 ข้อ 5 บรรทัดที่ไม่เยื้องและมีบรรทัดเยื้องตามหลัง ถือเป็นหัวข้อด้วย แม้ไม่มีหมายเลข (Yuth สั่งตัดเลข 1. 2. ของข้อ 7 ออก) */
    const key = !lead && (/^[0-9\u0E50-\u0E59]+\s*[.)]/.test(txt) || nxtLead);
    /* หัวข้อที่ไม่มีข้อย่อยตามหลัง ให้เป็นตัวบาง ตามข้อ 2 ของคำสั่ง 10 ก.ย. 2569 รอบสาม */
    const solo = key && !nxtLead;
    const tails = it.tails.map(x=>` <span class="tail">${esc(x)}</span>`).join("");
    return `<li class="${lead?"sub":(key?("key"+(solo?" solo":"")):"")}">${esc(txt)}${tails}</li>`;
  }).join("") + "</ul>";
}
/* คำสั่ง Yuth 10 ก.ย. 2569 ข้อ 3 ตารางวิเคราะห์สาเหตุ ต้องมีลำดับที่ ต้องคลี่คำย่อ
   และต้องไม่มีคอลัมน์ว่างคั่น มิฉะนั้นหัวตารางจะไม่ตรงแนวกับตัวเลขข้างล่าง */
const WHY_WORD = {"รด.":"รายเดือน", "รว.":"รายวัน", "รด":"รายเดือน", "รว":"รายวัน"};
function noteWhy(rows){
  const isTab = rows.some(r=>Array.isArray(r) && r.length>1);
  if(!isTab) return noteList(rows.map(r=>Array.isArray(r)? r[0] : r));
  let w = Math.max.apply(null, rows.map(r=>r.length));
  /* ตัดคอลัมน์ที่ว่างทุกแถวออก ยกเว้นคอลัมน์แรกซึ่งเป็นชื่อรายการ */
  const keep = [];
  for(let j=0;j<w;j++){
    if(j===0 || rows.some(r=>String(r[j]==null?"":r[j]).trim()!=="")) keep.push(j);
  }
  rows = rows.map(r=>keep.map(j=>r[j]));
  w = keep.length;
  /* คลี่คำย่อในหัวตาราง และเติมคอลัมน์ลำดับที่ไว้หน้าสุด */
  rows = rows.map((r,ri)=>{
    const c = r.slice();
    if(ri===0) for(let j=1;j<c.length;j++){
      const t = String(c[j]==null?"":c[j]).trim();
      if(WHY_WORD[t]) c[j] = WHY_WORD[t];
    }
    return c;
  });
  let n = 0;
  rows = rows.map((r,ri)=>{
    if(ri===0) return ["ลำดับ"].concat(r);
    const sum = /^\s*รวม/.test(String(r[0]||""));
    return [sum? "" : String(++n)].concat(r);
  });
  w += 1;
  /* รอบแก้ 8 ต.ค. 2569 ข้อ 1 หัวคอลัมน์ของคอลัมน์ที่มีตัวเลขในแถวข้อมูล ได้ class num ด้วย จึงชิดขวาแนวเดียวกับตัวเลขข้างล่าง
     คอลัมน์ลำดับและคอลัมน์ชื่อรายการ (สองคอลัมน์แรก) คงชิดซ้าย */
  const isNum = t => t!=="" && !isNaN(Number(t.replace(/,/g,"")));
  const numCol = Array.from({length:w},(_,j)=> j>1 && rows.slice(1).some(r=>isNum(String(r[j]==null?"":r[j]).trim())));
  const cell = (v,j,tag)=>{
    const t = String(v==null?"":v).trim();
    const num = tag==="th"? numCol[j] : (j>1 && isNum(t));
    return `<${tag} class="${num?"num":""}">${esc(t)}</${tag}>`;
  };
  const head = "<thead><tr>" + Array.from({length:w},(_,j)=>cell(rows[0][j],j,"th")).join("") + "</tr></thead>";
  const body = rows.slice(1).map(r=>{
    const sum = /^\s*รวม/.test(String(r[1]||""));
    return `<tr class="${sum?"sumrow":""}">` + Array.from({length:w},(_,j)=>cell(r[j],j,"td")).join("") + "</tr>";
  }).join("");
  return `<div class="tbl-wrap"><table>${head}<tbody>${body}</tbody></table></div>`;
}
function renderNotes(k, monthLabel){

       ไม่ต้องขึ้นข้อความอธิบายใดๆ */
    wrap.hidden = true; body.hidden = true; body.innerHTML = "";
    $("noteSub").textContent = "";
    btn.setAttribute("aria-expanded","false"); btn.textContent = "กางบทวิเคราะห์";

  const col = (title, inner)=> inner? `<div class="note-col"><h4>${esc(title)}</h4>${inner}</div>` : "";

    col("สรุปผลที่เกิดขึ้น (WHAT)", d.what&&d.what.length? noteList(d.what) : ""),

  /* บอกแหล่งที่มาของบทวิเคราะห์งวดนั้นเสมอ ผู้อ่านจึงตรวจย้อนได้ว่าข้อความมาจากที่ใดในไฟล์ */
  const sname = (S.notesSrc && S.notesSrc[String(k.no)]) ? S.notesSrc[String(k.no)][monthLabel] : "";

function fmtGeneric(v, unit){
  if(v==null||v==="") return "";
  if(v===true||v==="True") return "มี";
  if(v===false||v==="False") return "";
  if(typeof v!=="number") return String(v);
  const u = String(unit||"");
  /* รอบ 2 ตำหนิ 1.5 ตัดพารามิเตอร์สเกลที่ไม่มีผู้เรียกส่ง ค่าหน่วยร้อยละที่เข้ามาที่นี่ต้องเก็บเป็นร้อยละอยู่แล้ว
     ปัจจุบันมีเพียงเป้าในตารางข้อมูลประกอบ แถวหลักที่เก็บเป็นสัดส่วนใช้ fmtAct ซึ่งใช้ ACT_SCALE ที่ประกาศ */
  if(u.indexOf("%")>=0) return numf(v, 1)+"%";
  if(Math.abs(v)>=1000) return nf0.format(v);
  if(Number.isInteger(v)) return nf0.format(v);
  if(Math.abs(v)<1) return numf(v,2);
  return numf(v,1);
}

/* รอบแก้ 8 ต.ค. 2569 r2 คำสั่ง Yuth "สามารถเลือกข้อที่จะแสดงได้ด้วย สามารถเลือกหัวข้อได้หลายหัวข้อ หรือ ทีละหัวข้อก็ได้"
   ทุกข้อ คือไม่กรอง ติ๊กข้อใดข้อหนึ่งคือแสดงเฉพาะข้อนั้น ติ๊กเพิ่มได้หลายข้อ ติ๊กครบทุกข้อหรือเอาออกจนหมดกลับเป็นทุกข้อ
   รายการไม่ถูกวาดใหม่ตอนติ๊ก โฟกัสจึงอยู่ที่ช่องเดิม ปิดด้วย Escape คลิกนอกรายการ หรือย้ายโฟกัสออก แล้วคืนโฟกัสให้ปุ่ม (กติกาข้อ 81) */
function pickLabel(){
  const p = tblF.pick.slice().sort((a,b)=>a-b);
  if(!p.length) return "ทุกข้อ";
  if(p.length<=4) return "ข้อ " + p.join(", ");
  return "เลือก " + p.length + " ข้อ";
}
function pickSync(){
  const panel = $("pickPanel"), btn = $("pickBtn");
  panel.querySelectorAll("input[data-no]").forEach(c=>{ c.checked = tblF.pick.indexOf(Number(c.getAttribute("data-no")))>=0; });
  const all = panel.querySelector("input[data-all]");
  if(all) all.checked = tblF.pick.length===0;
  $("pickLbl").textContent = pickLabel();
  btn.classList.toggle("on", tblF.pick.length>0);
}
function pickBuild(){
  const rows = S.kpis.slice().sort((a,b)=>dispNo(a)-dispNo(b)).map(k=>

  $("pickPanel").innerHTML = `<label class="pick-row all"><input type="checkbox" data-all="1"><span class="pick-nm">ทุกข้อ</span></label>` + rows;
  pickSync();
}
function pickOpen(open, refocus){
  const panel = $("pickPanel"), btn = $("pickBtn");
  if(open){ panel.removeAttribute("hidden"); } else { panel.setAttribute("hidden",""); }
  btn.setAttribute("aria-expanded", open? "true" : "false");
  if(open){ const f = panel.querySelector("input"); if(f) f.focus(); }
  else if(refocus) btn.focus();
}
$("pickBtn").addEventListener("click",()=>{ pickOpen($("pickPanel").hasAttribute("hidden"), false); });
$("pickPanel").addEventListener("change",e=>{
  const c = e.target; if(!c || c.tagName!=="INPUT") return;
  if(c.hasAttribute("data-all")){ tblF.pick = []; }
  else {
    const no = Number(c.getAttribute("data-no"));
    const at = tblF.pick.indexOf(no);
    if(c.checked && at<0) tblF.pick.push(no);
    if(!c.checked && at>=0) tblF.pick.splice(at,1);
    if(tblF.pick.length>=S.kpis.length) tblF.pick = [];
  }

});

function bindView(chartId, tableId, btnId){

    hideEl.classList.remove("v-in"); hideEl.classList.add("v-out");
    hideEl.__vt = setTimeout(()=>{ hideEl.classList.remove("v-out"); done(); }, 120);
  });
}

/* ข1 รอบ 4 ต.ค. 2569 เดิมวาดใหม่เมื่อหน้าต่างกว้างเปลี่ยนเกิน 24 จุดภาพ กราฟจึงคลาดสเกลได้ราวร้อยละสอง
   ตอนนี้ตรวจกรอบภาพของกราฟทุกตัวเทียบความกว้างจริงทุกครั้งที่หน้าต่างหรือกล่องเปลี่ยนขนาด แล้ววาดใหม่เฉพาะตัวที่คลาด */
/* รอบ 12 พ.ย. 2569 ข้อ ส2 และ ส5 ความสูงของกราฟให้เต็มความสูงจอที่เหลือ ที่จอกว้าง 1280 ขึ้นไป (จอที่เมนูเป็นแผงซ้าย)
   ขอบล่างของการ์ดเมื่อเลื่อนอยู่บนสุด ห่างขอบล่างจอ 24 จุดภาพ คิดจากตำแหน่งการ์ดในหน้า (offsetTop ไม่ขึ้นกับการเคลื่อนไหว) และส่วนของการ์ดที่ไม่ใช่กราฟ
   พื้นที่วาดไม่ต่ำกว่า minPlot และไม่เกิน 620 จุดภาพ จอแคบกว่า 1280 หรือกราฟซ่อนอยู่ ใช้ความสูงเดิม defH */
function fitSvgH(id, defH, minPlot, padTB){
  if(!sideNav()) return defH;
  const el = $(id), card = el && el.closest(".card");
  if(!el || !card || !el.getClientRects().length) return defH;
  const sv = el.querySelector("svg"), svH = sv? sv.getBoundingClientRect().height : 0;
  let top = 0, e = card; while(e){ top += e.offsetTop; e = e.offsetParent; }
  const want = Math.round(document.documentElement.clientHeight - 24 - top - (card.offsetHeight - svH));
  return Math.max(minPlot + padTB, Math.min(620 + padTB, want));
}
/* รอบส่งคืนครั้งที่ 1 ส2.9 พื้นที่วาดขั้นต่ำเท่าค่าเดิม จอเตี้ยจึงสูงเท่าเดิม ไม่ล้นมากกว่าเดิม (ผู้จัดการตัดสิน 12 พ.ย. 2569) */
function actHFix(w6){ const d = Math.round(Math.max(196, Math.min((w6>=900 && w6<1400)? 212 : 232, w6*0.24))); return fitSvgH("actChart", d, d - 68, 68); }
function trendHFix(w){ const d = Math.round(w>=900? Math.max(168, Math.min(216, w*0.145)) : Math.max(196, Math.min(216, w*0.175))); return fitSvgH("trendChart", d, d - 58, 58); }
function svgHOff(id, want){
  const el = $(id), sv = el && el.querySelector("svg");
  if(!sv || !el.getClientRects().length || !sv.viewBox || !sv.viewBox.baseVal) return false;
  return Math.abs(sv.viewBox.baseVal.height - want) > 1;
}
function chartOff(id, wfn){
  const el = $(id);
  if(!el || !el.getClientRects().length) return false;
  const sv = el.querySelector("svg");
  if(!sv || !sv.viewBox || !sv.viewBox.baseVal) return false;
  const vb = sv.viewBox.baseVal.width;
  return vb>0 && Math.abs(wfn(id, vb) - vb) > 0.5;
}
function fitCharts(){
  if(chartOff("trendChart", chartWidth) || svgHOff("trendChart", trendHFix(chartWidth("trendChart", 760)))) renderTrend();
  if(redrawAct && pageOn("page-kpi") && (chartOff("actChart", chartWidth) || chartOff("scoreSpark", sparkWidth) || svgHOff("actChart", actHFix(chartWidth("actChart", 540))))) redrawAct();
  fitTileNums();
}
/* จ ข้อ 134 ตัวเลขกับหน่วยบนการ์ดอยู่บรรทัดเดียวเสมอ ถ้าไม่พอให้ลดขนาดตัวเลขทีละจุดภาพ ไม่ต่ำกว่า 22 จุดภาพ */
function fitTileNums(){
  if(!pageOn("page-kpi")) return;
  document.querySelectorAll("#kpiTiles .num").forEach(n=>{
    n.style.fontSize = "";
    const nw = n.querySelector(".nw");
    if(!nw || !n.clientWidth) return;
    let fs = parseFloat(getComputedStyle(n).fontSize), guard = 0;
    while(nw.getBoundingClientRect().width > n.clientWidth + 0.5 && fs > 22 && guard++ < 20){ fs -= 1; n.style.fontSize = fs+"px"; }
  });
}

/* ---------- พลุแสดงความยินดี ----------
   ยิงครั้งเดียวต่อหนึ่งเหตุการณ์ เก็บกุญแจของเหตุการณ์ที่ยิงไปแล้วไว้ใน fxDone
   เหตุการณ์ที่ยิง คือคะแนนรวมตั้งแต่ 100 คะแนนขึ้นไป และตัวชี้วัดที่ถึงเป้าหมายขึ้นไปในหน้าเจาะรายข้อ
   ผู้ใช้ที่ตั้งค่าเครื่องให้ลดการเคลื่อนไหว จะไม่เห็นพลุ ตามหลักการเข้าถึง */
const fxDone = new Set();
let fxP = [], fxOn = false, fxDpr = 1, fxEnd = 0, fxMotif = null;
function fxReduce(){
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
function fxSize(){
  const cv = $("fx"); if(!cv) return;
  fxDpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.floor(window.innerWidth * fxDpr);
  cv.height = Math.floor(window.innerHeight * fxDpr);
}
function fxBurst(rx, ry){
  const cv = $("fx"); if(!cv || !cv.getContext) return;
  if(cv.width < 2) fxSize();
  const cols = TH.fx;
  const W = cv.width, H = cv.height, x = W*rx, y = H*ry, n = 56;
  for(let i=0;i<n;i++){
    const a = (Math.PI*2*i)/n + Math.random()*0.25;
    const sp = (2.1 + Math.random()*3.6) * fxDpr;
    fxP.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1,
              col:cols[(Math.random()*cols.length)|0], r:(1.8+Math.random()*2.2)*fxDpr});
  }
  fxEnd = (window.performance? performance.now() : Date.now()) + 4500;
  cv.style.display = "block";
  if(!fxOn){ fxOn = true; requestAnimationFrame(fxStep); }
}
function fxStep(){
  const cv = $("fx"); if(!cv || !cv.getContext){ fxOn=false; return; }
  const ctx = cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  let alive = 0;
  for(let i=0;i<fxP.length;i++){
    const q = fxP[i];
    if(q.life<=0) continue;
    alive++;
    q.vy += 0.055*fxDpr; q.vx *= 0.988; q.vy *= 0.988;
    q.x += q.vx; q.y += q.vy; q.life -= 0.0115;
    ctx.globalAlpha = Math.max(0, q.life);
    ctx.fillStyle = q.col;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const motifAlive = fxMotifDraw(ctx, cv.width, cv.height);
  ctx.globalAlpha = 1;
  const now = fxNow();
  if((alive>0 || motifAlive) && now < fxEnd){ requestAnimationFrame(fxStep); }
  else { ctx.clearRect(0,0,cv.width,cv.height); fxP = []; fxMotif = null; fxOn = false; cv.style.display = "none"; }
}
/* รูปประกอบของพลุ วาดด้วยเส้นบนผืนวาดเดียวกัน ไม่ใช่รูปภาพและไม่ใช่อิโมจิ
   มงกุฎ ใช้กับเกรดสูงสุด จรวด ใช้กับสถานะเกินเป้าหมาย ตามคำสั่ง Yuth 7 ก.ย. 2569 */
function fxNow(){ return window.performance? performance.now() : Date.now(); }
function fxStartMotif(kind){
  const cv = $("fx"); if(!cv || !cv.getContext) return;
  if(cv.width < 2) fxSize();
  fxMotif = {kind:kind, t0:fxNow(), dur: kind==="rocket"? 1250 : 2200, burst:false};
  fxEnd = Math.max(fxEnd, fxMotif.t0 + fxMotif.dur + 200);
  cv.style.display = "block";
  if(!fxOn){ fxOn = true; requestAnimationFrame(fxStep); }
}
function fxDrawCrown(ctx, cx, cy, sc, al){
  ctx.save();
  ctx.globalAlpha = al; ctx.translate(cx, cy); ctx.scale(sc, sc);
  ctx.beginPath();
  ctx.moveTo(-62,26); ctx.lineTo(-74,-42); ctx.lineTo(-31,-4); ctx.lineTo(0,-56);
  ctx.lineTo(31,-4); ctx.lineTo(74,-42); ctx.lineTo(62,26); ctx.closePath();
  ctx.fillStyle = "#e8b400"; ctx.fill();
  ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.strokeStyle = "#8a6a00"; ctx.stroke();
  ctx.beginPath(); ctx.rect(-62,30,124,20);
  ctx.fillStyle = "#e8b400"; ctx.fill(); ctx.stroke();
  [[-46,4],[0,-16],[46,4]].forEach(q=>{
    ctx.beginPath(); ctx.arc(q[0],q[1],7,0,Math.PI*2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
  });
  ctx.restore();
}
function fxDrawRocket(ctx, cx, cy, sc, al){
  ctx.save();
  ctx.globalAlpha = al; ctx.translate(cx, cy); ctx.scale(sc, sc);
  ctx.beginPath();
  ctx.moveTo(0,-52); ctx.bezierCurveTo(20,-24,20,6,14,26);
  ctx.lineTo(-14,26); ctx.bezierCurveTo(-20,6,-20,-24,0,-52); ctx.closePath();
  ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.strokeStyle = "#17491d"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-14,6); ctx.lineTo(-34,32); ctx.lineTo(-14,26); ctx.closePath();
  ctx.moveTo(14,6); ctx.lineTo(34,32); ctx.lineTo(14,26); ctx.closePath();
  ctx.fillStyle = "#3fae49"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,-14,9,0,Math.PI*2);
  ctx.fillStyle = "#2f5d8a"; ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-11,28); ctx.quadraticCurveTo(0,64,11,28); ctx.closePath();
  ctx.fillStyle = "#e8b400"; ctx.fill();
  ctx.restore();
}
function fxMotifDraw(ctx, W, H){
  if(!fxMotif) return false;
  const el = fxNow() - fxMotif.t0;
  if(el >= fxMotif.dur){ fxMotif = null; return false; }
  const base = 1.35 * fxDpr;
  if(fxMotif.kind === "crown"){
    const inn = Math.min(1, el/380);
    const sc = base * (0.45 + 0.75*inn - 0.20*Math.max(0,(el-380)/500 > 1 ? 1 : (el-380)/500));
    const al = el < 1500 ? 1 : Math.max(0, 1 - (el-1500)/700);
    fxDrawCrown(ctx, W*0.5, H*0.30, Math.max(0.2, sc), al);
    return true;
  }
  const flyDur = 620;
  const pr = Math.min(1, el/flyDur);
  const ease = 1 - Math.pow(1-pr, 2);
  const y = H*(0.94 - 0.66*ease);
  const al = el < 900 ? 1 : Math.max(0, 1 - (el-900)/330);
  if(pr < 1 && Math.random() < 0.9){
    for(let q=0;q<2;q++){
      fxP.push({x:W*0.5 + (Math.random()-0.5)*10*fxDpr, y:y + 30*base, vx:(Math.random()-0.5)*1.2*fxDpr,
                vy:(0.6+Math.random())*fxDpr, life:0.55, col:"#e8b400", r:(1.4+Math.random()*1.6)*fxDpr});
    }
  }
  if(pr >= 1 && !fxMotif.burst){ fxMotif.burst = true; fxBurst(0.5, (y/H) - 0.02); }
  fxDrawRocket(ctx, W*0.5, y, base, al);
  return true;
}
/* รอบส่งคืนครั้งที่ 2 ของชุดสี่ (12 พ.ย. 2569) รายการ 1 พลุของหน้าภาพรวมต้องไม่ค้างหรือยิงทับหน้าเจาะรายตัวชี้วัด
   ตัวตั้งเวลาของ celebrate เก็บไว้ใน fxTimers เพื่อยกเลิกได้ fxStop ล้างผืนวาดทันที กุญแจใน fxDone ไม่ถูกลบ จึงยังยิงครั้งเดียวต่อกุญแจเท่าเดิม */
let fxTimers = [];
function fxLater(fn, ms){
  const id = setTimeout(()=>{ fxTimers = fxTimers.filter(t=>t!==id); fn(); }, ms);
  fxTimers.push(id);
}
function fxStop(){
  fxTimers.forEach(clearTimeout); fxTimers = [];
  fxP = []; fxMotif = null; fxEnd = 0;
  const cv = $("fx"); if(!cv) return;
  if(cv.getContext && cv.width > 0) cv.getContext("2d").clearRect(0,0,cv.width,cv.height);
  cv.style.display = "none";
}
function celebrate(key, motif){
  if(!key || fxDone.has(key)) return;
  fxDone.add(key);
  if(fxReduce()) return;
  if(motif==="rocket"){
    fxLater(()=>{ fxSize(); fxStartMotif("rocket"); }, 180);
    fxLater(()=>fxBurst(0.24, 0.26), 830);
    fxLater(()=>fxBurst(0.76, 0.29), 960);
    return;
  }
  fxLater(()=>{ fxSize(); fxBurst(0.50, 0.30); if(motif==="crown") fxStartMotif("crown"); }, 420);
  fxLater(()=>fxBurst(0.22, 0.22), 700);
  fxLater(()=>fxBurst(0.78, 0.25), 950);
}
/* ข้อ 18 ของคำสั่ง Yuth 10 ก.ย. 2569 เติมไอคอนกำกับหัวข้อการ์ด
   ใช้ SVG ที่วาดในไฟล์นี้เท่านั้น ไม่มีอิโมจิและไม่มีฟอนต์ไอคอน */
/* รอบ r2 12 พ.ย. 2569 ข้อ 8 คำสั่ง Yuth "ใส่รูปภาพสื่อความหมายไปด้วยนะ เพื่อการสื่อสารที่ชัดเจน"
   ปุ่มตัวกรองวิธีคิดคะแนนรวม (ตัดเพดาน ไม่ตัดเพดาน) ปุ่มเลือกข้อ (รายการ) และปุ่มสลับมุมมองที่ยังเป็นข้อความคงที่ตอนเปิดหน้า */
function r2StaticIcons(){
  document.querySelectorAll('#trendModes .fchip').forEach(b=>{ if(!b.querySelector("svg")) b.insertAdjacentHTML("afterbegin", icon(b.getAttribute("data-tm")==="full"? "uncap" : "cap", 14, "currentColor")); });
  const pb = $("pickBtn"); if(pb && !pb.querySelector("svg.ic")) pb.insertAdjacentHTML("afterbegin", icon("list",14,"currentColor"));
  document.querySelectorAll('label[for="selRange"], label[for="selRangeK"]').forEach(l=>{ if(!l.querySelector("svg")) l.insertAdjacentHTML("afterbegin", icon("calendar",14,"currentColor")); });
  ["trendToggle","actToggle","otTrendToggle","otDeptToggle"].forEach(id=>{ const b = $(id); if(b && !b.querySelector("svg")) b.insertAdjacentHTML("afterbegin", icon(/กราฟ$/.test(b.textContent.trim())? "bars" : "table",14,"currentColor")); });
}
function paintHeadIcons(){
  document.querySelectorAll(".h3ic").forEach(el=>{
    if(el.firstChild) return;
    const kd = el.getAttribute("data-ic");
    el.innerHTML = icon(kd==="chart"? "bars" : kd, 16, "currentColor");
  });
  /* รอบ 8 ต.ค. 2569 r5 ไอคอนของเมนูแถบซ้าย หน้าปัดคือภาพรวมคะแนน เป้าคือตัวชี้วัดรายข้อ นาฬิกาคือชั่วโมงโอที */
  document.querySelectorAll(".nav-ic").forEach(el=>{
    if(el.firstChild) return;
    el.innerHTML = icon(el.getAttribute("data-nic"), 18, "currentColor");
  });
}
/* ภาพประกอบการ์ดคะแนนรวม เป็นเส้นกราฟขาขึ้นกับแท่งสามอัน วาดในไฟล์ ไม่ใช่รูปถ่าย
   ตามข้อ 4 ของคำสั่ง Yuth 10 ก.ย. 2569 รอบสาม */
/* รอบแก้ 8 ต.ค. 2569 ข้อ 8 ตัววาดลายน้ำเกรดและตัววัดกรอบลายน้ำ (คำสั่ง 10 ก.ย. 2569 รอบห้า ข้อ 1) ตัดออก
   เพราะลายน้ำถูกแทนด้วยป้ายเกรดทึบในการ์ดคะแนนรวม ดูคอมเมนต์ที่กฎ .hero-art */
function heroArt(){
  return `<svg viewBox="0 0 120 120" fill="none" aria-hidden="true">`
    + `<rect x="10" y="70" width="18" height="40" rx="4" fill="#ffffff"/>`
    + `<rect x="38" y="52" width="18" height="58" rx="4" fill="#ffffff"/>`
    + `<rect x="66" y="30" width="18" height="80" rx="4" fill="#ffffff"/>`
    + `<path d="M12 62 L47 40 L75 22 L108 10" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<circle cx="108" cy="10" r="8" fill="#ffffff"/></svg>`;
}
/* รอบ 12 พ.ย. 2569 ข้อ 4 ปุ่มหุบกางแผงเมนู ค่าว่างคือค่าตั้งต้นตามความกว้าง (1600 ขึ้นไปกาง 1280 ถึง 1599 หุบ) min คือผู้ใช้หุบ max คือผู้ใช้กาง
   เก็บในตัวแปรนี้เท่านั้น ไม่ใช้ localStorage sessionStorage หรือคุกกี้ ไอคอนเป็นแผงกับลูกศรคู่ ทิศลูกศรบอกการกระทำที่จะเกิด */
let navPref = "";
function navWide(){ return !!(window.matchMedia && window.matchMedia("(min-width:1600px)").matches); }
function navExpanded(){ return navWide()? navPref!=="min" : navPref==="max"; }
function navTogIcon(ex){
  const d = ex? "M14 7.5L9.5 12l4.5 4.5M19.5 7.5L15 12l4.5 4.5" : "M10 7.5l4.5 4.5L10 16.5M15.5 7.5L20 12l-4.5 4.5";
  return `<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="2.6" height="16" rx="1.3" fill="currentColor"/>`
    + `<path d="${d}" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function syncNavTog(){
  const b = $("navTog"); if(!b) return;
  const ex = navExpanded();
  b.setAttribute("aria-expanded", ex? "true" : "false");
  b.setAttribute("aria-label", ex? "หุบเมนู" : "กางเมนู");
  b.innerHTML = navTogIcon(ex);
}
if($("navTog")){
  $("navTog").addEventListener("click", ()=>{
    navPref = navExpanded()? "min" : "max";
    const app = document.querySelector(".app"), tb = $("topbar");
    app.classList.toggle("nav-min", navPref==="min");
    app.classList.toggle("nav-max", navPref==="max");
    if(!REDUCED && tb){ tb.classList.remove("nav-swap"); void tb.offsetWidth; tb.classList.add("nav-swap"); }
    syncNavTog(); hideTip(); hideSpark(); onResize();
  });
  window.addEventListener("resize", syncNavTog);
  syncNavTog();
}
function pageOn(id){ const el = $(id); return !!el && el.classList.contains("show"); }
function hideSplash(){ const sp=$("splash"); if(!sp||sp.classList.contains("hide")) return; sp.classList.add("hide"); setTimeout(()=>{sp.style.display="none";},400); }
try{
  fixScores();
  pickBuild();
  renderAll();
  renderOt();
  paintHeadIcons();
  r2StaticIcons();   /* รอบ r2 ข้อ 8 */
}finally{
  /* ฟอนต์โหลดเสร็จทีหลัง ความกว้างข้อความจึงเปลี่ยน ต้องล้างทะเบียนแล้ววาดกราฟใหม่
     ไม่งั้นตำแหน่งป้ายจะคิดจากฟอนต์สำรอง ไม่ใช่ฟอนต์ที่ผู้ใช้เห็นจริง */
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{
      /* ด่าน 24 ตั้งเวลาซ่อนหน้ารอเปิดก่อนวาดใหม่ การวาดทำงานต่อเนื่องในรอบเดียวกัน จึงเสร็จก่อนหน้ารอเปิดหายเสมอ */
      setTimeout(hideSplash,150);
      _mwCache = {};
      try{ renderTrend(); renderTable(); renderKpiPage(); }catch(e){}
      /* รอบแก้ 8 ต.ค. 2569 ข้อ 8 ลายน้ำเกรดถูกตัดออกแล้ว จึงไม่ต้องวัดกรอบลายน้ำใหม่ เหลือการตั้งความสูงแถบบน */
      try{ syncTopbarH(); }catch(e){}
      /* ง การ์ดที่อยู่นอกจอตอนโหลดค่อยปรากฏเมื่อเลื่อนมาถึง การ์ดในจอแรกแสดงทันที
         ตั้งหลังฟอนต์พร้อม ระหว่างหน้ารอเปิดยังบังอยู่ จึงไม่บังคับจัดวางเพิ่มระหว่างโหลด (ด่าน 24) */
      try{ setupReveal("page-overview"); }catch(e){}
    });
  }
  setTimeout(hideSplash, 2200);
}
