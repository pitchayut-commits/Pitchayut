/* ---------- ตัวเลือกช่วงเวลา แบบรายการเลื่อนลง พร้อมโหมดกำหนดเอง ---------- */
let customMode = false;
function rangeOptions(){
  const n = S.months.length;
  let o = S.months.map((m,i)=>
    `<option value="m${i}">${esc(m)}${i===n-1?" (เดือนล่าสุด)":""}</option>`).join("");
  if(n>=2) o += `<option value="c2">เทียบ 2 เดือนล่าสุด</option>`;
  if(n>=3) o += `<option value="c3">เทียบ 3 เดือนล่าสุด</option>`;
  o += `<option value="custom">กำหนดเอง เลือกได้ถึง 3 เดือน</option>`;
  return o;
}
function currentRangeValue(){
  if(customMode) return "custom";
  const n = S.months.length;
  if(selMonths.length===1) return "m"+selMonths[0];
  const want2 = [n-2,n-1].join(","), want3 = [n-3,n-2,n-1].join(",");
  const cur = selSorted().join(",");
  if(cur===want2) return "c2";
  if(cur===want3) return "c3";
  return "custom";
}
function renderRange(){
  const sel = $("selRange");
  sel.innerHTML = rangeOptions();
  sel.value = currentRangeValue();
  const chips = $("mchips");
  if(customMode){
    chips.hidden = false;
    chips.innerHTML = S.months.map((m,i)=>
      `<button type="button" class="mchip" data-mi="${i}" aria-pressed="${selMonths.includes(i)?"true":"false"}">${esc(m)}</button>`).join("");
    chips.querySelectorAll(".mchip").forEach(ch=>{
      ch.addEventListener("click",()=>{
        const i = parseInt(ch.getAttribute("data-mi"),10);
        const at = selMonths.indexOf(i);
        if(at>=0){ if(selMonths.length>1) selMonths.splice(at,1); }
        else { selMonths.push(i); if(selMonths.length>3) selMonths.shift(); }
        monthPicked = true;
        busy(renderAll);
      });
    });
    $("mhint").textContent = "";
  } else {
    chips.hidden = true;
    chips.innerHTML = "";
    $("mhint").textContent = compareMode()
      ? "กำลังเทียบ "+selSorted().map(x=>S.months[x]).join(" กับ ")
      : "";
  }
}
function onRangeChange(v){
  const n = S.months.length;
  if(v==="custom"){ customMode = true; }
  else if(v==="c2"){ customMode=false; selMonths=[n-2,n-1]; monthPicked=true; }
  else if(v==="c3"){ customMode=false; selMonths=[n-3,n-2,n-1]; monthPicked=true; }
  else { customMode=false; selMonths=[parseInt(v.slice(1),10)]; monthPicked=true; }
  busy(renderAll);
}

/* ---------- การ์ดตัวเลขสำคัญ ---------- */
function cmpText(cur,prev,label){
  if(cur==null||prev==null) return "";
  const d = (cur-prev)*100;
  const w = d>=0 ? `<span class="up">เพิ่มขึ้น ${numf(Math.abs(d),1)} คะแนน</span>` : `<span class="down">ลดลง ${numf(Math.abs(d),1)} คะแนน</span>`;
  return w+" "+label;
}
/* คะแนนที่เก็บได้ของตัวชี้วัดข้อหนึ่ง ต้องเดินตามวิธีคิดที่ผู้ใช้เลือกไว้
   แบบตามชีท ใช้คอลัมน์คะแนนถ่วงน้ำหนักของชีท ซึ่งตัดไว้ที่น้ำหนักเต็มของข้อ
   แบบไม่ตัดเพดาน ใช้น้ำหนักคูณคะแนนจริง คะแนนของข้อจึงเกินน้ำหนักเต็มได้
   ถ้าจุดใดไม่เดินตาม จอเดียวกันจะบอกคนละคะแนน */
function gotPts(k, mi){
  if(trendMode==="full"){
    const r = k.m[mi][2];
    return r==null? null : (k.weight||0)*r;
  }
  return k.m[mi][3];
}
function modeWord(){
  return trendMode==="full"? "ไม่ตัดเพดาน เกิน 100 ได้" : "ตามชีท ไม่เกิน 100";
}
function renderTiles(){
  const i = mainM();
  const cmp = compareMode();
  const others = selSorted().filter(x=>x!==i);
  /* วิธีคิดคะแนนรวมที่ผู้ใช้เลือกไว้ ต้องใช้กับการ์ดนี้ด้วย ไม่งั้นจอเดียวกันจะบอกคนละคะแนน */
  const full = trendMode==="full";
  const tot = full? totalsFull() : null;
  const gsum = (mi, from, to) => {
    let sum = 0, any = false;
    S.kpis.forEach(k=>{
      if(k.no<from || k.no>to) return;
      const r = k.m[mi][2];
      if(r==null) return;
      any = true; sum += (k.weight||0)*r;
    });
    return any? sum : null;
  };
  const totAt = mi => full? (tot[mi]!=null? tot[mi]/100 : null) : S.totals.total[mi][2];
  const fin = totAt(i);
  const finPrev = i>0 ? totAt(i-1) : null;
  const finPct = fin!=null ? fin*100 : null;
  const g = full? deriveGrade(finPct) : (S.grades[i] || deriveGrade(finPct));
  const outp = full? [null,null,gsum(i,1,5)] : S.totals.out[i];
  const inp  = full? [null,null,gsum(i,6,10)] : S.totals.inp[i];
  const passList=[], failList=[];
  S.kpis.forEach(k=>{
    const r = k.m[i][2];
    if(r==null) return;
    (r>=1?passList:failList).push(k.no);
  });
  const heroCmp = cmp
    ? others.map(o=>{
        const v = totAt(o);
        return `<div>${esc(S.months[o])} ได้ ${v!=null?numf(v*100,1):"ไม่มีข้อมูล"} คะแนน</div>`;
      }).join("")
    : cmpText(fin,finPrev,"จากเดือนก่อน");
  /* แถบของกลุ่ม ต้องเล่าเรื่องเดียวกับวิธีคิดที่เลือกอยู่
     แบบตามชีท คะแนนกลุ่มเกินน้ำหนักเต็มไม่ได้ แถบจึงเต็มที่ร้อยละร้อย
     แบบไม่ตัดเพดาน คะแนนกลุ่มเกินน้ำหนักเต็มได้ แถบจึงต้องยาวเกินขีดน้ำหนักเต็ม
     ถ้ายังตัดที่ร้อยละร้อยเหมือนเดิม การ์ดจะบอกว่าเต็มพอดี ทั้งที่ตัวเลขข้างบนเกินไปแล้ว */
  const rawPct = v => v!=null? v*100 : 0;
  const outRaw = outp[2]!=null? outp[2]/0.70*100 : 0;
  const inRaw  = inp[2]!=null? inp[2]/0.30*100 : 0;
  const barMax = full? Math.max(100, outRaw, inRaw) : 100;
  const overflow = barMax > 100.05;
  const srcRow = (nm, pctRaw, gotPt, fullPt, note) => {
    const wpc = Math.max(0, Math.min(100, pctRaw/barMax*100));
    const tick = overflow? `<i style="left:${(100/barMax*100).toFixed(2)}%"></i>` : "";
    const vl = full
      ? `${fmtPts(gotPt)} <span class="dim">น้ำหนักเต็ม ${fullPt} คะแนน</span>`
      : `${fmtPts(gotPt)} <span class="dim">จาก ${fullPt} คะแนน</span>`;
    return `
    <div class="srcrow">
      <div class="r1"><span class="nm2">${esc(nm)}</span>
        <span class="vl">${vl}</span></div>
      <div class="wbar"><span class="got" data-w="${wpc}"></span><span class="rest" style="flex:1"></span>${tick}</div>
      <div class="r2">${esc(note)}</div>
    </div>`;
  };
  const outPct = outRaw;
  const inPct  = inRaw;
  $("tiles").innerHTML = `
  <div class="card span4 tile tile-hero">
    <div class="lbl">คะแนนรวมเดือน ${esc(S.months[i])}</div>
    <div class="hero-score"><span class="num" id="heroNum">${finPct!=null?numf(finPct,1):"ไม่มีข้อมูล"}</span><span class="hero-full">${full? "เกิน 100 ได้ ฐานเต็ม 100" : "จากคะแนนเต็ม 100"}</span></div>
    <div class="cmp">${heroCmp}</div>
    <div class="grade-block ${gradeClass(g)}">
      ${gradeIcon(g,26)}
      <div class="gtxt"><div class="gname">เกรด ${esc(g)}</div><div class="gword">${esc(gradeWord(g))}</div></div>
    </div>
    <div class="hero-sub">
      <div class="hs-head">ผลรายตัวชี้วัด เดือน ${esc(S.months[i])}</div>
      <ul>
        <li>ทำได้ตามเกณฑ์ ${passList.length} ข้อ จาก ${passList.length+failList.length} ข้อ</li>
        ${failList.length? `<li>ยังไม่ผ่านเกณฑ์ ข้อ ${failList.join(", ")}</li>` : `<li>ผ่านเกณฑ์ครบทุกข้อ</li>`}
      </ul>
    </div>
  </div>
  <div class="card span8">
    <h3>ที่มาของคะแนนรวม เดือน ${esc(S.months[i])}</h3>
    <ul class="sub-list">
      <li>ตัวชี้วัดทั้งหมด 10 ข้อ แบ่งเป็นสองกลุ่ม รวมกันเป็นคะแนนเต็ม 100 คะแนน${full? " วิธีคิดที่เลือกอยู่คือไม่ตัดเพดาน คะแนนกลุ่มจึงเกินน้ำหนักเต็มได้":""}</li>
      <li>กลุ่มงานที่ส่งผลถึงองค์กร น้ำหนักรวม 70 คะแนน</li>
      <li>กลุ่มงานประจำของแผนก น้ำหนักรวม 30 คะแนน</li>
    </ul>
    <div class="srcbars">
      ${srcRow("งานที่ส่งผลถึงองค์กร", outPct, outp[2], 70, "ข้อ 1 ถึง 5 ค่าใช้จ่าย การลาออก การทำตามกฎหมาย อุบัติเหตุ และความพึงพอใจ")}
      ${srcRow("งานประจำของแผนก", inPct, inp[2], 30, "ข้อ 6 ถึง 10 การเติมคน การขาดงาน ความผิดพลาดจ่ายค่าตอบแทน งาน 5 ส. และกิจกรรม")}
    </div>
    ${overflow? '<div class="srcfoot">ขีดในแถบ คือระดับน้ำหนักเต็มของกลุ่ม ส่วนที่ยาวเลยขีดไป คือคะแนนที่ทำได้เกินน้ำหนักเต็ม</div>' : ""}
  </div>`;
  if(finPct!=null) countUp($("heroNum"), finPct, 1, "");
  requestAnimationFrame(()=>{
    $("tiles").querySelectorAll(".wbar .got").forEach(el=>{ el.style.width = el.getAttribute("data-w")+"%"; });
  });
}

/* ---------- คะแนนรวมรายเดือน ---------- */
/* สองแบบ ตามคำสั่ง 25 ส.ค. 2569
   sheet คือค่าที่ชีทบันทึก ซึ่งตัดเพดานคะแนนของแต่ละข้อไว้ที่น้ำหนักของข้อนั้น คะแนนรวมจึงเกิน 100 ไม่ได้
   full คือคิดใหม่โดยไม่ตัดเพดาน เอาน้ำหนักคูณคะแนนจริงของแต่ละข้อ คะแนนรวมจึงเกิน 100 ได้ */
let trendMode = "sheet";
function totalsFull(){
  return S.months.map((m,mi)=>{
    let sum = 0, any = false;
    S.kpis.forEach(k=>{
      const r = k.m[mi][2];
      if(r==null) return;
      any = true;
      sum += (k.weight||0) * r;
    });
    return any? sum*100 : null;
  });
}
/* กล่องอธิบายวิธีคิดคะแนนรวม ตามคำสั่ง 25 ส.ค. 2569 ข้อ 2
   ยกตัวอย่างด้วยตัวเลขจริงของเดือนที่เลือกอยู่ ผู้อ่านจึงกดเครื่องคิดเลขตามได้ทันที */
function modeHelpHtml(){
  const i = mainM();
  const mn = S.months[i];
  const sheetV = S.totals.total[i][2];
  const fullV = totalsFull()[i];
  const ex = S.kpis.slice().filter(k=>k.m[i][2]!=null).sort((a,b)=>b.m[i][2]-a.m[i][2])[0];
  let exTxt = "";
  if(ex){
    const r = ex.m[i][2];
    const wt = (ex.weight||0)*100;
    exTxt = "<li>ตัวอย่างเดือน " + esc(mn) + " ข้อ " + ex.no + " น้ำหนัก " + numf(wt,0)
      + " คะแนน ทำได้ " + fmtScore(r, ex.no)
      + " แบบตามชีทเก็บได้ " + fmtPts(Math.min(ex.weight||0, (ex.weight||0)*r))
      + " คะแนน เพราะถูกตัดไว้ที่น้ำหนักเต็ม ส่วนแบบไม่ตัดเพดานเก็บได้ "
      + fmtPts((ex.weight||0)*r) + " คะแนน</li>";
  }
  return '<div class="nt-head">วิธีคิดคะแนนรวมสองแบบ</div><ul>'
    + '<li>ทั้งสองแบบใช้ตัวเลขผลงานชุดเดียวกัน ต่างกันแค่ตอนรวมคะแนนว่ายอมให้แต่ละข้อเกินน้ำหนักของตัวเองหรือไม่</li>'
    + '<li>แบบตามชีท ไม่เกิน 100 คือเอาน้ำหนักคูณคะแนนของข้อนั้น แล้วตัดไว้ไม่ให้เกินน้ำหนักเต็มของข้อ จากนั้นรวมทั้งสิบข้อ คะแนนรวมจึงไม่เกิน 100</li>'
    + '<li>แบบไม่ตัดเพดาน เกิน 100 ได้ คือเอาน้ำหนักคูณคะแนนของข้อนั้นตรงตัว ไม่ตัดส่วนที่เกิน แล้วรวมทั้งสิบข้อ ข้อที่ทำได้เกินเป้าจึงช่วยดึงคะแนนรวมขึ้นได้</li>'
    + exTxt
    + '<li>เดือน ' + esc(mn) + ' แบบตามชีทได้ ' + (sheetV!=null? numf(sheetV*100,1) : "ไม่มีข้อมูล")
    + ' คะแนน แบบไม่ตัดเพดานได้ ' + (fullV!=null? numf(fullV,1) : "ไม่มีข้อมูล") + ' คะแนน</li>'
    + '<li>ทุกจุดในไฟล์ที่แสดงคะแนนที่เก็บได้ ทั้งการ์ดคะแนนรวม การ์ดคะแนนรายตัวชี้วัด หน้าเจาะรายตัวชี้วัด และเกรด เดินตามแบบที่เลือกอยู่เสมอ</li>'
    + '<li>คะแนนของข้อ 1 และข้อ 9 หน้านี้คิดจากเป้าและทิศทางที่ถูกต้อง เพราะชีทต้นทางกรอกสองข้อนี้ผิด ตั้งแต่ 4 ก.ย. 2569 ทั้งสองแบบใช้ชุดคะแนนเดียวกันแล้ว ทุกจุดในหน้าจึงบอกคะแนนตรงกัน</li>'
    + '</ul>';
}
function renderModeHelp(){
  const box = $("tmPop");
  if(!box) return;
  box.innerHTML = modeHelpHtml();
}
function toggleModeHelp(force){
  const box = $("tmPop"), btn = $("tmInfo");
  if(!box||!btn) return;
  const open = force!=null? force : box.hasAttribute("hidden");
  if(open){ box.removeAttribute("hidden"); } else { box.setAttribute("hidden",""); }
  btn.setAttribute("aria-expanded", open? "true":"false");
}
function renderTrend(){
  const full = trendMode==="full";
  const vals = full? totalsFull() : S.totals.total.map(t=>t[2]!=null? t[2]*100 : null);
  const w = chartWidth("trendChart", 760);
  const hl = new Set(selMonths);
  /* ประโยคสรุปหนึ่งบรรทัดเหนือกราฟ คิดจากข้อมูลในหน้านี้เอง แก้ 3 ก.ย. 2569 */
  (function(){
    let li = -1;
    for(let i=vals.length-1;i>=0;i--){ if(vals[i]!=null){ li=i; break; } }
    if(li<0){ $("trendLead").textContent = ""; return; }
    const g = full? deriveGrade(vals[li]) : (S.grades[li]||deriveGrade(vals[li]));
    let txt = "เดือนล่าสุด "+S.months[li]+" ได้ "+numf(vals[li],1)+" คะแนน เกรด "+g;
    const prev = li>0? vals[li-1] : null;
    if(prev!=null){
      const d = vals[li]-prev;
      txt += Math.abs(d)<0.05? " เท่ากับเดือนก่อน" : (d>0? " เพิ่มขึ้น "+numf(d,1)+" คะแนนจากเดือนก่อน" : " ลดลง "+numf(Math.abs(d),1)+" คะแนนจากเดือนก่อน");
    }
    const loss = S.kpis.map(k=>({no:k.no, v:(k.weight - (k.m[li][3]!=null? k.m[li][3]:k.weight))*100}))
                       .filter(o=>o.v>0.05).sort((a,b)=>b.v-a.v).slice(0,2);
    if(loss.length) txt += " ข้อที่เสียคะแนนมากที่สุดคือ ข้อ "+loss.map(o=>o.no).join(" และ ข้อ ");
    $("trendLead").textContent = txt;
  })();
  $("trendSub").textContent = full
    ? "คิดจากน้ำหนักคูณคะแนนจริงของแต่ละข้อ คะแนนรวมเกิน 100 ได้"
    : "คิดตามชีท ซึ่งตัดคะแนนของแต่ละข้อไว้ที่น้ำหนักของข้อนั้น คะแนนรวมจึงไม่เกิน 100";
  $("trendModes").querySelectorAll(".fchip").forEach(c=>{
    c.setAttribute("aria-pressed", c.getAttribute("data-tm")===trendMode? "true":"false");
  });
  renderModeHelp();
  const nums = vals.filter(v=>v!=null);
  const yMax = Math.max(120, nums.length? Math.ceil((Math.max.apply(null,nums)+6)/5)*5 : 120);
  const yMin = Math.min(70, nums.length? Math.floor((Math.min.apply(null,nums)-6)/5)*5 : 70);
  $("trendChart").innerHTML = lineChart(vals, S.months, {
    width:w, height: Math.round(Math.max(340, Math.min(470, w*0.56))),
    yMin:yMin, yMax:yMax, gid:"trendg",
    refs:[{v:80,label:"ต่ำกว่า 80 คือเกรด C",color:"#e2a99e"},
          {v:100,label:"ถึง 100 คือเกรด A",color:"#d9a300"},
          {v:110,label:"ถึง 110 คือเกรด A+",color:"#2e8536"}],
    plotBg:"#ffffff",
    /* แรเงาเฉพาะช่วงต่ำกว่า 80 ซึ่งเป็นเกรด C ช่วงอื่นปล่อยเป็นพื้นขาว ตามคำสั่ง 24 ส.ค. 2569 */
    bands:[{from:yMin,to:80,color:"rgba(184,65,46,0.13)",label:"เกรด C",labelColor:"#8f3d2c"}],
    highlight:hl, dim:monthPicked, labelEvery: w<560?2:1,
    fmt:v=>numf(v,1),
    tipExtra:i=>"เกรด "+(full? deriveGrade(vals[i]) : (S.grades[i]||deriveGrade(vals[i])))
  });
  let rows = S.months.map((m,i)=>{
    const v = vals[i], g = full? deriveGrade(v) : (S.grades[i]||deriveGrade(v));
    const prev = i>0? vals[i-1]:null;
    const d = (v!=null&&prev!=null)? v-prev : null;
    const dTxt = d==null? "" : (d>=0? `<span class="delta-up">เพิ่มขึ้น ${numf(Math.abs(d),1)}</span>` : `<span class="delta-down">ลดลง ${numf(Math.abs(d),1)}</span>`);
    return `<tr class="${selMonths.includes(i)?"mon-hl":""}"><td>${esc(m)}</td><td class="num">${v!=null?numf(v,1):"ไม่มีข้อมูล"}</td><td>${gradeIcon(g,15)} เกรด ${esc(g)}</td><td>${dTxt}</td></tr>`;
  }).join("");
  $("trendTable").innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>เดือน</th><th class="num">คะแนนรวม${full? " (ไม่ตัดเพดาน)":" (ตามชีท)"}</th><th>เกรด</th><th>เทียบเดือนก่อน</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  /* ย่อคำอธิบายเกรดเป็นแถวชิปแถวเดียว แก้ 3 ก.ย. 2569 คำอธิบายเต็มอยู่ในข้อความกำกับเมื่อชี้ */
  const items = S.legend.map(l=>{
    const rng = gradeRange(l[1]);
    return `<li title="${esc(l[2])}">${gradeIcon(l[1],14)}<span class="gk-range">เกรด ${esc(l[1])} ${rng}</span></li>`;
  }).join("");
  $("gradeLegend").innerHTML =
    `<div class="gk-head">เกณฑ์เกรด</div><ul class="gk-row">${items}</ul>`;
  bindTips($("trendChart"));
  bindMonthClicks("trendChart");
  syncView("trendChart","trendTable","trendToggle");
}

/* ---------- ข้อที่เสียคะแนนมากที่สุด แท่งเต็มคือน้ำหนัก ---------- */
function shortName(k){ return "ข้อ "+k.no+" "+k.name; }
/* จำสถานะย่อหรือขยายของการ์ดคะแนนรายตัวชี้วัด เพื่อให้คงเดิมเมื่อวาดใหม่ */
let wbarHidden = false;
function syncWbar(){
  $("wbars").style.display = wbarHidden? "none":"grid";
  $("wbarLegend").style.display = wbarHidden? "none":"flex";
  $("wbarToggle").textContent = wbarHidden? "แสดงรายการ":"ซ่อนรายการ";
  $("wbarToggle").setAttribute("aria-expanded", wbarHidden? "false":"true");
}
function renderWbars(){
  const i = mainM();
  const maxW = Math.max.apply(null, S.kpis.map(k=>k.weight||0));
  const full = trendMode==="full";
  /* คิดจากคอลัมน์คะแนนถ่วงน้ำหนักของชีทโดยตรง เพื่อให้บวกกับคะแนนรวมได้ 100 พอดี
     ถ้าคิดจากอัตราที่ชีทปัดไว้สองตำแหน่ง ผลรวมจะคลาดจาก 100 ราวหนึ่งในสิบคะแนน
     ส่วนแบบไม่ตัดเพดาน ใช้น้ำหนักคูณคะแนนจริง จึงมีทั้งข้อที่เสียคะแนนและข้อที่เก็บเกินน้ำหนักเต็ม */
  const lossOf = (k,mi) => {
    const got = gotPts(k,mi);
    if(got==null) return null;
    return Math.max(0, k.weight*100 - got*100);
  };
  const list = S.kpis.map((k,idx)=>({k, idx, loss: lossOf(k,i)}))
    .sort((a,b)=>(b.loss==null?-1:b.loss)-(a.loss==null?-1:a.loss) || a.k.no-b.k.no);
  $("wbarSub").textContent = "เดือน "+S.months[i]+" เรียงจากข้อที่เสียคะแนนมากที่สุด วิธีคิด "+modeWord();
  /* แถบของทุกข้อต้องใช้มาตราเดียวกัน ไม่งั้นเทียบข้ามข้อไม่ได้
     ข้อที่เก็บเกินน้ำหนักเต็ม แถบจะยาวเลยขีดน้ำหนักเต็มของข้อนั้น */
  let ovMax = 100;
  if(full){
    S.kpis.forEach(k=>{
      const g = gotPts(k,i);
      if(g==null || !(k.weight>0)) return;
      ovMax = Math.max(ovMax, (g/k.weight)*100);
    });
  }
  const anyOver = ovMax > 100.05;
  let html = "";
  list.forEach(o=>{
    const k = o.k;
    const wfull = k.weight*100;
    const gp = gotPts(k,i);
    const got = gp==null? 0 : gp*100;
    const lost = o.loss==null? 0 : o.loss;
    const barPct = (k.weight/maxW)*100;
    const gotW = wfull>0? Math.min(100, (got/wfull)*100/ovMax*100) : 0;
    const lostW = wfull>0? (lost/wfull)*100/ovMax*100 : 0;
    const tick = (anyOver && wfull>0)? `<i style="left:${(100/ovMax*100).toFixed(2)}%"></i>` : "";
    /* รูปแบบตัวเลขตรงกับการ์ดที่มาของคะแนนรวม คือ ทำได้ จาก น้ำหนักเต็ม */
    const word = full? "น้ำหนักเต็ม" : "จาก";
    const lv = o.loss==null
      ? `<span class="lv">ไม่มีข้อมูล</span>`
      : `<span class="lv ${lost<0.05?"zero":"loss"}">${fmtPts(gp)} ${word} ${numf(wfull,0)} คะแนน</span>`;
    html += `<button type="button" class="lossrow" data-kpi="${o.idx}" data-tip="${esc(shortName(k))}<br>เก็บได้ ${fmtPts(gp)} ${word} ${numf(wfull,0)} คะแนน">
      <div class="l1"><span class="nm">${k.no} ${esc(k.name)}</span>${lv}</div>
      <div class="wbar" style="width:${barPct.toFixed(1)}%">
        <span class="got" data-w="${gotW.toFixed(1)}"></span><span class="lost" data-w="${lostW.toFixed(1)}"></span>${tick}
      </div>
    </button>`;
  });
  $("wbars").innerHTML = html;
  $("wbarLegend").innerHTML =
    `<span><span class="key"></span>คะแนนที่เก็บได้</span>
     <span><span class="key hatch"></span>คะแนนที่เสียไป</span>`
    + (anyOver? `<span>ขีดในแถบ คือระดับน้ำหนักเต็มของข้อนั้น ส่วนที่ยาวเลยขีดไป คือคะแนนที่เก็บเกินน้ำหนักเต็ม</span>` : "");
  $("wbarCount").textContent = "ทั้งหมด "+list.length+" ข้อ";
  requestAnimationFrame(()=>{
    $("wbars").querySelectorAll(".wbar span[data-w]").forEach(el=>{ el.style.width = el.getAttribute("data-w")+"%"; });
  });
  $("wbars").querySelectorAll(".lossrow").forEach(b=>{
    b.addEventListener("click",()=>{ openKpi(parseInt(b.getAttribute("data-kpi"),10)); });
  });
  bindTips($("wbars"));
  syncWbar();
}

/* ---------- ตารางตัวชี้วัด ---------- */
/* คำบอกสถานะ ข้อที่ชีทระบุทิศทางขัดกับสูตรคะแนน ให้พูดตามสิ่งที่ชีทให้มาจริง
   คือเต็มหรือไม่เต็ม โดยไม่ตัดสินว่าถึงเป้าหรือไม่ถึงเป้า */
/* สถานะมีสองค่าเท่านั้น ตามคำสั่ง 25 ส.ค. 2569
   ถึงเป้าหมาย เมื่อคะแนนตั้งแต่ 100 ขึ้นไป และ ไม่ถึงเป้าหมาย เมื่อต่ำกว่า 100 */
function statusWord(r, no){
  if(r==null) return {cls:"na", ic:"note", col:"#566058", w:"ไม่มีข้อมูล"};
  return r>=1
    ? {cls:"pass", ic:"check", col:"#2e8536", w:"ถึงเป้าหมาย"}
    : {cls:"fail", ic:"warn", col:"#b8412e", w:"ไม่ถึงเป้าหมาย"};
}
/* ข้อที่ไม่ถึงเป้า ใช้เฉดแดงอย่างเดียว ไม่ไล่เฉดตามความห่างจากเป้าอีกต่อไป */
function statusSev(r, no){ return statusWord(r, no); }
function statusChipSev(r, no){
  const st = statusSev(r, no);
  return `<span class="chip ${st.cls}">${icon(st.ic,14,st.col)} ${st.w}</span>`;
}
/* กล่องข้อจำกัดของข้อมูล ย่อเหลือไอคอน ผู้อ่านกดเองเมื่ออยากรู้ ตามคำสั่ง 24 ส.ค. 2569
   ข้อความยังอยู่ในหน้าจริง ไม่ใช่คำบรรยายเมื่อชี้ จึงอ่านได้บนมือถือด้วย */
let limitSeq = 0;
function limitBox(text){

    + `<div class="datalimit" id="${id}" hidden><span>ข้อจำกัดของข้อมูล ${esc(text)}</span></div></div>`;

/* แถบเทียบคะแนนในตาราง ความยาวเต็มรางเท่ากับคะแนนสูงสุดที่มีในตารางรอบนั้น
   ถ้ามีข้อที่เกิน 100 รางจะยาวขึ้นตาม แถบของทุกข้อจึงเทียบกันได้จริง
   ขีดบางบนรางคือตำแหน่ง 100 ซึ่งแปลว่าทำได้ตามเป้าพอดี */
function minibar(r, barMax){
  if(r==null) return "";
  const mx = (barMax && barMax>1)? barMax : 1;
  const pct = Math.min(100, (r/mx)*100);
  const mark = (100/mx);
  const color = r>=1? "var(--green)":"var(--red)";
  return `<span class="minibar"><span style="width:${pct.toFixed(1)}%; background:${color}"></span>`
    + (mx>1? `<i style="left:${mark.toFixed(1)}%"></i>` : "") + `</span>`;
}
function filteredKpis(){
  const i = mainM();
  let list = S.kpis.map((k,idx)=>({k,idx}));
  if(tblF.status!=="all") list = list.filter(o=>{
    const r = o.k.m[i][2];
    return tblF.status==="pass"? r!=null&&r>=1 : r!=null&&r<1;
  });
  if(tblF.group!=="all") list = list.filter(o=>o.k.type===tblF.group);
  if(tblF.q.trim()!==""){
    const q = tblF.q.trim().toLowerCase();
    list = list.filter(o=>(o.k.no+" "+o.k.name).toLowerCase().includes(q));
  }
  const r = o => o.k.m[i][2];
  const loss = o => r(o)==null? -1 : (1-capR(r(o)))*o.k.weight*100;
  if(tblF.sort==="lossDesc") list.sort((a,b)=>loss(b)-loss(a) || a.k.no-b.k.no);
  if(tblF.sort==="scoreDesc") list.sort((a,b)=>(r(b)==null?-9:r(b))-(r(a)==null?-9:r(a)));
  if(tblF.sort==="weightDesc") list.sort((a,b)=>b.k.weight-a.k.weight);
  return list;
}
function renderTable(){
  const i = mainM();
  const cmp = compareMode();
  const sel = selSorted();
  $("tblSub").textContent = cmp

  const list = filteredKpis();
  $("tblCount").textContent = "แสดง "+list.length+" จาก "+S.kpis.length+" ข้อ";
  /* มาตราของแถบเทียบคะแนน คิดจากคะแนนสูงสุดของเดือนที่แสดงอยู่
     ถ้ามีข้อที่เกิน 100 รางจะยืดตาม แถบทุกข้อจึงเทียบกันได้จริง */
  const barMax = Math.max.apply(null, [1].concat(S.kpis.map(kk=>{ const v=kk.m[i][2]; return v==null? 1 : v; })));
  let head, rows="";
  const limNotes = [];
  if(!cmp){

    list.forEach(o=>{

      const lim = KPI_LIMIT[k.no];

      if(lim){ limNotes.push({no:k.no, text:lim}); fnNo = limNotes.length; }

        <td class="num" data-label="ข้อ">${k.no}</td>
        <td class="kname">${esc(k.name)}<div class="cell-sub">หน่วย ${esc(unitDisplay(k))}</div>${lim? `<sup class="fnmark" title="${esc(lim)}">${fnNo}</sup>`:""}</td>
        <td data-label="เป้าหมาย">${fmtTargetDisplay(k)}</td>
        <td class="num" data-label="ผลจริง"><span class="${fail?"val-bad":""}">${fmtActUnit(k,act)}</span></td>
        <td class="num ${isOverScore(ratio,k.no)?"val-over":""}" data-label="คะแนน">${fmtScore(ratio,k.no)}${minibar(ratio, barMax)}</td>
        <td class="num" data-label="น้ำหนัก">${fmtW(k.weight)}</td>
        <td data-label="สถานะ">${statusChip(ratio, k.no)}</td>
      </tr>`;
    });
  } else {
    const mh = sel.map(mi=>`<th class="num ${mi===i?"mon-hl":""}">คะแนน ${esc(S.months[mi])}</th>`).join("");
    head = `<tr><th class="num">ข้อ</th><th>ตัวชี้วัด</th>${mh}<th>การเปลี่ยนแปลง</th><th class="num">น้ำหนัก</th></tr>`;
    list.forEach(o=>{
      const k=o.k;
      const cells = sel.map(mi=>{
        const r = k.m[mi][2];
        return `<td class="num ${mi===i?"mon-hl":""} ${r!=null&&r<1?"val-bad":""} ${isOverScore(r,k.no)?"val-over":""}">${fmtScore(r,k.no)}</td>`;
      }).join("");
      const r1 = k.m[sel[0]][2], r2 = k.m[sel[sel.length-1]][2];
      let dTxt = "";
      if(r1!=null&&r2!=null){
        const d = (r2-r1)*100;
        dTxt = Math.abs(d)<0.5? "เท่าเดิม" : (d>0? `<span class="delta-up">เพิ่มขึ้น ${numf(Math.abs(d),0)}</span>`:`<span class="delta-down">ลดลง ${numf(Math.abs(d),0)}</span>`);
      }
      rows += `<tr class="clickable" data-kpi="${o.idx}" tabindex="0" role="button" aria-label="เปิดรายละเอียดข้อ ${k.no}">
        <td class="num" data-label="ข้อ">${k.no}</td>
        <td class="kname">${esc(k.name)}</td>
        ${cells}<td>${dTxt}</td><td class="num">${fmtW(k.weight)}</td>
      </tr>`;
    });
  }
  /* จำนวนคอลัมน์ต้องนับจากหัวตารางชุดที่กำลังจะวาด ไม่ใช่ค่าคงที่ เพราะโหมดเทียบเดือนมีคอลัมน์ไม่เท่ากัน */
  const nCol = (head.match(/<th/g)||[]).length || 7;
  if(!rows) rows = `<tr><td colspan="${nCol}" style="text-align:center; color:var(--ink2)">ไม่มีข้อที่ตรงกับตัวกรอง</td></tr>`;
  $("kpiTable").innerHTML = `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
  /* ข้อความข้อจำกัดของข้อมูล ยกมารวมไว้ใต้ตารางเป็นเชิงอรรถ แก้ 3 ก.ย. 2569 */
  $("kpiLimits").innerHTML = limNotes.length
    ? `<div class="fn-head">ข้อจำกัดของข้อมูล</div><ol>${limNotes.map(o=>`<li>ข้อ ${o.no} ${esc(o.text)}</li>`).join("")}</ol>`
    : "";
  $("kpiTable").querySelectorAll("tr.clickable").forEach(tr=>{
    const go = ()=>openKpi(parseInt(tr.getAttribute("data-kpi"),10));
    tr.addEventListener("click",go);
    tr.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
  bindTips($("kpiTable"));
}

/* กราฟคะแนนขนาดเล็กในการ์ดคะแนนเดือน ตามคำสั่ง 25 ส.ค. 2569 ข้อ 5
   ย้ายมาจากเส้นซ้อนในกราฟแท่ง เพื่อให้กราฟแท่งเหลือหน่วยเดียว คือผลจริง
   เส้นประคือระดับคะแนน 100 ซึ่งแปลว่าทำได้ตามเป้าพอดี */
function sparkScore(vals, labels, hlSet, w){
  /* Yuth สั่งเมื่อ 28 ส.ค. 2569 ให้พิมพ์ตัวเลขคะแนนลงบนเส้นด้วย
     จึงต้องเผื่อที่ว่างด้านบนให้ตัวเลข และเพิ่มขอบซ้ายขวาไม่ให้ตัวเลขล้นกรอบ */
  const W = Math.max(60, w||220), H = 92;
  const pad = {l:14, r:14, t:30, b:22};
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const nums = vals.filter(v=>v!=null);
  if(!nums.length) return '<div class="spark-na">ไม่มีข้อมูลคะแนนรายเดือน</div>';
  /* มาตราของกราฟเล็ก ต้องคลุมทั้งช่วงคะแนนจริงและระดับ 100 แล้วเผื่อขอบ
     ถ้าเริ่มที่ศูนย์เสมอ เส้นจะแบนจนมองไม่เห็นความต่างระหว่างเดือน */
  let hi = Math.max(100, Math.max.apply(null, nums));
  let lo = Math.min(100, Math.min.apply(null, nums));
  const padv = Math.max(5, (hi-lo)*0.22);
  hi += padv; lo = Math.max(0, lo - padv);
  if(hi-lo < 1) hi = lo + 1;
  const X = i => pad.l + (vals.length<2? iw/2 : (i/(vals.length-1))*iw);
  const Y = v => pad.t + ih - ((v-lo)/(hi-lo||1))*ih;
  let d = "", pen = false, g = "";
  vals.forEach((v,i)=>{
    if(v==null){ pen = false; return; }
    d += (pen? " L ":" M ") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
    pen = true;
  });
  const y100 = Y(100);
  g += `<line x1="${pad.l}" y1="${y100.toFixed(1)}" x2="${(pad.l+iw).toFixed(1)}" y2="${y100.toFixed(1)}" stroke="#a37800" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  g += `<path d="${d.trim()}" fill="none" stroke="#2f5d8a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  /* ป้ายตัวเลขต้องไม่ทับกัน วิธีที่ใช้คือจองพื้นที่แนวนอนทีละป้าย ไม่ใช่เว้นเป็นจังหวะคงที่
     เพราะการเว้นเป็นจังหวะคุมเฉพาะป้ายที่มาจากจังหวะ แต่ป้ายบังคับ คือเดือนที่ผู้ใช้เลือกและเดือนสุดท้าย
     อาจตกลงมาติดกับป้ายอื่นได้ ป้ายที่จองพื้นที่ไม่ได้ให้ข้ามไป ดีกว่าพิมพ์ทับกัน */
  const takenTop = [], takenBot = [];
  const fits = (arr,a,b)=> !arr.some(t=> b > t[0]+0.5 && a < t[1]-0.5);
  const anchOf = i => i===0? "start" : (i===vals.length-1? "end" : "middle");
  const boxOf = (cx, wpx, anch)=> anch==="start"? [cx, cx+wpx] : (anch==="end"? [cx-wpx, cx] : [cx-wpx/2, cx+wpx/2]);
  vals.forEach((v,i)=>{
    if(v==null) return;
    const on = hlSet && hlSet.has(i);
    g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${on?4.2:2.6}" fill="${on?"#1e2822":"#2f5d8a"}"/>`;
  });
  /* ลำดับสิทธิ์ในการจองพื้นที่ เดือนที่ผู้ใช้เลือกก่อน แล้วเดือนสุดท้าย แล้วจึงเดือนที่เหลือจากซ้ายไปขวา */
  const order = [];
  const push = i => { if(i>=0 && vals[i]!=null && order.indexOf(i)<0) order.push(i); };
  /* เดือนที่เลือกไล่จากใหม่ไปเก่า ให้ตรงลำดับกับชื่อเดือนที่ขอบล่าง
     ไม่งั้นเมื่อกล่องแคบจนพิมพ์ได้แถวละใบ ตัวเลขข้างบนกับชื่อเดือนข้างล่างจะเป็นคนละเดือน */
  for(let i=vals.length-1;i>=0;i--){ if(hlSet && hlSet.has(i)) push(i); }
  push(vals.length-1);
  vals.forEach((v,i)=>push(i));
  order.forEach(i=>{
    const v = vals[i], on = hlSet && hlSet.has(i);
    const txt = numf(v,0), anch = anchOf(i);
    const bx = boxOf(X(i), txtW(txt,12.5)+8, anch);
    if(!fits(takenTop, bx[0], bx[1])) return;
    takenTop.push(bx);
    /* ตีเส้นขาวรอบตัวอักษร กันตัวเลขจมกับเส้นกราฟ */
    const ty = Math.max(13, Y(v) - 10);
    g += `<text x="${X(i).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anch}" font-size="12.5" font-weight="${on?800:600}"`
      + ` fill="${on?"#1e2822":"#2f5d8a"}" stroke="#ffffff" stroke-width="3" paint-order="stroke">${txt}</text>`;
  });
  /* ชื่อเดือนที่ผู้ใช้เลือก พิมพ์ที่ขอบล่าง เดือนใหม่กว่ามีสิทธิ์จองก่อน */
  const hls = [];
  vals.forEach((v,i)=>{ if(v!=null && hlSet && hlSet.has(i)) hls.push(i); });
  hls.reverse().forEach(i=>{
    const lb = String(labels[i]==null?"":labels[i]), anch = anchOf(i);
    const bx = boxOf(X(i), txtW(lb,12)+8, anch);
    if(!fits(takenBot, bx[0], bx[1])) return;
    takenBot.push(bx);
    g += `<text x="${X(i).toFixed(1)}" y="${(H-5).toFixed(1)}" text-anchor="${anch}" font-size="12.5" font-weight="700" fill="#1e2822">${esc(lb)}</text>`;
  });
  /* ไม่พิมพ์เลข 100 ซ้อนบนเส้นประ เพราะกราฟเล็กมากและจะทับจุดของเดือนท้าย

    }
    if(notes.length) deptDiffNote = "ชีท KPI กับชีท KPI 2569 แผนก "+notes.join(" และ ")+" กราฟกับการ์ดด้านบนใช้ตัวเลขจากชีท KPI ส่วนตารางนี้ใช้ตัวเลขจากชีท KPI 2569 แผนก";
    /* ข้อ 2 และข้อ 6 ใช้จำนวนคนออกและคนเข้าจากไฟล์ทะเบียนสรรหาและพ้นสภาพ ตามคำสั่ง Yuth 2 ก.ย. 2569
       เพื่อให้ตรงกับแดชบอร์ดสรรหาและพ้นสภาพ จุดที่ต่างจากชีท PMS_HR ต้องบอกไว้ ไม่แก้เงียบ */
    if(SOURCE_NOTE[k.no]) deptDiffNote = (deptDiffNote? deptDiffNote+"  " : "") + SOURCE_NOTE[k.no];
  }
  const thead = `<thead><tr><th>รายการ</th><th class="num">เป้าหมาย</th><th>หน่วย</th>${head}</tr></thead>`;
  const subsBody = subRows? `<tbody class="subs" id="subDetail" hidden>${subRows}</tbody>` : "";
  $("subTable").innerHTML = `<table>${thead}<tbody>${mainRows}</tbody>${subsBody}</table>`;
  /* ปุ่มกางแถวย่อย วางไว้ใต้ตาราง ผู้อ่านจึงเห็นแถวสำคัญก่อน แล้วค่อยกดดูตัวประกอบ */
  if(subCount){
    $("subNote").innerHTML = `<div class="subs-bar">`
      + `<button type="button" class="help-btn" id="subMore" data-n="${subCount}" aria-expanded="false" aria-controls="subDetail">`
      + `ดูรายละเอียดย่อย ${subCount} รายการ</button>`
      + `<span class="subs-note">สองแถวบนคือตัวเลขหลักของตัวชี้วัดข้อนี้ รายละเอียดย่อยเป็นตัวประกอบการคำนวณ</span></div>`;
  } else {
    $("subNote").innerHTML = "";
  }
  /* หมายเหตุนี้เป็นข้อเท็จจริงเรื่องความเสี่ยงของข้อมูล ไม่ใช่คำอธิบายวิธีใช้ จึงต้องคงไว้ */
  $("subLimit").innerHTML = limitBox(deptDiffNote);
}
function fmtGeneric(v, unit){
  if(v==null||v==="") return "";
  if(v===true||v==="True") return "มี";
  if(v===false||v==="False") return "";
  if(typeof v!=="number") return esc(v);
  const u = String(unit||"");
  if(u.indexOf("%")>=0) return numf(Math.abs(v)<=1.5? v*100 : v, 1)+"%";
  if(Math.abs(v)>=1000) return nf0.format(v);
  if(Number.isInteger(v)) return nf0.format(v);
  if(Math.abs(v)<1) return numf(v,2);
  return numf(v,1);
}

}

$("trendModes").querySelectorAll(".fchip").forEach(ch=>{

    trendMode = ch.getAttribute("data-tm");
    /* ต้องวาดใหม่ทุกจุดที่แสดงคะแนนที่เก็บได้ ไม่งั้นตัวเลขบนจอเดียวกันจะขัดกัน
       ครอบคลุมการ์ดคะแนนรวม กราฟคะแนนรวม การ์ดคะแนนรายตัวชี้วัด และหน้าเจาะรายตัวชี้วัด */

function renderAll(){
  renderRange(); kpiOptions(); renderMeta();
  renderTiles(); renderTrend(); renderWbars(); renderTable();
  renderKpiPage();
}
let rsTimer = null, lastW = window.innerWidth;
window.addEventListener("resize",()=>{
  clearTimeout(rsTimer);
  rsTimer = setTimeout(()=>{
    if(Math.abs(window.innerWidth-lastW)<24) return;
    lastW = window.innerWidth;
    renderTrend(); renderKpiPage();
  }, 220);
});
function hideSplash(){ const sp=$("splash"); if(!sp||sp.classList.contains("hide")) return; sp.classList.add("hide"); setTimeout(()=>{sp.style.display="none";},400); }
try{
  fixScores();
  renderAll();
}finally{
  /* ฟอนต์โหลดเสร็จทีหลัง ความกว้างข้อความจึงเปลี่ยน ต้องล้างทะเบียนแล้ววาดกราฟใหม่
     ไม่งั้นตำแหน่งป้ายจะคิดจากฟอนต์สำรอง ไม่ใช่ฟอนต์ที่ผู้ใช้เห็นจริง */
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{
      _mwCache = {};
      try{ renderTrend(); renderWbars(); renderKpiPage(); }catch(e){}
      setTimeout(hideSplash,150);
    });
  }
  setTimeout(hideSplash, 2200);
}
