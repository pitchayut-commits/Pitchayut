/* ============================================================
   Dashboard HR TPC ระบบภาพผิวกระจกโปร่งแสง โหมด CI เขียว JS Group
   โทเคนสียึด dashboard-format references/design-tokens.md ข้อ 1
   ชั้นกระจกผ่านการทดสอบค่าความคมชัดจากภาพเรนเดอร์จริง
   ============================================================ */
:root{
  /* โทเคนสี CI ห้ามแก้ค่า */
  --green:#3fae49; --green-d:#2e8536; --green-dd:#17491d; --green-deep:#1c5a23;
  --green-bg:#eaf6eb; --bg:#f4f8f4; --card:#ffffff; --ink:#1e2822; --ink2:#566058;
  --line:#dce7dd; --blue:#2f5d8a; --blue-bg:#e6eef7; --amber:#d9a300; --amber-t:#8a6a00;
  --amber-bg:#fff3d1; --red:#b8412e; --red-bg:#fbe8e4; --gray:#c9d3ca;
  /* ชั้นกระจก */
  --glass:rgba(255,255,255,0.76);
  --glass-strong:rgba(255,255,255,0.9);
  --glass-edge:rgba(255,255,255,0.78);
  --glass-edge-in:rgba(255,255,255,0.95);
  --glass-blur:blur(24px) saturate(150%) brightness(1.05);
  --glass-blur-lite:blur(15px) saturate(140%) brightness(1.04);
  --shadow-s:0 2px 8px rgba(23,73,29,0.05);
  --shadow-m:0 10px 30px rgba(23,73,29,0.09), 0 2px 6px rgba(23,73,29,0.05);
  --shadow-l:0 18px 48px rgba(23,73,29,0.13), 0 3px 10px rgba(23,73,29,0.06);

  --r-lg:22px; --r-md:16px; --r-sm:10px;
}

html,body{height:100%;}
body{
  font-family:'Prompt','Leelawadee UI','Segoe UI',Tahoma,sans-serif;

  word-break:normal; overflow-wrap:break-word;

/* ---------- หน้ารอเปิด ---------- */
#splash{position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
  background:linear-gradient(168deg,#f9fdfa,#eaf5ee); transition:opacity 0.35s ease;}
#splash.hide{opacity:0; pointer-events:none;}
#splash .logo-img{height:64px; animation:pulse 1.4s ease-in-out infinite;}
#splash .t1{font-size:18px; font-weight:700; color:var(--green-dd);}
#splash .t2{font-size:13px; color:var(--ink2);}
#splash .bar{width:180px; height:4px; border-radius:99px; background:rgba(23,73,29,0.10); overflow:hidden;}
#splash .bar span{display:block; width:40%; height:100%; border-radius:99px;
  background:linear-gradient(90deg,var(--green),var(--green-dd)); animation:slide 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.55;}}
@keyframes slide{0%{transform:translateX(-120%);} 100%{transform:translateX(420%);}}

/* ---------- แถบความคืบหน้าตอนสลับข้อมูล ---------- */
#loadbar{position:fixed; top:0; left:0; right:0; height:3px; z-index:150; pointer-events:none;
  background:linear-gradient(90deg,var(--green),var(--green-dd)); transform:scaleX(0);
  transform-origin:left; opacity:0;}
#loadbar.run{opacity:1; animation:loadgrow 0.5s ease-out forwards;}
@keyframes loadgrow{0%{transform:scaleX(0);} 80%{transform:scaleX(0.85);} 100%{transform:scaleX(1);}}
main.dim .grid{opacity:0.45; transition:opacity 0.15s ease;}
main .grid{transition:opacity 0.2s ease;}

/* ---------- ชั้นแสงพื้นหลัง ของประดับล้วน ค่าความเข้มคุมด้วยผลทดสอบความคมชัด ---------- */
.bg-field{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.bg-field span{position:absolute; display:block; border-radius:50%; filter:blur(76px); opacity:0.42;}
.bg-field .o1{width:44vw; height:44vw; left:-10vw; top:-14vw; background:radial-gradient(circle at 32% 32%,rgba(63,174,73,0.42),rgba(63,174,73,0) 70%);}
.bg-field .o2{width:38vw; height:38vw; right:-8vw; top:6vh; background:radial-gradient(circle at 60% 40%,rgba(47,93,138,0.26),rgba(47,93,138,0) 70%);}
.bg-field .o3{width:40vw; height:40vw; left:38vw; bottom:-16vw; background:radial-gradient(circle at 40% 60%,rgba(217,163,0,0.26),rgba(217,163,0,0) 70%);}
.app{position:relative; z-index:1; display:flex; flex-direction:column; min-height:100vh;}

/* ---------- ทางลัดแป้นพิมพ์ ---------- */
.skip{position:absolute; left:-9999px; top:8px; z-index:99;
  background:var(--green-dd); color:#ffffff; font-size:14px; font-weight:600;
  border-radius:var(--r-sm); padding:10px 18px; text-decoration:none;}
.skip:focus{left:12px;}

/* ---------- แถบหัวด้านบน แทนแถบเมนูด้านซ้าย แก้ 3 ก.ย. 2569 ตามคำสั่ง Yuth ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:10px 32px;
  background:linear-gradient(180deg,rgba(255,255,255,0.94),rgba(255,255,255,0.76));
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-edge);
  box-shadow:0 6px 26px rgba(23,73,29,0.06);
}
.brand{display:flex; align-items:center; gap:12px; position:relative;}
.brand .logo-img{height:34px;}
.brand .b1{font-size:14px; font-weight:700; color:var(--green-dd); line-height:1.35;}
.brand .b2{font-size:12px; color:var(--ink2); line-height:1.6;}
.nav{display:flex; flex-direction:row; gap:4px; padding:4px; min-width:0;
  background:rgba(244,248,244,0.92); border:1px solid var(--glass-edge); border-radius:99px;}
.nav button{
  position:relative; display:block; cursor:pointer; white-space:nowrap;
  font-family:inherit; font-size:14px; font-weight:500; color:var(--ink); line-height:1.5;
  background:transparent; border:1px solid transparent; border-radius:99px;
  padding:9px 18px; transition:box-shadow 0.18s ease, transform 0.12s ease;
}
.nav button:hover{background:rgba(255,255,255,0.9); border-color:var(--glass-edge);}
.nav button:active{transform:scale(0.98);}
.nav button.active{
  color:var(--green-dd); font-weight:600;
  background:#ffffff; border-color:rgba(46,133,54,0.35);
  box-shadow:var(--shadow-s), inset 0 1px 0 var(--glass-edge-in);
}


/* ---------- พื้นที่เนื้อหา ---------- */
main{flex:1; padding:14px 32px 48px 32px; min-width:0;}
.page{display:none;}
/* ง รอบ 4 ต.ค. 2569 หน้าที่แสดงตอนโหลดต้องเห็นทันที ไม่จางเข้า (กติกาข้อ 124 ข้อหนึ่ง)
   การจางเข้าออกใช้เฉพาะตอนสลับแท็บ ผ่านคลาส pg-in และ pg-out ท้ายบล็อกสไตล์ */
.page.show{display:block;}
.page-head{display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-bottom:12px;}
.page-head h1{font-size:28px; font-weight:800; color:var(--ink); line-height:1.3; letter-spacing:-0.2px;}
.page-head .spacer{flex:1;}
.controls{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink2); font-weight:500; flex-wrap:wrap;}
select, input[type="search"], input[type="text"]{
  font-family:inherit; font-size:14px; font-weight:500; color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,0.92),rgba(255,255,255,0.74));
  -webkit-backdrop-filter:var(--glass-blur-lite); backdrop-filter:var(--glass-blur-lite);
  border:1px solid var(--glass-edge); border-radius:var(--r-sm);
  padding:9px 12px; cursor:pointer; max-width:360px; box-shadow:var(--shadow-s);
}
input[type="search"], input[type="text"]{cursor:text;}
select:hover, input[type="search"]:hover{border-color:rgba(46,133,54,0.5);}
.src-line{font-size:12.5px; color:var(--ink2); margin-bottom:20px; line-height:1.75;}

/* ---------- จุดโฟกัสแป้นพิมพ์ ---------- */
a:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible,
input:focus-visible, [tabindex]:focus-visible{
  outline:none; box-shadow:var(--ring); border-radius:var(--r-sm);
}
select:focus{outline:none;}

/* ---------- ตัวเลือกเดือนแบบชิป ---------- */
.mbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.mchips{display:flex; gap:8px; flex-wrap:wrap;}
.mchip{
  font-family:inherit; font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;
  background:rgba(255,255,255,0.72); border:1px solid var(--glass-edge); border-radius:99px;
  padding:7px 15px; box-shadow:var(--shadow-s);
  transition:transform 0.12s ease, box-shadow 0.16s ease;
}
.mchip:hover{border-color:rgba(46,133,54,0.55); background:rgba(255,255,255,0.92);}
.mchip:active{transform:scale(0.95);}
.mchip[aria-pressed="true"]{
  color:#ffffff; font-weight:600; border-color:rgba(255,255,255,0.4);
  background:linear-gradient(135deg,var(--green-d),var(--green-deep));
  box-shadow:var(--shadow-m), inset 0 1px 0 rgba(255,255,255,0.25);
}
.mhint{font-size:12px; color:var(--ink2);}

/* ผืนวาดพลุแสดงความยินดี ลอยทับหน้าจอ แต่กดทะลุได้ ไม่ขวางการใช้งาน */
#fx{position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:70; display:none;}
@media (prefers-reduced-motion: reduce){ #fx{display:none !important;} }

/* ---------- กริดและการ์ดกระจก ---------- */

:root{--cgap:24px;}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:var(--cgap); align-items:start;}
/* แถวการ์ดตัวเลขสรุป ให้สูงเท่ากันทุกใบแม้ข้อความยาวไม่เท่ากัน */
.grid.tilerow{align-items:stretch;}
/* กล่องการ์ด แก้ใหม่ 7 ก.ย. 2569 ตามคำสั่ง Yuth ที่ไม่เอากล่องแบบเดิม
   ผิวขาวเรียบ ขอบเส้นบางเส้นเดียว มุมเล็กลง เงาบางมาก ไม่มีชั้นกระจกและไม่มีแถบสีคาดหัวการ์ด
   ความเป็นระเบียบมาจากช่องไฟและลำดับตัวอักษร ไม่ได้มาจากเอฟเฟกต์ */
.card{
  position:relative; isolation:isolate; min-width:0;
  background:var(--card);
  border:1px solid var(--line); border-radius:12px;
  padding:22px 24px;
  box-shadow:0 1px 2px rgba(23,73,29,0.05);
  transition:box-shadow 0.18s ease, transform 0.18s ease;
}
.card:hover{border-color:rgba(46,133,54,0.42); box-shadow:0 2px 10px rgba(23,73,29,0.07);}
.card h3{font-size:18px; font-weight:700; margin-bottom:4px; letter-spacing:-0.1px;}
/* ข้อ 5 ของคำสั่ง Yuth 10 ก.ย. 2569 รอบสี่ หัวข้อทุกหัวต้องมีภาพกำกับที่เห็นชัดและสื่อความหมาย
   จึงวางไอคอนไว้ในชิปสี่เหลี่ยมมุมโค้งพื้นจาง สีตามโทนของหน้านั้น ไม่ใช่เส้นจางลอยอยู่หน้าข้อความ */
.h3ic{display:inline-flex; align-items:center; justify-content:center;
  width:27px; height:27px; border-radius:9px; margin-right:9px; vertical-align:-7px;
  background:rgba(63,174,73,0.13); color:#2e8536; flex:none;}
#page-kpi .h3ic{background:var(--tone-wash); color:var(--tone-ink);}
.card .sub{font-size:12.5px; color:var(--ink2); margin-bottom:16px; line-height:1.7;}
.card .sub:empty{display:none;}
.card .foot{font-size:12px; color:var(--ink2); margin-top:14px; line-height:1.7;}
.span3{grid-column:span 3;} .span4{grid-column:span 4;} .span6{grid-column:span 6;}
.span8{grid-column:span 8;} .span12{grid-column:span 12;}
@media (max-width:1100px){ .span3,.span4{grid-column:span 6;} .span6,.span8{grid-column:span 12;} }

/* ---------- การ์ดตัวเลขสำคัญ ---------- */
.tile .lbl{font-size:14px; font-weight:500; color:var(--ink2); line-height:1.55;}
.tile .num{font-size:40px; font-weight:800; line-height:1.2; margin:8px 0 4px 0;
  color:var(--green-dd); font-variant-numeric:tabular-nums; letter-spacing:-1px;}
.tile .cmp{font-size:13px; font-weight:500; color:var(--ink2); line-height:1.7;}
.cmp .up{color:var(--green-dd); font-weight:600;}
.cmp .down{color:var(--red); font-weight:600;}
/* การ์ดคะแนนรวม ไล่เฉดสามระดับ มีแสงตกที่ขอบบนและเงาจมที่ขอบล่าง จึงดูนูนขึ้นมาจากหน้า
   ตามคำสั่ง Yuth 7 ก.ย. 2569 ค่าสีทุกตัวยังอยู่ในโทนเขียว CI เดิม */
.tile-hero{
  border:1px solid rgba(23,73,29,0.85); color:#ffffff;
  background:linear-gradient(158deg,#2f8438 0%,var(--green-deep) 46%,var(--green-dd) 100%);
  box-shadow:0 20px 40px rgba(23,73,29,0.34), 0 4px 10px rgba(23,73,29,0.22),
    inset 0 1px 0 rgba(255,255,255,0.34), inset 0 -22px 40px rgba(0,0,0,0.18);
}
.tile-hero:hover{
  border-color:rgba(23,73,29,0.95);
  box-shadow:0 24px 48px rgba(23,73,29,0.38), 0 5px 12px rgba(23,73,29,0.24),
    inset 0 1px 0 rgba(255,255,255,0.38), inset 0 -22px 40px rgba(0,0,0,0.18);
}
/* รอบแก้ 8 ต.ค. 2569 ข้อ 8 และข้อ 11 ความทึบของแสงตกมุมบนซ้ายลดจาก 0.22 เป็น 0.08
   ที่ 0.22 พื้นใต้ตัวเลขคะแนนจุดที่สว่างที่สุด วัดจากพิกเซลของภาพเรนเดอร์ ได้ความต่างสีกับตัวอักษรขาวต่ำสุด 4.36 ต่อ 1 และใต้ป้ายชื่อการ์ดต่ำสุด 3.90 ต่อ 1 ต่ำกว่าเกณฑ์ 4.5
   ที่ 0.08 ได้ต่ำสุด 4.89 และ 4.64 ต่อ 1 วัดทั้งกรอบข้อความ ที่ความกว้าง 1280 1920 และ 768
   ตัวเลขชุดนี้เป็นค่าที่ผู้ตรวจอิสระวัดซ้ำเมื่อ 8 ต.ค. 2569 (หลักฐานผู้ตรวจ c7_hero_contrast3) แทนค่าเดิมในคอมเมนต์ที่ไม่ตรงหลักฐาน แสงที่ขอบบนของการ์ดยังมาจากเส้นเงาด้านในของกฎ .tile-hero ข้างบน */
.tile-hero::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(130% 82% at 16% -12%, rgba(255,255,255,0.08), rgba(255,255,255,0) 62%);
}
.tile-hero .lbl,.tile-hero .cmp{color:#ffffff;}
.tile-hero .num{font-size:48px; color:#ffffff;}
.tile-hero .cmp .up,.tile-hero .cmp .down{color:#ffffff; text-decoration:underline; text-underline-offset:3px;}

/* ป้ายเกรดและป้ายสถานะ สีคู่กับคำเสมอ */
.chip{display:inline-block; border-radius:99px; font-size:12px; font-weight:600;
  padding:3px 12px; white-space:nowrap; border:1px solid transparent;}
.chip.pass{background:rgba(234,246,235,0.95); color:var(--green-dd); border-color:rgba(46,133,54,0.34);}
.chip.fail{background:rgba(251,232,228,0.95); color:var(--red); border-color:rgba(184,65,46,0.34);}
.chip.na{background:rgba(255,255,255,0.72); color:var(--ink2); border-color:var(--line);}
/* เกินเป้าหมาย ใช้พื้นเขียวเข้มทึบตัวอักษรขาว ส่วนถึงเป้าหมายใช้พื้นเขียวอ่อน สองสถานะจึงแยกกันได้ในพริบตา */
.chip.over{background:var(--green-dd); color:#ffffff; border-color:var(--green-dd);}

.chip-grade{display:inline-block; border-radius:99px; font-size:13px; font-weight:600;
  padding:4px 14px; margin-top:10px; border:1px solid transparent;}
.chip-grade.gA{background:#eaf6eb; color:var(--green-dd); border-color:rgba(46,133,54,0.5);}
.chip-grade.gB{background:var(--amber-bg); color:var(--ink); border-color:var(--amber);}
.chip-grade.gC{background:var(--red-bg); color:var(--red); border-color:rgba(184,65,46,0.5);}

/* กล่องเน้นข้อที่ยังไม่ถึงเป้า */
.hl-amber{display:inline-block; background:var(--amber-bg); border:1px solid var(--amber);
  color:var(--ink); border-radius:var(--r-sm); padding:4px 10px; font-size:12.5px; font-weight:500;
  margin-top:8px; line-height:1.6;}

/* ---------- แถบตัวกรองของตาราง ---------- */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.toolbar .fgroup{display:flex; align-items:center; gap:8px;}
.fchip{
  font-family:inherit; font-size:12.5px; font-weight:500; color:var(--ink); cursor:pointer;
  background:rgba(255,255,255,0.72); border:1px solid var(--glass-edge); border-radius:99px;
  padding:6px 13px; transition:transform 0.12s ease, box-shadow 0.15s ease;
}
.fchip:hover{border-color:rgba(46,133,54,0.5);}
.fchip:active{transform:scale(0.96);}
.fchip[aria-pressed="true"]{color:var(--green-dd); font-weight:600; background:rgba(234,246,235,0.95);
  border-color:rgba(46,133,54,0.55);}
.toolbar select{padding:7px 10px; font-size:12.5px; max-width:230px;}
.toolbar input[type="search"]{padding:7px 12px; font-size:12.5px; width:180px;}
.count-line{font-size:12px; color:var(--ink2); margin-bottom:8px;}
/* รอบแก้ 8 ต.ค. 2569 r2 ตัวเลือกข้อที่จะแสดงในตารางตัวชี้วัด เลือกได้ทีละข้อหรือหลายข้อ
   ปุ่มหน้าตาเดียวกับรายการเลือกในแถบเดียวกัน (กติกาข้อ 18) รายการเป็นกระจกเบลอแบบเดียวกับกล่องเมื่อชี้ (กติกาข้อ 92)
   ปุ่มกว้างตามข้อความที่เลือกอยู่ ไม่ตัดคำ (กติกาข้อ 102) */
.pick{position:relative; display:inline-flex; align-self:stretch;}
.pick-btn{display:inline-flex; align-items:center; gap:8px; font-family:inherit; font-size:12.5px; font-weight:500;
  color:var(--ink); white-space:nowrap; padding:7px 10px; cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,0.92),rgba(255,255,255,0.74));
  -webkit-backdrop-filter:var(--glass-blur-lite); backdrop-filter:var(--glass-blur-lite);
  border:1px solid var(--glass-edge); border-radius:var(--r-sm); box-shadow:var(--shadow-s);}
.pick-btn:hover{border-color:rgba(46,133,54,0.5);}
.pick-btn.on{border-color:var(--green-d); color:var(--green-dd); font-weight:700;}
.pick-chev{flex:0 0 12px; width:12px; height:12px; max-width:12px; transition:transform .16s ease;}
.pick-btn[aria-expanded="true"] .pick-chev{transform:rotate(180deg);}
.pick-panel{position:absolute; left:0; top:calc(100% + 6px); z-index:40; width:max-content; min-width:300px;
  max-width:min(460px, calc(100vw - 48px)); padding:8px; border-radius:12px;
  background:rgba(246,248,247,0.94); -webkit-backdrop-filter:blur(24px) saturate(140%); backdrop-filter:blur(24px) saturate(140%);
  border:1px solid rgba(255,255,255,0.85);
  box-shadow:0 18px 42px rgba(23,40,28,0.22), inset 0 1px 0 rgba(255,255,255,0.9);
  animation:pickIn .16s ease;}
.pick-panel[hidden]{display:none;}
/* เคลื่อนเฉพาะตำแหน่ง ไม่แตะความทึบ รายการจึงมองเห็นเสมอแม้ภาพเคลื่อนไหวค้าง */
@keyframes pickIn{from{transform:translateY(-5px);} to{transform:none;}}
.pick-row{display:flex; align-items:flex-start; gap:9px; padding:6px 8px; border-radius:8px; cursor:pointer;
  font-size:12.5px; line-height:1.55; color:var(--ink);}
.pick-row:hover{background:rgba(63,174,73,0.10);}
.pick-row input{flex:0 0 auto; width:15px; height:15px; margin:2px 0 0 0; accent-color:var(--green-d); cursor:pointer;}
.pick-row .pick-no{flex:0 0 auto; min-width:38px; font-weight:700; color:var(--green-dd);}
.pick-row .pick-nm{flex:1 1 auto; min-width:0;}
.pick-row.all{font-weight:700; border-bottom:1px solid var(--line); border-radius:8px 8px 0 0; padding-bottom:8px; margin-bottom:4px;}
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
  .pick-btn,.pick-panel{background:rgba(255,255,255,0.97);}
}
@media (max-width:760px){
  .pick{flex:1 1 100%;} .pick-btn{width:100%; justify-content:space-between;} .pick-panel{width:100%; min-width:0;}
}

/* ---------- หน้าชั่วโมงโอที เพิ่ม 8 ต.ค. 2569 r3 ตามคำสั่ง Yuth นำแผ่น สรุป OT ก.ย.69 มาแสดงเป็นภาพ ----------
   ข้อมูลมาจาก EMBED.ot ซึ่ง rebuild_kpi.py อ่านจากแผ่นที่ชื่อขึ้นต้นว่า สรุป OT ในไฟล์ TPC PMS_HR.xlsx
   สีเขียวคือไม่เกิน Budget สีแดงอิฐคือเกิน Budget ความหมายเดียวกับหน้าอื่น ทุกจุดมีคำกำกับคู่กับสี
   แท่งและแถบวาดด้วย HTML จึงยืดตามความกว้างของกล่องเอง ไม่ต้องวาดใหม่เมื่อจอเปลี่ยนขนาด */
.ot-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
.ot-head h1{font-size:28px; font-weight:800; color:var(--ink); line-height:1.3; letter-spacing:-0.2px;}
.ot-head .title-ic{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:12px;
  background:rgba(63,174,73,0.13); color:#2e8536; flex:none;}
.ot-head .spacer{flex:1;}
.ot-seg{display:inline-flex; gap:8px; flex-wrap:wrap; align-items:center;}
.ot-seg .ot-seg-lbl{font-size:13px; font-weight:500; color:var(--ink2);}
.ot-limit{font-size:12.5px; color:var(--ink2); line-height:1.75; margin:0 0 14px 0;}
.ot-tile{display:flex; flex-direction:column;}
.ot-tile .lbl{display:flex; align-items:center; gap:8px;}
.ot-tile .ot-num{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin:8px 0 2px 0;}
.ot-tile .ot-num .num{margin:0; font-size:38px;}
.ot-tile .ot-unit{font-size:14px; font-weight:500; color:var(--ink2); white-space:nowrap;}
.ot-tile .ot-of{font-size:13px; font-weight:500; color:var(--ink2); line-height:1.7; margin-bottom:10px;}
.ot-tile .ot-line{font-size:13px; font-weight:500; color:var(--ink); line-height:1.75;}
.ot-tile .ot-line b{font-weight:700;}
.ot-tile .ot-line .over{color:var(--red); font-weight:700;}
.ot-tile .ot-line .ok{color:var(--green-dd); font-weight:700;}
.ot-tile .ot-bar{margin:2px 0 10px 0;}
.ot-tile.sel{border-color:var(--green-d); box-shadow:0 0 0 2px rgba(46,133,54,0.18), 0 2px 10px rgba(23,73,29,0.07);}
.ot-tile .ot-selword{align-self:flex-start; margin-top:auto; padding-top:10px; font-size:12px; font-weight:600; color:var(--green-dd);}
/* รอบ 12 พ.ย. 2569 ข้อ 10.4 หลังตัดบรรทัดตามข้อ 9 10 11 การ์ดในแถวเดียวกันยังสูงเท่ากัน บรรทัดสุดท้ายดันลงชิดขอบล่าง ไม่มีช่องว่างเป็นก้อนท้ายการ์ด (กติกาข้อ 2) */
.ot-tile > .ot-line:last-child{margin-top:auto;}
/* การ์ดคำตอบของหน้า ไล่เฉดและนูนแบบเดียวกับการ์ดคะแนนรวม (กติกาข้อ 4) */
.ot-hero{border:1px solid rgba(23,73,29,0.85); color:#ffffff;
  background:linear-gradient(158deg,#2f8438 0%,var(--green-deep) 46%,var(--green-dd) 100%);
  box-shadow:0 20px 40px rgba(23,73,29,0.34), 0 4px 10px rgba(23,73,29,0.22),
    inset 0 1px 0 rgba(255,255,255,0.34), inset 0 -22px 40px rgba(0,0,0,0.18);}
.ot-hero:hover{border-color:rgba(23,73,29,0.95);}
.ot-hero .lbl,.ot-hero .ot-unit,.ot-hero .ot-of,.ot-hero .ot-line{color:#ffffff;}
.ot-hero .ot-num .num{color:#ffffff; font-size:52px;}
.ot-hero .lbl-ic{color:#ffffff;}
/* หน้าปัดนาฬิกาบนการ์ดเขียวเป็นสีขาว เข็มจึงต้องเป็นสีเขียวเข้ม มิฉะนั้นเห็นเป็นจุดขาว */
.ot-hero .lbl-ic svg path{stroke:#1c5a23;}
.ot-hero .hl{font-weight:700; text-decoration:underline; text-underline-offset:3px;}
#page-ot [hidden]{display:none !important;}
/* แถบใช้ไปเทียบ Budget ขีดตั้งคือระดับ Budget ส่วนที่เลยขีดคือชั่วโมงที่เกิน */
.ot-bar{position:relative; height:14px; border-radius:7px; background:rgba(23,73,29,0.10); overflow:hidden;}
.ot-bar .fill{position:absolute; left:0; top:0; bottom:0; border-radius:7px 0 0 7px; background:linear-gradient(180deg,#4cbb57,var(--green));}
.ot-bar .fill.over{background:linear-gradient(180deg,#cf5a45,var(--red));}
.ot-bar .tick{position:absolute; top:0; bottom:0; width:2px; background:rgba(30,40,34,0.62);}
.ot-hero .ot-bar{background:rgba(255,255,255,0.24);}
.ot-hero .ot-bar .fill{background:linear-gradient(180deg,#ffffff,#e4f3e6);}
.ot-hero .ot-bar .tick{background:rgba(255,255,255,0.95);}
/* กราฟแท่งรายเดือน */
.ot-cols{position:relative; display:grid; gap:10px; --otg:10px; --otpl:6px; --otpr:96px; align-items:end; height:232px; padding:26px 96px 0 6px; margin-top:6px;}
.ot-col{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0;}
/* รอบ 8 ต.ค. 2569 r5 ป้ายค่าอยู่ชั้นบนของเส้น Budget และมีพื้นรองของตัวเอง เส้นจึงไม่พาดทับตัวเลขของเดือนที่อยู่ใกล้ระดับ Budget (ผลตรวจอิสระ r3) */
.ot-col .v{flex:0 0 auto; font-size:12px; font-weight:600; color:rgba(30,40,34,0.78); font-variant-numeric:tabular-nums; white-space:nowrap; margin-bottom:14px;
  position:relative; z-index:3; padding:0 4px; border-radius:7px; background:rgba(255,255,255,0.88);}
/* แท่งห้ามหดตามป้ายค่า ความสูงต้องเท่าสัดส่วนของค่าจริงเสมอ ป้ายล้นขึ้นไปในขอบบนของกรอบได้ */
.ot-col .b{flex:0 0 auto; width:max(70%, min(100%, 44px)); max-width:110px; border-radius:4px 4px 0 0; background:#cfe8d2; border:1px solid rgba(46,133,54,0.22); border-bottom:none; min-height:2px;}
.ot-col.cur .v{font-size:14.5px; font-weight:800; color:var(--ink);}
.ot-col.cur .b{background:linear-gradient(180deg,#4cbb57,#2e8536); border-color:#17491d;}
.ot-col.cur.over .b{background:linear-gradient(180deg,#cf5a45,#b8412e); border-color:#7d3427;}
/* รอบ 12 พ.ย. 2569 ข้อ 13 คำสั่ง Yuth "รูป 4 เดือนไหนเกิน ก็ให้เป็นสีโทนแดง" เดือนก่อนหน้าที่เกิน Budget ของกลุ่มเป็นแท่งแดงอ่อน #e2a99e (TH.refC คู่กับเขียวอ่อนเดิม)
   เดือนล่าสุดที่เกินคงแดงเข้มตามกฎข้างบน ป้ายตัวเลขของเดือนที่เกินเป็นแดงเข้ม #8f3d2c (TH.refCInk) ได้ราว 7.3 ต่อ 1 บนพื้นรองขาว ตารางยังบอกคำว่า เกิน ต่ำกว่า เหมือนเดิม */
.ot-col.over:not(.cur) .b{background:#e2a99e; border-color:rgba(143,61,44,0.40);}
.ot-col.over .v{color:#8f3d2c;}
.ot-col.over:not(.cur) .v{font-weight:700;}
.ot-xs{display:grid; gap:10px; padding:6px 96px 0 6px; border-top:1px solid rgba(23,73,29,0.18);}
.ot-xs span{font-size:12px; color:var(--ink2); text-align:center; white-space:nowrap;}
.ot-xs span.cur{font-size:14px; font-weight:800; color:var(--ink);}
/* รอบ 11 พ.ย. 2569 เส้นแนวโน้มของกราฟแท่งโอที ชั้นนี้วางจากขอบในของกรอบกราฟ ขอบบนลง 26 จุดภาพเท่าระยะขอบบน ความสูงจึงเป็นฐานเดียวกับแท่ง
   (จุดอยู่ที่ร้อยละ v/top ของความสูงแท่ง) ส่วนแกนนอนคิดจากกึ่งกลางคอลัมน์แรกถึงกึ่งกลางคอลัมน์สุดท้าย ด้วยตัวแปร --otpl --otpr --otg ซึ่งต้องเท่ากับ padding ซ้าย padding ขวา และ gap ของ .ot-cols ทุกช่วงความกว้าง (ไม่ใช้พื้นที่กริดเป็นกรอบอ้างอิง เพราะงานพิมพ์ของ Chrome วางชั้นนั้นผิดหน้า)
   เส้นเป็นของประกอบ ไม่รับเมาส์ ไม่มีกล่องเมื่อชี้ สีมาจากตัวแปร TH ในสคริปต์ */
.ot-trend{position:absolute; top:26px; bottom:0; z-index:2; pointer-events:none;}
.ot-trend svg.ln{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible;}
.ot-trend svg.ln path{fill:none; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke;}
/* รอบ 12 พ.ย. 2569 ข้อ 12 คำสั่ง Yuth "เพิ่มความชัด ของเส้นค่าเฉลี่ยหน่อย  แล้วไฮไลท์ให้เห็นเทรน" จุดรัศมี 5.5 ในกรอบ 18 จุดภาพ จุดเดือนล่าสุดรัศมี 7.5 ในกรอบ 22 จุดภาพ */
.ot-trend svg.dot{position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; overflow:visible;}
.ot-trend svg.dot.cur{width:22px; height:22px; margin:-11px 0 0 -11px;}
/* รอบ 8 ต.ค. 2569 r5 เส้นเกณฑ์เป็นฉาก ความทึบไม่เกิน 0.25 ตามกติกาข้อ 29 ป้ายปลายเส้นยังทึบเต็ม (ผลตรวจอิสระ r3) */
/* รอบ 12 พ.ย. 2569 ข้อ 12 คำสั่ง Yuth "เพิ่มความชัด ของเส้นค่าเฉลี่ยหน่อย" เส้นประ Budget ของกราฟนี้เป็นตัวเลือกรายกราฟตามกติกาข้อ 141 แทนความทึบ 0.25 ของกติกาข้อ 29
   หนา 2.5 จุดภาพ สีทองอำพันเข้ม #8a6a00 (TH.noteIc) ทึบเต็ม ได้ราว 5 ต่อ 1 บนพื้นการ์ดขาว ขีด 8 เว้น 5 จุดภาพ วาดด้วยพื้นไล่สีซ้ำ จึงคุมความยาวขีดได้ทุกเบราว์เซอร์
   ชั้น z-index 1 อยู่เหนือแท่ง (ไม่มีชั้น) และใต้เส้นแนวโน้ม (ชั้น 2) margin-bottom ครึ่งความหนา ให้กึ่งกลางเส้นอยู่ที่ระดับ Budget */
.ot-ref{position:absolute; left:6px; right:8px; height:2.5px; margin-bottom:-1.25px; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(90deg,#8a6a00 0 8px,transparent 8px 13px);}
.ot-ref span{position:absolute; right:0; top:-11px; font-size:12px; font-weight:700; color:#6b5100; background:rgba(255,249,230,0.96);
  border:1px solid rgba(217,163,0,0.55); border-radius:8px; padding:1px 7px; white-space:nowrap; font-variant-numeric:tabular-nums;}
/* แถบเทียบ Budget รายแผนก */
.ot-rows{display:flex; flex-direction:column; margin-top:8px;}
/* รอบ 12 พ.ย. 2569 ข้อ 2 แถวมีกราฟเส้นเล็ก (คอลัมน์ sp กว้าง 112 จุดภาพ) วางด้วยชื่อพื้นที่กริด ช่วงจอกลางและจอแคบเปลี่ยนเฉพาะการจัดพื้นที่ */
.ot-row{display:grid; grid-template-columns:minmax(150px,210px) 112px minmax(110px,1fr) 215px 150px; grid-template-areas:"nm sp bar nums st"; gap:14px; align-items:center;
  padding:9px 8px; border-bottom:1px solid rgba(23,73,29,0.08);}
.ot-row > .nm{grid-area:nm;} .ot-row > .ot-spark{grid-area:sp;} .ot-row > .ot-barbox{grid-area:bar;} .ot-row .nums{grid-area:nums;} .ot-row .st{grid-area:st;} .ot-row > .ot-tail{display:contents;}   /* ชุดสาม 12 พ.ย. 2569 */
/* รอบ 12 พ.ย. 2569 ข้อ 1 คำสั่ง Yuth "รูป1 แผนกไหนที่ทำโอทีเกิน ให้ไฮไลท์เป็นพิเศษ" ไฮไลต์ด้วยสีพื้นที่เข้มขึ้น (ทึบ 0.92) เงาโทนแดง ชื่อหนา และไอคอนเตือน
   ไม่ใช้แถบสีข้างซ้ายและเส้นขอบรอบแถว เพราะ dashboard-format กติกาข้อ 3 และ 82 ห้ามกรอบและแถบสีหนาบนกล่องทุกชนิด ตามคำสั่ง Yuth 22 ต.ค. 2569 ให้ไฮไลต์ด้วยสีและเงาแทน
   ตัวเลขแดงบนพื้นนี้ใช้ #8f3d2c (TH.refCInk) เพราะ #b8412e ได้ต่ำกว่า 4.5 ต่อ 1 บนพื้นที่เข้มขึ้น */
.ot-row.over{background:rgba(246,221,215,0.92); border-radius:8px; margin:3px 0;
  box-shadow:0 6px 16px rgba(184,65,46,0.18), 0 1px 3px rgba(184,65,46,0.14);}
.ot-row .nm{font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.45; min-width:0;}
.ot-row.over .nm{font-weight:800;}
.ot-row .nm .ot-ovic{display:inline-block; margin-right:5px; vertical-align:-2px; line-height:0;}
.ot-row .nm small{display:block; font-size:12px; font-weight:400; color:var(--ink2);}
/* รอบ 12 พ.ย. 2569 ข้อ 3 คำสั่ง Yuth "รูป1  ต้องระบุตัวเลข เกณฑ์   ตัวเลขที่ทำได้  ตัวเลขที่เกิน" คำกำกับ เกณฑ์ (Budget) และ ทำได้ อยู่หน้าตัวเลข
   ตัวเลขตัวที่สาม (เกิน หรือ เหลือ) อยู่ในป้ายสถานะที่เดียว ไม่ซ้ำสองที่ */
/* ชุดสาม 12 พ.ย. 2569 ข้อ ท1 คำสั่ง Yuth "รูป 1 พอเอาข้อความมาวางแบบนี้ คือสับสน  ออกแบบการวางใหม่" เลิกกลุ่มสองบรรทัดซ้อน
   ทางขวาของแถบเหลือบรรทัดเดียว ทำได้ N ชั่วโมง (P%) คอลัมน์กว้างคงที่ 215 จุดภาพ ตัวเลขชิดขวาตรงกันทุกแถว ตัวเลขเกณฑ์ย้ายไปอยู่ที่ป้ายเหนือขีดตั้ง (ข้อ ท2) */
.ot-row .nums{font-size:13px; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right;}
.ot-row .nums .ot-k{font-size:13px; font-weight:400; color:var(--ink2); margin-right:6px;}
.ot-row .nums b{font-size:14px; font-weight:800;}
.ot-row.over .nums b{color:#8f3d2c;}
.ot-row .nums .pct{color:var(--ink2); margin-left:6px; font-weight:400;}
/* ชุดสาม 12 พ.ย. 2569 ข้อ ท2 คำสั่ง Yuth "รูป 2 ใส่ตัวเลขเส้นเกณฑ์มาด้วย จะได้รู้" ป้าย เกณฑ์ N ชั่วโมง เหนือแถบ กึ่งกลางตรงขีดตั้ง
   ตำแหน่งแนวนอนตั้งจากสคริปต์ otPlaceBud (บีบไม่ให้ล้นขอบช่องแถบ) สีทองอำพันเข้ม #6b5100 (TH.amberInk) ขีดตั้งของแถวแผนกเข้มขึ้นจากทึบ 0.62 เป็น #1e2822 ทึบ */
.ot-row .ot-barbox{position:relative; min-width:0; padding-top:19px;}
.ot-row .ot-bud{position:absolute; top:0; left:0; font-size:12px; font-weight:700; line-height:16px; color:#6b5100; white-space:nowrap; font-variant-numeric:tabular-nums;}
.ot-row .ot-bar .tick{background:#1e2822;}
.ot-row .st .chip b{font-weight:800;}
.ot-row.over .st .chip b{color:#8f3d2c;}
.ot-row .st{text-align:left;}
.ot-row .ot-bar{height:12px; border-radius:6px;}
.ot-row .ot-bar .fill{border-radius:6px 0 0 6px;}
.ot-none{font-size:12.5px; color:var(--ink2); line-height:1.75; margin-top:12px;}
.ot-notes{margin-top:16px; padding-top:12px; border-top:1px solid rgba(23,73,29,0.14);}
.ot-notes h4{font-size:13.5px; font-weight:700; color:var(--green-dd); margin-bottom:6px;}
.ot-notes ul{list-style:none; padding:0; margin:0;}
.ot-notes li{position:relative; padding-left:16px; font-size:12.5px; line-height:1.8; color:var(--ink);}
.ot-notes li::before{content:""; position:absolute; left:3px; top:10px; width:5px; height:5px; border-radius:50%; background:var(--green-d);}
#otTrendTbl[hidden],#otDeptTbl[hidden],#otTrend[hidden],#otDept[hidden]{display:none;}
#otDeptTbl td,#otDeptTbl th,#otTrendTbl td,#otTrendTbl th{padding:8px 9px; font-size:12px;}
#otDeptTbl tr.sumrow td,#otTrendTbl tr.sumrow td{font-weight:700; background:rgba(234,246,235,0.7);}
#otDeptTbl td.neg{color:var(--red); font-weight:700;}
.ot-ref-cap{display:none;}
/* รอบ 12 พ.ย. 2569 ข้อ 2 กราฟเส้นเล็กในแถว กดได้ด้วยแป้นพิมพ์และการแตะ พื้นจางขึ้นเมื่อชี้หรือเปิดกราฟใหญ่ ไม่มีเส้นขอบ (กติกาข้อ 3) */
.ot-spark{display:inline-flex; align-items:center; justify-content:center; width:112px; height:36px; border-radius:10px; cursor:zoom-in; justify-self:start;
  transition:background 0.15s ease;}
.ot-spark svg{display:block; overflow:visible;}
.ot-spark:hover,.ot-spark[aria-expanded="true"]{background:rgba(255,255,255,0.86);}
/* กล่องกราฟใหญ่ลอย ผิวกระจกเบลอแบบเดียวกับ #tip ไม่รับเมาส์ อยู่นอกการ์ดจึงไม่ถูกตัดขอบ กว้างไม่เกินหน้าต่างลบ 16 จุดภาพ */
#otSparkPop{position:fixed; z-index:55; display:none; pointer-events:none; color:#1e2822; padding:12px 12px 10px 12px; border-radius:16px; max-width:calc(100vw - 16px);
  background:rgba(248,251,249,0.88); -webkit-backdrop-filter:blur(24px) saturate(150%); backdrop-filter:blur(24px) saturate(150%);
  box-shadow:0 18px 42px rgba(23,40,28,0.24), inset 0 1px 0 rgba(255,255,255,0.9);}
#otSparkPop .sp-t{font-size:14px; font-weight:700; line-height:1.45;}
#otSparkPop .sp-t .ic{vertical-align:-2px; margin-right:5px;}
#otSparkPop .sp-s{font-size:12px; color:#566058; line-height:1.6;}
#otSparkPop svg.sp-svg{display:block; margin-top:4px; overflow:visible;}
#otSparkPop .sp-k{display:flex; flex-wrap:wrap; gap:2px 14px; font-size:12px; color:#566058; line-height:1.7; margin-top:2px;}
#otSparkPop .sp-k .kd{display:inline-block; width:24px; height:2.5px; margin-right:6px; vertical-align:3px; background:repeating-linear-gradient(90deg,#8a6a00 0 8px,transparent 8px 13px);}
#otSparkPop .sp-k .kr{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; background:#b8412e;}
/* รอบ 12 พ.ย. 2569 ข้อ 12.3 สัญลักษณ์เส้นประและเส้นแนวโน้มในคำอธิบายของกราฟโอทีรายเดือน หน้าตาเดียวกับเส้นจริง กฎนี้ผูกกับ #otTrendLegend จึงไม่แตะคำอธิบายของหน้าอื่น */
#otTrendLegend .key.dash{width:26px; height:2.5px; border-top:none; vertical-align:3px; background:repeating-linear-gradient(90deg,#8a6a00 0 8px,transparent 8px 13px);}
#otTrendLegend .key.linekey{border-top-width:4px;}
@media print{
  #otSparkPop{display:none !important;}
  .ot-col .b,.ot-ref,#otTrendLegend .key,.ot-spark svg{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
/* บรรทัดหน่วยอยู่เหนือตารางในกล่องเลื่อนเดียวกัน ตรึงชิดซ้ายและกว้างเท่าส่วนที่มองเห็น จึงอ่านครบโดยไม่ต้องเลื่อนตาราง แม้จอ 390 (ผลตรวจอิสระ r5) */
#otDeptTbl .tbl-cap{position:sticky; left:0; padding:9px 12px 7px 12px; font-size:12px; line-height:1.7; color:var(--ink2);}
/* รอบ 8 ต.ค. 2569 r5 ตารางรายแผนกมี 18 คอลัมน์ ต้องพอดีการ์ดที่จอ 1280 โดยไม่มีแถบเลื่อนแนวนอน (กติกาข้อ 75) หัวคอลัมน์ยาวจึงแบ่งสองบรรทัดที่รอยต่อคำ และลดระยะขอบข้างของช่อง */
#otDeptTbl td,#otDeptTbl th{padding-left:6px; padding-right:6px;}
#otDeptTbl th{line-height:1.45; vertical-align:bottom;}
@media (max-width:1100px){
  /* จอกลาง การ์ดคำตอบของหน้ากางเต็มแถว สองกลุ่มอยู่คู่กันแถวถัดไป ป้ายค่าเดือนล่าสุดย่อลงไม่ให้ชนป้าย Budget */
  #otTiles .ot-hero{grid-column:span 12;}
  .ot-col.cur .v{font-size:12.5px;}
  .ot-cols,.ot-xs{padding-right:116px;}
  .ot-cols{--otpr:116px;}
  /* รอบ 12 พ.ย. 2569 ข้อ 2 และ 3 แถวแรก ชื่อ กราฟเล็ก แถบ แถวสอง ตัวเลขพร้อมคำกำกับเรียงบรรทัดเดียว แล้วป้ายสถานะ */
  .ot-row{grid-template-columns:minmax(130px,170px) 112px minmax(60px,1fr) 150px; grid-template-areas:"nm sp bar bar" "nums nums nums st"; row-gap:6px;}   /* ชุดสาม 12 พ.ย. 2569 ข้อ ท1.2 ท1.3 */
  .ot-row .nums{text-align:right;}   /* ชุดสาม 12 พ.ย. 2569 ข้อ ท1.6 ตัวเลขชิดขวาติดป้ายสถานะ ขอบขวาตรงกันทุกแถว */
}
@media (max-width:760px){
  .ot-head h1{font-size:22px;}
  .ot-cols{padding-right:6px; gap:5px; --otg:5px; --otpr:6px; height:210px;} .ot-xs{padding-right:6px; gap:5px;}
  .ot-ref{right:6px;}
  /* รอบ 8 ต.ค. 2569 r5 จอแคบไม่มีขอบขวาให้ป้าย Budget ป้ายปลายเส้นจึงซ่อน แล้วแสดงป้ายเดียวกันที่มุมบนซ้ายของกรอบกราฟ ในแถบว่างเหนือยอดแท่ง
     ไม่ทับป้ายค่าของเดือนล่าสุด (ผลตรวจอิสระ r3) และไม่ทับยอดแท่งของเดือนที่สูงกว่า Budget (ผลตรวจอิสระ r5) */
  .ot-ref span{display:none;}
  .ot-ref-cap{display:block; position:absolute; left:6px; top:1px; z-index:4; font-size:12px; font-weight:700; color:#6b5100; background:rgba(255,249,230,0.96);
    border:1px solid rgba(217,163,0,0.55); border-radius:10px; padding:1px 7px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  /* จอแคบ ป้ายค่าบนแท่งแสดงเฉพาะเดือนล่าสุด ค่าเดือนอื่นอ่านได้จากมุมมองตาราง (กติกาข้อ 71) */
  .ot-col:not(.cur) .v{display:none;}
  /* รอบ 12 พ.ย. 2569 ข้อ 2.7 และ 3.7 จอแคบ กราฟเล็กอยู่ครบและแตะได้ คำกำกับตัวเลขอยู่ครบ */
  /* ชุดสาม 12 พ.ย. 2569 ข้อ ท1.6 จอแคบ ทำได้ กับป้ายสถานะอยู่บรรทัดเดียวกันเมื่อพอ ไม่พอขึ้นบรรทัดใหม่ทั้งชิ้น */
  .ot-row{grid-template-columns:112px minmax(0,1fr); grid-template-areas:"nm nm" "sp bar" "ft ft"; gap:6px 10px;}
  .ot-row > .ot-tail{grid-area:ft; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px;}
  .ot-row .nums{text-align:left;}
  .ot-hero .ot-num .num{font-size:44px;}
}

/* ---------- ตาราง ---------- */
.tbl-wrap{overflow-x:auto; border-radius:var(--r-md); border:1px solid rgba(255,255,255,0.6);
  background:rgba(255,255,255,0.42); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
table{border-collapse:collapse; width:100%; font-size:13px;}
th{font-size:12px; font-weight:600; color:var(--ink2); text-align:left; padding:11px 14px;
  border-bottom:1px solid rgba(23,73,29,0.16); background:rgba(255,255,255,0.9);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  white-space:nowrap; position:sticky; top:0; z-index:2;}
td{padding:10px 14px; border-bottom:1px solid rgba(23,73,29,0.08); vertical-align:top; line-height:1.65;}
tbody tr:nth-child(even) td{background:rgba(255,255,255,0.34);}
tbody tr:hover td{background:rgba(234,246,235,0.62);}
tbody tr.rowfail td{background:rgba(251,232,228,0.42);}
tbody tr.rowfail:hover td{background:rgba(251,232,228,0.66);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
/* ข้อ 4 ของคำสั่ง Yuth 10 ก.ย. 2569 รอบห้า แถวย่อยเดิมจางและเล็กจนอ่านยาก
   เพิ่มความเข้ม เพิ่มขนาด และใส่จุดนำหน้าชื่อรายการ สีจุดตามโทนของหน้า */
tr.subrow td{color:var(--ink); font-size:13.5px; font-weight:500;}
tr.subrow td.num{font-weight:600;}
#subTable tbody.subs td:first-child{position:relative;}
#subTable tbody.subs td:first-child::before{content:""; position:absolute;
  left:15px; top:50%; margin-top:-3.5px; width:7px; height:7px; border-radius:50%;
  background:var(--green); opacity:0.62;}
#page-kpi.tone-fail #subTable tbody.subs td:first-child::before{background:#b8412e; opacity:0.55;}
/* รอบแก้ 7 ต.ค. 2569 r3 ข้อ 2 แถวย่อยชั้นรอง (คนออกรายเดือนและรายวัน อยู่ใต้รวมคนออก) เยื้องเข้าและใช้จุดกลวง */
#subTable tbody.subs tr.sub2 td:first-child{padding-left:52px;}
#subTable tbody.subs tr.sub2 td:first-child::before{left:35px; width:6px; height:6px; margin-top:-3px; background:transparent; border:1.5px solid var(--green); opacity:0.8;}
#page-kpi.tone-fail #subTable tbody.subs tr.sub2 td:first-child::before{background:transparent; border-color:#b8412e;}
tr.clickable{cursor:pointer;}
td.kname{min-width:220px; max-width:360px;}
td .cell-sub{font-size:12px; color:var(--ink2); margin-top:2px;}
td .val-bad{color:var(--red); font-weight:600;}
/* คะแนนที่เกิน 100 ตามชีท เน้นให้เห็นว่าไม่ใช่ค่าที่ถูกตัดเพดาน */
td.val-over{color:var(--green-dd); font-weight:700;}
th.mon-hl, td.mon-hl{background:rgba(234,246,235,0.7);}
.delta-up{color:var(--green-dd); font-weight:600;}
.delta-down{color:var(--red); font-weight:600;}

/* ---------- แถบความคืบหน้า ---------- */
.track{background:rgba(255,255,255,0.55); border:1px solid var(--glass-edge);
  border-radius:6px; height:14px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(23,73,29,0.09); position:relative;}
.track .fill{height:100%; border-radius:5px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.42);
  transform-origin:left center;}
.track.slim{height:9px; margin-top:4px;}
.mini-legend{display:flex; gap:14px; font-size:12px; color:var(--ink2); margin:2px 0 10px 0; flex-wrap:wrap;}

/* ---------- คำอธิบายชุดสี ---------- */
.legend-strip{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink2); margin-top:12px; line-height:1.7;}
.legend-strip .key{display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:6px; vertical-align:-1px;
  background:linear-gradient(180deg,#4cbb57,var(--green));}
/* ปุ่มคำอธิบายของช่วงที่เสียไป ใช้ลายเดียวกับในแท่งจริง เพื่อให้เทียบกันได้โดยไม่ต้องพึ่งสี */
.legend-strip .key.dash{width:22px; height:0; border-radius:0; border-top:2px dashed #a37800; vertical-align:4px;}
.legend-strip .key.linekey{width:22px; height:0; border-radius:0; border-top:3px solid #6595bf; vertical-align:4px;}
.legend-strip .key.hatch{background:
  repeating-linear-gradient(135deg, rgba(255,255,255,0.42) 0 3px, rgba(255,255,255,0) 3px 7px),
  linear-gradient(180deg,#b8412e,#8f3d2c);}

svg{display:block; width:100%; height:auto;}
svg text{font-family:'Prompt','Leelawadee UI','Segoe UI',Tahoma,sans-serif;}
svg .clickable{cursor:pointer;}
.viewlink{background:none; border:none; font-family:inherit; font-size:12.5px; font-weight:600;
  color:var(--green-dd); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  padding:5px 8px; min-height:26px;}
.viewlink:hover{color:var(--green-deep);}

/* ---------- ปุ่มทั่วไป ---------- */
.btn{display:inline-block; font-family:inherit; font-size:14px; font-weight:600; color:#ffffff;
  border:1px solid rgba(255,255,255,0.28); border-radius:12px; padding:11px 24px; cursor:pointer;
  background:linear-gradient(135deg,var(--green-d),var(--green-deep));
  box-shadow:var(--shadow-m), inset 0 1px 0 rgba(255,255,255,0.3);
  transition:transform 0.18s ease, box-shadow 0.18s ease;}
.btn:hover{transform:translateY(-1px); filter:brightness(1.06);}
.btn:active{transform:translateY(0) scale(0.98);}
.btn.sec{color:var(--green-dd); background:rgba(255,255,255,0.78); border:1px solid rgba(46,133,54,0.55);
  -webkit-backdrop-filter:var(--glass-blur-lite); backdrop-filter:var(--glass-blur-lite);}
.btn.mini{font-size:12.5px; padding:7px 14px; border-radius:10px;}

.sum-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:6px 0 14px 0;}
.sum-head h2{font-size:18px; font-weight:700; color:var(--green-dd);}
.sum-head .when{font-size:13px; color:var(--ink2);}
.sum-tag{display:inline-block; font-size:12px; font-weight:600; color:#8a6a00; background:#fff3d1; border:1px solid #f0dc9a; border-radius:999px; padding:2px 10px; margin-left:6px; vertical-align:middle;}
.tile .num small{font-size:16px; font-weight:600; color:var(--ink2); margin-left:6px; letter-spacing:0;}
.tile-hero .num small{color:rgba(255,255,255,0.85);}
.tile .lbl .ic{vertical-align:-3px; margin-right:6px;}

/* ---------- คำอธิบายลอย ---------- */
/* หัวข้อในคำอธิบายลอย ต้องขึ้นบรรทัดใหม่และมีเส้นคั่น ไม่ให้ไปต่อท้ายข้อความก่อนหน้า */
#tip .tip-head{display:block; font-weight:700; color:var(--green-dd); margin-top:8px; padding-top:7px;
  border-top:1px solid rgba(23,40,28,0.14);}
#tip .tip-head:first-child{margin-top:0; padding-top:0; border-top:none;}
#tip ul{margin:5px 0 0 0; padding-left:16px;}
#tip li{margin-top:3px; line-height:1.6;}
/* คำสั่ง Yuth 10 ก.ย. 2569 ข้อ 25 ป็อปอัปทุกตัวใช้พื้นกระจกเบลอโทนเทาอ่อน */
#tip{position:fixed; z-index:50; color:#1e2822; font-size:12px; line-height:1.6;
  padding:10px 14px; border-radius:12px; pointer-events:none; display:none; max-width:360px;
  background:rgba(244,246,245,0.80); -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  border:1px solid rgba(255,255,255,0.85);
  box-shadow:0 18px 42px rgba(23,40,28,0.22), inset 0 1px 0 rgba(255,255,255,0.9);}

.page-foot{font-size:12px; color:var(--ink2); margin-top:28px; padding-top:12px; line-height:1.8;
  border-top:1px solid rgba(23,73,29,0.14);}

/* ---------- เครื่องที่ไม่รองรับการเบลอพื้นหลัง ---------- */
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
  .card,.tbl-wrap{background:rgba(255,255,255,0.96);}
  .topbar{background:rgba(255,255,255,0.97);}
  select,.btn.sec,.mchip,.fchip{background:rgba(255,255,255,0.96);}
  th{background:#ffffff;}
}

/* ---------- ผู้ใช้ที่ขอลดการเคลื่อนไหว ---------- */
/* ง รอบ 4 ต.ค. 2569 ปิดทุกการเคลื่อนไหวจริง ไม่ใช่แค่ย่อเวลา (กติกาข้อ 105 และ 124 ข้อเจ็ด) */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important;}
  .card:hover,.btn:hover,.btn:active,.help-btn:active,.viewlink:active,.grp-more:active,
  .limit-btn:active,.nav button:active,.fchip:active,.mchip:active{transform:none !important;}
  .rv-pend{opacity:1 !important; transform:none !important;}
  .ch-pend .bar-in{transform:none !important;}
  .ch-pend .ln-path,.ch-pend .sp-path{stroke-dashoffset:0 !important;}
}

/* ---------- จอแคบ ---------- */
@media (max-width:760px){
  .app{display:block;}
  .topbar{padding:10px 16px; gap:12px;}
  .brand .logo-img{height:30px;}
  .brand .b1{font-size:13px;}
  .nav{flex:1 1 100%; overflow-x:auto;}
  .nav button{flex:1 1 auto; text-align:center; padding:10px 14px;}
  main{padding:16px 16px 36px 16px;}
  :root{--cgap:16px;}
  .span3,.span4,.span6,.span8{grid-column:span 12;}
  .card{padding:18px 16px; border-radius:var(--r-md);}
  .page-head{gap:10px;}
  .page-head h1{font-size:24px;}
  .page-head .spacer{display:none;}
  .controls{width:100%;}
  .controls select{flex:1 1 100%; width:100%; max-width:100%;}
  .toolbar input[type="search"]{width:100%;}
  .tile .num{font-size:34px;}
  .tile-hero .num{font-size:36px;}
  /* ตารางตัวชี้วัดบนจอแคบ เปลี่ยนเป็นการ์ดเรียงลงมา ไม่ต้องเลื่อนซ้ายขวา แก้ 3 ก.ย. 2569 */
  #kpiTable{overflow-x:visible;}
  #kpiTable table, #kpiTable tbody, #kpiTable tr, #kpiTable td{display:block; width:auto;}
  #kpiTable thead{display:none;}
  #kpiTable tr{background:rgba(255,255,255,0.96); border:1px solid var(--line);
    border-radius:var(--r-md); padding:12px 14px; margin-bottom:12px;}
  #kpiTable td{border:none; padding:5px 0; text-align:left;
    display:flex; justify-content:space-between; align-items:baseline; gap:14px;}
  #kpiTable td::before{content:attr(data-label); flex:0 0 auto;
    font-size:12.5px; font-weight:600; color:var(--ink2);}
  #kpiTable td.kname{display:block; font-weight:700; padding-bottom:6px;}
  #kpiTable td.kname::before{content:none;}
}

/* ---------- งานพิมพ์ ถอดผิวกระจกทั้งหมด ---------- */
@media print{
  body{background:#ffffff !important; background-image:none !important;}
  .bg-field,.topbar,.skip,#splash,#loadbar,.toolbar,.mbar{display:none !important;}
  main{padding:0;}
  .card,.tbl-wrap{
    background:#ffffff !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important;
    border:1px solid #dce7dd !important; box-shadow:none !important;}
  .card::before,.tile-hero::before{display:none !important;}
  .tile-hero{background:#ffffff !important; color:var(--ink) !important; border:1px solid var(--green-d) !important;}
  .tile-hero .lbl,.tile-hero .cmp,.tile-hero .num{color:var(--ink) !important;}
  .page{display:block !important;}
  th{position:static;}
}

/* ============ รอบที่สาม ปรับตามคำสั่ง 10 จุด 21 ส.ค. 2569 ============ */

/* ชื่อหน้าแบบเน้น มีสีและเงาอ่อน */
.title-hero{
  font-size:30px; font-weight:800; line-height:1.3; letter-spacing:-0.3px;
  color:var(--green-dd);
  text-shadow:0 1px 0 rgba(255,255,255,0.85), 0 3px 10px rgba(23,73,29,0.14);
}
.card-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
.card-head h3{flex:1;}

/* ไอคอนที่วาดด้วย SVG ในไฟล์ ไม่ใช้อิโมจิและไม่ใช้ฟอนต์ไอคอน
   ต้องล้มกฎ svg กว้างเต็มกล่องที่ประกาศไว้ด้านบน ไม่เช่นนั้นไอคอนจะขยายเต็มการ์ด */
svg.ic{display:inline-block !important; width:auto !important; height:auto !important;
  vertical-align:-3px; flex:0 0 auto;}
svg.ic-lg{vertical-align:-6px;}

/* แถบเลือกช่วงเวลา */
.mbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
.mbar select{min-width:250px;}
/* ตัวกรองช่วงเวลาบนหน้าเจาะรายตัวชี้วัด ตามคำสั่ง Yuth 10 ก.ย. 2569 ข้อ 1 */
.rng-lbl{font-size:13px; font-weight:600; color:var(--ink2);}
#selRangeK{min-width:210px;}
.mchips[hidden]{display:none;}

/* รายการเกณฑ์เกรดแบบมีหัวข้อย่อยและไอคอน */
.grade-key{margin-top:14px; padding-top:12px; border-top:1px solid rgba(23,73,29,0.12);}
.grade-key .gk-head{font-size:12.5px; font-weight:600; color:var(--ink2); margin-bottom:8px;}
.grade-key ul{list-style:none; display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:8px 20px;}
.grade-key li{display:flex; align-items:flex-start; gap:9px; font-size:12.5px; line-height:1.6; color:var(--ink);}
.grade-key li .gk-range{font-weight:700; white-space:nowrap;}
.grade-key .gk-note{margin-top:10px; font-size:12px; color:var(--ink2);}
.grade-key ul.gk-row{display:flex; flex-wrap:wrap; gap:8px 10px;}
.grade-key ul.gk-row li{align-items:center; gap:7px; padding:5px 12px;
  background:rgba(255,255,255,0.82); border:1px solid var(--glass-edge); border-radius:99px;}

/* การ์ดกราฟคู่ในหน้าเจาะรายตัวชี้วัด ต้องวางตรงกันทุกบรรทัด
   คำอธิบายสีถูกดันไปชิดขอบล่าง การ์ดสองใบจึงจบระดับเดียวกัน */
#page-kpi .grid .card.span6{display:flex; flex-direction:column;}
#page-kpi .grid .card.span6 .sub{min-height:21px;}
#page-kpi .grid .card.span6 .legend-strip{margin-top:auto;}

/* การ์ดสี่ใบในหน้าเจาะรายตัวชี้วัด ให้อ่านง่ายขึ้นตามคำสั่ง 23 ส.ค. 2569 */
#kpiTiles .lbl{font-size:15px;}
#kpiTiles .cmp{font-size:14px;}
#kpiTiles .chip{font-size:13px;}

/* ตัวเลขเด่นตัวเดียว คำนำหน้าและคำหน่วยใช้ขนาดเท่าข้อความรอง ตามคำสั่ง 28 ส.ค. 2569 ข้อ 1 */
#page-kpi #kpiTiles .num{font-size:30px; font-weight:700; letter-spacing:-0.2px; line-height:1.25;}
#page-kpi #kpiTiles .num .num-lead,
#page-kpi #kpiTiles .num .num-unit,
#page-kpi #kpiTiles .num .num-note{
  font-size:14px; font-weight:500; color:var(--ink2); letter-spacing:0; white-space:nowrap;}
#page-kpi #kpiTiles .num .num-unit,
#page-kpi #kpiTiles .num .num-note{margin-left:6px;}
#page-kpi #kpiTiles .num .num-lead{margin-right:6px;}
/* รอบแก้ 8 ต.ค. 2569 ข้อ 10 Yuth สั่ง "Pop up ให้ขึ้นต่อเมื่อ เอาเมาท์ไปชี้ที่ตัวเลข หรือ ค่า เท่านั้น ไม่ใช่ชี้ที่กล่อง"
   ตัวชี้เมาส์รูปช่วยเหลือจึงย้ายจากทั้งการ์ดมาอยู่ที่ตัวเลขหรือค่าที่มีกล่องเมื่อชี้เท่านั้น */
#kpiTiles [data-tip]{cursor:help;}

/* ตารางข้อมูลประกอบ ให้เห็นทันทีว่าแถวไหนสำคัญ ตามคำสั่ง 28 ส.ค. 2569 ข้อ 5 */
/* แถวหลัก เน้นด้วยพื้นสีทึบสีเดียวทั้งแถว ตัวหนา และเส้นใต้หนา
   เลิกใช้แถบขีดสีข้างซ้าย เพราะบนจอแคบที่คอลัมน์แรกถูกตรึงไว้ แถบนั้นยืดสูงตามข้อความที่ตัดบรรทัด
   แล้วกลายเป็นเส้นทึบยาวคาดกลางตาราง แก้ตามคำสั่ง Yuth 7 ก.ย. 2569 */
#subTable tr.mainrow td{background:#eaf6eb; font-weight:700; color:var(--ink);
  font-size:14px;}
#subTable tr.mainrow:hover td{background:#e2f2e4;}
#subTable tr.scorerow td{background:rgba(255,255,255,0.55); font-weight:600; color:var(--ink2);}
#subTable tr.scorerow:hover td{background:rgba(240,248,241,0.9);}
#subTable tbody.subs td{font-size:12px; color:var(--ink2); background:rgba(247,250,247,0.75);}
#subTable tbody.subs td:first-child{padding-left:32px;}
#subTable tbody.subs[hidden]{display:none;}
/* จอแคบ ตรึงคอลัมน์ชื่อรายการไว้ซ้ายมือ ผู้อ่านจึงรู้ว่ากำลังดูแถวไหนขณะเลื่อน แก้ 4 ก.ย. 2569 */
.scroll-hint{display:none;}
@media (max-width:760px){
  .scroll-hint{display:block; font-size:12px; color:var(--ink2); margin:2px 0 8px 0;}
  #subTable table{min-width:640px;}
  #subTable th:first-child, #subTable td:first-child{
    position:sticky; left:0; z-index:2; background:#ffffff;
    box-shadow:1px 0 0 rgba(23,73,29,0.10);}
  #subTable tr.mainrow td:first-child{background:#eaf6eb;}
  #subTable tbody.subs td:first-child{background:#f7faf7; padding-left:16px;}
  #subTable tbody.subs tr.sub2 td:first-child{padding-left:34px;}
}
.subs-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px;}
.subs-note{font-size:12px; color:var(--ink2); line-height:1.7;}

/* การ์ดคะแนนรวม */
/* รอบแก้ 8 ต.ค. 2569 ข้อ 8 Yuth สั่ง "ออกแบบใหม่ ให้เกรด และ ตัวเลขคะแนน เด่นชัดขึ้น"
   ตัวเลขคะแนนรวมเป็นตัวอักษรที่ใหญ่ที่สุดของการ์ด เกรดเป็นอันดับสอง อยู่ในป้ายทึบสีตามเกรดที่ปลายขวาของการ์ด คำอธิบายเกรดอยู่ในป้ายเดียวกัน
   การ์ดจัดเป็นกริด ซ้ายคือคะแนนกับข้อความประกอบ กลางคือภาพประกอบ ขวาคือป้ายเกรด เนื้อหาฝั่งซ้ายจึงเตี้ยลง
   จอกว้างตั้งแต่ 901 จุดภาพ ความสูงของแถวการ์ดไม่เพิ่มจากเดิม (ที่ 1280 และ 1920 ลดจาก 217.8 เหลือ 202 จุดภาพ) หน้าภาพรวมจึงยังพอดีหนึ่งจอตามคำสั่ง 8 ก.ย. 2569 ข้อ 1
   จอแคบไม่เกิน 900 จุดภาพ การ์ดเรียงลงเป็นคอลัมน์เดียว การ์ดคะแนนรวมสูงขึ้น 21 จุดภาพ */
.tile-hero .hero-score{display:flex; align-items:baseline; flex-wrap:wrap; gap:0 10px; margin:8px 0 4px 0;}
.tile-hero .hero-score .num{margin:0;}
.tile-hero .hero-full{font-size:18px; font-weight:500; color:rgba(255,255,255,0.92);}
/* ป้ายเกรดในการ์ดคะแนนรวม พื้นไล่เฉดและเส้นขอบใช้ชุดเดียวกับ .chip-grade ของเกรดนั้น มีเงาใต้ป้าย จึงดูลอยอยู่เหนือพื้นเขียว
   สีตัวอักษรเกรดใช้เฉดเข้มที่ไฟล์นี้ใช้อยู่แล้วบนพื้นสีอ่อน คือ #6b5100 ของปุ่มข้อจำกัดของข้อมูล และ #8a2f1e ของคอลัมน์สะสมโทนแดง
   เพราะ --amber-t กับ --red บนปลายเข้มของพื้นไล่เฉดได้ความต่างสี 4.41 และ 4.24 ต่อ 1 ต่ำกว่าเกณฑ์ 4.5 สีที่ใช้ได้ 6.52 และ 6.48 ต่อ 1 */
.grade-block{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  min-width:132px; padding:9px 18px 10px 18px; border-radius:14px; border:1px solid transparent;
  box-shadow:0 6px 14px rgba(0,0,0,0.16), inset 0 1px 0 #ffffff;
}
.grade-block .gcap{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; line-height:1.4;}
.grade-block .gcap .ic{margin:0; vertical-align:0;}
.grade-block .gname{font-size:48px; font-weight:800; line-height:1; letter-spacing:-0.5px; margin:2px 0 4px 0;}
.grade-block .gword{font-size:13.5px; font-weight:600; line-height:1.45; color:var(--ink);}
.grade-block.gA{background:linear-gradient(180deg,#f4fbf5 0%,#e0f1e3 100%); border-color:rgba(46,133,54,0.5);}
.grade-block.gB{background:linear-gradient(180deg,#fff9e6 0%,#ffeec2 100%); border-color:var(--amber);}
.grade-block.gC{background:linear-gradient(180deg,#fdf2ef 0%,#f6ddd7 100%); border-color:rgba(184,65,46,0.5);}
.grade-block.gA .gcap,.grade-block.gA .gname{color:var(--green-dd);}
.grade-block.gB .gcap,.grade-block.gB .gname{color:#6b5100;}
.grade-block.gC .gcap,.grade-block.gC .gname{color:#8a2f1e;}
/* รอบ 8 ต.ค. 2569 r4 เดือนที่ยังไม่มีคะแนนรวมจึงไม่มีเกรด ป้ายเป็นสีกลางและบอกว่ายังไม่มีข้อมูล เดิมขึ้นคำว่า เกรด โดยไม่มีตัวอักษรเกรด */
.grade-block.gN{background:#f4f6f5; border-color:var(--line);}
.grade-block.gN .gcap{color:var(--ink2);}
/* รอบ 12 พ.ย. 2569 ข้อ ส6 ป้ายที่ไม่มีคำอธิบายเกรด (gnw) ระยะขอบบนล่างเท่ากัน ตัวอักษรเกรดใหญ่ขึ้นเล็กน้อย ความกว้างไม่เกินเดิม จอแคบใช้กฎเดิม */
@media (min-width:901px){
  .grade-block.gnw{padding:12px 18px 12px 18px;}
  .grade-block.gnw .gname{font-size:50px; margin:3px 0 0 0;}
}
/* โครงกริดของการ์ดคะแนนรวม แถวสุดท้ายยืดรับความสูงที่เหลือ บรรทัดผลรายตัวชี้วัดจึงชิดขอบล่าง ป้ายเกรดและภาพประกอบอยู่กึ่งกลางแนวตั้ง */
.tile-hero{display:grid; grid-template-columns:minmax(0,1fr) auto auto; grid-template-rows:auto auto auto 1fr; column-gap:18px;
  position:relative; overflow:hidden;}
.tile-hero > *{position:relative; z-index:1;}
.tile-hero > .lbl{grid-column:1; grid-row:1;}
.tile-hero > .hero-score{grid-column:1; grid-row:2;}
.tile-hero > .cmp{grid-column:1; grid-row:3;}
.tile-hero > .hero-sub{grid-column:1; grid-row:4; align-self:end;}
.tile-hero > .hero-art{grid-column:2; grid-row:1 / span 4; align-self:center;}
.tile-hero > .grade-block{grid-column:3; grid-row:1 / span 4; align-self:center;}
/* เนื้อหารองในการ์ดคะแนนรวม ผลรายตัวชี้วัดของเดือน */
.tile-hero .hero-sub{margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.34);}
/* คำสั่ง Yuth 10 ก.ย. 2569 รอบสาม ข้อ 4 ที่ว่างด้านขวาของการ์ดคะแนนรวม ใส่ภาพประกอบวาดด้วยเส้นในไฟล์ ไม่ใช่รูปถ่ายจากภายนอก
   รอบแก้ 8 ต.ค. 2569 ข้อ 8 ลายน้ำตัวอักษรเกรดของคำสั่งเดียวกัน (และรอบห้า ข้อ 1) ถูกแทนด้วยป้ายเกรดทึบที่ตำแหน่งเดียวกัน
   เพราะ Yuth สั่งให้เกรดเด่นชัดขึ้น และเกรดตัวเดียวกันไม่ควรอยู่สองที่ในการ์ดเดียว ภาพประกอบแท่งกราฟยังอยู่ ย้ายมาอยู่หน้าป้ายเกรด */
.hero-art{width:132px; height:132px; pointer-events:none; opacity:0.17;}
.hero-art svg{display:block; width:100%; height:100%;}
/* จอกว้าง 1280 ถึง 1439 การ์ดแคบลง ภาพประกอบย่อเหลือ 84 จุดภาพ จอ 1101 ถึง 1279 ซ่อนภาพประกอบ บรรทัดคะแนนจึงไม่ถูกบีบจนตัดบรรทัด (วัดแล้วทุกเกรด) */
@media (min-width:1280px) and (max-width:1439px){ .hero-art{width:84px; height:84px;} }
@media (min-width:1101px) and (max-width:1279px){ .hero-art{display:none;} }
@media (max-width:900px){
  .hero-art{display:none;}
  .tile-hero{grid-template-columns:minmax(0,1fr); grid-template-rows:none;}
  .tile-hero > .grade-block{grid-column:1; grid-row:4; justify-self:start; flex-direction:row; gap:12px;
    min-width:0; margin-top:8px; padding:6px 16px; text-align:left;}
  .tile-hero > .hero-sub{grid-row:5;}
  .grade-block .gname{font-size:40px; margin:0;}
}
.tile-hero .hero-sub .hs-head{font-size:13px; font-weight:600; color:rgba(255,255,255,0.95);}
.tile-hero .hero-sub ul{padding-left:18px; margin:0;}
.tile-hero .hero-sub li{font-size:12.5px; font-weight:400; color:rgba(255,255,255,0.92); line-height:1.7; margin-top:2px;}

/* การ์ดกลุ่มงานสองใบ อยู่แถวเดียวกับการ์ดคะแนนรวม แทนกล่องที่มาของคะแนนเดิม
   ระดับของสารบนหน้าจึงเรียงเป็น คะแนนรวม แล้วสองกลุ่มงาน แล้วรายข้อในตาราง ไม่มีชั้นใดซ้ำกัน */
.tile-grp{display:flex; flex-direction:column;}
.tile-grp .grp-score{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin:10px 0 12px 0;}
.tile-grp .grp-score .num{margin:0; font-size:34px;}
.tile-grp .grp-full{font-size:13px; font-weight:500; color:var(--ink2); white-space:nowrap;}
.tile-grp .wbar{height:14px;}
.tile-grp .grp-cmp{font-size:12.5px; margin:-4px 0 12px 0; min-height:19px;}
.tile-grp .grp-pass{font-size:12.5px; font-weight:500; color:var(--ink); line-height:1.7; margin-top:12px;}
.tile-grp .grp-more{align-self:flex-start; margin-top:12px; padding:6px 0; background:none; border:none;
  font-family:inherit; font-size:12.5px; font-weight:600; color:var(--green-deep); cursor:pointer;
  text-decoration:underline; text-underline-offset:3px;}
.tile-grp .grp-more:hover{color:var(--green-dd);}
.tile-grp .grp-more:focus-visible{outline:2px solid var(--green-deep); outline-offset:2px;}
.tile-grp .grp-detail[hidden]{display:none;}
.tile-grp .grp-note{font-size:12px; color:var(--ink2); line-height:1.7; margin-top:10px;}
.tile-grp .grp-foot{font-size:12px; color:var(--ink2); line-height:1.7; margin-top:auto; padding-top:12px;}

/* ช่องคะแนนที่เก็บได้ในตาราง ยกงานของการ์ดแถบคะแนนเดิมมาไว้ที่เดียว */
.ptscell{display:flex; flex-direction:column; gap:7px; min-width:158px;}
.pts-val{font-size:12.5px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
/* รอบแก้ 8 ต.ค. 2569 ข้อ 10 ตัวเลขคะแนนกว้างเท่าข้อความ ไม่ยืดเต็มช่อง กล่องเมื่อชี้จึงขึ้นเฉพาะเมื่อชี้ที่ตัวเลข */
.ptscell .pts-val{align-self:flex-start;}
.pts-val.zero{color:var(--green-dd);}
.pts-val.loss{color:var(--red);}
.wbar.sm{height:10px; border-radius:5px;}

/* รายการอธิบายใต้หัวการ์ด */
.sub-list{padding-left:20px; margin:4px 0 14px 0;}
.sub-list li{font-size:12.5px; color:var(--ink2); line-height:1.75; margin-top:2px;}

/* แถบคะแนน ใช้ร่วมกันระหว่างการ์ดกลุ่มงานกับช่องคะแนนในตาราง */
.wbar{display:flex; height:16px; border-radius:6px; overflow:hidden;
  border:1px solid rgba(46,133,54,0.42);
  background:rgba(255,255,255,0.55); box-shadow:inset 0 1px 3px rgba(23,73,29,0.09);}
/* ช่วงที่เก็บได้กับช่วงที่เสียไป ต้องแยกออกได้แม้ผู้อ่านตาบอดสี
   จึงใช้สามทางพร้อมกัน คือความสว่างต่างกัน มีเส้นขาวคั่นไม่ให้สองสีแตะกัน
   และช่วงที่เสียไปมีลายทแยงซึ่งอ่านได้โดยไม่ต้องพึ่งสี */
.wbar .got{background:linear-gradient(180deg,#4cbb57,var(--green)); transform-origin:left center;}
.wbar .lost{background:
  repeating-linear-gradient(135deg, rgba(255,255,255,0.34) 0 3px, rgba(255,255,255,0) 3px 7px),
  linear-gradient(180deg,#b8412e,#8f3d2c);
  box-shadow:inset 3px 0 0 #ffffff; transform-origin:left center;}
.wbar .rest{background:transparent;}
.wbar{position:relative;}
.wbar i{position:absolute; top:0; bottom:0; width:2px; background:rgba(30,40,34,0.62); z-index:2;}
.sparkbox{margin-top:10px;}
.spark-na{font-size:12px; color:var(--ink2); padding:14px 0;}
.spark-cap{font-size:12px; color:var(--ink2); margin-top:3px; line-height:1.55;}
.help-btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:32px; padding:0 14px;
  border-radius:99px; border:1px solid var(--green-deep); background:#ffffff; color:var(--green-deep);
  font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;}
.help-btn:hover{background:rgba(63,174,73,0.10);}
.help-btn[aria-expanded="true"]{background:var(--green-deep); color:#ffffff;}
.help-btn:focus-visible{outline:2px solid var(--green-deep); outline-offset:2px;}
.popbox{margin-top:12px; border:1px solid var(--line); border-radius:10px; background:#f7faf7;
  padding:14px 16px; font-size:13px; color:var(--ink); line-height:1.75; max-width:760px;}
.popbox[hidden]{display:none;}
.popbox .nt-head{font-weight:700; font-size:13px; margin-bottom:8px;}
.popbox ul{margin:0; padding-left:18px;}
.popbox li{margin-bottom:6px;}
.popbox li:last-child{margin-bottom:0;}
/* ตารางแสดงการคำนวณในกล่องวิธีคิด */
.calc-lead{margin:0 0 10px 0; font-size:12.5px; color:var(--ink2); line-height:1.7;}
.calc-tbl{width:100%; border-collapse:collapse; margin:0 0 12px 0;}
.calc-tbl th,.calc-tbl td{padding:5px 9px; font-size:12.5px; line-height:1.6; text-align:left;
  border-bottom:1px solid var(--line);}
.calc-tbl th{font-weight:600; color:var(--ink2); background:rgba(234,246,235,0.6);}
.calc-tbl th.n,.calc-tbl td.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.calc-tbl .cut{color:var(--ink2); font-size:12px;}
.calc-tbl tr.sum td{font-weight:700; color:var(--green-dd); border-top:2px solid var(--green-deep); border-bottom:none;}

/* โทนสีของหน้าเจาะรายตัวชี้วัด เปลี่ยนตามระดับความห่างจากเป้า
   ค่าตั้งต้นคือโทนเขียวถึงเป้า ทุกค่าสีผ่านเกณฑ์ความต่างสีของ WCAG 2.1 ระดับ AA */
#page-kpi{--tone-ink:#17491d; --tone-line:#3fae49; --tone-wash:rgba(234,246,235,0.72); --tone-edge:rgba(46,133,54,0.34);}
#page-kpi.tone-fail{--tone-ink:#b8412e; --tone-line:#b8412e; --tone-wash:rgba(251,232,228,0.86); --tone-edge:rgba(184,65,46,0.34);}
/* ข้อ 1 ของคำสั่ง Yuth 10 ก.ย. 2569 รอบสี่ หน้าตัวชี้วัดที่ยังไม่ถึงเป้าหมาย ต้องไม่มีกรอบและไม่มีแผงพื้นสี
   ให้เหมือนหน้าที่ถึงเป้าหมายทุกประการ โทนแดงมาจากพื้นหลังฟุ้งและสีของส่วนประกอบเท่านั้น
   แผงพื้นแดงไล่ระดับพร้อมขอบและเงาของคำสั่ง 7 ก.ย. 2569 รอบเจ็ด ยกเลิกแล้ว */
#page-kpi{border:1px solid transparent; border-radius:18px; padding:18px; margin-top:2px;
  transition:box-shadow 0.3s ease;}
@media (min-width:761px){ #page-kpi{padding-top:12px;} }
@media (max-width:760px){ #page-kpi{padding:12px; border-radius:14px;} }
/* ตารางในหน้าที่ยังไม่ถึงเป้าหมาย ต้องไม่เหลือพื้นเขียวหรือแถบเขียว เพราะเขียวแปลว่าผ่าน
   ทั้งแถวหลักของตารางข้อมูลประกอบ คอลัมน์เดือนที่เลือก และแถวที่ชี้อยู่ ให้เปลี่ยนเป็นเฉดแดงชุดเดียวกับแผงพื้นหลัง */
#page-kpi.tone-fail #subTable tr.mainrow td{background:#fbe8e4;}
#page-kpi.tone-fail #subTable tr.mainrow:hover td{background:#f7ded8;}
#page-kpi.tone-fail #subTable tr.scorerow:hover td{background:rgba(253,244,241,0.92);}
#page-kpi.tone-fail th.mon-hl,#page-kpi.tone-fail td.mon-hl{background:rgba(251,232,228,0.72);}
#page-kpi.tone-fail tbody tr:hover td{background:rgba(251,232,228,0.55);}
@media (max-width:760px){
  #page-kpi.tone-fail #subTable tr.mainrow td:first-child{background:#fbe8e4;}
}

/* แถบภาพประกอบส่วนหัวของหน้า ภาพจากไฟล์ที่ Yuth ส่งมา 7 ก.ย. 2569 ฝังเป็นข้อมูลในไฟล์ ไม่เรียกจากภายนอก
   ฉากทึบไล่ระดับด้านที่วางข้อความ เพื่อให้ตัวอักษรขาวอ่านได้ทุกภาพ และไม่บังใบหน้าคนในภาพ */
.banner{position:relative; overflow:hidden; border-radius:14px; margin-bottom:16px;
  border:1px solid rgba(23,73,29,0.16);
  box-shadow:0 12px 26px rgba(23,73,29,0.18), 0 2px 6px rgba(23,73,29,0.10), inset 0 1px 0 rgba(255,255,255,0.35);}
.banner img, .banner .bnr-svg{display:block; width:100%; height:210px; object-fit:cover; object-position:center 42%;}
.banner.slim img{height:200px; object-position:center 52%;}
.banner::after{content:""; position:absolute; inset:0; pointer-events:none;}
.banner.b-left::after{background:linear-gradient(90deg, rgba(15,52,22,0.88) 0%, rgba(15,52,22,0.56) 28%, rgba(15,52,22,0.10) 62%, rgba(15,52,22,0) 100%);}
.banner.b-bottom::after{background:linear-gradient(0deg, rgba(15,52,22,0.86) 0%, rgba(15,52,22,0.34) 30%, rgba(15,52,22,0.03) 64%, rgba(15,52,22,0) 100%);}
.banner-txt{position:absolute; left:26px; bottom:20px; z-index:1; display:flex; flex-direction:column; gap:6px; max-width:64%;}
.banner .banner-eyebrow{font-size:13px; font-weight:600; color:rgba(255,255,255,0.94); letter-spacing:0.2px; line-height:1.5;}
.banner .title-hero{color:#ffffff; text-shadow:0 2px 12px rgba(0,0,0,0.45);}
.banner-tag{position:absolute; right:12px; top:11px; z-index:1; font-size:12px; color:rgba(255,255,255,0.94);
  background:rgba(15,52,22,0.58); padding:3px 10px; border-radius:99px; line-height:1.5;}
#page-kpi.tone-fail .banner{border-color:rgba(184,65,46,0.30);
  box-shadow:0 12px 26px rgba(184,65,46,0.20), 0 2px 6px rgba(184,65,46,0.12), inset 0 1px 0 rgba(255,255,255,0.35);}
#page-kpi.tone-fail .banner.b-bottom::after{background:linear-gradient(0deg, rgba(120,38,25,0.86) 0%, rgba(120,38,25,0.36) 30%, rgba(120,38,25,0.04) 64%, rgba(120,38,25,0) 100%);}
@media (max-width:760px){
  .banner img, .banner .bnr-svg{height:150px;}
  .banner.slim img{height:130px; object-position:center 52%;}
  .banner-txt{left:16px; bottom:14px; max-width:92%;}
}
/* บีบความสูงของหน้าภาพรวม เพื่อให้กล่องด้านบนกับการ์ดกราฟคะแนนรวมรายเดือนอยู่ในหน้าจอเดียว
   ไม่ต้องเลื่อนขึ้นลง ตามคำสั่ง Yuth 8 ก.ย. 2569 ข้อ 1 ค่าทุกตัววัดจากการเรนเดอร์จริงสามความกว้าง */
#page-overview .banner{margin-bottom:8px;}
#page-overview .banner img, #page-overview .banner .bnr-svg{height:102px;}
#page-overview .mbar{margin-bottom:14px;}
#page-overview .tilerow .card{padding:12px 15px;}
#page-overview .tilerow .tile .lbl{font-size:13px; line-height:1.45;}
#page-overview .tilerow .tile .num{font-size:32px; margin:4px 0 2px 0;}
/* รอบแก้ 8 ต.ค. 2569 ข้อ 8 ตัวเลขคะแนนรวมเดิมแสดง 32 จุดภาพ (กฎ .tilerow .tile .num ข้างบนชนะกฎ 38 จุดภาพของบรรทัดนี้) ขยายเป็น 58 จุดภาพ จอแคบ 48 จุดภาพ
   กฎย่อกล่องเกรดสองบรรทัดเดิมตัดออก เพราะป้ายเกรดย้ายไปอยู่ปลายขวาของการ์ดและมีขนาดของตัวเองแล้ว */
#page-overview .tilerow .tile-hero .num{font-size:58px; line-height:1.05; letter-spacing:-1.5px;}
@media (max-width:760px){ #page-overview .tilerow .tile-hero .num{font-size:48px;} }
#page-overview .tile-hero .hero-score{margin:4px 0 2px 0;}
#page-overview .tile-hero .hero-full{font-size:15px;}
#page-overview .tile-hero .hero-sub{margin-top:6px; padding-top:6px;}
#page-overview .tile-hero .hero-sub li{line-height:1.5; margin-top:0;}
#page-overview .tile-grp .grp-score{margin:6px 0 8px 0;}
#page-overview .tile-grp .grp-score .num{font-size:27px;}
#page-overview .tile-grp .grp-cmp{margin:-2px 0 8px 0; min-height:0;}
#page-overview .tile-grp .grp-pass{margin-top:8px; line-height:1.55;}
#page-overview .tile-grp .grp-more{margin-top:8px; padding:3px 0;}
#page-overview .tile-grp .grp-foot{padding-top:8px; line-height:1.55;}
.fit-gap{height:24px;}
/* รอบ 3 ข้อ 4 ระยะห่างระหว่างการ์ดใช้ค่าเดียวกับช่องกริด */
.fit-gap{height:var(--cgap,24px);}
#page-overview #trendCard{padding:14px 18px 12px 18px;}
#page-overview #trendCard .sub{margin-bottom:8px;}
#page-overview #trendCard .toolbar{margin-bottom:8px;}
#page-overview .grade-key{margin-top:8px; padding-top:8px;}
#page-overview .grade-key .gk-head{margin-bottom:4px;}
#page-overview .grade-key ul{gap:5px 20px;}
#page-overview .grade-key .gk-note{margin-top:3px; line-height:1.5;}
#page-overview .grade-key li{line-height:1.5;}
@media (max-width:1100px){
  #page-overview .banner img, #page-overview .banner .bnr-svg{height:150px;}
  #page-overview .tilerow .card{padding:18px 16px;}
}
/* แถบบทวิเคราะห์ WHAT WHY HOW ของเดือนที่เลือก ปิดไว้เป็นค่าตั้งต้น
   สามคอลัมน์เท่ากันบนจอกว้าง ซ้อนลงเป็นสามบล็อกบนจอแคบ
   สีของหัวข้อและเส้นคั่นผูกกับโทนของหน้า จึงเปลี่ยนตามสถานะเหมือนส่วนอื่น
   สร้างตามคำสั่ง Yuth 8 ก.ย. 2569 */
.note-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:6px;}
.note-grid.c1{grid-template-columns:1fr;}
.note-grid.c2{grid-template-columns:repeat(2,1fr);}
.note-col{min-width:0;}
.note-col h4{font-size:13.5px; font-weight:700; color:var(--tone-ink,var(--green-dd));
  padding-bottom:6px; margin-bottom:8px; border-bottom:1px solid var(--tone-line,var(--line));}
.note-col ul{list-style:none; padding:0; margin:0;}
.note-col ul.bul li{position:relative; padding-left:17px; font-size:12.5px; line-height:1.75;
  color:var(--ink); margin-bottom:4px;}
.note-col ul.bul li::before{content:""; position:absolute; left:5px; top:9px;
  width:5px; height:5px; border-radius:50%; background:var(--tone-ink,var(--green-deep));
  opacity:0.85;}
/* คำสั่ง Yuth 9 ก.ย. 2569 ข้อ 2 ประเด็นที่มีตัวเลข ให้จุดนำหนักและเยื้องออกมาข้างหน้า
   ส่วนประเด็นย่อย ให้จุดนำจางลงและเยื้องเข้าไป ลำดับชั้นจึงอ่านออกตั้งแต่แวบแรก */
.note-col ul.bul li.key{padding-left:17px; font-weight:700; margin-top:7px; margin-bottom:5px;}
/* คำสั่ง Yuth 10 ก.ย. 2569 รอบสาม ข้อ 2 หัวข้อที่ไม่มีข้อย่อยอยู่ใต้มัน ไม่ต้องหนา
   เพราะตัวหนามีไว้บอกว่ายังมีของอยู่ข้างล่าง ไม่ใช่ไว้เน้นทุกบรรทัด */
.note-col ul.bul li.key.solo{font-weight:400;}
.note-col ul.bul li.key::before{left:0; top:8px; width:7px; height:7px; opacity:1;}
.note-col ul.bul li.sub{padding-left:33px; color:var(--ink2);}
.note-col ul.bul li.sub::before{left:20px; top:10px; width:4px; height:4px; opacity:0.42;}
/* รอบแก้ 8 ต.ค. 2569 ข้อ 2 และข้อ 7 ส่วนต่อท้ายบรรทัด (ความเสียหาย หรือ สิ่งที่ได้) อยู่ใน li เดียวกับบรรทัดก่อนหน้า
   น้ำหนักปกติ สีรอง คั่นด้วยเส้นตั้งบางที่วาดด้วย CSS ไม่พิมพ์อักขระเพิ่ม ข้อความที่คัดลอกจึงเป็นคำเดิมคั่นด้วยช่องไฟเดียว */
.note-col ul.bul li .tail{font-weight:400; color:var(--ink2); margin-left:5px; padding-left:9px;
  border-left:1px solid var(--tone-line,var(--line));
  /* รอบ 8 ต.ค. 2569 r4 ส่วนต่อท้ายลงบรรทัดใหม่ทั้งก้อนเมื่อที่ไม่พอ ไม่ตัดกลางจนเหลือคำเดียวค้างบรรทัด */
  display:inline-block; max-width:100%; vertical-align:top;}
.note-col table{width:100%; border-collapse:collapse;}
.note-col table th,.note-col table td{font-size:12px; line-height:1.6; padding:5px 8px;
  border-bottom:1px solid var(--tone-line,var(--line)); text-align:left; vertical-align:top;}
.note-col table th{font-weight:600; color:var(--ink2); white-space:nowrap;}
/* รอบแก้ 8 ต.ค. 2569 ข้อ 1 หัวคอลัมน์ของคอลัมน์ตัวเลขชิดขวาแนวเดียวกับตัวเลขข้างล่าง เดิมกฎ th ของบล็อกนี้บังคับชิดซ้ายทุกหัว */
.note-col table th.num,.note-col table td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.note-col table tr.sumrow td{font-weight:700; border-bottom:none;}
.note-src{font-size:12px; color:var(--ink2); line-height:1.7; margin-top:12px;}
@media (max-width:900px){ .note-grid{grid-template-columns:1fr; gap:16px;} }
/* สองคอลัมน์ท้ายตารางข้อมูลประกอบ ยอดสะสมและค่าเฉลี่ยต่อเดือน
   คำสั่ง Yuth 9 ก.ย. 2569 ข้อ 1 ให้อยู่ข้างเดือนล่าสุด ไม่แยกเป็นแถบใต้ตาราง */
#subTable th.cumcol, #subTable td.cumcol{background:#eef6ef; border-left:1px solid var(--line);}
#subTable th.cumcol{color:var(--green-dd); font-weight:800;}
#subTable tr.mainrow td.cumcol{background:#dcefdd; font-weight:800; color:var(--green-dd);}
#page-kpi.tone-fail #subTable th.cumcol, #page-kpi.tone-fail #subTable td.cumcol{background:#fdf1ee;}
#page-kpi.tone-fail #subTable tr.mainrow td.cumcol{background:#f7ded8; color:#8a2f1e;}
/* รอบ 12 พ.ย. 2569 ข้อ ส3 คำสั่ง Yuth "รูป 3 ให้ใส่เส้นกั้น บางๆ" เส้นแนวตั้งระหว่างทุกคอลัมน์ด้วยเงาด้านใน 1 จุดภาพ (ไม่เพิ่มความกว้างตาราง)
   เส้นแนวนอนระหว่างทุกแถวใช้เส้นใต้เดิมของช่อง ปรับความทึบจาก 0.08 เป็น 0.13 หัวตารางคง 0.16 ผูกกับ #subTable เท่านั้น ตารางอื่นไม่แตะ */
#subTable th:not(:last-child), #subTable td:not(:last-child){box-shadow:inset -1px 0 0 rgba(23,73,29,0.13);}
#subTable tr:not(:last-child) td{border-bottom-color:rgba(23,73,29,0.13);}   /* รอบส่งคืนครั้งที่ 2 รายการ 2 แถวสุดท้ายของแต่ละ tbody คงเส้นปิดท้ายเท่า BEFORE */
@media (max-width:760px){
  #subTable th:first-child, #subTable td:first-child{box-shadow:1px 0 0 rgba(23,73,29,0.10), inset -1px 0 0 rgba(23,73,29,0.13);}
}
@media print{ #subTable th, #subTable td{-webkit-print-color-adjust:exact; print-color-adjust:exact;} }
/* คำสั่ง Yuth 10 ก.ย. 2569 ข้อ 7 8 10 ปุ่ม ลิงก์ และรายการเลือกบนหน้านี้
   ต้องใช้สีเดียวกับโทนของหน้า ไม่ใช่เขียวค้างไว้ขณะที่ทั้งหน้าเป็นแดง */
#page-kpi .btn.sec{color:var(--tone-ink); border-color:var(--tone-edge);
  background:var(--tone-wash);}
#page-kpi .btn.sec:hover{border-color:var(--tone-line);}
#page-kpi select{color:var(--tone-ink); border-color:var(--tone-edge);}
#page-kpi .viewlink{color:var(--tone-ink);}
#page-kpi .viewlink:hover{color:var(--tone-line);}
#page-kpi .help-btn{color:var(--tone-ink); border-color:var(--tone-line); background:#ffffff;}
#page-kpi .help-btn:hover{background:var(--tone-wash);}
#page-kpi .help-btn[aria-expanded="true"]{background:var(--tone-ink); color:#ffffff; border-color:var(--tone-ink);}
#page-kpi .subs-bar .help-btn{font-weight:700;}
/* ข้อ 20 ดวงไฟพื้นหลังของหน้า ต้องเปลี่ยนโทนตามหน้าด้วย ไม่งั้นเห็นเขียวโผล่ที่ขอบ */
/* ข้อ 3 ของคำสั่ง Yuth 10 ก.ย. 2569 รอบห้า หน้าตัวชี้วัดที่ยังไม่ถึงเป้าหมาย
   พื้นหลังทั้งจอเป็นโทนแดงอ่อนไล่ระดับ ไล่ที่ตัวพื้นหลังของหน้า ไม่ใช่แผงที่มีขอบ
   จึงไม่เกิดกรอบตามที่เคยถูกทักเมื่อรอบก่อน */
body.tone-fail{
  background-image:
    radial-gradient(58rem 42rem at 10% -10%, rgba(184,65,46,0.20), transparent 60%),
    radial-gradient(48rem 38rem at 98% 2%, rgba(150,80,60,0.13), transparent 58%),
    radial-gradient(54rem 42rem at 80% 94%, rgba(217,120,0,0.13), transparent 60%),
    radial-gradient(40rem 34rem at 30% 108%, rgba(184,65,46,0.12), transparent 60%),
    linear-gradient(168deg,#fefaf9 0%,#fbeeea 48%,#f7e2dc 100%);}
body.tone-fail .bg-field .o1{background:radial-gradient(circle at 32% 32%,rgba(184,65,46,0.34),rgba(184,65,46,0) 70%);}
body.tone-fail .bg-field .o2{background:radial-gradient(circle at 60% 40%,rgba(150,80,60,0.20),rgba(150,80,60,0) 70%);}
body.tone-fail .bg-field .o3{background:radial-gradient(circle at 40% 60%,rgba(217,120,0,0.20),rgba(217,120,0,0) 70%);}
/* ข้อ 17 ป้ายสถานะต้องเด่น มีมิติ ไม่ใช่ป้ายแบนเรียบ */
.badge{box-shadow:0 8px 18px rgba(23,40,28,0.14), inset 0 1px 0 rgba(255,255,255,0.85);
  text-shadow:0 1px 0 rgba(255,255,255,0.6);}
.badge.pass{background:linear-gradient(180deg,#f2fbf3,#dcefdd);}
.badge.fail{background:linear-gradient(180deg,#fdf1ee,#f7ded8); box-shadow:0 8px 18px rgba(120,38,25,0.18), inset 0 1px 0 rgba(255,255,255,0.85);}
.badge.over{background:linear-gradient(180deg,#2f8438,var(--green-dd)); color:#ffffff; text-shadow:none;
  box-shadow:0 10px 22px rgba(23,73,29,0.32), inset 0 1px 0 rgba(255,255,255,0.34);}
.kpi-title-row .badge{font-size:16px; padding:10px 20px;}
/* รอบ 3 ข้อ 3 กติกาข้อ 122 และ 27 พอดีหนึ่งจอที่ 1280x800 และ 1920x950 ลดตามลำดับ แถบภาพ ระยะ แล้วจัดแถวใหม่ ไม่ลดตัวอักษร ไม่ตัดข้อมูล */
#trendCard .card-head{align-items:center; row-gap:6px; margin-bottom:8px;}
#trendCard .card-head h3{flex:0 0 auto; margin-bottom:0;}
#trendCard .card-head .toolbar.tb-head{flex:1 1 auto; margin:0;}
#trendCard .card-head .viewlink{margin-left:auto;}
@media (min-width:1101px){
  #page-overview .banner img, #page-overview .banner .bnr-svg{height:88px;}
  #page-overview .banner-txt{bottom:12px;}
  #page-overview .mbar{margin-bottom:10px;}
  #page-overview .grade-key{display:flex; flex-wrap:wrap; align-items:center; column-gap:16px; row-gap:4px;}
  #page-overview .grade-key .gk-head{margin-bottom:0;}
}
/* ข้อ 18 ไอคอนกำกับความหมายในป้ายชื่อการ์ดและหัวข้อการ์ด */
.lbl .ic, .card-head h3 .ic, .grid .card h3 .ic{vertical-align:-3px; margin-right:7px;}
/* คำสั่ง Yuth 10 ก.ย. 2569 ข้อ 4 หน้านี้เป็นหน้าไฮไลต์ ต้องเห็นครบตั้งแต่หัวเรื่องถึงกราฟ
   โดยไม่ต้องเลื่อนจอ ลำดับการลดคือ หัวเรื่อง แล้วการ์ด แล้วความสูงกราฟ ตามกติกาข้อ 27 */
#page-kpi .kpi-head{margin-bottom:8px; padding-bottom:7px;}
#page-kpi .kpi-head-top select{min-height:34px; padding-top:5px; padding-bottom:5px;}
#page-kpi .kpi-head-top .btn.mini{padding:5px 12px; min-height:34px;}
#page-kpi .kpi-head h1{line-height:1.2;}
#page-kpi .kpi-status{margin-top:0;}
#page-kpi .sparkbox svg{max-height:54px;}
#page-kpi .kpi-head h1{font-size:23px;}
#page-kpi .kpi-head-top{margin-bottom:4px;}
#page-kpi #kpiTiles .card{padding:11px 14px;}
/* ข้อ 2 ของคำสั่ง Yuth 10 ก.ย. 2569 รอบห้า การ์ดสามใบที่ไม่มีกราฟเล็กเหลือที่ว่างมาก
   จึงขยายตัวเลขเด่น คำนำหน้า คำหน่วย และบรรทัดอธิบายให้ได้สัดส่วนกับกล่อง
   ความสูงการ์ดยังถูกกำหนดโดยการ์ดที่มีกราฟเล็ก จึงไม่ทำให้หน้าสูงขึ้น */
#page-kpi #kpiTiles .num{font-size:33px; line-height:1.2;}
#page-kpi #kpiTiles .cmp{font-size:14px; line-height:1.55;}
#page-kpi #kpiTiles .num .num-lead,
#page-kpi #kpiTiles .num .num-unit,
#page-kpi #kpiTiles .num .num-note{font-size:16px;}
#page-kpi #kpiTiles .lbl{font-size:15.5px;}
#page-kpi .sparkbox{margin-top:5px;}
#page-kpi .spark-cap{font-size:12px; line-height:1.4; margin-top:2px;}
#page-kpi #kpiTiles .card .lbl{padding-bottom:6px;}
#page-kpi .grid .card h3{font-size:17px;}
#page-kpi .card-head{margin-bottom:2px;}
#page-kpi.tone-na{--tone-ink:#566058; --tone-line:#c9d3ca; --tone-wash:rgba(255,255,255,0.7); --tone-edge:var(--line);}
#page-kpi .kpi-head{padding:0 0 10px 0; border-bottom:2px solid var(--tone-line);}
#page-kpi .kpi-head h1{color:var(--tone-ink); text-shadow:none;}
#page-kpi .kpi-head .eyebrow{color:var(--tone-ink);}
#page-kpi #kpiTiles .num{color:var(--tone-ink);}
#page-kpi .grid .card h3{color:var(--tone-ink);}
/* แทนแถบสีคาดหัวการ์ด ใช้เส้นคั่นบางใต้ป้ายชื่อการ์ด อ่านเป็นลำดับชั้นได้โดยไม่ต้องพึ่งแถบสี */
#page-kpi #kpiTiles .card .lbl{padding-bottom:8px; margin-bottom:2px; border-bottom:1px solid var(--tone-edge);}
/* การ์ดสี่ใบสูงเท่ากัน ใบที่เนื้อหาสั้นกว่าจึงเหลือที่ว่างท้ายการ์ด
   ดันบรรทัดสุดท้ายลงไปชิดขอบล่าง ที่ว่างจึงกระจายอยู่กลางการ์ดแทนที่จะเป็นช่องโหว่ก้อนเดียว */
#page-kpi #kpiTiles .card{display:flex; flex-direction:column;}
/* ตัวเลขเด่นต้องอยู่ใต้หัวการ์ดเสมอ ห้ามถูกดันลงไปชิดขอบล่าง เพราะการ์ดที่ไม่มีบรรทัดปิดท้ายจะกลวงกลางใบ
   แก้ตามข้อ 3 ของคำสั่ง Yuth 7 ก.ย. 2569 */
#page-kpi #kpiTiles .card > *:last-child:not(.num){margin-top:auto;}
/* รอบแก้ 8 ต.ค. 2569 ข้อ 9 Yuth สั่ง "ให้ ไฮไลท์ สี สองช่องนี้ และ ให้ออกแบบใหม่ ให้รู้ว่าคือเป้าหมาย กับ ผลงานจริง"
   การ์ดเป้าหมายใช้โทนทองอำพันคงที่ทุกเดือน สีเดียวกับเส้นประเป้าหมายของกราฟผลจริงข้างล่าง การ์ดผลงานจริงใช้โทนตามสถานะของเดือนนั้น ชุดเดียวกับโทนของหน้า
   สองการ์ดต่างกันด้วยป้ายคำ ไอคอน และคำบอกสถานะด้วย ไม่พึ่งสีอย่างเดียว พื้นไล่เฉดจบที่โทเคนพื้นอ่อนของสีนั้น
   ความต่างสีของข้อความทุกชิ้นกับปลายเข้มของพื้นจึงไม่ต่ำกว่า 4.5 ต่อ 1 */
#page-kpi #kpiTiles .tile-tgt{background:linear-gradient(180deg,#fff9e6 0%,var(--amber-bg) 100%); border-color:rgba(217,163,0,0.55);
  box-shadow:0 1px 2px rgba(163,120,0,0.20), inset 0 1px 0 rgba(255,255,255,0.9);}
#page-kpi #kpiTiles .tile-tgt .lbl{border-bottom-color:rgba(217,163,0,0.45);}
#page-kpi #kpiTiles .tile-tgt .lbl-ic{background:rgba(255,255,255,0.85); color:#6b5100;}
#page-kpi #kpiTiles .tile-tgt .num{color:#6b5100;}
#page-kpi #kpiTiles .tile-tgt .role{background:#6b5100;}
#page-kpi #kpiTiles .tile-act{background:linear-gradient(180deg,#f4fbf5 0%,var(--green-bg) 100%); border-color:var(--tone-edge);
  box-shadow:0 1px 2px rgba(23,73,29,0.16), inset 0 1px 0 rgba(255,255,255,0.9);}
#page-kpi.tone-fail #kpiTiles .tile-act{background:linear-gradient(180deg,#fdf2ef 0%,var(--red-bg) 100%);
  box-shadow:0 1px 2px rgba(184,65,46,0.18), inset 0 1px 0 rgba(255,255,255,0.9);}
#page-kpi.tone-na #kpiTiles .tile-act{background:linear-gradient(180deg,#f9fdfa 0%,var(--bg) 100%);
  box-shadow:0 1px 2px rgba(23,73,29,0.05), inset 0 1px 0 rgba(255,255,255,0.9);}
#page-kpi #kpiTiles .tile-act .lbl-ic{background:rgba(255,255,255,0.85);}
/* ป้ายคำบอกบทบาทของการ์ด พื้นทึบตัวอักษรขาว สีพื้นคือสีหมึกของโทนนั้น */
#page-kpi #kpiTiles .role{display:inline-block; padding:1px 10px; border-radius:99px; font-size:14px; font-weight:700; line-height:1.5;
  color:#ffffff; background:var(--tone-ink); vertical-align:1px;}
#page-kpi #kpiTiles .role-sub{margin-left:7px;}
/* คำบอกสถานะในการ์ดผลงานจริง ใช้ป้ายสถานะเดิมของหน้า (statusChip) วางต่อท้ายตัวเลขในบรรทัดเดียวกัน
   ข้อ 1 ตัวเลขยาวเต็มบรรทัด ป้ายสถานะจึงลงไปอยู่บรรทัดเดียวกับวงเล็บร้อยละที่ประหยัด เป็นกลุ่มบรรทัดเตี้ย การ์ดจึงไม่สูงขึ้นจากเดิม
   พื้นป้ายในการ์ดนี้ไล่จากขาว ป้ายจึงเห็นแยกจากพื้นการ์ดสีเดียวกัน และตัวอักษรแดงได้ความต่างสีไม่ต่ำกว่า 4.5 ต่อ 1 */
#page-kpi #kpiTiles .tile-act .num{display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px;}
#page-kpi #kpiTiles .tile-act .act-meta{display:inline-flex; flex-wrap:wrap; align-items:center; gap:2px 8px; line-height:1.3;}
#page-kpi #kpiTiles .tile-act .act-meta .num-note{margin-left:0;}
#page-kpi #kpiTiles .tile-act .num .chip{letter-spacing:0; padding:3px 10px; line-height:1.3;}
#page-kpi #kpiTiles .tile-act .num .chip.pass{background:linear-gradient(180deg,#ffffff 0%,#f4fbf5 100%);}
#page-kpi #kpiTiles .tile-act .num .chip.fail{background:linear-gradient(180deg,#ffffff 0%,#fdf2ef 100%);}

/* กล่องข้อจำกัดของข้อมูลแบบย่อ กดที่ไอคอนจึงกาง */
.limit-wrap{margin-top:10px;}
.limit-btn{display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:44px; padding:8px 14px; font-family:inherit; font-size:13px; font-weight:600; color:#6b5100;
  border-radius:99px; border:1px solid rgba(217,163,0,0.55); background:rgba(255,243,209,0.9); cursor:pointer;}
.limit-btn:hover{background:rgba(255,236,178,0.95);}
.limit-btn.on{background:rgba(255,228,150,0.95);}
.limit-btn:focus-visible{outline:2px solid var(--green-deep); outline-offset:2px;}
.limit-wrap .datalimit{margin-top:8px;}
.datalimit[hidden]{display:none;}


/* หัวหน้าเจาะรายตัวชี้วัด */
.kpi-head{margin-bottom:12px;}
/* ข้อ 4 ของคำสั่ง Yuth 8 ก.ย. 2569 หัวเรื่องกับป้ายสถานะอยู่บรรทัดเดียวกัน
   เพื่อให้การ์ดสี่ใบและกราฟผลจริงรายเดือน อยู่ในหน้าจอเดียวโดยไม่ต้องเลื่อน */
.kpi-title-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.kpi-title-row .kpi-status{margin-top:0;}
.kpi-head-top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
.kpi-head .eyebrow{font-size:13px; font-weight:600; color:var(--ink2); letter-spacing:0.3px;}
.kpi-head .spacer{flex:1;}
