<style>
/* ============================================================
   Dashboard HR TPC ระบบภาพผิวกระจกโปร่งแสง โหมด CI เขียว JS Group
   โทเคนสียึด dashboard-format references/design-tokens.md ข้อ 1
   ชั้นกระจกผ่านการทดสอบค่าความคมชัดจากภาพเรนเดอร์จริง
   ============================================================ */
:root{
  /* โทเคนสี CI ห้ามแก้ค่า */
  --green:#3fae49; --green-d:#2e8536; --green-dd:#17491d; --green-deep:#1c5a23;
  --green-bg:#eaf6eb; --bg:#f4f8f4; --card:#ffffff; --ink:#1e2822; --ink2:#566058;
  --line:#dce7dd; --blue:#2f5d8a; --blue-bg:#e6eef7; --amber:#d9a300; --amber-t:#8a6a00;
  --amber-bg:#fff3d1; --red:#b8412e; --red-bg:#fbe8e4; --gray:#c9d3ca;
  /* ชั้นกระจก */
  --glass:rgba(255,255,255,0.76);
  --glass-strong:rgba(255,255,255,0.9);
  --glass-edge:rgba(255,255,255,0.78);
  --glass-edge-in:rgba(255,255,255,0.95);
  --glass-blur:blur(24px) saturate(150%) brightness(1.05);
  --glass-blur-lite:blur(15px) saturate(140%) brightness(1.04);
  --shadow-s:0 2px 8px rgba(23,73,29,0.05);
  --shadow-m:0 10px 30px rgba(23,73,29,0.09), 0 2px 6px rgba(23,73,29,0.05);
  --shadow-l:0 18px 48px rgba(23,73,29,0.13), 0 3px 10px rgba(23,73,29,0.06);
  --ring:0 0 0 3px rgba(255,255,255,0.9), 0 0 0 5px var(--green-d);
  --r-lg:22px; --r-md:16px; --r-sm:10px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Prompt','Leelawadee UI','Segoe UI',Tahoma,sans-serif;
  color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  word-break:normal; overflow-wrap:break-word;
  background:var(--bg);
  background-image:
    radial-gradient(58rem 42rem at 10% -10%, rgba(63,174,73,0.20), transparent 60%),
    radial-gradient(48rem 38rem at 98% 2%, rgba(47,93,138,0.12), transparent 58%),
    radial-gradient(54rem 42rem at 80% 94%, rgba(217,163,0,0.13), transparent 60%),
    radial-gradient(40rem 34rem at 30% 108%, rgba(63,174,73,0.12), transparent 60%),
    linear-gradient(168deg,#f9fdfa 0%,#eff8f2 48%,#eaf5ee 100%);
  background-attachment:fixed;
}

/* ---------- หน้ารอเปิด ---------- */
#splash{position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
  background:linear-gradient(168deg,#f9fdfa,#eaf5ee); transition:opacity 0.35s ease;}
#splash.hide{opacity:0; pointer-events:none;}
#splash img{height:64px; animation:pulse 1.4s ease-in-out infinite;}
#splash .t1{font-size:18px; font-weight:700; color:var(--green-dd);}
#splash .t2{font-size:13px; color:var(--ink2);}
#splash .bar{width:180px; height:4px; border-radius:99px; background:rgba(23,73,29,0.10); overflow:hidden;}
#splash .bar span{display:block; width:40%; height:100%; border-radius:99px;
  background:linear-gradient(90deg,var(--green),var(--green-dd)); animation:slide 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.55;}}
@keyframes slide{0%{transform:translateX(-120%);} 100%{transform:translateX(420%);}}

/* ---------- แถบความคืบหน้าตอนสลับข้อมูล ---------- */
#loadbar{position:fixed; top:0; left:0; right:0; height:3px; z-index:150; pointer-events:none;
  background:linear-gradient(90deg,var(--green),var(--green-dd)); transform:scaleX(0);
  transform-origin:left; opacity:0;}
#loadbar.run{opacity:1; animation:loadgrow 0.5s ease-out forwards;}
@keyframes loadgrow{0%{transform:scaleX(0);} 80%{transform:scaleX(0.85);} 100%{transform:scaleX(1);}}
main.dim .grid{opacity:0.45; transition:opacity 0.15s ease;}
main .grid{transition:opacity 0.2s ease;}

/* ---------- ชั้นแสงพื้นหลัง ของประดับล้วน ค่าความเข้มคุมด้วยผลทดสอบความคมชัด ---------- */
.bg-field{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.bg-field span{position:absolute; display:block; border-radius:50%; filter:blur(76px); opacity:0.42;}
.bg-field .o1{width:44vw; height:44vw; left:-10vw; top:-14vw; background:radial-gradient(circle at 32% 32%,rgba(63,174,73,0.42),rgba(63,174,73,0) 70%);}
.bg-field .o2{width:38vw; height:38vw; right:-8vw; top:6vh; background:radial-gradient(circle at 60% 40%,rgba(47,93,138,0.26),rgba(47,93,138,0) 70%);}
.bg-field .o3{width:40vw; height:40vw; left:38vw; bottom:-16vw; background:radial-gradient(circle at 40% 60%,rgba(217,163,0,0.26),rgba(217,163,0,0) 70%);}
.app{position:relative; z-index:1; display:flex; flex-direction:column; min-height:100vh;}

/* ---------- ทางลัดแป้นพิมพ์ ---------- */
.skip{position:absolute; left:-9999px; top:8px; z-index:99;
  background:var(--green-dd); color:#ffffff; font-size:14px; font-weight:600;
  border-radius:var(--r-sm); padding:10px 18px; text-decoration:none;}
.skip:focus{left:12px;}

/* ---------- แถบหัวด้านบน แทนแถบเมนูด้านซ้าย แก้ 3 ก.ย. 2569 ตามคำสั่ง Yuth ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:10px 32px;
  background:linear-gradient(180deg,rgba(255,255,255,0.94),rgba(255,255,255,0.76));
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-edge);
  box-shadow:0 6px 26px rgba(23,73,29,0.06);
}
.brand{display:flex; align-items:center; gap:12px; position:relative;}
.brand img{height:34px; display:block;}
.brand .b1{font-size:14px; font-weight:700; color:var(--green-dd); line-height:1.35;}
.brand .b2{font-size:12px; color:var(--ink2); line-height:1.6;}
.nav{display:flex; flex-direction:row; gap:4px; padding:4px; min-width:0;
  background:rgba(244,248,244,0.92); border:1px solid var(--glass-edge); border-radius:99px;}
.nav button{
  position:relative; display:block; cursor:pointer; white-space:nowrap;
  font-family:inherit; font-size:14px; font-weight:500; color:var(--ink); line-height:1.5;
  background:transparent; border:1px solid transparent; border-radius:99px;
  padding:9px 18px; transition:background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
}
.nav button:hover{background:rgba(255,255,255,0.9); border-color:var(--glass-edge);}
.nav button:active{transform:scale(0.98);}
.nav button.active{
  color:var(--green-dd); font-weight:600;
  background:#ffffff; border-color:rgba(46,133,54,0.35);
  box-shadow:var(--shadow-s), inset 0 1px 0 var(--glass-edge-in);
}


/* ---------- พื้นที่เนื้อหา ---------- */
main{flex:1; padding:28px 32px 48px 32px; min-width:0;}
.page{display:none;}
.page.show{display:block; animation:rise 0.32s ease both;}
@keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.page-head{display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-bottom:12px;}
.page-head h1{font-size:28px; font-weight:800; color:var(--ink); line-height:1.3; letter-spacing:-0.2px;}
.page-head .spacer{flex:1;}
.controls{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink2); font-weight:500; flex-wrap:wrap;}
select, input[type="search"], input[type="text"]{
  font-family:inherit; font-size:14px; font-weight:500; color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,0.92),rgba(255,255,255,0.74));
  -webkit-backdrop-filter:var(--glass-blur-lite); backdrop-filter:var(--glass-blur-lite);
  border:1px solid var(--glass-edge); border-radius:var(--r-sm);
  padding:9px 12px; cursor:pointer; max-width:360px; box-shadow:var(--shadow-s);
}
input[type="search"], input[type="text"]{cursor:text;}
select:hover, input[type="search"]:hover{border-color:rgba(46,133,54,0.5);}
.src-line{font-size:12.5px; color:var(--ink2); margin-bottom:20px; line-height:1.75;}

/* ---------- จุดโฟกัสแป้นพิมพ์ ---------- */
a:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible,
input:focus-visible, [tabindex]:focus-visible{
  outline:none; box-shadow:var(--ring); border-radius:var(--r-sm);
}
select:focus{outline:none;}

/* ---------- ตัวเลือกเดือนแบบชิป ---------- */
.mbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.mchips{display:flex; gap:8px; flex-wrap:wrap;}
.mchip{
  font-family:inherit; font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;
  background:rgba(255,255,255,0.72); border:1px solid var(--glass-edge); border-radius:99px;
  padding:7px 15px; box-shadow:var(--shadow-s);
  transition:background 0.16s ease, color 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
}
.mchip:hover{border-color:rgba(46,133,54,0.55); background:rgba(255,255,255,0.92);}
.mchip:active{transform:scale(0.95);}
.mchip[aria-pressed="true"]{
  color:#ffffff; font-weight:600; border-color:rgba(255,255,255,0.4);
  background:linear-gradient(135deg,var(--green-d),var(--green-deep));
  box-shadow:var(--shadow-m), inset 0 1px 0 rgba(255,255,255,0.25);
}
.mhint{font-size:12px; color:var(--ink2);}

/* ---------- กริดและการ์ดกระจก ---------- */
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:24px; align-items:start;}
/* แถวการ์ดตัวเลขสรุป ให้สูงเท่ากันทุกใบแม้ข้อความยาวไม่เท่ากัน */
.grid.tilerow{align-items:stretch;}
.card{
  position:relative; isolation:isolate; min-width:0;
  background:var(--glass);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-edge); border-radius:var(--r-lg);
  padding:22px 24px;
  box-shadow:var(--shadow-m), inset 0 1px 0 var(--glass-edge-in);
  transition:transform 0.22s ease, box-shadow 0.22s ease;
}
.card::before{
  content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,0.55) 0%,rgba(255,255,255,0) 38%);
}
.card:hover{transform:translateY(-2px); box-shadow:var(--shadow-l), inset 0 1px 0 var(--glass-edge-in);}
.card h3{font-size:18px; font-weight:700; margin-bottom:4px; letter-spacing:-0.1px;}
.card .sub{font-size:12.5px; color:var(--ink2); margin-bottom:16px; line-height:1.7;}
.card .foot{font-size:12px; color:var(--ink2); margin-top:14px; line-height:1.7;}
.span3{grid-column:span 3;} .span4{grid-column:span 4;} .span6{grid-column:span 6;}
.span8{grid-column:span 8;} .span12{grid-column:span 12;}
@media (max-width:1100px){ .span3,.span4{grid-column:span 6;} .span6,.span8{grid-column:span 12;} }

/* ---------- การ์ดตัวเลขสำคัญ ---------- */
.tile .lbl{font-size:14px; font-weight:500; color:var(--ink2); line-height:1.55;}
.tile .num{font-size:40px; font-weight:800; line-height:1.2; margin:8px 0 4px 0;
  color:var(--green-dd); font-variant-numeric:tabular-nums; letter-spacing:-1px;}
.tile .cmp{font-size:13px; font-weight:500; color:var(--ink2); line-height:1.7;}
.cmp .up{color:var(--green-dd); font-weight:600;}
.cmp .down{color:var(--red); font-weight:600;}
.tile-hero{
  border:1px solid rgba(63,174,73,0.42); color:#ffffff;
  background:linear-gradient(135deg,var(--green-deep) 0%,var(--green-dd) 100%);
  box-shadow:0 16px 40px rgba(23,73,29,0.32), inset 0 1px 0 rgba(255,255,255,0.22);
}
.tile-hero::before{background:radial-gradient(16rem 11rem at 112% -20%, rgba(255,255,255,0.20), transparent 66%);}
.tile-hero .lbl,.tile-hero .cmp{color:#ffffff;}
.tile-hero .num{font-size:48px; color:#ffffff;}
.tile-hero .cmp .up,.tile-hero .cmp .down{color:#ffffff; text-decoration:underline; text-underline-offset:3px;}

/* ป้ายเกรดและป้ายสถานะ สีคู่กับคำเสมอ */
.chip{display:inline-block; border-radius:99px; font-size:12px; font-weight:600;
  padding:3px 12px; white-space:nowrap; border:1px solid transparent;}
.chip.pass{background:rgba(234,246,235,0.95); color:var(--green-dd); border-color:rgba(46,133,54,0.34);}
.chip.fail{background:rgba(251,232,228,0.95); color:var(--red); border-color:rgba(184,65,46,0.34);}
.chip.na{background:rgba(255,255,255,0.72); color:var(--ink2); border-color:var(--line);}

.chip-grade{display:inline-block; border-radius:99px; font-size:13px; font-weight:600;
  padding:4px 14px; margin-top:10px; border:1px solid transparent;}
.chip-grade.gA{background:#eaf6eb; color:var(--green-dd); border-color:rgba(46,133,54,0.5);}
.chip-grade.gB{background:var(--amber-bg); color:var(--ink); border-color:var(--amber);}
.chip-grade.gC{background:var(--red-bg); color:var(--red); border-color:rgba(184,65,46,0.5);}

/* กล่องเน้นข้อที่ยังไม่ถึงเป้า */
.hl-amber{display:inline-block; background:var(--amber-bg); border:1px solid var(--amber);
  color:var(--ink); border-radius:var(--r-sm); padding:4px 10px; font-size:12.5px; font-weight:500;
  margin-top:8px; line-height:1.6;}

/* ---------- แถบตัวกรองของตาราง ---------- */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.toolbar .fgroup{display:flex; align-items:center; gap:8px;}
.fchip{
  font-family:inherit; font-size:12.5px; font-weight:500; color:var(--ink); cursor:pointer;
  background:rgba(255,255,255,0.72); border:1px solid var(--glass-edge); border-radius:99px;
  padding:6px 13px; transition:all 0.15s ease;
}
.fchip:hover{border-color:rgba(46,133,54,0.5);}
.fchip:active{transform:scale(0.96);}
.fchip[aria-pressed="true"]{color:var(--green-dd); font-weight:600; background:rgba(234,246,235,0.95);
  border-color:rgba(46,133,54,0.55);}
.toolbar select{padding:7px 10px; font-size:12.5px; max-width:230px;}
.toolbar input[type="search"]{padding:7px 12px; font-size:12.5px; width:180px;}
.count-line{font-size:12px; color:var(--ink2); margin-bottom:8px;}

/* ---------- ตาราง ---------- */
.tbl-wrap{overflow-x:auto; border-radius:var(--r-md); border:1px solid rgba(255,255,255,0.6);
  background:rgba(255,255,255,0.42); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
table{border-collapse:collapse; width:100%; font-size:13px;}
th{font-size:12px; font-weight:600; color:var(--ink2); text-align:left; padding:11px 14px;
  border-bottom:1px solid rgba(23,73,29,0.16); background:rgba(255,255,255,0.9);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  white-space:nowrap; position:sticky; top:0; z-index:2;}
td{padding:10px 14px; border-bottom:1px solid rgba(23,73,29,0.08); vertical-align:top; line-height:1.65;}
tbody tr:nth-child(even) td{background:rgba(255,255,255,0.34);}
tbody tr:hover td{background:rgba(234,246,235,0.62);}
tbody tr.rowfail td{background:rgba(251,232,228,0.42);}
tbody tr.rowfail:hover td{background:rgba(251,232,228,0.66);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
tr.subrow td{color:var(--ink2); font-size:12px;}
tr.clickable{cursor:pointer;}
td.kname{min-width:220px; max-width:360px;}
td .cell-sub{font-size:12px; color:var(--ink2); margin-top:2px;}
td .val-bad{color:var(--red); font-weight:600;}
/* คะแนนที่เกิน 100 ตามชีท เน้นให้เห็นว่าไม่ใช่ค่าที่ถูกตัดเพดาน */
td.val-over{color:var(--green-dd); font-weight:700;}
th.mon-hl, td.mon-hl{background:rgba(234,246,235,0.7);}
.delta-up{color:var(--green-dd); font-weight:600;}
.delta-down{color:var(--red); font-weight:600;}

/* แถบคะแนนเล็กในตาราง */
.minibar{display:inline-block; vertical-align:middle; width:76px; height:8px; border-radius:5px;
  background:rgba(255,255,255,0.65); border:1px solid var(--glass-edge); overflow:hidden; margin-left:10px;}
.minibar span{display:block; height:100%; border-radius:4px;}
/* ขีดบอกตำแหน่ง 100 คะแนน ใช้เมื่อรางถูกยืดเพราะมีข้อที่เกิน 100 */
.minibar{position:relative;}
.minibar i{position:absolute; top:0; bottom:0; width:2px; background:rgba(30,40,34,0.5);}

/* ---------- แถบความคืบหน้า ---------- */
.track{background:rgba(255,255,255,0.55); border:1px solid var(--glass-edge);
  border-radius:6px; height:14px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(23,73,29,0.09); position:relative;}
.track .fill{height:100%; border-radius:5px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.42);
  width:0; transition:width 0.55s cubic-bezier(0.25,0.6,0.3,1);}
.track.slim{height:9px; margin-top:4px;}
.mini-legend{display:flex; gap:14px; font-size:12px; color:var(--ink2); margin:2px 0 10px 0; flex-wrap:wrap;}

/* ---------- คำอธิบายชุดสี ---------- */
.legend-strip{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink2); margin-top:12px; line-height:1.7;}
.legend-strip .key{display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:6px; vertical-align:-1px;
  background:linear-gradient(180deg,#4cbb57,var(--green));}
/* ปุ่มคำอธิบายของช่วงที่เสียไป ใช้ลายเดียวกับในแท่งจริง เพื่อให้เทียบกันได้โดยไม่ต้องพึ่งสี */
.legend-strip .key.dash{width:22px; height:0; border-radius:0; border-top:2px dashed #a37800; vertical-align:4px;}
.legend-strip .key.linekey{width:22px; height:0; border-radius:0; border-top:3px solid #6595bf; vertical-align:4px;}
.legend-strip .key.hatch{background:
  repeating-linear-gradient(135deg, rgba(255,255,255,0.42) 0 3px, rgba(255,255,255,0) 3px 7px),
  linear-gradient(180deg,#b8412e,#8f3d2c);}

svg{display:block; width:100%; height:auto;}
svg text{font-family:'Prompt','Leelawadee UI','Segoe UI',Tahoma,sans-serif;}
svg .clickable{cursor:pointer;}
.viewlink{background:none; border:none; font-family:inherit; font-size:12.5px; font-weight:600;
  color:var(--green-dd); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  padding:5px 8px; min-height:26px;}
.viewlink:hover{color:var(--green-deep);}

/* ---------- ปุ่มทั่วไป ---------- */
.btn{display:inline-block; font-family:inherit; font-size:14px; font-weight:600; color:#ffffff;
  border:1px solid rgba(255,255,255,0.28); border-radius:12px; padding:11px 24px; cursor:pointer;
  background:linear-gradient(135deg,var(--green-d),var(--green-deep));
  box-shadow:var(--shadow-m), inset 0 1px 0 rgba(255,255,255,0.3);
  transition:transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;}
.btn:hover{transform:translateY(-1px); filter:brightness(1.06);}
.btn:active{transform:translateY(0) scale(0.98);}
.btn.sec{color:var(--green-dd); background:rgba(255,255,255,0.78); border:1px solid rgba(46,133,54,0.55);
  -webkit-backdrop-filter:var(--glass-blur-lite); backdrop-filter:var(--glass-blur-lite);}
.btn.mini{font-size:12.5px; padding:7px 14px; border-radius:10px;}

.sum-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:6px 0 14px 0;}
.sum-head h2{font-size:18px; font-weight:700; color:var(--green-dd);}
.sum-head .when{font-size:13px; color:var(--ink2);}
.sum-tag{display:inline-block; font-size:12px; font-weight:600; color:#8a6a00; background:#fff3d1; border:1px solid #f0dc9a; border-radius:999px; padding:2px 10px; margin-left:6px; vertical-align:middle;}
.tile .num small{font-size:16px; font-weight:600; color:var(--ink2); margin-left:6px; letter-spacing:0;}
.tile-hero .num small{color:rgba(255,255,255,0.85);}
.tile .lbl .ic{vertical-align:-3px; margin-right:6px;}

/* ---------- คำอธิบายลอย ---------- */
#tip .tip-head{font-weight:700;}
#tip ul{margin:5px 0 0 0; padding-left:16px;}
#tip li{margin-top:3px; line-height:1.6;}
#tip{position:fixed; z-index:50; color:#ffffff; font-size:12px; line-height:1.6;
  padding:8px 12px; border-radius:var(--r-sm); pointer-events:none; display:none; max-width:330px;
  background:rgba(30,40,34,0.93); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.18); box-shadow:var(--shadow-l);}

.page-foot{font-size:12px; color:var(--ink2); margin-top:28px; padding-top:12px; line-height:1.8;
  border-top:1px solid rgba(23,73,29,0.14);}

/* ---------- เครื่องที่ไม่รองรับการเบลอพื้นหลัง ---------- */
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
  .card,.tbl-wrap{background:rgba(255,255,255,0.96);}
  .topbar{background:rgba(255,255,255,0.97);}
  select,.btn.sec,.mchip,.fchip{background:rgba(255,255,255,0.96);}
  th{background:#ffffff;}
}

/* ---------- ผู้ใช้ที่ขอลดการเคลื่อนไหว ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.001ms !important; animation-iteration-count:1 !important;
    transition-duration:0.001ms !important;}
  .card:hover{transform:none;}
  .track .fill{transition:none;}
}

/* ---------- จอแคบ ---------- */
@media (max-width:760px){
  .app{display:block;}
  .topbar{padding:10px 16px; gap:12px;}
  .brand img{height:30px;}
  .brand .b1{font-size:13px;}
  .nav{flex:1 1 100%; overflow-x:auto;}
  .nav button{flex:1 1 auto; text-align:center; padding:10px 14px;}
  main{padding:16px 16px 36px 16px;}
  .grid{gap:16px;}
  .span3,.span4,.span6,.span8{grid-column:span 12;}
  .card{padding:18px 16px; border-radius:var(--r-md);}
  .page-head{gap:10px;}
  .page-head h1{font-size:24px;}
  .page-head .spacer{display:none;}
  .controls{width:100%;}
  .controls select{flex:1 1 100%; width:100%; max-width:100%;}
  .toolbar input[type="search"]{width:100%;}
  .tile .num{font-size:34px;}
  .tile-hero .num{font-size:36px;}
  /* ตารางตัวชี้วัดบนจอแคบ เปลี่ยนเป็นการ์ดเรียงลงมา ไม่ต้องเลื่อนซ้ายขวา แก้ 3 ก.ย. 2569 */
  #kpiTable{overflow-x:visible;}
  #kpiTable table, #kpiTable tbody, #kpiTable tr, #kpiTable td{display:block; width:auto;}
  #kpiTable thead{display:none;}
  #kpiTable tr{background:rgba(255,255,255,0.96); border:1px solid var(--line);
    border-radius:var(--r-md); padding:12px 14px; margin-bottom:12px;}
  #kpiTable td{border:none; padding:5px 0; text-align:left;
    display:flex; justify-content:space-between; align-items:baseline; gap:14px;}
  #kpiTable td::before{content:attr(data-label); flex:0 0 auto;
    font-size:12.5px; font-weight:600; color:var(--ink2);}
  #kpiTable td.kname{display:block; font-weight:700; padding-bottom:6px;}
  #kpiTable td.kname::before{content:none;}
}

/* ---------- งานพิมพ์ ถอดผิวกระจกทั้งหมด ---------- */
@media print{
  body{background:#ffffff !important; background-image:none !important;}
  .bg-field,.topbar,.skip,#splash,#loadbar,.toolbar,.mbar{display:none !important;}
  main{padding:0;}
  .card,.tbl-wrap{
    background:#ffffff !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important;
    border:1px solid #dce7dd !important; box-shadow:none !important;}
  .card::before,.tile-hero::before{display:none !important;}
  .tile-hero{background:#ffffff !important; color:var(--ink) !important; border:1px solid var(--green-d) !important;}
  .tile-hero .lbl,.tile-hero .cmp,.tile-hero .num{color:var(--ink) !important;}
  .page{display:block !important;}
  th{position:static;}
}

/* ============ รอบที่สาม ปรับตามคำสั่ง 10 จุด 21 ส.ค. 2569 ============ */

/* ชื่อหน้าแบบเน้น มีสีและเงาอ่อน */
.title-hero{
  font-size:30px; font-weight:800; line-height:1.3; letter-spacing:-0.3px;
  color:var(--green-dd);
  text-shadow:0 1px 0 rgba(255,255,255,0.85), 0 3px 10px rgba(23,73,29,0.14);
}
.card-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
.card-head h3{flex:1;}

/* ไอคอนที่วาดด้วย SVG ในไฟล์ ไม่ใช้อิโมจิและไม่ใช้ฟอนต์ไอคอน
   ต้องล้มกฎ svg กว้างเต็มกล่องที่ประกาศไว้ด้านบน ไม่เช่นนั้นไอคอนจะขยายเต็มการ์ด */
svg.ic{display:inline-block !important; width:auto !important; height:auto !important;
  vertical-align:-3px; flex:0 0 auto;}
svg.ic-lg{vertical-align:-6px;}

/* แถบเลือกช่วงเวลา */
.mbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
.mbar select{min-width:250px;}
.mchips[hidden]{display:none;}

/* รายการเกณฑ์เกรดแบบมีหัวข้อย่อยและไอคอน */
.grade-key{margin-top:14px; padding-top:12px; border-top:1px solid rgba(23,73,29,0.12);}
.grade-key .gk-head{font-size:12.5px; font-weight:600; color:var(--ink2); margin-bottom:8px;}
.grade-key ul{list-style:none; display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:8px 20px;}
.grade-key li{display:flex; align-items:flex-start; gap:9px; font-size:12.5px; line-height:1.6; color:var(--ink);}
.grade-key li .gk-range{font-weight:700; white-space:nowrap;}
.grade-key .gk-note{margin-top:10px; font-size:12px; color:var(--ink2);}
.grade-key ul.gk-row{display:flex; flex-wrap:wrap; gap:8px 10px;}
.grade-key ul.gk-row li{align-items:center; gap:7px; padding:5px 12px;
  background:rgba(255,255,255,0.82); border:1px solid var(--glass-edge); border-radius:99px;}

/* การ์ดกราฟคู่ในหน้าเจาะรายตัวชี้วัด ต้องวางตรงกันทุกบรรทัด
   คำอธิบายสีถูกดันไปชิดขอบล่าง การ์ดสองใบจึงจบระดับเดียวกัน */
#page-kpi .grid .card.span6{display:flex; flex-direction:column;}
#page-kpi .grid .card.span6 .sub{min-height:21px;}
#page-kpi .grid .card.span6 .legend-strip{margin-top:auto;}

/* การ์ดสี่ใบในหน้าเจาะรายตัวชี้วัด ให้อ่านง่ายขึ้นตามคำสั่ง 23 ส.ค. 2569 */
#kpiTiles .lbl{font-size:15px;}
#kpiTiles .cmp{font-size:14px;}
#kpiTiles .chip{font-size:13px;}

/* ตัวเลขเด่นตัวเดียว คำนำหน้าและคำหน่วยใช้ขนาดเท่าข้อความรอง ตามคำสั่ง 28 ส.ค. 2569 ข้อ 1 */
#page-kpi #kpiTiles .num{font-size:30px; font-weight:700; letter-spacing:-0.2px; line-height:1.35;}
#page-kpi #kpiTiles .num .num-lead,
#page-kpi #kpiTiles .num .num-unit,
#page-kpi #kpiTiles .num .num-note{
  font-size:14px; font-weight:500; color:var(--ink2); letter-spacing:0; white-space:nowrap;}
#page-kpi #kpiTiles .num .num-unit,
#page-kpi #kpiTiles .num .num-note{margin-left:6px;}
#page-kpi #kpiTiles .num .num-lead{margin-right:6px;}
#kpiTiles .tile{cursor:help;}

/* ตารางข้อมูลประกอบ ให้เห็นทันทีว่าแถวไหนสำคัญ ตามคำสั่ง 28 ส.ค. 2569 ข้อ 5 */
#subTable tr.mainrow td{background:rgba(234,246,235,0.9); font-weight:700; color:var(--ink);
  font-size:14px; border-bottom:1px solid rgba(23,73,29,0.2);}
#subTable tr.mainrow td:first-child{box-shadow:inset 3px 0 0 var(--green-deep);}
#subTable tr.mainrow:hover td{background:rgba(226,243,228,0.98);}
#subTable tr.scorerow td{background:rgba(255,255,255,0.55); font-weight:600; color:var(--ink2);}
#subTable tr.scorerow:hover td{background:rgba(240,248,241,0.9);}
#subTable tbody.subs td{font-size:12px; color:var(--ink2); background:rgba(247,250,247,0.75);}
#subTable tbody.subs td:first-child{padding-left:32px;}
#subTable tbody.subs[hidden]{display:none;}
/* จอแคบ ตรึงคอลัมน์ชื่อรายการไว้ซ้ายมือ ผู้อ่านจึงรู้ว่ากำลังดูแถวไหนขณะเลื่อน แก้ 4 ก.ย. 2569 */
.scroll-hint{display:none;}
@media (max-width:760px){
  .scroll-hint{display:block; font-size:12px; color:var(--ink2); margin:2px 0 8px 0;}
  #subTable table{min-width:640px;}
  #subTable th:first-child, #subTable td:first-child{
    position:sticky; left:0; z-index:2; background:#ffffff;
    box-shadow:1px 0 0 var(--line);}
  #subTable tr.mainrow td:first-child{background:#eaf6eb;}
  #subTable tbody.subs td:first-child{background:#f7faf7; padding-left:16px;}
}
.subs-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px;}
.subs-note{font-size:12px; color:var(--ink2); line-height:1.7;}

/* การ์ดคะแนนรวม */
.tile-hero .hero-score{display:flex; align-items:baseline; gap:10px; margin:8px 0 4px 0;}
.tile-hero .hero-score .num{margin:0;}
.tile-hero .hero-full{font-size:18px; font-weight:500; color:rgba(255,255,255,0.92);}
.grade-block{
  display:flex; align-items:center; gap:11px; margin-top:14px; padding:11px 15px;
  border-radius:14px; background:rgba(255,255,255,0.95); border:1px solid rgba(255,255,255,0.5);
}
.grade-block .gtxt{line-height:1.35;}
.grade-block .gname{font-size:22px; font-weight:800; letter-spacing:-0.3px;}
.grade-block .gword{font-size:12.5px; font-weight:500; color:var(--ink2);}
.grade-block.gA .gname{color:var(--green-dd);}
.grade-block.gB .gname{color:#8a6a00;}
.grade-block.gC .gname{color:var(--red);}
/* เนื้อหารองในการ์ดคะแนนรวม ผลรายตัวชี้วัดของเดือน */
.tile-hero .hero-sub{margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.34);}
.tile-hero .hero-sub .hs-head{font-size:12.5px; font-weight:600; color:rgba(255,255,255,0.95); margin-bottom:4px;}
.tile-hero .hero-sub ul{padding-left:18px; margin:0;}
.tile-hero .hero-sub li{font-size:12.5px; font-weight:400; color:rgba(255,255,255,0.92); line-height:1.7; margin-top:2px;}

/* รายการอธิบายใต้หัวการ์ด */
.sub-list{padding-left:20px; margin:4px 0 14px 0;}
.sub-list li{font-size:12.5px; color:var(--ink2); line-height:1.75; margin-top:2px;}

/* การ์ดที่มาของคะแนน */
.srcbars{margin-top:4px;}
.srcrow{margin-bottom:16px;}
.srcrow:last-child{margin-bottom:0;}
.srcrow .r1{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:6px;}
.srcrow .nm2{font-size:14px; font-weight:600; color:var(--ink); line-height:1.5;}
.srcrow .vl{font-size:14px; font-weight:700; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums;}
.srcrow .vl .dim{font-weight:500; color:var(--ink2);}
.srcrow .r2{font-size:12px; color:var(--ink2); margin-top:5px; line-height:1.6;}

/* แถวคะแนนรายข้อ แท่งเต็มคือน้ำหนัก */
/* รายการข้อที่เสียคะแนน วางสองคอลัมน์ ไล่จากบนลงล่างในคอลัมน์ซ้ายก่อน */
/* รายการข้อที่เสียคะแนน ไล่อันดับตามลำดับการอ่าน คือจากซ้ายไปขวาแล้วขึ้นแถวใหม่ */
.lossgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 30px; margin-top:6px;}
@media (max-width:900px){ .lossgrid{grid-template-columns:minmax(0,1fr) !important; gap:0;} }
.lossrow{display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent;
  border-radius:var(--r-sm); padding:9px 10px; margin-bottom:5px; cursor:pointer; font-family:inherit;
  transition:background 0.15s ease, border-color 0.15s ease;}
.lossrow:hover{background:rgba(255,255,255,0.78); border-color:var(--glass-edge);}
.lossrow .l1{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px;}
/* ชื่อตัวชี้วัดต้องอ่านได้ครบ จึงให้ตัดบรรทัดตามคำ ไม่ตัดท้ายด้วยจุดสามจุด */
.lossrow .nm{font-size:12.5px; font-weight:500; color:var(--ink); line-height:1.5;
  flex:1 1 auto; min-width:0;}
.lossrow .lv{font-size:12.5px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;
  flex:0 0 auto;}
.lossrow .lv.zero{color:var(--green-dd); font-weight:600;}
.lossrow .lv.loss{color:var(--red);}
.wbar{display:flex; height:16px; border-radius:6px; overflow:hidden;
  border:1px solid rgba(46,133,54,0.42);
  background:rgba(255,255,255,0.55); box-shadow:inset 0 1px 3px rgba(23,73,29,0.09);}
/* ช่วงที่เก็บได้กับช่วงที่เสียไป ต้องแยกออกได้แม้ผู้อ่านตาบอดสี
   จึงใช้สามทางพร้อมกัน คือความสว่างต่างกัน มีเส้นขาวคั่นไม่ให้สองสีแตะกัน
   และช่วงที่เสียไปมีลายทแยงซึ่งอ่านได้โดยไม่ต้องพึ่งสี */
.wbar .got{background:linear-gradient(180deg,#4cbb57,var(--green));
  transition:width 0.55s cubic-bezier(0.25,0.6,0.3,1); width:0;}
.wbar .lost{background:
  repeating-linear-gradient(135deg, rgba(255,255,255,0.34) 0 3px, rgba(255,255,255,0) 3px 7px),
  linear-gradient(180deg,#b8412e,#8f3d2c);
  box-shadow:inset 3px 0 0 #ffffff;
  transition:width 0.55s cubic-bezier(0.25,0.6,0.3,1); width:0;}
.wbar .rest{background:transparent;}
.wbar{position:relative;}
.wbar i{position:absolute; top:0; bottom:0; width:2px; background:rgba(30,40,34,0.62); z-index:2;}
.srcfoot{font-size:12px; color:var(--ink2); margin-top:12px; line-height:1.6;}
.sparkbox{margin-top:10px;}
.spark-na{font-size:12px; color:var(--ink2); padding:14px 0;}
.spark-cap{font-size:12px; color:var(--ink2); margin-top:4px; line-height:1.6;}
.help-btn{display:inline-flex; align-items:center; justify-content:center; min-height:32px; padding:0 14px;
  border-radius:99px; border:1px solid var(--green-deep); background:#ffffff; color:var(--green-deep);
  font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;}
.help-btn:hover{background:rgba(63,174,73,0.10);}
.help-btn[aria-expanded="true"]{background:var(--green-deep); color:#ffffff;}
.help-btn:focus-visible{outline:2px solid var(--green-deep); outline-offset:2px;}
.popbox{margin-top:12px; border:1px solid var(--line); border-radius:10px; background:#f7faf7;
  padding:14px 16px; font-size:13px; color:var(--ink); line-height:1.75; max-width:760px;}
.popbox[hidden]{display:none;}
.popbox .nt-head{font-weight:700; font-size:13px; margin-bottom:8px;}
.popbox ul{margin:0; padding-left:18px;}
.popbox li{margin-bottom:6px;}
.popbox li:last-child{margin-bottom:0;}
.lossrow .wt{font-size:12px; font-weight:400; color:var(--ink2); white-space:nowrap;}

/* โทนสีของหน้าเจาะรายตัวชี้วัด เปลี่ยนตามระดับความห่างจากเป้า
   ค่าตั้งต้นคือโทนเขียวถึงเป้า ทุกค่าสีผ่านเกณฑ์ความต่างสีของ WCAG 2.1 ระดับ AA */
#page-kpi{--tone-ink:#17491d; --tone-line:#3fae49; --tone-wash:rgba(234,246,235,0.72); --tone-edge:rgba(46,133,54,0.34);}
#page-kpi.tone-fail{--tone-ink:#b8412e; --tone-line:#b8412e; --tone-wash:rgba(251,232,228,0.86); --tone-edge:rgba(184,65,46,0.34);}
#page-kpi.tone-na{--tone-ink:#566058; --tone-line:#c9d3ca; --tone-wash:rgba(255,255,255,0.7); --tone-edge:var(--line);}
#page-kpi .kpi-head{background:var(--tone-wash); border:1px solid var(--tone-edge); border-left:6px solid var(--tone-line);
  border-radius:var(--r-md); padding:16px 20px 18px 20px;}
#page-kpi .kpi-head h1{color:var(--tone-ink); text-shadow:none;}
#page-kpi .kpi-head .eyebrow{color:var(--tone-ink);}
#page-kpi #kpiTiles .card{border-top:3px solid var(--tone-line);}
#page-kpi #kpiTiles .num{color:var(--tone-ink);}
#page-kpi .grid .card:not(.tile){border-top:3px solid var(--tone-line);}
#page-kpi .grid .card h3{color:var(--tone-ink);}

/* กล่องข้อจำกัดของข้อมูลแบบย่อ กดที่ไอคอนจึงกาง */
.limit-wrap{margin-top:10px;}
.limit-btn{display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:44px; padding:8px 14px; font-family:inherit; font-size:13px; font-weight:600; color:#6b5100;
  border-radius:99px; border:1px solid rgba(217,163,0,0.55); background:rgba(255,243,209,0.9); cursor:pointer;}
.limit-btn:hover{background:rgba(255,236,178,0.95);}
.limit-btn.on{background:rgba(255,228,150,0.95);}
.limit-btn:focus-visible{outline:2px solid var(--green-deep); outline-offset:2px;}
.limit-wrap .datalimit{margin-top:8px;}
.datalimit[hidden]{display:none;}


/* หัวหน้าเจาะรายตัวชี้วัด */
.kpi-head{margin-bottom:18px;}
.kpi-head-top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
.kpi-head .eyebrow{font-size:13px; font-weight:600; color:var(--ink2); letter-spacing:0.3px;}
.kpi-head .spacer{flex:1;}
.kpi-head h1{font-size:28px; font-weight:800; line-height:1.35; color:var(--green-dd); letter-spacing:-0.2px;
  text-shadow:0 1px 0 rgba(255,255,255,0.8), 0 3px 10px rgba(23,73,29,0.12);}
.kpi-status{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
.badge{display:inline-flex; align-items:center; gap:8px; border-radius:99px; padding:8px 16px;
  font-size:15px; font-weight:700; border:1px solid transparent;}
.badge.pass{background:rgba(234,246,235,0.95); color:var(--green-dd); border-color:rgba(46,133,54,0.45);}
.badge.fail{background:rgba(251,232,228,0.95); color:var(--red); border-color:rgba(184,65,46,0.45);}
.badge.na{background:rgba(255,255,255,0.8); color:var(--ink2); border-color:var(--line);}
.badge-sub{font-size:12.5px; color:var(--ink2); line-height:1.6;}

/* ป้ายสถานะในตารางแบบมีไอคอน */
.chip{display:inline-flex; align-items:center; gap:6px; border-radius:99px; font-size:12px; font-weight:600;
  padding:4px 12px; white-space:nowrap; border:1px solid transparent;}

/* ข้อความข้อจำกัดของข้อมูล */
.datalimit{display:flex; gap:8px; align-items:flex-start; margin-top:10px; padding:9px 13px;
  background:rgba(255,243,209,0.9); border:1px solid rgba(217,163,0,0.55); border-radius:var(--r-sm);
  font-size:12.5px; line-height:1.65; color:var(--ink);}
.fnmark{display:inline-block; font-size:12px; font-weight:700; color:#8a6a00; background:#fff3d1;
  border:1px solid #f0dc9a; border-radius:99px; padding:0 7px; margin-left:6px; vertical-align:2px;}
.fnbox{margin-top:14px; font-size:12.5px; color:var(--ink2); line-height:1.75;}
.fnbox .fn-head{font-weight:600; color:var(--ink); margin-bottom:6px;}
.fnbox ol{margin:0; padding-left:20px;}
.fnbox li{margin-bottom:4px;}
.lead-line{font-size:14.5px; line-height:1.75; color:var(--ink); font-weight:500; margin:4px 0 12px 0;}

@media (max-width:760px){
  .title-hero{font-size:24px;}
  .kpi-head h1{font-size:22px;}
  .mbar select{min-width:0; width:100%; flex:1 1 100%;}
  .grade-key ul{grid-template-columns:1fr;}
}
@media print{
  .title-hero, .kpi-head h1{text-shadow:none !important;}
  .grade-block{background:#ffffff !important; border:1px solid var(--line) !important;}
}
</style>

function icon(kind, size, color){

  const open = `<svg class="ic${z>=22?" ic-lg":""}" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" aria-hidden="true">`;
  if(kind==="check")
    return open+`<circle cx="12" cy="12" r="10" fill="${c}"/><path d="M7.4 12.4l3 3 6.2-6.6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(kind==="warn")
    return open+`<path d="M12 3.2L22 20.2H2z" fill="${c}"/><rect x="11" y="9" width="2" height="5.4" rx="1" fill="#ffffff"/><rect x="11" y="16" width="2" height="2" rx="1" fill="#ffffff"/></svg>`;
  if(kind==="alert")
    return open+`<circle cx="12" cy="12" r="10" fill="${c}"/><rect x="11" y="6" width="2" height="7.5" rx="1" fill="#ffffff"/><rect x="11" y="15.5" width="2" height="2.2" rx="1" fill="#ffffff"/></svg>`;
  if(kind==="star")
    return open+`<circle cx="12" cy="12" r="10" fill="${c}"/><path d="M12 6.2l1.75 3.9 4.25.45-3.2 2.85.92 4.2L12 15.4l-3.72 2.2.92-4.2L6 10.55l4.25-.45z" fill="#ffffff"/></svg>`;
  if(kind==="target")
    return open+`<circle cx="12" cy="12" r="9.2" stroke="${c}" stroke-width="2"/><circle cx="12" cy="12" r="4.8" stroke="${c}" stroke-width="2"/><circle cx="12" cy="12" r="1.7" fill="${c}"/></svg>`;
  if(kind==="note")
    return open+`<circle cx="12" cy="12" r="10" fill="${c}"/><rect x="11" y="10" width="2" height="7.5" rx="1" fill="#ffffff"/><rect x="11" y="6.3" width="2" height="2.2" rx="1" fill="#ffffff"/></svg>`;

}

function fixScores(){
  (S.kpis||[]).forEach(k=>{
    if(k.name0==null) k.name0 = k.name;
    if(NAME_FIX[k.no]) k.name = NAME_FIX[k.no];
    const f = SCORE_FIX[k.no];
    if(!f || !f.target) return;
    k.m.forEach(m=>{

      m[2] = f.form==="B" ? (m[0] / f.target) : (2 - (m[0] / f.target));
    });
  });
}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const nf0 = new Intl.NumberFormat("th-TH",{maximumFractionDigits:0});
function numf(v,d){return new Intl.NumberFormat("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);}
function fmtBy(kind,v){
  if(v==null||v==="") return "ไม่มีข้อมูล";
  if(typeof v!=="number") return esc(v);
  if(kind==="baht") return nf0.format(v);

  if(kind==="pct")  return numf(v,1)+"%";

}

const SAVE_PCT = {1:1937795};
function savePct(k, v){
  const base = SAVE_PCT[k.no];
  if(!base || v==null) return "";
  const p = (base - v) / base * 100;
  return p>=0 ? " (ประหยัด "+numf(p,1)+"%)" : " (เกินเป้า "+numf(-p,1)+"%)";
}
function fmtTarget(k){
  const dr = DIR_FIX[k.no] || k.dir;
  const dir = dr==="<=" ? "ไม่เกิน" : (dr===">=" ? "ไม่ต่ำกว่า" : "");
  let val = fmtBy(FMT[k.no].t, k.target);
  if(FMT[k.no].t==="plain") val = numf(k.target, k.target<1?2:0);
  let unit = "";
  if(!(k.unit==="%" && FMT[k.no].t==="pctf")) unit = k.unit==="%"? "%" : " "+esc(k.unit);
  return (dir?dir+" ":"")+val+unit;
}

   ทำให้เลข 100 อยู่ในสองเกรด และ 109.5 ไม่มีเกรดรองรับ อีกทั้งขีดกลางผิดวินัยภาษา
   Yuth สั่งให้เกลาให้ช่วงไม่ทับกันเมื่อ 27 ส.ค. 2569 ส่วนขอบเขตที่โค้ดใช้ตัดสินไม่เปลี่ยน */
const GRADE_BANDS = [
  {g:"C",   lo:null, hi:80},
  {g:"B",   lo:80,   hi:100},
  {g:"A",   lo:100,  hi:110},
  {g:"A+",  lo:110,  hi:120},
  {g:"A++", lo:120,  hi:null}
];
function deriveGrade(pct){
  if(pct==null) return "";
  for(let i=0; i<GRADE_BANDS.length; i++){
    const b = GRADE_BANDS[i];
    if(b.hi==null || pct<b.hi) return b.g;
  }
  return "A++";
}
/* ข้อความช่วงคะแนนของเกรด สร้างจากขอบเขตจริงที่ใช้ตัดสิน ไม่ได้พิมพ์ทับ */
function gradeRange(g){
  for(let i=0; i<GRADE_BANDS.length; i++){
    const b = GRADE_BANDS[i];
    if(b.g!==g) continue;
    if(b.lo==null) return "ต่ำกว่า "+b.hi+"%";
    if(b.hi==null) return GRADE_TOP_RANGE;
    return b.lo+"% ถึงน้อยกว่า "+b.hi+"%";
  }
  return "";
}
function gradeWord(g){
  const L = {"C":"ต้องปรับปรุงหรือพัฒนา","B":"ต่ำกว่ามาตรฐาน","A":"ได้ตามมาตรฐาน","A+":"ดีกว่ามาตรฐาน","A++":"ดีกว่ามาตรฐานมาก"};
  return L[g]||"";
}
function gradeClass(g){
  if(g==="C") return "gC";
  if(g==="B") return "gB";
  return "gA";
}

const tip = $("tip");
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("mousemove",e=>{
      tip.innerHTML = el.getAttribute("data-tip");
      tip.style.display = "block";
      /* หนีบตำแหน่งจากขนาดจริงของกล่อง ไม่ใช่ค่าคงที่ เพราะกล่องแบบรายการหัวข้อย่อยสูงและกว้างกว่าเดิม
         ถ้าใช้ค่าคงที่ กล่องจะยื่นพ้นขอบขวาหรือขอบล่างจนข้อความถูกตัดหาย */
      const tw = tip.offsetWidth || 300, th = tip.offsetHeight || 60;
      /* ใช้ความกว้างของพื้นที่แสดงผล ไม่ใช่ความกว้างหน้าต่าง เพราะหน้าต่างนับรวมแถบเลื่อนด้วย */
      const vw = document.documentElement.clientWidth || window.innerWidth;
      const vh = document.documentElement.clientHeight || window.innerHeight;
      const x = Math.max(8, Math.min(e.clientX+14, vw - tw - 12));
      let y = e.clientY + 14;
      if(y + th > vh - 12) y = Math.max(8, e.clientY - th - 14);
      tip.style.left = x+"px"; tip.style.top = y+"px";
    });
    el.addEventListener("mouseleave",()=>{ tip.style.display="none"; });
  });
}

function countUp(el, target, dec, suffix){
  if(REDUCED || target==null){ el.textContent = (target!=null? numf(target,dec):"ไม่มีข้อมูล")+(suffix||""); return; }
  const t0 = performance.now(), dur = 420, from = target*0.6;
  function step(t){
    const p = Math.min(1,(t-t0)/dur), v = from + (target-from)*(1-Math.pow(1-p,3));
    el.textContent = numf(v,dec)+(suffix||"");
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ประมาณความกว้างข้อความเป็นพิกเซล สำหรับจองพื้นที่ป้ายในกราฟ
   สระบนสระล่างและวรรณยุกต์ไทยไม่กินความกว้าง อักษรไทยกว้างกว่าเลขและอักษรละติน */
/* ค่าประมาณสำรอง ใช้เมื่อเบราว์เซอร์วัดให้ไม่ได้ */
function txtWEst(str, size){
  const sz = size||12;
  let u = 0;
  for(const ch of String(str||"")){
    const c = ch.codePointAt(0);
    if(c===0x0E31 || (c>=0x0E33 && c<=0x0E3A) || (c>=0x0E47 && c<=0x0E4E)) continue;
    if(c===0x20) { u += 0.30; continue; }
    if(c>=0x0E00 && c<=0x0E7F) { u += 0.62; continue; }
    if(c>=0x41 && c<=0x5A) { u += 0.64; continue; }
    u += 0.58;
  }
  return u*sz;
}
/* วัดความกว้างข้อความจากของจริง ผลจึงตรงกับฟอนต์ที่เครื่องปลายทางโหลดได้จริง
   เก็บผลไว้ในทะเบียน เพราะกราฟหนึ่งใบเรียกซ้ำหลายสิบครั้ง */
let _mwSvg = null, _mwTxt = null, _mwCache = {};
function txtW(str, size){
  const sz = size||12;
  const key = sz+"|"+String(str==null?"":str);
  if(_mwCache[key]!=null) return _mwCache[key];
  let w = null;
  try{
    if(!_mwSvg){
      _mwSvg = document.createElementNS("http://www.w3.org/2000/svg","svg");
      _mwSvg.setAttribute("aria-hidden","true");
      _mwSvg.setAttribute("style","position:absolute; left:-9999px; top:-9999px; width:0; height:0; overflow:hidden;");
      _mwTxt = document.createElementNS("http://www.w3.org/2000/svg","text");
      _mwSvg.appendChild(_mwTxt);
      document.body.appendChild(_mwSvg);
    }
    _mwTxt.setAttribute("font-size", sz);
    _mwTxt.textContent = String(str==null?"":str);
    const m = _mwTxt.getComputedTextLength();
    if(m>0 || !String(str==null?"":str).length) w = m;
  }catch(e){ w = null; }
  if(w==null) w = txtWEst(str, sz);
  _mwCache[key] = w;
  return w;
}
function chartFrame(w,h,pad){ return {w,h,l:pad.l,r:pad.r,t:pad.t,b:pad.b, iw:w-pad.l-pad.r, ih:h-pad.t-pad.b}; }
function niceScale(lo, hi, n){
  if(hi<=lo) hi = lo+1;
  const raw = (hi-lo)/n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  let step = mag;
  for(const m of [1,2,2.5,5,10]){ if(mag*m>=raw){ step = mag*m; break; } }
  const min = Math.floor(lo/step)*step;
  const max = Math.ceil(hi/step)*step;
  const ticks=[];
  for(let v=min; v<=max+step/1000; v+=step) ticks.push(Math.round(v*1000)/1000);
  return {min, max, ticks};
}
function tickLabel(v){
  if(Math.abs(v)>=1e6) return numf(v/1e6,1)+" ล้าน";
  if(Math.abs(v)>=1e4) return nf0.format(v);
  return numf(v, Math.abs(v)<10 && !Number.isInteger(v) ? 1:0);
}
function gridLines(f,ticks,min,max,suffix){
  let s="";
  ticks.forEach(tv=>{
    const y = f.t + f.ih - ((tv-min)/(max-min))*f.ih;
    s += `<line x1="${f.l}" y1="${y}" x2="${f.l+f.iw}" y2="${y}" stroke="#eaf6eb" stroke-width="1"/>`;
    s += `<text x="${f.l-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#566058">${tickLabel(tv)+(suffix||"")}</text>`;
  });
  return s;
}
function chartWidth(id, fallback){
  const el = $(id);
  let w = el && el.clientWidth ? el.clientWidth : 0;
  if(!w){
    /* หน้ายังซ่อนอยู่ ประมาณจากความกว้างพื้นที่เนื้อหาแทนค่าคงที่ */
    const mn = $("main");
    const inner = mn && mn.clientWidth ? mn.clientWidth - 64 : 0;
    w = inner? Math.floor(inner * (fallback>600? 1 : 0.5)) : fallback;
  }
  return Math.max(320, Math.min(1160, w));
}
/* ความกว้างของกราฟเล็กในการ์ด ต้องเท่ากับความกว้างจริงของกล่อง ห้ามใช้ขั้นต่ำ 320 ของกราฟใหญ่
   ถ้ากรอบภาพกว้างกว่ากล่อง เบราว์เซอร์จะย่อทั้งภาพ ตัวอักษรบนเส้นจึงเล็กกว่าที่ตั้งไว้ */
function sparkWidth(id, fallback){
  const el = $(id);
  let w = el && el.clientWidth ? el.clientWidth : 0;
  if(!w){
    const mn = $("main");
    const inner = mn && mn.clientWidth ? mn.clientWidth - 64 : 0;
    w = inner? Math.floor(inner/4) - 60 : fallback;
  }
  /* ไม่ตั้งขั้นต่ำที่กว้างกว่ากล่องจริง เพราะกรอบภาพที่กว้างกว่ากล่องจะถูกย่อทั้งภาพ
     ตัวอักษรบนเส้นจึงเล็กกว่าที่ตั้งไว้ เมื่อกล่องแคบให้ไปลดจำนวนป้ายแทน ไม่ใช่ย่อภาพ */
  return Math.max(60, Math.min(460, w));
}
/* วางป้ายค่าไม่ให้ทับกันและไม่หลุดกรอบ */
function placeLabels(pts, f, fmt){
  let s = "", lastBox = null;
  pts.forEach(p=>{
    const txt = fmt(p.v);
    const w = txt.length*6.8;
    let x = Math.max(f.l+w/2+2, Math.min(f.l+f.iw-w/2-2, p.x));
    let y = p.y-11, below = false;
    if(lastBox && Math.abs(p.y-lastBox.py)<15 && (x-w/2)<lastBox.x2+6){ y = p.y+20; below = true; }
    if(y < f.t+10) { y = p.y+20; below = true; }
    if(y > f.t+f.ih-2) y = p.y-11;
    s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2822">${esc(txt)}</text>`;
    lastBox = below? lastBox : {x2:x+w/2, py:p.y};
  });
  return s;
}

/* กราฟเส้น รองรับแถบเกรด เส้นเกณฑ์หลายเส้น จุดเด่นเดือนที่เลือก และการแตะเลือกเดือน
   ป้ายทุกชนิดจองพื้นที่ในทะเบียนกล่องเดียวกัน ป้ายที่ชนของเดิมจะไม่ถูกวาด */
function lineChart(vals, labels, opt){
  const w = opt.width||720, h = opt.height|| Math.round(Math.max(220, Math.min(300, w*0.4)));
  const f = chartFrame(w,h,{l:56,r:44,t:30,b:34});
  let min, max, ticks;
  if(opt.yMin!=null && opt.yMax!=null){
    min = opt.yMin; max = opt.yMax;
    const ns = niceScale(min,max,4); ticks = ns.ticks.filter(t=>t>=min&&t<=max);
  } else {
    const hi = Math.max.apply(null, vals.filter(v=>v!=null).concat(opt.refs? opt.refs.map(r=>r.v):[0]))*1.12;
    const ns = niceScale(opt.yMin!=null?opt.yMin:0, hi, 4);
    min = ns.min; max = ns.max; ticks = ns.ticks;
  }
  const Y = v => f.t + f.ih - ((v-min)/(max-min))*f.ih;
  const taken = [];
  let hitTxt = "";
  /* own คือหมายเลขจุดที่เป็นเจ้าของป้ายนั้น กล่องของจุดตัวเองไม่ถือว่าชน */
  const hits = (b, own) => taken.some(t =>
    (own==null || t.pi==null || t.pi!==own) &&
    !(b.x2<t.x1||b.x1>t.x2||b.y2<t.y1||b.y1>t.y2));
  const claim = b => { taken.push(b); };
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" role="img">`;
  let bandTxt = "", refTxt = "";
  (opt.bands||[]).forEach(b=>{
    const y1 = Y(Math.min(b.to,max)), y2 = Y(Math.max(b.from,min));
    if(y2<=y1) return;
    s += `<rect x="${f.l}" y="${y1.toFixed(1)}" width="${f.iw}" height="${(y2-y1).toFixed(1)}" fill="${b.color}"/>`;
    if(b.label) b._y = y1;
  });
  /* พื้นกราฟสีขาว ให้ตัวเลขและเส้นอ่านง่าย ไม่ให้พื้นหลังของหน้ามารบกวน */
  if(opt.plotBg) s = `<svg viewBox="0 0 ${f.w} ${f.h}" role="img">`
    + `<rect x="${f.l}" y="${f.t}" width="${f.iw}" height="${f.ih}" fill="${opt.plotBg}"/>`
    + s.slice(s.indexOf(">")+1);
  s += gridLines(f,ticks,min,max,opt.tickSuffix);
  /* เก็บเส้นอ้างอิงไว้วาดหลังเส้นข้อมูล เดือนที่ค่าทับเส้นพอดีจะได้ยังเห็นเส้นประ */
  let refLines = "";
  (opt.refs||[]).forEach(rf=>{
    if(rf.v<min||rf.v>max) return;
    const y = Y(rf.v);
    const col = rf.color || "#d9a300";
    refLines += `<line x1="${f.l}" y1="${y}" x2="${f.l+f.iw}" y2="${y}" stroke="${col}" stroke-width="2" stroke-dasharray="6 5"/>`;
  });
  const pts=[];
  vals.forEach((v,i)=>{
    if(v==null) return;
    const x = f.l + (vals.length===1?f.iw/2 : (i/(vals.length-1))*f.iw);
    pts.push({x, y:Y(v), v, i});
  });
  if(pts.length>1){
    const path = pts.map((p,j)=>(j?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
    const area = path + ` L ${pts[pts.length-1].x.toFixed(1)} ${f.t+f.ih} L ${pts[0].x.toFixed(1)} ${f.t+f.ih} Z`;
    s += `<defs><linearGradient id="${opt.gid||"ag"}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cd489" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7cd489" stop-opacity="0"/></linearGradient></defs>`;
    s += `<path d="${area}" fill="url(#${opt.gid||"ag"})"/>`;
    s += `<path d="${path}" fill="none" stroke="#2e8536" stroke-width="2.5" stroke-linejoin="round" opacity="${opt.dim? 0.6 : 1}"/>`;
  }
  s += refLines;
  /* จุดข้อมูลจองพื้นที่ของตัวเองก่อน ป้ายชนิดอื่นจะหลบ */
  pts.forEach(p=>{
    const hl = opt.dim && opt.highlight && opt.highlight.has(p.i);
    if(hl) s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="rgba(46,133,54,0.18)"/>`;
    const pc = opt.ptColors? opt.ptColors[p.i] : null;
    const fade = opt.dim && !hl? 0.42 : 1;
    s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${hl?6:4.5}" fill="${pc? pc[hl?1:0] : (hl?"#17491d":"#2e8536")}" stroke="#ffffff" stroke-width="1.6" opacity="${fade}"/>`;
    /* พื้นที่รับการกดต้องไม่เล็กกว่า 26 พิกเซล เพื่อให้แตะได้จริงบนมือถือ */
    hitTxt += `<rect class="clickable" data-mi="${p.i}" x="${(p.x-13).toFixed(1)}" y="${(p.y-13).toFixed(1)}" width="26" height="26" fill="transparent" data-tip="${esc(labels[p.i])} ${esc(opt.fmt(p.v))}${opt.tipExtra? "<br>"+esc(opt.tipExtra(p.i)) : ""}"/>`;
    taken.push({x1:p.x-9, x2:p.x+9, y1:p.y-9, y2:p.y+9, pi:p.i});
  });
  /* ป้ายเส้นเกณฑ์ มีพื้นรองสีขาว วาดเมื่อไม่ชนของเดิม */
  (opt.refs||[]).forEach(rf=>{
    if(rf.v<min||rf.v>max || !rf.label) return;
    const y = Y(rf.v);
    const col = rf.color || "#d9a300";
    const txt = col==="#e2a99e"? "#8f3d2c" : (col==="#2e8536"? "#17491d" : "#6b5100");
    const wpx = txtW(rf.label,12) + 16;
    for(const ly of [y-8, y+19]){
      if(ly < f.t+12 || ly > f.t+f.ih-3) continue;
      const box = {x1:f.l+1, x2:f.l+5+wpx, y1:ly-15, y2:ly+7};
      if(hits(box)) continue;
      refTxt += `<rect x="${f.l+3}" y="${(ly-12).toFixed(1)}" width="${wpx.toFixed(0)}" height="17" rx="5" fill="#ffffff" opacity="0.9"/>`
        + `<text x="${f.l+10}" y="${ly.toFixed(1)}" text-anchor="start" font-size="12" font-weight="600" fill="${txt}">${esc(rf.label)}</text>`;
      claim(box);
      break;
    }
  });
  /* ป้ายค่าประจำจุด เดือนที่เลือกได้สิทธิ์วางก่อน ลองเหนือจุดก่อน ถ้าชนจึงลองใต้จุด
     ป้ายที่ยังชนหลังลองสองระดับจะไม่ถูกวาด ตัวเลขยังอ่านได้จากตารางและจากการแตะจุด */
  let valTxt = "";
  pts.slice().sort((a,b)=>{
    const ha = opt.highlight && opt.highlight.has(a.i) ? 1 : 0;
    const hb = opt.highlight && opt.highlight.has(b.i) ? 1 : 0;
    return hb-ha || a.i-b.i;
  }).forEach(p=>{
    const txt = opt.fmt(p.v);
    const wpx = txtW(txt,12);
    const x = Math.max(f.l+wpx/2+2, Math.min(f.l+f.iw-wpx/2-2, p.x));
    for(const cy of [p.y-15, p.y+25]){
      if(cy < f.t+11 || cy > f.t+f.ih-1) continue;
      const box = {x1:x-wpx/2-6, x2:x+wpx/2+6, y1:cy-14, y2:cy+6};
      if(hits(box, p.i)) continue;
      valTxt += `<rect x="${(x-wpx/2-6).toFixed(1)}" y="${(cy-14).toFixed(1)}" width="${(wpx+12).toFixed(0)}" height="20" rx="5" fill="#ffffff" opacity="0.96"/>`
        + `<text x="${x.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2822">${esc(txt)}</text>`;
      claim(box);
      break;
    }
  });
  /* ป้ายชื่อแถบเกรด ชิดขวา วาดเมื่อไม่ชนของเดิม */
  (opt.bands||[]).forEach(b=>{
    if(!b.label || b._y==null) return;
    const wpx = txtW(b.label,12);
    for(const ly of [b._y+15, b._y+30]){
      if(ly > f.t+f.ih-3) continue;
      const box = {x1:f.l+f.iw-wpx-11, x2:f.l+f.iw-2, y1:ly-15, y2:ly+7};
      if(hits(box)) continue;
      bandTxt += `<text x="${f.l+f.iw-6}" y="${ly.toFixed(1)}" text-anchor="end" font-size="12" font-weight="600" fill="${b.labelColor||"#566058"}">${esc(b.label)}</text>`;
      claim(box);
      break;
    }
  });
  /* ป้ายชื่อเดือน เดือนที่เลือกได้สิทธิ์วางก่อน ที่เหลือวางเมื่อไม่ชนของเดิม */
  const every = opt.labelEvery||1;
  const mTaken = [];
  const mHits = b => mTaken.some(t=>!(b.x2<t.x1||b.x1>t.x2));
  const my = f.t+f.ih+22;
  vals.map((v,i)=>({i, hl:!!(opt.highlight && opt.highlight.has(i)),
      x: f.l + (vals.length===1?f.iw/2 : (i/(vals.length-1))*f.iw)}))
    .sort((a,b)=>{
      const pa = a.hl?2:((a.i%every===0||a.i===vals.length-1)?1:0);
      const pb = b.hl?2:((b.i%every===0||b.i===vals.length-1)?1:0);
      return pb-pa || a.i-b.i;
    }).forEach(c=>{
      if(!c.hl && c.i%every!==0 && c.i!==vals.length-1) return;
      const wpx = txtW(labels[c.i],12);
      const box = {x1:c.x-wpx/2-2, x2:c.x+wpx/2+2};
      if(mHits(box)) return;
      mTaken.push(box);
      s += `<text x="${c.x.toFixed(1)}" y="${my}" text-anchor="middle" font-size="12" font-weight="${c.hl?700:400}" fill="${c.hl?"#17491d":"#566058"}">${esc(labels[c.i])}</text>`;
    });
  return s+valTxt+bandTxt+refTxt+hitTxt+"</svg>";
}
/* กราฟแท่ง รองรับจุดเด่นเดือนที่เลือกและการแตะเลือกเดือน
   ป้ายค่าจองพื้นที่ในทะเบียนกล่องเดียวกัน เดือนที่เลือกได้สิทธิ์ก่อน
   ป้ายที่ยังชนหลังลองสองระดับจะไม่ถูกวาด ตัวเลขยังอ่านได้จากตารางด้านล่างและจากการแตะแท่ง */
function barChart(vals, labels, colors, opt){
  const w = opt.width||720, h = Math.round(Math.max(220, Math.min(300, w*0.4)));
  /* ถ้ามีเส้นคะแนนซ้อน ต้องเว้นขอบขวาให้ป้ายแกนขวา */
  /* มีป้ายชื่อแกน จึงต้องเว้นที่ทั้งซ้ายและขวาเพิ่ม */
  const f = chartFrame(w,h,{l:opt.axisLeft? 76:56, r:opt.line? 84:44, t:opt.axisLeft? 34:26, b:34});
  const nums = vals.filter(v=>v!=null);
  let hiRaw = Math.max.apply(null, nums.concat([opt.ref!=null?opt.ref:0, 0]))*1.18;
  /* ถ้ามีเส้นคะแนนซ้อน ต้องเผื่อความสูงให้คะแนนสูงสุดอยู่ในกรอบ
     เพราะเส้นคะแนนผูกไว้กับเส้นเป้าหมาย คือคะแนน 100 อยู่ที่ระดับเส้นเป้าหมายพอดี */
  if(opt.line && opt.ref!=null && opt.ref>0){
    const lm = Math.max.apply(null, opt.line.vals.filter(v=>v!=null).concat([100]));
    hiRaw = Math.max(hiRaw, opt.ref*(lm/100)*1.10);
  }
  let loRaw = Math.min.apply(null, nums.concat([0]));
  const ns = niceScale(loRaw, hiRaw, 4);
  const lo = ns.min, hi = ns.max;
  const taken = [];
  let hitTxt = "";
  const hits = b => taken.some(t=>!(b.x2<t.x1||b.x1>t.x2||b.y2<t.y1||b.y1>t.y2));
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" role="img">` + gridLines(f,ns.ticks,lo,hi,opt.tickSuffix);
  /* จางเดือนอื่นเฉพาะเมื่อผู้ใช้กดเลือกเดือนเองแล้ว */
  const dim = !!(opt.highlight && opt.dim);
  const bw = Math.min(46, f.iw/vals.length*0.55);
  const y0 = f.t + f.ih - ((0-lo)/(hi-lo))*f.ih;
  const every = opt.labelEvery||1;
  const refY = (opt.ref!=null && opt.ref>=lo && opt.ref<=hi)
      ? f.t + f.ih - ((opt.ref-lo)/(hi-lo))*f.ih : null;

  const refTxt = "";

  const cands = [], monthCands = [];
  vals.forEach((v,i)=>{
    const cx = f.l + (i+0.5)*(f.iw/vals.length);
    const x = cx-bw/2;
    const hl = !!(opt.highlight && opt.highlight.has(i));
    let top = y0;
    if(v==null){
      cands.push({i, hl, cx, top:y0, txt:"ไม่มีข้อมูล", weak:true});
    }else{
      const y = f.t + f.ih - ((v-lo)/(hi-lo))*f.ih;
      top = Math.min(y,y0);
      const hgt = Math.max(2,Math.abs(y0-y));
      /* เดือนที่ไม่ได้เลือกจางเฉพาะเนื้อแท่ง แต่คงเส้นขอบสีเต็มไว้
         ผู้อ่านจึงยังแยกออกว่าเดือนนั้นถึงเป้าหรือไม่ถึงเป้า */
      const bStroke = (dim && hl)? (opt.hlStroke? opt.hlStroke(i) : "#17491d") : (dim? colors[i] : null);
      s += `<rect class="bar-in" data-bi="${i}" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="4" fill="${colors[i]}" fill-opacity="${dim && !hl ? 0.30 : 1}" ${bStroke? 'stroke="'+bStroke+'" stroke-width="'+((dim&&hl)?2:1.5)+'"':''}/>`;
      /* พื้นที่รับการกดกว้างเต็มช่องของเดือนนั้น และสูงเต็มกราฟ เพื่อให้แตะได้จริงบนมือถือ */
      hitTxt += `<rect class="clickable" data-mi="${i}" x="${(cx-Math.max(13,f.iw/vals.length/2)).toFixed(1)}" y="${f.t}" width="${(Math.max(26,f.iw/vals.length)).toFixed(1)}" height="${f.ih}" fill="transparent" data-tip="${esc(labels[i])} ${esc(opt.fmt(v))}"/>`;
      cands.push({i, hl, cx, top, txt:opt.fmtShort(v), weak:false});
    }
    monthCands.push({i, hl, cx, txt:labels[i]});
  });

  /* ป้ายชื่อเดือน เดือนที่เลือกได้สิทธิ์วางก่อน เดือนที่เหลือวางเมื่อไม่ชนของเดิม
     จึงไม่มีชื่อเดือนทับกันแม้จอแคบ */
  const mTaken = [];
  const mHits = b => mTaken.some(t=>!(b.x2<t.x1||b.x1>t.x2));
  const my = f.t+f.ih+22;
  monthCands.slice().sort((a,b)=>{
    const pa = a.hl?2:((a.i%every===0||a.i===vals.length-1)?1:0);
    const pb = b.hl?2:((b.i%every===0||b.i===vals.length-1)?1:0);
    return pb-pa || a.i-b.i;
  }).forEach(c=>{
    if(!c.hl && c.i%every!==0 && c.i!==vals.length-1) return;
    const wpx = txtW(c.txt,12);
    const box = {x1:c.cx-wpx/2-4, x2:c.cx+wpx/2+4};
    if(mHits(box)) return;
    mTaken.push(box);
    s += `<text x="${c.cx.toFixed(1)}" y="${my}" text-anchor="middle" font-size="12" font-weight="${c.hl?700:400}" fill="${c.hl?"#17491d":"#566058"}">${esc(c.txt)}</text>`;
  });

  /* ลำดับสิทธิ์ ป้ายค่าแท่งของเดือนที่เลือก แล้วจุดของเส้น แล้วป้ายค่าแท่งที่เหลือ */
  cands.sort((a,b)=> (b.hl?1:0)-(a.hl?1:0) || a.i-b.i);
  let valTxt = "";
  const placeVal = c=>{
    const wpx = txtW(c.txt,12);
    const lx = Math.max(f.l+wpx/2+2, Math.min(f.l+f.iw-wpx/2-2, c.cx));
    /* ยอดของแท่งต้องอยู่เหนือยอดแท่งเสมอ ตามคำสั่ง 25 ส.ค. 2569
       ถ้าที่ตรงนั้นถูกจองไว้ ให้ขยับสูงขึ้นทีละระดับ ห้ามย้ายลงไปอยู่ในตัวแท่ง */
    const base = Math.max(f.t+11, c.top-7);
    const levels = [];
    [base, base-16, base-32, base-48].forEach(ly=>{
      const cy = Math.max(f.t+11, ly);
      if(levels.indexOf(cy) < 0) levels.push(cy);
    });
    for(const cy of levels){
      const box = {x1:lx-wpx/2-6, x2:lx+wpx/2+6, y1:cy-14, y2:cy+6};
      if(hits(box)) continue;
      valTxt += `<rect x="${(lx-wpx/2-6).toFixed(1)}" y="${(cy-14).toFixed(1)}" width="${(wpx+12).toFixed(0)}" height="20" rx="5" fill="#ffffff" opacity="0.96"/>`
        + `<text x="${lx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="${c.weak?400:600}" fill="${c.weak?"#566058":"#1e2822"}">${esc(c.txt)}</text>`;
      taken.push(box);
      return;
    }
  };
  /* คะแนน 0 อยู่ที่เส้นศูนย์ของแกนซ้าย และคะแนน 100 อยู่ที่ระดับเส้นเป้าหมายพอดี
     เส้นคะแนนจึงอยู่ในย่านเดียวกับแท่ง และตัดเส้นเป้าหมายเมื่อคะแนนเท่ากับ 100
     ถ้าเป้าหมายเป็นศูนย์ เส้นเป้าหมายจะทับเส้นศูนย์ ผูกกันไม่ได้ ต้องใช้มาตราสำรองที่กระจายเต็มกรอบ */
  const lineSpan = (opt.line && refY!=null)? (y0-refY) : 0;
  const lineTop = (opt.line && opt.line.max)? opt.line.max : 100;
  const Y2 = v => lineSpan >= 20
    ? y0 - (v/100)*lineSpan
    : y0 - (v/lineTop)*(y0 - f.t - 10);
  let linePts = [];
  if(opt.line){
    const L = opt.line;
    L.vals.forEach((v,i)=>{
      if(v==null) return;
      const p = {x:f.l+(i+0.5)*(f.iw/L.vals.length), y:Y2(v), v, i};
      linePts.push(p);
      taken.push({x1:p.x-7, x2:p.x+7, y1:p.y-7, y2:p.y+7, pi:p.i});
    });
  }

  cands.forEach(placeVal);

  if(refY!=null){
    s += `<line x1="${f.l}" y1="${refY}" x2="${f.l+f.iw}" y2="${refY}" stroke="#a37800" stroke-width="2" stroke-dasharray="6 5"/>`;
  }

  /* เส้นคะแนนซ้อนบนแท่งผลจริง อ่านค่าที่แกนขวา
     แกนซ้ายเป็นหน่วยของผลจริง แกนขวาเป็นคะแนน สองอย่างนี้คนละหน่วย จึงต้องมีป้ายแกนกำกับทั้งสองฝั่ง */
  let lineTxt = "";
  if(opt.line){
    const L = opt.line;
    const col = L.color || "#6595bf";
    const txtCol = L.textColor || "#2f5d8a";
    /* แกนขวาไม่ได้ใช้เส้นกริดชุดเดียวกับแกนซ้าย จึงต้องมีเส้นอ้างอิงของตัวเอง
       ไม่งั้นผู้อ่านจะลากสายตาไปตกที่ตัวเลขของแกนซ้าย */
    /* ขีดแกนขวา วางตามมาตราของคะแนน ไม่ต้องมีเส้นกริดของตัวเอง
       เพราะคะแนน 100 ตรงกับเส้นเป้าหมายที่วาดไว้แล้ว */
    (L.ticks||[]).forEach(tv=>{
      const y = Y2(tv);
      if(y < f.t-2 || y > f.t+f.ih+2) return;
      lineTxt += `<text x="${(f.l+f.iw+8).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="start" font-size="12" fill="${txtCol}">${esc(L.fmtTick? L.fmtTick(tv) : String(tv))}</text>`;
    });
    const pts = linePts;
    if(pts.length>1){
      lineTxt += `<path d="${pts.map((p,j)=>(j?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" opacity="${dim? 0.55 : 1}"/>`;
    }
    pts.forEach(p=>{
      const hl = !!(opt.highlight && opt.highlight.has(p.i));
      lineTxt += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${hl?6:4.5}" fill="${hl? (L.dark||"#2f5d8a") : col}" stroke="#ffffff" stroke-width="1.6" opacity="${dim && !hl? 0.42 : 1}"/>`;
    });
    /* ป้ายค่าของเส้น เดือนที่เลือกได้สิทธิ์วางก่อน ป้ายที่ยังชนจะไม่วาด ค่ายังอ่านได้จากตาราง */
    let lv = "";
    pts.slice().sort((a,b)=>{
      const ha = dim && opt.highlight && opt.highlight.has(a.i)?1:0;
      const hb = dim && opt.highlight && opt.highlight.has(b.i)?1:0;
      return hb-ha || a.i-b.i;
    }).forEach(p=>{
      const txt = L.fmt(p.v);
      const wpx = txtW(txt,12);
      const lx = Math.max(f.l+wpx/2+2, Math.min(f.l+f.iw-wpx/2-2, p.x));
      for(const cy of [p.y-15, p.y+25]){
        if(cy < f.t+11 || cy > f.t+f.ih-2) continue;
        const box = {x1:lx-wpx/2-6, x2:lx+wpx/2+6, y1:cy-14, y2:cy+6};
        if(taken.some(t=>t.pi!==p.i && !(box.x2<t.x1||box.x1>t.x2||box.y2<t.y1||box.y1>t.y2))) continue;
        lv += `<rect x="${(lx-wpx/2-6).toFixed(1)}" y="${(cy-14).toFixed(1)}" width="${(wpx+12).toFixed(0)}" height="20" rx="5" fill="#ffffff" opacity="0.96"/>`
          + `<text x="${lx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="${txtCol}">${esc(txt)}</text>`;
        taken.push(box);
        break;
      }
    });
    lineTxt += lv;
  }
  /* ป้ายค่าของแท่งวาดเป็นชั้นบนสุด เส้นคะแนนจึงไม่พาดทับตัวเลข */
  /* ป้ายชื่อแกน วางตั้งฉากที่ขอบซ้ายและขอบขวา บอกว่าแต่ละแกนคือข้อมูลอะไร */
  let axisTxt = "";
  if(opt.axisLeft){
    const cy = f.t + f.ih/2;
    axisTxt += `<text transform="translate(14 ${cy.toFixed(1)}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600" fill="#566058">${esc(opt.axisLeft)}</text>`;
  }
  if(opt.axisRight){
    const cy = f.t + f.ih/2;
    axisTxt += `<text transform="translate(${(f.w-12).toFixed(1)} ${cy.toFixed(1)}) rotate(90)" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5d8a">${esc(opt.axisRight)}</text>`;
  }
  return s+refTxt+lineTxt+valTxt+axisTxt+hitTxt+"</svg>";
}
function bindMonthClicks(rootId){
  $(rootId).querySelectorAll("[data-mi]").forEach(el=>{
    el.addEventListener("click",()=>{
      selMonths = [parseInt(el.getAttribute("data-mi"),10)];
      monthPicked = true;
      tip.style.display="none";
      busy(renderAll);
    });
  });
}

    if(btn.dataset.page==="kpi") renderKpiPage();
