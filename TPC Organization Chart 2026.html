<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผังโครงสร้างองค์กร TPC ปี 2026 ฉบับปรับข้อมูลได้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* โทเคนโหมด CI JS Group ที่มา dashboard-format references/design-tokens.md ข้อ 1 และ 4 (21 ส.ค. 2569) */
:root{
  --accent:#3fae49; --accent-deep:#2e8536; --accent-dark:#17491d;
  --s2:#2f5d8a; --s2-bg:#e6eef7; --s3:#d9a300; --s3-bg:#fff3d1; --s4:#c9d3ca;
  --risk:#b8412e; --risk-bg:#fbe8e4;
  --ground:#f4f8f4; --card:#ffffff; --ink:#1e2822; --muted:#566058;
  --line:#dce7dd; --tint:#eaf6eb;
  /* ระบบระยะห่างฐาน 4 ที่มา ui-design-format ระบบระยะห่าง */
  --s1:4px; --s2s:8px; --s3s:12px; --s4s:16px; --s6:24px; --s8:32px; --s12:48px;
  --r-lg:18px; --r-sm:10px;
  --shadow:0 6px 24px rgba(30,40,34,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Prompt","Leelawadee UI","Tahoma",sans-serif;
  background:var(--ground); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.55; font-size:16px;
}
/* ---------- ลำดับชั้นตัวอักษร 3 ระดับ ---------- */
.page-title{font-size:28px;font-weight:800;margin:0;color:var(--accent-dark)}
.card-title{font-size:18px;font-weight:700;margin:0 0 var(--s3s)}
.kpi-value{font-size:44px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.label,.kpi-label{font-size:14px;font-weight:500;color:var(--muted)}
.source-line{font-size:12px;font-weight:500;color:var(--muted)}
.body-sm{font-size:14px}
/* ---------- ชิ้นส่วนกดได้ ห้าสถานะ ที่มา ui-design-format ---------- */
button{
  font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
  border-radius:var(--r-sm);border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);padding:8px 16px;min-height:36px;
  transition:background .12s,border-color .12s;
}
button:hover{border-color:var(--accent-deep);background:var(--tint)}
button:active{background:var(--tint);border-color:var(--accent-dark)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
button.primary{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
button.danger{border-color:var(--risk);color:var(--risk);background:var(--card)}
button.danger:hover{background:var(--risk-bg)}
button.link{border:none;background:none;padding:var(--s1) var(--s2s);color:var(--accent-dark);font-weight:600;min-height:28px}
button.link:hover{background:var(--tint)}
button:disabled{opacity:.5;cursor:not-allowed;background:var(--card);border-color:var(--line)}
button:disabled:hover{background:var(--card);border-color:var(--line)}
input,select{
  font-family:inherit;font-size:14px;padding:8px 12px;min-height:36px;
  border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);max-width:100%;
}
input:focus,select:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent-deep)}
label{font-size:14px;font-weight:500;color:var(--muted);display:block;margin-bottom:var(--s1)}
/* ---------- โครงหน้า ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:var(--s6) var(--s8) 64px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:var(--s4s) var(--s8) 0}
.brand{display:flex;justify-content:space-between;gap:var(--s6);flex-wrap:wrap;align-items:center}
.brandL{display:flex;gap:var(--s4s);align-items:center}
.brandL img{height:44px;width:auto;display:block}
.actions{display:flex;gap:var(--s2s);flex-wrap:wrap;align-items:center}
.chip{font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px}
.chip.clean{background:var(--tint);color:var(--accent-dark)}
.chip.dirty{background:var(--s3-bg);color:var(--ink)}
nav.tabs{display:flex;gap:var(--s1);margin-top:var(--s4s);flex-wrap:wrap}
nav.tabs button{border:none;background:none;border-radius:var(--r-sm) var(--r-sm) 0 0;padding:10px 20px;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;min-height:44px}
nav.tabs button:hover{background:var(--tint);border-bottom-color:var(--line)}
nav.tabs button[aria-selected="true"]{color:var(--accent-dark);font-weight:700;border-bottom-color:var(--accent);background:var(--ground)}
.badge{display:inline-block;min-width:22px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;margin-left:var(--s2s);background:var(--s3-bg);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:var(--s6)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s6)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 22px;box-shadow:var(--shadow)}
.kpi .kpi-value{color:var(--accent-dark)}
.kpi.lead{background:linear-gradient(135deg,var(--accent-deep),var(--accent-dark));border-color:var(--accent-dark)}
.kpi.lead .kpi-value{color:#fff;font-size:48px}
.kpi.lead .kpi-label{color:#eaf6eb}
.kpi.warn{background:var(--s3-bg);border-color:var(--s3)}
.kpi.warn .kpi-value{color:var(--ink)}
@media(max-width:720px){.kpi.lead .kpi-value{font-size:44px}}
/* ---------- ตาราง ---------- */
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;font-size:14px;vertical-align:top}
th{background:var(--tint);color:var(--accent-dark);font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1}
th.sortable{cursor:pointer}
th.sortable:hover{background:#dcefdd}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--ground)}
td.num,th.num{text-align:right}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;max-height:600px;background:var(--card)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.m{background:var(--tint);color:var(--accent-dark)}
.pill.d{background:var(--s2-bg);color:var(--s2)}
.pill.wait{background:var(--s3-bg);color:var(--ink)}
.filters{display:flex;gap:var(--s3s);flex-wrap:wrap;align-items:flex-end;margin-bottom:var(--s4s)}
.filters>div{display:flex;flex-direction:column}
/* ---------- ผังองค์กร ---------- */
/* แท็บผังองค์กรเป็นชิ้นงานหลัก จึงกางเต็มความกว้างจอ และวางแผงรายละเอียดไว้ข้างผัง */
body.chart-mode .wrap{max-width:1760px}
body.chart-mode .top-in{max-width:1760px}
.chart-page{display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:var(--s6);align-items:start}
.chart-main{min-width:0}
.chart-side{display:flex;flex-direction:column;gap:var(--s4s);position:sticky;top:var(--s4s);max-height:calc(100vh - 40px);overflow:auto}
.chart-side .card{padding:18px 20px}
.overline{font-size:12px;font-weight:600;letter-spacing:.6px;color:var(--accent-deep);margin-bottom:4px}
.sumlist{display:grid;grid-template-columns:1fr auto;gap:6px var(--s3s);margin:0;font-size:14px}
.sumlist dt{color:var(--muted);font-weight:500}
.sumlist dd{margin:0;font-weight:600;text-align:right;color:var(--ink)}
.chart-tag{position:absolute;left:var(--s4s);top:var(--s4s);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 14px;font-size:14px;font-weight:600;color:var(--accent-dark);box-shadow:var(--shadow);pointer-events:none;max-width:60%}
@media(max-width:1180px){.chart-page{grid-template-columns:1fr}.chart-side{position:static;max-height:none;overflow:visible}}
/* แถบคำสั่งจัดเป็นหมวด อ่านง่ายและหาปุ่มเจอเร็ว */
.chart-bar{display:flex;gap:var(--s3s);flex-wrap:wrap;align-items:flex-start;margin-bottom:var(--s3s)}
.cgrp{border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 9px 6px;background:var(--card)}
.cgrp-t{display:block;font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--accent-deep);margin-bottom:3px}
.cgrp-b{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cgrp-b select{min-height:32px;padding:5px 9px;font-size:13px}
.cgrp-b button{min-height:32px;padding:5px 11px;font-size:13px}
.subtree{margin:0;padding-left:16px;font-size:13px;max-height:220px;overflow:auto}
.subtree li{margin-bottom:3px}
.canvas-box{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow);overflow:hidden;height:calc(100vh - 268px);min-height:460px}
.canvas-box svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background:
  radial-gradient(circle at 1px 1px, #e4efe5 1px, transparent 0) 0 0/24px 24px}
.canvas-box svg.grabbing{cursor:grabbing}
.hint{margin-top:var(--s3s);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 16px;font-size:12px;font-weight:500;color:var(--muted)}
.zoombar{position:absolute;right:var(--s4s);top:var(--s4s);display:flex;flex-direction:column;gap:var(--s1)}
.zoombar button{min-width:40px;min-height:36px;padding:4px 8px;box-shadow:var(--shadow)}
.foldC{fill:#fff;stroke:var(--accent-deep);stroke-width:1.5;cursor:pointer}
.foldC.on{fill:var(--accent-deep)}
.foldG:hover .foldC{fill:var(--tint)}
.foldG:hover .foldC.on{fill:var(--accent-dark)}
.foldT{fill:var(--accent-dark);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.foldT.on{fill:#fff}
.lhandle{fill:var(--s2);stroke:#fff;stroke-width:1.5;cursor:ns-resize}
.lhG:hover .lhandle{fill:var(--accent-deep);r:7.5}
.gline{stroke:var(--s2);stroke-dasharray:6 5;pointer-events:none}
.gapline{stroke:var(--s3);pointer-events:none}
.gaptxt{fill:var(--s3);font-weight:700;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
/* ชุดสีกล่องตามตาราง JONG STIT Group Organization Level (ผู้ใช้ส่ง 25 ส.ค. 2569) */
/* กล่องหน่วยงาน เส้นขอบหนาและมีเงา กล่องพนักงาน เส้นบางไม่มีเงา */
.nodeRect{fill:#fff;stroke:#8f8f8f;stroke-width:2.6;filter:url(#boxShadow)}
.nodeRect.lv-company{fill:#a6e7a6;stroke:#4e9a4e}
.nodeRect.lv-group{fill:#8cc63f;stroke:#5e8e2a}
.nodeRect.lv-division{fill:#fbe2cf;stroke:#c98a56}
.nodeRect.lv-section{fill:#d4d4d4;stroke:#8f8f8f}
.nodeRect.lv-department{fill:#dce9f7;stroke:#8bafd6}
.nodeRect.lv-emp{fill:#fff;stroke:var(--s2);stroke-width:1.4;filter:none}
.nodeRect.lv-emp.t-d{stroke:var(--s3)}
/* กล่องพนักงานที่มีผู้ใต้บังคับบัญชา พื้นเทาอ่อน ขอบหนาสองเส้น */
.nodeRect.lv-emp.boss{fill:#ededed;stroke-width:3;filter:url(#boxShadow)}
.nodeInner{fill:none;stroke:var(--s2);stroke-width:1;pointer-events:none}
.nodeCnt{font-size:11px;font-weight:700;fill:#3c5a42;pointer-events:none;text-anchor:end;dominant-baseline:middle}
.nodeCnt.short{fill:var(--risk)}
.nodeG{cursor:move}
.nodeG.sel .nodeRect{stroke:var(--accent-dark);stroke-width:3}
.nodeG:hover .nodeRect{stroke:var(--accent-deep)}
.nodeG.dropok .nodeRect{stroke:var(--risk);stroke-width:3}
.nodeG.pick .nodeRect{stroke:var(--s3);stroke-width:4}
.handle{r:8}
.canvas-box.linking svg{cursor:crosshair}
.nodeT{font-size:13px;font-weight:700;fill:var(--ink);pointer-events:none;text-anchor:middle}
.nodeT.inv{fill:#fff}
.nodeS{font-size:11.5px;font-weight:500;fill:var(--muted);pointer-events:none;text-anchor:middle}
.nodeS.inv{fill:#dcefdd}
.link{fill:none;stroke:#b9c9bb;stroke-width:2}
.handle{fill:var(--accent-deep);stroke:#fff;stroke-width:2;cursor:crosshair}
.handle:hover{fill:var(--accent-dark)}
.rubber{stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;fill:none;pointer-events:none}
/* ---------- หน้าจับคู่ ---------- */
.match-grid{display:grid;grid-template-columns:360px 1fr;gap:var(--s6);align-items:start}
@media(max-width:980px){.match-grid{grid-template-columns:1fr}}
.lg-list{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:var(--s2s)}
.lg-item{display:flex;justify-content:space-between;gap:var(--s2s);align-items:center;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;background:#fff;text-align:left;font-size:14px;min-height:40px}
.lg-item:hover{border-color:var(--s2);background:var(--s2-bg)}
.lg-item[aria-pressed="true"]{border-color:var(--s2);background:var(--s2-bg);color:var(--ink)}
.lg-item .cnt{background:var(--s3-bg);border-radius:999px;padding:1px 10px;font-weight:600;font-size:12px;white-space:nowrap}
.member-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s3s);background:#fff}
.member-list label{display:flex;gap:var(--s2s);align-items:flex-start;font-size:14px;color:var(--ink);padding:3px 0;margin:0;font-weight:400}
.bar-out{height:14px;border-radius:999px;background:var(--tint);border:1px solid var(--line);overflow:hidden}
.bar-in{height:100%;background:var(--accent);border-radius:999px}
/* ---------- กล่องโต้ตอบ ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,40,34,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:var(--s12) var(--s4s);overflow:auto}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);max-width:680px;width:100%;padding:24px;box-shadow:0 16px 48px rgba(30,40,34,.28)}
.modal h2{font-size:18px;font-weight:700;color:var(--accent-dark);margin:0 0 var(--s3s)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3s) var(--s4s);margin-bottom:var(--s3s)}
.frow .full{grid-column:1/-1}
@media(max-width:600px){.frow{grid-template-columns:1fr}}
.mfoot{display:flex;justify-content:space-between;gap:var(--s3s);margin-top:var(--s6);flex-wrap:wrap}
.mfoot .right{display:flex;gap:var(--s2s);margin-left:auto}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent-dark);color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;display:none;z-index:99;max-width:86%;box-shadow:0 8px 24px rgba(30,40,34,.24);pointer-events:none}
#toast.bad{background:var(--risk)}
.notebox{background:var(--s3-bg);border:1px solid var(--s3);border-radius:var(--r-sm);padding:10px 16px;font-size:14px}
.riskbox{background:var(--risk-bg);border:1px solid var(--risk);border-radius:var(--r-sm);padding:10px 16px;font-size:14px}
ol.loglist{margin:0;padding-left:22px;font-size:14px}
ol.loglist li{margin-bottom:var(--s1)}
.foot{margin-top:var(--s8);font-size:12px;font-weight:500;color:var(--muted)}
@media(max-width:720px){
  .wrap{padding:var(--s4s) var(--s4s) 48px}
  .top-in{padding:var(--s3s) var(--s4s) 0}
  .canvas-box{height:70vh;min-height:420px}
  .kpis{grid-template-columns:1fr}
}

</style>
</head>

// ฝ่ายทั้งหมดที่เคยอยู่ใต้หน่วยขึ้นตรงผู้บริหาร จึงขึ้นตรงกับ SK Group และ SK Group ห้อยข้างแกนกลางใต้กล่องบริษัท
const STAFF_DEFAULT = 'SK Group';
const OLD_DIRECT = 'หน่วยขึ้นตรงผู้บริหาร';
function applyStaffDefault(units) {
  for (const u of units) {
    if (u.level === 'group' && u.name === OLD_DIRECT) { u.name = 'SK Group'; u.en = 'SK GROUP'; u.staff = true; }
    if (u.staff == null && u.level === 'group' && u.name === STAFF_DEFAULT) u.staff = true;
  }
  return units;
}
applyStaffDefault(ORIGINAL.units);

S.pos = {};                 // ตำแหน่งกล่องที่ผู้ใช้ลากเอง { scopeKey: { nodeId: {x,y} } }

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function nf(n) { return Number(n || 0).toLocaleString('th-TH'); }
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = bad ? 'bad' : '';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = 'none'; }, bad ? 5200 : 2800);
}
function nowStr() {
  const d = new Date(), p = x => String(x).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + (d.getFullYear() + 543) + ' ' + p(d.getHours()) + '.' + p(d.getMinutes()) + ' น.';
}
function stamp() {
  const d = new Date(), p = x => String(x).padStart(2, '0');
  return p(d.getDate()) + p(d.getMonth() + 1) + (d.getFullYear() + 543);
}

/* ---------- ดัชนี ---------- */
let IDX = {}, CHILD = {}, EIDX = {}, EBYUNIT = {};
function reindex() {
  IDX = {}; CHILD = {}; EIDX = {}; EBYUNIT = {};
  for (const u of S.units) IDX[u.id] = u;
  for (const u of S.units) if (u.parent && IDX[u.parent]) (CHILD[u.parent] = CHILD[u.parent] || []).push(u.id);
  for (const k in CHILD) CHILD[k].sort((a, b) => (IDX[a].ord || 99) - (IDX[b].ord || 99) || IDX[a].name.localeCompare(IDX[b].name, 'th'));
  for (const e of S.emps) {
    EIDX[e.id] = e;
    if (e.unit) (EBYUNIT[e.unit] = EBYUNIT[e.unit] || []).push(e.id);
  }
  for (const k in EBYUNIT) {
    EBYUNIT[k].sort((a, b) => {
      const x = EIDX[a], y = EIDX[b];
      if (x.type !== y.type) return x.type === 'm' ? -1 : 1;
      return String(x.code).localeCompare(String(y.code), 'th');
    });
  }
}
function rootId() { return S.meta.root; }
function kids(uid) { return (CHILD[uid] || []).map(i => IDX[i]); }
function empsOf(uid) { return (EBYUNIT[uid] || []).map(i => EIDX[i]); }
function descend(uid) {
  const out = [], st = [uid];
  while (st.length) { const c = st.pop(); for (const k of (CHILD[c] || [])) { out.push(k); st.push(k); } }
  return out;
}
function totals(uid) {
  const set = new Set([uid, ...descend(uid)]);
  let m = 0, d = 0;
  for (const e of S.emps) if (e.unit && set.has(e.unit)) { if (e.type === 'm') m++; else d++; }
  return { m, d, t: m + d };
}
function pathOf(uid, fromRoot) {
  const parts = [];
  let u = IDX[uid];
  while (u) { if (fromRoot || u.level !== 'company') parts.unshift(u.name); u = u.parent ? IDX[u.parent] : null; }
  return parts.join(' / ');
}
function nkey(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
// หัวหน้าหน่วย คือคนในหน่วยที่ไม่มีหัวหน้าอยู่ในหน่วยเดียวกัน อ่านจากช่องผู้บังคับบัญชาโดยตรง คนที่ 1
// ไม่เดาลำดับอาวุโส ถ้าได้มากกว่าหนึ่งคน จะแจ้งว่ารอยืนยัน
function unitHead(uid) {
  const list = empsOf(uid);
  if (!list.length) return { roots: [], label: '' };
  const inside = new Set(list.map(e => nkey(e.name)));
  // ไล่ครบทั้งสี่ชั้นเหมือนที่ผังใช้ คนที่ไม่มีหัวหน้าคนใดอยู่ในหน่วยเดียวกัน คือหัวหน้าหน่วย
  const roots = list.filter(e => {
    for (let bi = 0; bi < 4; bi++) { const b = nkey(e.b[bi]); if (b && inside.has(b) && b !== nkey(e.name)) return false; }
    return true;
  });
  if (roots.length === 1) return { roots, label: 'หัวหน้าหน่วย ' + roots[0].name };
  if (roots.length > 1 && roots.length < list.length) return { roots, label: 'หัวหน้าหน่วย รอยืนยัน ' + roots.length + ' คน' };
  return { roots, label: '' };
}
function pathDiv(uid) { // เส้นทางสังกัดนับจากระดับฝ่ายลงมา ไม่รวมกลุ่มสายและบริษัท
  const parts = [];
  let u = IDX[uid];
  while (u && u.level !== 'group' && u.level !== 'company') { parts.unshift(u.name); u = u.parent ? IDX[u.parent] : null; }
  return parts.join(' / ');
}
function ancestorAt(uid, level) {
  let u = IDX[uid];
  while (u && u.level !== level) u = u.parent ? IDX[u.parent] : null;
  return u;
}
function divisionsSorted() {
  return S.units.filter(u => u.level === 'division')
    .slice().sort((a, b) => (a.ord || 99) - (b.ord || 99) || a.name.localeCompare(b.name, 'th'));
}
function isAncestor(a, b) { // a เป็นบรรพบุรุษของ b หรือไม่
  let u = IDX[b];
  while (u) { if (u.id === a) return true; u = u.parent ? IDX[u.parent] : null; }
  return false;
}
function childLevel(parentLevel) {
  const i = LEVELS.indexOf(parentLevel);
  return LEVELS[Math.min(i + 1, LEVELS.length - 1)];
}
function relevel(uid) { // ตั้งระดับใหม่ตามพ่อ แล้วไล่ลงลูกทุกชั้น
  const u = IDX[uid], p = u.parent ? IDX[u.parent] : null;
  if (!p) return;
  u.level = childLevel(p.level);
  for (const c of kids(uid)) relevel(c.id);
}

/* ---------- การแก้ไขพร้อมเลิกทำ ---------- */
function pushHist() {
  HIST.push(clone({ units: S.units, emps: S.emps, pos: S.pos }));
  if (HIST.length > 40) HIST.shift();
}
function commit(msg, quiet) {
  LOG.unshift({ t: nowStr(), msg });
  dirty++;
  reindex();
  renderAll();
  if (!quiet) toast(msg);
}
function undo() {
  if (!HIST.length) return;
  const p = HIST.pop();
  S.units = p.units; S.emps = p.emps; S.pos = p.pos;
  LOG.unshift({ t: nowStr(), msg: 'เลิกทำรายการล่าสุด' });
  dirty++;
  reindex(); renderAll(); toast('เลิกทำแล้ว');
}
/* ---------- บันทึกผังเป็นจุดอ้างอิง และย้อนกลับไปจุดที่บันทึกไว้ ---------- */
let SAVES = [];
function snapshot() { return clone({ units: S.units, emps: S.emps, pos: S.pos, folded: UI.folded, meta: S.meta }); }
function sameAsSnap(p) { return JSON.stringify(snapshot()) === JSON.stringify(p); }
function restoreSnap(p) {
  S.units = clone(p.units); S.emps = clone(p.emps); S.pos = clone(p.pos); S.meta = clone(p.meta);
  UI.folded = clone(p.folded || {});
  reindex(); renderAll();
}
function saveLayout() {
  SAVES.push({ t: nowStr(), snap: snapshot() });
  if (SAVES.length > 20) SAVES.shift();
  LOG.unshift({ t: nowStr(), msg: 'บันทึกผังไว้เป็นจุดที่ ' + SAVES.length });
  renderAll();
  toast('บันทึกผังแล้ว เป็นจุดที่ ' + SAVES.length + ' ถ้าแก้แล้วไม่ชอบ กดปุ่ม ย้อนกลับผังที่บันทึก เพื่อกลับมาที่จุดนี้');
}
function revertSaved() {
  if (!SAVES.length) { toast('ยังไม่มีผังที่บันทึกไว้ ถ้าต้องการย้อนการแก้ครั้งล่าสุด ให้กดปุ่ม เลิกทำล่าสุด แทน', true); return; }
  let target = SAVES[SAVES.length - 1];
  if (sameAsSnap(target.snap) && SAVES.length > 1) { SAVES.pop(); target = SAVES[SAVES.length - 1]; }
  pushHist();
  restoreSnap(target.snap);
  dirty++;
  LOG.unshift({ t: nowStr(), msg: 'ย้อนกลับไปผังที่บันทึกไว้เมื่อ ' + target.t });
  renderAll();
  toast('ย้อนกลับไปผังที่บันทึกไว้เมื่อ ' + target.t + ' แล้ว เหลือจุดที่บันทึกไว้ ' + SAVES.length + ' จุด');
}

/* ---------- ตัวเลือกหน่วยแบบ 3 ชั้น ---------- */
function makeCascade(box, currentUnitId, title) {
  const divs = divisionsSorted();
  let d1 = '', d2 = '', d3 = '';
  if (currentUnitId && IDX[currentUnitId]) {
    const ch = [];
    let u = IDX[currentUnitId];
    while (u && u.level !== 'group' && u.level !== 'company') { ch.unshift(u.id); u = u.parent ? IDX[u.parent] : null; }
    d1 = ch[0] || ''; d2 = ch[1] || ''; d3 = ch[2] || '';
  }
  box.innerHTML = `<label>${esc(title || 'สังกัด')}</label>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <select data-c="1"><option value="">(เลือกฝ่าย)</option>${divs.map(d => `<option value="${d.id}" ${d.id === d1 ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>
      <select data-c="2"></select><select data-c="3"></select></div>`;
  const s1 = box.querySelector('[data-c="1"]'), s2 = box.querySelector('[data-c="2"]'), s3 = box.querySelector('[data-c="3"]');
  function fill(sel, pid, chosen, ph) {
    const ks = pid ? kids(pid) : [];
    sel.innerHTML = `<option value="">${ph}</option>` + ks.map(k => `<option value="${k.id}" ${k.id === chosen ? 'selected' : ''}>${esc(k.name)}</option>`).join('');
    sel.disabled = !ks.length;
  }
  function refresh(init) {
    fill(s2, s1.value, init ? d2 : '', '(ตรงกับฝ่าย ไม่ระบุหน่วยย่อย)');
    fill(s3, s2.value, init ? d3 : '', '(ตรงกับหน่วยชั้นที่สอง)');
  }
  refresh(true);
  s1.onchange = () => refresh(false);
  s2.onchange = () => fill(s3, s2.value, '', '(ตรงกับหน่วยชั้นที่สอง)');
  return { get() { return s3.value || s2.value || s1.value || null; } };
}
function datalists() {
  const poss = [...new Set(S.emps.map(e => e.pos).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
  const bosses = new Set();
  for (const e of S.emps) { for (const b of e.b) if (b) bosses.add(b); if (e.name) bosses.add(e.name); }
  return `<datalist id="poslist">${poss.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
  <datalist id="bosslist">${[...bosses].sort((a, b) => a.localeCompare(b, 'th')).map(b => `<option value="${esc(b)}">`).join('')}</datalist>`;
}

/* ===== 10-files.js ===== */
/* ============================================================
   เครื่องยนต์ไฟล์ในเบราว์เซอร์ ไม่พึ่งไลบรารีภายนอก
   ZIP เขียนแบบไม่บีบอัด (stored) และอ่านแบบคลายบีบอัดด้วย DecompressionStream
   ใช้สร้างและอ่าน XLSX และสร้าง PPTX
   ============================================================ */
const FZ = (function () {
  const enc = new TextEncoder();

  // ---------- CRC32 ----------
  let CRCT = null;
  function crcTable() {
    if (CRCT) return CRCT;
    CRCT = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRCT[n] = c >>> 0;
    }
    return CRCT;
  }
  function crc32(buf) {
    const t = crcTable();
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = t[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // ---------- เขียน ZIP ----------
  function zipWrite(files) {
    // files = [{name, data: Uint8Array|string}]
    const items = files.map(f => {
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      return { name: enc.encode(f.name), data, crc: crc32(data) };
    });
    let total = 0;
    for (const it of items) total += 30 + it.name.length + it.data.length + 46 + it.name.length;
    total += 22;
    const out = new Uint8Array(total);
    const dv = new DataView(out.buffer);
    let off = 0;
    const offsets = [];
    for (const it of items) {
      offsets.push(off);
      dv.setUint32(off, 0x04034b50, true);
      dv.setUint16(off + 4, 20, true);      // version needed
      dv.setUint16(off + 6, 0x0800, true);  // flag bit 11 = ชื่อเป็น UTF-8
      dv.setUint16(off + 8, 0, true);       // method 0 = stored
      dv.setUint16(off + 10, 0, true);      // time
      dv.setUint16(off + 12, 0x21, true);   // date 1 ม.ค. 1980
      dv.setUint32(off + 14, it.crc, true);
      dv.setUint32(off + 18, it.data.length, true);
      dv.setUint32(off + 22, it.data.length, true);
      dv.setUint16(off + 26, it.name.length, true);
      dv.setUint16(off + 28, 0, true);
      off += 30;
      out.set(it.name, off); off += it.name.length;
      out.set(it.data, off); off += it.data.length;
    }
    const cdStart = off;
    items.forEach((it, i) => {
      dv.setUint32(off, 0x02014b50, true);
      dv.setUint16(off + 4, 20, true);
      dv.setUint16(off + 6, 20, true);
      dv.setUint16(off + 8, 0x0800, true);
      dv.setUint16(off + 10, 0, true);
      dv.setUint16(off + 12, 0, true);
      dv.setUint16(off + 14, 0x21, true);
      dv.setUint32(off + 16, it.crc, true);
      dv.setUint32(off + 20, it.data.length, true);
      dv.setUint32(off + 24, it.data.length, true);
      dv.setUint16(off + 28, it.name.length, true);
      dv.setUint16(off + 30, 0, true);
      dv.setUint16(off + 32, 0, true);
      dv.setUint16(off + 34, 0, true);
      dv.setUint16(off + 36, 0, true);
      dv.setUint32(off + 38, 0, true);
      dv.setUint32(off + 42, offsets[i], true);
      off += 46;
      out.set(it.name, off); off += it.name.length;
    });
    dv.setUint32(off, 0x06054b50, true);
    dv.setUint16(off + 8, items.length, true);
    dv.setUint16(off + 10, items.length, true);
    dv.setUint32(off + 12, off - cdStart, true);
    dv.setUint32(off + 16, cdStart, true);
    dv.setUint16(off + 20, 0, true);
    return out;
  }

  // ---------- อ่าน ZIP ----------
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('NO_DECOMPRESS');
    }
    let ds;
    try { ds = new DecompressionStream('deflate-raw'); }
    catch (e) { throw new Error('NO_DECOMPRESS'); }
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }

  async function zipRead(arrayBuffer) {
    const u8 = new Uint8Array(arrayBuffer);
    const dv = new DataView(arrayBuffer);
    // หา End of Central Directory จากท้ายไฟล์
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('BAD_ZIP');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const dec = new TextDecoder('utf-8');
    const out = {};
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('BAD_ZIP');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
      const lnlen = dv.getUint16(lho + 26, true);
      const lelen = dv.getUint16(lho + 28, true);
      const dstart = lho + 30 + lnlen + lelen;
      const raw = u8.subarray(dstart, dstart + csize);
      out[name] = { method, raw };
      p += 46 + nlen + elen + clen;
    }
    const files = {};
    for (const k of Object.keys(out)) {
      const e = out[k];
      if (e.method === 0) files[k] = dec.decode(e.raw);
      else if (e.method === 8) files[k] = dec.decode(await inflateRaw(e.raw));
      else throw new Error('BAD_ZIP');
    }
    return files;
  }

  // ---------- ตัวช่วย XML ----------
  function xe(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  }
  function colName(n) { // 0 -> A
    let s = '';
    n += 1;
    while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
    return s;
  }
  function colIndex(ref) { // "AB12" -> 27
    let n = 0;
    for (let i = 0; i < ref.length; i++) {
      const c = ref.charCodeAt(i);
      if (c >= 65 && c <= 90) n = n * 26 + (c - 64); else break;
    }
    return n - 1;
  }

  // ---------- สร้าง XLSX ----------
  // sheets = [{name, rows: [[cell,...],...]}] ค่าเป็นสตริงหรือตัวเลข
  function xlsxWrite(sheets) {
    const files = [];
    const sheetXml = sheets.map(sh => {
      const rows = sh.rows.map((row, ri) => {
        const cells = row.map((v, ci) => {
          const ref = colName(ci) + (ri + 1);
          if (v === null || v === undefined || v === '') return '';
          if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
          const st = ri === 0 ? ' s="1"' : '';
          return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
        }).join('');
        return `<row r="${ri + 1}">${cells}</row>`;
      }).join('');
      const nc = Math.max(1, ...sh.rows.map(r => r.length));
      const cols = `<cols><col min="1" max="${nc}" width="22" customWidth="1"/></cols>`;
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData></worksheet>`;
    });
    sheetXml.forEach((x, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: x }));

    files.push({
      name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`
    });
    files.push({
      name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`
    });
    files.push({
      name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xe(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`
    });
    files.push({
      name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`
    });
    files.push({
      name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Tahoma"/></font><font><b/><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEAF6EB"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`
    });
    return zipWrite(files);
  }

  // ---------- อ่าน XLSX ----------
  async function xlsxRead(arrayBuffer) {
    const files = await zipRead(arrayBuffer);
    const P = new DOMParser();
    const wbXml = files['xl/workbook.xml'];
    if (!wbXml) throw new Error('BAD_XLSX');
    const relsXml = files['xl/_rels/workbook.xml.rels'] || '';
    const relDoc = P.parseFromString(relsXml, 'application/xml');
    const relMap = {};
    relDoc.querySelectorAll('Relationship').forEach(r => {
      relMap[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\/?xl\//, '').replace(/^\//, '');
    });
    // shared strings
    let shared = [];
    if (files['xl/sharedStrings.xml']) {
      const sd = P.parseFromString(files['xl/sharedStrings.xml'], 'application/xml');
      shared = Array.from(sd.getElementsByTagName('si')).map(si =>
        Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join(''));
    }
    const wd = P.parseFromString(wbXml, 'application/xml');
    const out = [];
    Array.from(wd.getElementsByTagName('sheet')).forEach(sh => {
      const name = sh.getAttribute('name');
      const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = relMap[rid];
      if (!target) return;
      const key = 'xl/' + target;
      const xml = files[key];
      if (!xml) return;
      const doc = P.parseFromString(xml, 'application/xml');
      const rows = [];
      Array.from(doc.getElementsByTagName('row')).forEach(rw => {
        const ri = parseInt(rw.getAttribute('r') || (rows.length + 1)) - 1;
        const arr = rows[ri] || (rows[ri] = []);
        Array.from(rw.getElementsByTagName('c')).forEach(c => {
          const ref = c.getAttribute('r') || '';
          const ci = ref ? colIndex(ref) : arr.length;
          const t = c.getAttribute('t');
          let val = '';
          if (t === 'inlineStr') {
            val = Array.from(c.getElementsByTagName('t')).map(x => x.textContent).join('');
          } else {
            const v = c.getElementsByTagName('v')[0];
            const raw = v ? v.textContent : '';
            if (t === 's') val = shared[parseInt(raw)] != null ? shared[parseInt(raw)] : '';
            else val = raw;
          }
          arr[ci] = val;
        });
      });
      for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
      out.push({ name, rows });
    });
    if (!out.length) throw new Error('BAD_XLSX');
    return out;
  }

      const lines = (s.lines || []).map(ln =>
        `<a:p><a:pPr algn="${s.algn || 'l'}"/><a:r><a:rPr lang="th-TH" sz="${ln.sz}" b="${ln.b ? 1 : 0}" dirty="0"><a:solidFill><a:srgbClr val="${ln.color}"/></a:solidFill><a:latin typeface="Prompt"/><a:ea typeface="Prompt"/><a:cs typeface="Prompt"/></a:rPr><a:t>${xe(ln.t)}</a:t></a:r></a:p>`).join('');

    });

    });

    });
    const clr = (n, v) => `<a:${n}><a:srgbClr val="${v}"/></a:${n}>`;
    files.push({
      name: 'ppt/theme/theme1.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<a:theme xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" name="JS Group"><a:themeElements><a:clrScheme name="JS Group"><a:dk1><a:sysClr val="windowText" lastClr="000000"/></a:dk1><a:lt1><a:sysClr val="window" lastClr="FFFFFF"/></a:lt1>${clr('dk2', '1E2822')}${clr('lt2', 'F4F8F4')}${clr('accent1', '3FAE49')}${clr('accent2', '2E8536')}${clr('accent3', '17491D')}${clr('accent4', '2F5D8A')}${clr('accent5', 'D9A300')}${clr('accent6', 'B8412E')}${clr('hlink', '2F5D8A')}${clr('folHlink', '566058')}</a:clrScheme><a:fontScheme name="Prompt"><a:majorFont><a:latin typeface="Prompt"/><a:ea typeface="Prompt"/><a:cs typeface="Prompt"/></a:majorFont><a:minorFont><a:latin typeface="Prompt"/><a:ea typeface="Prompt"/><a:cs typeface="Prompt"/></a:minorFont></a:fontScheme><a:fmtScheme name="JS Group"><a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:fillStyleLst><a:lnStyleLst><a:ln w="9525"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="19050"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="28575"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln></a:lnStyleLst><a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst><a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:bgFillStyleLst></a:fmtScheme></a:themeElements></a:theme>`
    });
    return zipWrite(files);
  }

  function download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  return { zipWrite, zipRead, xlsxWrite, xlsxRead, pptxWrite, download, xe, EMU_PER_PX };
})();

/* ============================================================
   ผังองค์กรแบบลากวางและเชื่อมสายบังคับบัญชาได้อย่างอิสระ
   วาดด้วย SVG ในไฟล์ ส่งออกเป็นรูปภาพ PPTX และ Excel
   ============================================================ */
const CH = (function () {
  // ค่าระยะของผัง แบบแถวแนวนอน และแบบห้อยแนวตั้ง
  const HGAP = 28, VGAP = 72;          // แบบแถว
  const HANG_X = 58, HANG_Y = 24, HANG_V = 14, SPINE = 24;  // แบบห้อย
  const MAXROW = 2200;                 // ความกว้างสูงสุดที่ยอมให้กางเป็นแถวเดียว
  const COLGAP = 34, MAXPERCOL = 5;    // ระยะระหว่างคอลัมน์ และจำนวนกล่องสูงสุดต่อคอลัมน์
  const STAFF_X = 54, STAFF_V = 18;    // หน่วยขึ้นตรง ห้อยข้างแกนกลางใต้กล่องแม่
  // ชุดสีตามตาราง JONG STIT Group Organization Level ที่ผู้ใช้ส่งมา 25 ส.ค. 2569
  // กล่องหน่วยงานใช้เส้นขอบหนาและมีเงา กล่องพนักงานใช้เส้นบางไม่มีเงา จะได้แยกออกจากกันทันที
  const SZ = {
    company: { w: 330, h: 68, fs: 17, ss: 12.5, fill: '#a6e7a6', stroke: '#4e9a4e', ink: '#12341a', sink: '#3c5a42' },
    group: { w: 236, h: 60, fs: 15, ss: 12, fill: '#8cc63f', stroke: '#5e8e2a', ink: '#17351a', sink: '#3b5326' },
    division: { w: 214, h: 64, fs: 14.5, ss: 12, fill: '#fbe2cf', stroke: '#c98a56', ink: '#4a3323', sink: '#6c5340' },
    section: { w: 196, h: 58, fs: 13.5, ss: 12, fill: '#d4d4d4', stroke: '#8f8f8f', ink: '#2a2a2a', sink: '#565656' },
    department: { w: 196, h: 58, fs: 13.5, ss: 12, fill: '#dce9f7', stroke: '#8bafd6', ink: '#22344a', sink: '#4a5c72' },
    emp: { w: 206, h: 62, fs: 13, ss: 12, fill: '#ffffff', stroke: '#2f5d8a', ink: '#1e2822', sink: '#566058' },
    empd: { w: 206, h: 62, fs: 13, ss: 12, fill: '#ffffff', stroke: '#d9a300', ink: '#1e2822', sink: '#566058' },
  };
  let MC = null;
  function ctx() {
    if (!MC) { MC = document.createElement('canvas').getContext('2d'); }
    return MC;
  }
  function fontStr(size, weight) { return `${weight} ${size}px Prompt, "Leelawadee UI", Tahoma, sans-serif`; }
  function wrap(text, size, weight, maxW, maxLines) {
    const c = ctx();
    c.font = fontStr(size, weight);
    const words = String(text || '').split(/(\s+)/).filter(x => x !== '');
    const lines = [];
    let cur = '';
    const push = () => { if (cur) { lines.push(cur.trim()); cur = ''; } };
    for (const w of words) {
      const test = cur + w;
      if (c.measureText(test).width > maxW && cur) {
        push(); cur = w.trim() ? w : '';
      } else cur = test;
      // คำเดี่ยวยาวเกินกล่อง ตัดทีละอักษร
      while (c.measureText(cur).width > maxW && cur.length > 1) {
        let cut = cur.length;
        while (cut > 1 && c.measureText(cur.slice(0, cut)).width > maxW) cut--;
        lines.push(cur.slice(0, cut));
        cur = cur.slice(cut);
      }
      if (lines.length >= maxLines) break;
    }
    push();
    if (lines.length > maxLines) {
      const keep = lines.slice(0, maxLines);
      let last = keep[maxLines - 1];
      while (last.length > 1 && c.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      keep[maxLines - 1] = last + '…';
      return keep;
    }
    return lines.length ? lines : [''];
  }

  /* ---------- สร้างรายการโหนดที่มองเห็นตามขอบเขตและระดับ ---------- */
  function scopeRoot() { return UI.scope === 'all' ? rootId() : (IDX[UI.scope] ? UI.scope : rootId()); }
  function scopeKey() { return UI.scope + '|' + UI.depth; }
  function maxLevelIdx() { return DEPTH_ORDER[UI.depth]; }

  function build() {
    const nodes = [], byId = {};
    const rid = scopeRoot();
    const showEmp = UI.depth === 'emp';
    const maxIdx = maxLevelIdx();

    function mkUnit(u, parentNode) {
      const s = SZ[u.level] || SZ.department;
      const nameLines = wrap(u.name, s.fs, 700, s.w - 20, 2);
      const t = totals(u.id);
      const subLines = [];
      if (u.en && u.en !== u.name) subLines.push(...wrap(u.en, s.ss, 500, s.w - 16, 2));
      const head = unitHead(u.id);
      if (head.label) subLines.push(...wrap(head.label, s.ss, 500, s.w - 16, 1));
      const planN = (u.plan === '' || u.plan == null) ? null : Number(u.plan);
      if (!t.t && planN == null) subLines.push('ยังไม่มีพนักงาน');
      if (UI.folded[u.id]) {
        const hid = (LEVELS.indexOf(u.level) + 1 <= maxIdx ? kids(u.id).length : 0) + (showEmp ? empsOf(u.id).length : 0);
        if (hid) subLines.push('พับไว้ ซ่อนกล่องลูก ' + nf(hid) + ' กล่อง');
      }
      const h = Math.max(s.h, 24 + nameLines.length * (s.fs + 4) + subLines.length * (s.ss + 4));
      const n = {
        id: u.id, kind: 'unit', ref: u, level: u.level, w: s.w, h, style: s,
        nameLines, subLines, parent: parentNode ? parentNode.id : null, ukids: [], x: 0, y: 0,
        cntNow: t.t, cntPlan: (u.plan === '' || u.plan == null) ? null : Number(u.plan)
      };
      nodes.push(n); byId[n.id] = n;
      if (parentNode) parentNode.ukids.push(n);
      const li = LEVELS.indexOf(u.level);
      const kidUnits = li + 1 <= maxIdx ? kids(u.id) : [];
      const kidEmps = showEmp ? empsOf(u.id) : [];
      n.hasKids = kidUnits.length > 0 || kidEmps.length > 0;
      n.folded = !!UI.folded[u.id];
      n.hiddenCount = n.folded ? kidUnits.length + kidEmps.length : 0;
      if (!n.folded) {
        for (const c of kidUnits) mkUnit(c, n);
        if (showEmp) mkEmpTree(u.id, n);
      }
      return n;
    }
    // สร้างชั้นของคนในหน่วยจากช่องผู้บังคับบัญชาโดยตรง คนที่ 1 ของไฟล์ต้นทาง
    // หัวหน้าที่อยู่ในหน่วยเดียวกันจะอยู่เหนือลูกน้อง ที่เหลือห้อยกับกล่องหน่วยงาน
    function mkEmpTree(uid, unitNode) {
      const list = empsOf(uid);
      if (!list.length) return;
      const byName = {}, byEid = {};
      for (const e of list) { byName[nkey(e.name)] = e; byEid[e.id] = e; }
      // ไล่หาหัวหน้าจากช่องผู้บังคับบัญชาโดยตรง คนที่ 1 ถึงคนที่ 4 ตามลำดับ
      // ใช้ชื่อแรกที่เป็นคนในหน่วยเดียวกัน ที่เหลือให้ห้อยกับกล่องหน่วยงาน
      const pOf = {};
      for (const e of list) {
        for (let bi = 0; bi < 4; bi++) {
          const b = nkey(e.b[bi]);
          if (b && byName[b] && byName[b].id !== e.id) { pOf[e.id] = byName[b].id; break; }
        }
      }
      for (const e of list) { // ตัดสายที่วนกลับ
        const seen = new Set([e.id]);
        let cur = pOf[e.id];
        while (cur) { if (seen.has(cur)) { delete pOf[e.id]; break; } seen.add(cur); cur = pOf[cur]; }
      }
      const made = {};
      const make = e => {
        if (made[e.id]) return made[e.id];
        made[e.id] = true;
        const par = pOf[e.id] ? make(byEid[pOf[e.id]]) : unitNode;
        return (made[e.id] = mkEmp(e, par));
      };
      for (const e of list) make(e);
    }
    function mkEmp(e, parentNode) {
      const s = e.type === 'm' ? SZ.emp : SZ.empd;
      const nameLines = wrap(e.name, s.fs, 700, s.w - 20, 1);
      const subLines = wrap((e.code ? e.code + ' ' : '') + (e.pos || ''), s.ss, 500, s.w - 16, 2);
      const h = Math.max(s.h, 14 + nameLines.length * (s.fs + 4) + subLines.length * (s.ss + 3));
      const n = {
        id: e.id, kind: 'emp', ref: e, level: 'emp', w: s.w, h, style: s,
        nameLines, subLines, parent: parentNode.id, ukids: [], x: 0, y: 0
      };
      nodes.push(n); byId[n.id] = n;
      parentNode.ukids.push(n);
      return n;
    }
    const root = mkUnit(IDX[rid], null);
    layout(root);
    // ตำแหน่งที่ผู้ใช้ลากเอง ทับค่าที่จัดอัตโนมัติ
    const ov = S.pos[scopeKey()] || {};
    for (const n of nodes) if (ov[n.id]) { n.x = ov[n.id].x; n.y = ov[n.id].y; n.moved = true; }
    return { nodes, byId, root };
  }

  // compact เท่ากับบังคับให้กิ่งนี้แคบ เพื่อให้กิ่งพี่น้องเรียงแนวนอนได้ในกรอบเดียว
  function measure(n, compact) {
    for (const c of n.ukids) measure(c, compact);
    // หน่วยที่ตั้งค่าให้ห้อยข้างแกนกลาง แยกออกจากแถวลูกปกติ
    n._staff = n.ukids.filter(c => c.kind === 'unit' && c.ref.staff);
    n._norm = n.ukids.filter(c => !(c.kind === 'unit' && c.ref.staff));
    const slots = n._norm.length;
    if (!n.ukids.length) { n.boxW = n.w; n.boxH = n.h; n._hang = false; n._staff = []; n._norm = []; return; }
    if (!slots) { n._staff = []; n._norm = n.ukids.slice(); }
    const rowOf = () => {
      const ws = n._norm.map(c => c.boxW);
      return ws.reduce((a, b) => a + b, 0) + HGAP * (ws.length - 1);
    };
    let rowW = rowOf();
    // กางเป็นแถวแนวนอนก่อนเสมอ กว้างเกินกรอบจึงบีบกิ่งลูกให้แคบลงก่อน
    // ถ้ายังกว้างเกิน จึงห้อยแนวตั้งแบบหลายคอลัมน์ ผังจะเต็มกรอบและไม่เป็นคอลัมน์เดียว
    if (UI.spread === 'hang') {
      n._hang = n.level !== 'company';
    } else if (compact) {
      n._hang = n.level !== 'company' && slots > 1;
    } else {
      n._hang = false;
      if (rowW > MAXROW) {
        for (const c of n.ukids) measure(c, true);
        rowW = rowOf();
        if (rowW > MAXROW && n.level !== 'company') n._hang = true;
      }
    }
    if (!n._hang) {
      n._cW = rowW;
      n._cH = n._norm.length ? Math.max(...n._norm.map(c => c.boxH)) : 0;
      n._padR = 0;
      n._vgap = VGAP;
      if (n._staff.length) {
        // หน่วยขึ้นตรง ห้อยข้างแกนกลางระหว่างกล่องแม่กับแถวลูก จึงต้องเผื่อทั้งความสูงและความกว้างด้านขวา
        n._staffW = Math.max(...n._staff.map(c => c.boxW));
        n._staffH = n._staff.reduce((a2, c) => a2 + c.boxH, 0) + STAFF_V * (n._staff.length - 1);
        n._padR = STAFF_X + n._staffW + HGAP;
        n._vgap = Math.max(VGAP, n._staffH + STAFF_V * 2 + 24);
      }
      n.boxW = Math.max(n.w, n._cW) + n._padR;
      n.boxH = n.h + n._vgap + n._cH;
      return;
    }
    // โหมดห้อย กล่องลูกทุกกล่องเรียงลงในคอลัมน์ แบ่งหลายคอลัมน์เมื่อมีมาก
    const items = n._norm.map(c => ({ node: c, w: c.boxW, h: c.boxH }));
    const maxW = Math.max(...items.map(i => i.w));
    const colW = HANG_X + maxW;
    const colsFit = Math.max(1, Math.floor((MAXROW + COLGAP) / (colW + COLGAP)));
    const cols = Math.max(1, Math.min(colsFit, Math.ceil(items.length / MAXPERCOL)));
    const per = Math.ceil(items.length / cols);
    const groups = [];
    for (let i = 0; i < items.length; i += per) groups.push(items.slice(i, i + per));
    n._colItems = groups;
    n._colW = colW;
    n._cW = groups.length * colW + (groups.length - 1) * COLGAP;
    n._cH = Math.max(...groups.map(g => g.reduce((a, i) => a + i.h, 0) + HANG_V * (g.length - 1)));
    // คอลัมน์เดียว แกนตั้งอยู่ใต้กึ่งกลางกล่องแม่ กล่องลูกจึงเยื้องไปทางขวา
    // ต้องนับความกว้างส่วนที่เยื้องออกไปด้วย ไม่อย่างนั้นกิ่งนี้จะล้ำไปทับกิ่งข้างเคียง
    n._single = groups.length === 1;
    n.boxW = n._single
      ? Math.max(n.w, n.w / 2 + (HANG_X - SPINE) + maxW)
      : Math.max(n.w, n._cW);
    n.boxH = n.h + HANG_Y + n._cH;
  }
  function assign(n, x, y) {
    n.y = y;
    if (!n.ukids.length) { n.x = x + (n.boxW - n.w) / 2; return; }
    if (n._hang) {
      // คอลัมน์เดียว กล่องแม่ชิดซ้ายของช่องตัวเอง แกนตั้งอยู่ใต้กึ่งกลางกล่องแม่พอดี
      n.x = n._single ? x : x + (n.boxW - n.w) / 2;
      const left = n._single ? (n.x + n.w / 2 - SPINE) : x + (n.boxW - n._cW) / 2;
      if (!n._single) {
        // หลายคอลัมน์ ให้กล่องแม่อยู่กึ่งกลางระหว่างแกนตั้งขาแรกกับขาสุดท้าย ผังจะสมมาตรซ้ายขวา
        const mid = left + SPINE + (n._colItems.length - 1) * (n._colW + COLGAP) / 2;
        n.x = Math.max(x, mid - n.w / 2);
      }
      const top = y + n.h + HANG_Y;
      n._spines = [];
      n._colItems.forEach((g, ci) => {
        const colLeft = left + ci * (n._colW + COLGAP);
        const sx = colLeft + SPINE;
        n._spines.push(sx);
        let cy = top;
        for (const it of g) {
          assign(it.node, colLeft + HANG_X, cy);
          it.node._spineX = sx;
          it.node._spineCol = ci;
          cy += it.h + HANG_V;
        }
      });
    } else {
      const inner = n.boxW - (n._padR || 0);
      let cx = x + (inner - n._cW) / 2;
      const start = cx, cy = y + n.h + (n._vgap || VGAP);
      for (const c of n._norm) { assign(c, cx, cy); cx += c.boxW + HGAP; }
      n.x = start + n._cW / 2 - n.w / 2;
      if (n._staff && n._staff.length) {
        const trunk = n.x + n.w / 2;
        let sy = y + n.h + STAFF_V;
        for (const c of n._staff) { assign(c, trunk + STAFF_X, sy); c._isStaff = true; sy += c.boxH + STAFF_V; }
      }
    }
  }
  function layout(root) { measure(root, false); assign(root, 0, 0); }

  /* ---------- เส้นเชื่อม เก็บเป็นชุดจุด ใช้ร่วมกันทั้ง SVG รูปภาพ และ PPTX ---------- */
  // ระยะที่ผู้ใช้ลากเส้นเอง เก็บรวมกับตำแหน่งกล่อง โดยใช้คำนำหน้า L: จะได้ส่งออกและนำเข้าไปพร้อมกัน
  function lineOff(id) {
    const m = S.pos[scopeKey()];
    const v = m && m['L:' + id];
    return v ? { x: v.x || 0, y: v.y || 0 } : { x: 0, y: 0 };
  }
  function railY(p) { return p.y + p.h + Math.round(HANG_Y / 2) + lineOff('R:' + p.id).y; }
  function colKey(pid, ci) { return 'S:' + pid + ':' + ci; }
  function spineAt(p, ci) {
    const base = p._spines && p._spines[ci] != null ? p._spines[ci] : p.x + SPINE;
    return base + lineOff(colKey(p.id, ci)).x;
  }
  function spineX(p, c) { return spineAt(p, c && c._spineCol != null ? c._spineCol : 0); }
  function hangRail(p) {
    if (!p._hang || !p._spines || !p._spines.length) return [];
    const ry = railY(p), cx = p.x + p.w / 2;
    const sp = p._spines.map((_, ci) => spineAt(p, ci));
    const lo = Math.min(cx, ...sp), hi = Math.max(cx, ...sp);
    const out = [[[cx, p.y + p.h], [cx, ry]]];
    if (hi - lo > 0.5) out.push([[lo, ry], [hi, ry]]);
    return out;
  }
  function elbowY(p, c) {
    const y1 = p.y + p.h, y2 = c.y;
    // กล่องแม่ที่มีหน่วยขึ้นตรงห้อยอยู่ ต้องลากแกนกลางลงไปเกือบถึงแถวลูก เส้นจะได้ผ่านหน่วยขึ้นตรงทุกกล่อง
    const base = (p._staff && p._staff.length) ? y2 - 24 : y1 + Math.max(16, (y2 - y1) / 2);
    const raw = base + lineOff(c.id).y;
    const lo = Math.min(y1, y2) + 10, hi = Math.max(y1, y2) - 10;
    return hi <= lo ? (y1 + y2) / 2 : Math.max(lo, Math.min(hi, raw));
  }
  function linkSegs(p, c) {
    if (c._isStaff) {                       // หน่วยขึ้นตรง เส้นออกข้างจากแกนกลางของกล่องแม่
      const cy = c.y + c.h / 2;
      return [[[p.x + p.w / 2, cy], [c.x, cy]]];
    }
    if (p._hang) {
      const sx = spineX(p, c);
      const cy = c.y + c.h / 2;
      return [[[sx, railY(p)], [sx, cy], [c.x, cy]]];
    }
    const x1 = p.x + p.w / 2, y1 = p.y + p.h;
    const x2 = c.x + c.w / 2, y2 = c.y;
    const my = elbowY(p, c);
    return [[[x1, y1], [x1, my], [x2, my], [x2, y2]]];
  }
  function allSegs() {
    const out = [];
    for (const n of MODEL.nodes) {
      out.push(...hangRail(n));
      if (n.parent) {
        const p = MODEL.byId[n.parent];
        if (p) out.push(...linkSegs(p, n));
      }
    }
    return out;
  }
  // จุดจับสำหรับลากย้ายเส้น กิ่งที่ห้อยแนวตั้งจับที่แกนกลาง กิ่งที่กางแนวนอนจับที่ข้อศอกของแต่ละเส้น
  const MAXLH = 160;
  function lineHandles() {
    const out = [];
    if (!MODEL || MODEL.nodes.length > MAXLH) return out;
    for (const n of MODEL.nodes) {
      if (n._hang && n._spines && n._spines.length) {
        n._spines.forEach((_, ci) => out.push({
          id: colKey(n.id, ci), yid: 'R:' + n.id, x: spineAt(n, ci), y: railY(n), axis: 'xy',
          name: n.ref.name + (n._spines.length > 1 ? ' ขาที่ ' + (ci + 1) : '')
        }));
      }
      if (!n.parent || n._isStaff) continue;
      const p = MODEL.byId[n.parent];
      if (!p || p._hang) continue;
      out.push({ id: n.id, yid: n.id, x: (p.x + p.w / 2 + n.x + n.w / 2) / 2, y: elbowY(p, n), axis: 'y', name: n.ref.name });
    }
    return out;
  }
  function lhSvg() {
    return lineHandles().map(h =>
      `<g class="lhG" data-lh="${h.id}" data-yid="${h.yid}" data-axis="${h.axis}">
        <circle cx="${h.x}" cy="${h.y}" r="13" fill="rgba(0,0,0,0)"></circle>
        <circle class="lhandle" cx="${h.x}" cy="${h.y}" r="5.5"><title>ลากจุดนี้เพื่อย้ายแนวเส้นของ ${esc(h.name)}</title></circle>
      </g>`).join('');
  }
  function toPath(pts) { return 'M ' + pts.map(p => p[0] + ' ' + p[1]).join(' L '); }

  /* ---------- วาด SVG ---------- */
  let MODEL = null;
  function nodeSvg(n) {
    const s = n.style;
    const inv = false;   // ทุกระดับใช้พื้นอ่อน ตัวหนังสือสีเข้ม ตามชุดสีใหม่
    let ty = 0;
    const total = n.nameLines.length * (s.fs + 4) + n.subLines.length * (s.ss + 4);
    ty = n.h / 2 - total / 2 + s.fs;
    let txt = '';
    for (const l of n.nameLines) {
      txt += `<text class="nodeT${inv ? ' inv' : ''}" x="${n.w / 2}" y="${ty}" style="font-size:${s.fs}px">${esc(l)}</text>`;
      ty += s.fs + 4;
    }
    ty += 2;
    for (const l of n.subLines) {
      txt += `<text class="nodeS${inv ? ' inv' : ''}" x="${n.w / 2}" y="${ty}" style="font-size:${s.ss}px">${esc(l)}</text>`;
      ty += s.ss + 4;
    }
    const boss = n.kind === 'emp' && n.ukids.length > 0;
    const cls = 'nodeRect lv-' + (n.kind === 'emp' ? 'emp' + (n.ref.type === 'd' ? ' t-d' : '') + (boss ? ' boss' : '') : n.level);
    const inner = boss ? `<rect class="nodeInner" x="4" y="4" width="${n.w - 8}" height="${n.h - 8}" rx="9"></rect>` : '';
    const handle = n.kind === 'unit'
      ? `<circle data-handle="${n.id}" cx="${n.w / 2}" cy="${n.h}" r="15" fill="rgba(0,0,0,0)" style="cursor:crosshair"></circle>
         <circle class="handle" data-handle="${n.id}" cx="${n.w / 2}" cy="${n.h}" r="7"><title>ลากจากจุดนี้ไปปล่อยบนกล่องอื่น เพื่อให้กล่องนั้นมาสังกัดหน่วยนี้</title></circle>` : '';
    const fold = n.hasKids
      ? `<g class="foldG" data-tg="${n.id}">
           <circle class="foldC${n.folded ? ' on' : ''}" cx="${n.w - 15}" cy="15" r="10"></circle>
           <text class="foldT${n.folded ? ' on' : ''}" x="${n.w - 15}" y="15">${n.folded ? '+' : '\u2212'}</text>
           <title>${n.folded ? 'กางกล่องลูกของหน่วยนี้' : 'พับกล่องลูกของหน่วยนี้'}</title>
         </g>` : '';
    // ตัวเลขกำลังคนมุมขวาบน จริง ทับ ตามแผน ถ้ายังไม่กรอกแผนจะแสดงเฉพาะจำนวนจริง
    let cnt = '';
    if (n.kind === 'unit') {
      const txtC = n.cntPlan == null ? String(nf(n.cntNow)) : nf(n.cntNow) + '/' + nf(n.cntPlan);
      const short = n.cntPlan != null && n.cntNow < n.cntPlan;
      cnt = `<text class="nodeCnt${short ? ' short' : ''}" x="${n.w - (n.hasKids ? 30 : 9)}" y="15">${esc(txtC)}</text>`;
    }
    return `<g class="nodeG${UI.sel === n.id ? ' sel' : ''}" data-nid="${n.id}" transform="translate(${n.x},${n.y})">
      <rect class="${cls}" width="${n.w}" height="${n.h}" rx="12"></rect>${inner}${txt}${cnt}${handle}${fold}</g>`;
  }
  function render() {
    MODEL = build();
    const svg = document.getElementById('chartSvg');
    if (!svg) return;
    const links = allSegs().map(s => `<path class="link" d="${toPath(s)}"></path>`);
    const v = UI.view;
    svg.innerHTML = `<defs><filter id="boxShadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#1e2822" flood-opacity="0.22"></feDropShadow>
      </filter></defs>
      <g id="cam" transform="translate(${v.tx},${v.ty}) scale(${v.k})">
      <g id="links">${links.join('')}</g>
      <g id="nodes">${MODEL.nodes.map(nodeSvg).join('')}</g><g id="lineh">${lhSvg()}</g>
      <g id="guides"></g>
      <path id="rubber" class="rubber" d="" style="display:none"></path></g>`;
    const tag = document.getElementById('chartTag');
    if (tag) tag.textContent = titleText();
    updatePanel();
  }
  function bbox() {
    const ns = MODEL.nodes;
    const x1 = Math.min(...ns.map(n => n.x)), y1 = Math.min(...ns.map(n => n.y));
    const x2 = Math.max(...ns.map(n => n.x + n.w)), y2 = Math.max(...ns.map(n => n.y + n.h));
    return { x1, y1, x2, y2, w: x2 - x1, h: y2 - y1 };
  }
  // ย่อขยายให้ผังพอดีกรอบทั้งด้านกว้างและด้านสูง กรอบผังสูงคงที่ตามหน้าจอ จึงไม่ต้องดันความสูงตามเนื้อผัง
  function fit() {
    if (!MODEL) MODEL = build();
    const svg = document.getElementById('chartSvg');
    if (!svg) return;
    const pad = 32;
    const r = svg.getBoundingClientRect();
    const w = r.width, h = r.height;
    const b = bbox();
    let k = Math.min((w - pad * 2) / Math.max(b.w, 1), (h - pad * 2) / Math.max(b.h, 1));
    k = Math.max(0.14, Math.min(k, 1.15));
    UI.view.k = k;
    UI.view.tx = Math.max(pad, (w - b.w * k) / 2) - b.x1 * k;
    UI.view.ty = Math.max(pad, (h - b.h * k) / 2) - b.y1 * k;
    render();
  }
  function zoom(f) {
    const svg = document.getElementById('chartSvg');
    const r = svg.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const v = UI.view;
    const nk = Math.min(3, Math.max(0.06, v.k * f));
    v.tx = cx - (cx - v.tx) * (nk / v.k);
    v.ty = cy - (cy - v.ty) * (nk / v.k);
    v.k = nk;
    render();
  }

  // รายการหน่วยย่อยทุกชั้นของหน่วยที่เลือก ตอบคำถามว่าฝ่ายนี้ประกอบด้วยส่วนงานและแผนกอะไรบ้าง
  function subTreeHtml(uid) {
    const rows = [];
    (function walk(id, lv) {
      for (const c of kids(id)) {
        const t = totals(c.id);
        const plan = (c.plan === '' || c.plan == null) ? '' : ' ตามแผน ' + nf(c.plan);
        rows.push(`<li style="margin-left:${lv * 14}px"><b>${esc(LEVEL_TH[c.level])}</b> ${esc(c.name)}
          <span class="label" style="display:inline">${nf(t.t)} คน${esc(plan)}</span></li>`);
        walk(c.id, lv + 1);
      }
    })(uid, 0);
    if (!rows.length) return `<div class="label" style="margin-top:16px">หน่วยนี้ไม่มีหน่วยย่อย</div>`;
    return `<div style="margin-top:16px">
      <div class="label" style="margin-bottom:6px">หน่วยย่อยทั้งหมด ${nf(rows.length)} หน่วย เรียงตามชั้น</div>
      <ul class="subtree">${rows.join('')}</ul></div>`;
  }

  /* ---------- แผงรายละเอียดข้างผัง ---------- */
  function updatePanel() {
    const box = document.getElementById('chartPanel');
    if (!box) return;

  /* ---------- การโต้ตอบ ลากวางและเชื่อมต่อ ---------- */
  let drag = null, conn = null, pan = null, linkFrom = null, ldrag = null;

  /* ---------- เส้นไกด์และการดูดเข้าแนว แบบโปรแกรมเขียนผัง ---------- */
  const SNAPPX = 9;                    // ระยะดูดบนหน้าจอ หน่วยพิกเซล
  function modeGap(vals) {             // ระยะที่พบบ่อยที่สุดในแถว ปัดเป็นจำนวนเต็ม
    const c = {};
    let best = null;
    for (const v of vals) {
      const k = Math.round(v);
      if (k <= 0) continue;
      c[k] = (c[k] || 0) + 1;
      if (!best || c[k] > c[best]) best = k;
    }
    return best == null ? null : Number(best);
  }
  // คืนตำแหน่งที่ดูดเข้าแนวแล้ว พร้อมรายการเส้นไกด์ที่ต้องวาด
  function snapDrag(n, nx, ny) {
    const out = { x: nx, y: ny, guides: [], note: '' };
    if (!UI.guides) return out;
    const tol = SNAPPX / Math.max(UI.view.k, 0.15);
    const others = MODEL.nodes.filter(o => o.id !== n.id);
    if (!others.length) return out;

    // แนวตั้ง จัดขอบซ้าย กึ่งกลาง ขอบขวา ให้ตรงกับกล่องอื่น
    let bv = null;
    for (const o of others) {
      const oc = [o.x, o.x + o.w / 2, o.x + o.w];
      const mc = [nx, nx + n.w / 2, nx + n.w];
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
        const d = Math.abs(mc[i] - oc[j]);
        if (d <= tol && (!bv || d < bv.d)) bv = { d, dx: oc[j] - mc[i], at: oc[j], o };
      }
    }
    if (bv) {
      out.x = nx + bv.dx;
      out.guides.push({ t: 'v', at: bv.at, a: Math.min(ny, bv.o.y), b: Math.max(ny + n.h, bv.o.y + bv.o.h) });
      out.note = 'ตรงแนวตั้งกับกล่องอื่น';
    }
    // แนวนอน จัดขอบบน กึ่งกลาง ขอบล่าง ให้ตรงกับกล่องอื่น
    let bh = null;
    for (const o of others) {
      const oc = [o.y, o.y + o.h / 2, o.y + o.h];
      const mc = [ny, ny + n.h / 2, ny + n.h];
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
        const d = Math.abs(mc[i] - oc[j]);
        if (d <= tol && (!bh || d < bh.d)) bh = { d, dy: oc[j] - mc[i], at: oc[j], o };
      }
    }
    if (bh) {
      out.y = ny + bh.dy;
      out.guides.push({ t: 'h', at: bh.at, a: Math.min(out.x, bh.o.x), b: Math.max(out.x + n.w, bh.o.x + bh.o.w) });
      out.note = out.note ? 'ตรงแนวตั้งและแนวนอนกับกล่องอื่น' : 'ตรงแนวนอนกับกล่องอื่น';
    }

    // ระยะเท่ากันแนวนอน กล่องที่อยู่แถวเดียวกัน คือมีช่วงแนวตั้งซ้อนทับกัน
    const Y = out.y;
    const row = others.filter(o => o.y < Y + n.h && o.y + o.h > Y).sort((a, b) => a.x - b.x);
    if (row.length) {
      const X = out.x;
      let L = null, R = null;
      for (const o of row) {
        if (o.x + o.w <= X + tol && (!L || o.x + o.w > L.x + L.w)) L = o;
        if (o.x >= X + n.w - tol && (!R || o.x < R.x)) R = o;
      }
      let done = false;
      if (L && R) {
        const ideal = (L.x + L.w + R.x - n.w) / 2;
        if (Math.abs(ideal - X) <= tol) {
          out.x = ideal;
          const gap = (R.x - (L.x + L.w) - n.w) / 2;
          const yy = Y + n.h / 2;
          out.guides.push({ t: 'gap', o: 'h', x1: L.x + L.w, x2: out.x, y: yy, val: gap });
          out.guides.push({ t: 'gap', o: 'h', x1: out.x + n.w, x2: R.x, y: yy, val: gap });
          out.note = 'ระยะซ้ายและขวาเท่ากัน ' + Math.round(gap) + ' หน่วย';
          done = true;
        }
      }
      if (!done && (L || R)) {
        const gaps = [];
        for (let i = 1; i < row.length; i++) { const g = row[i].x - (row[i - 1].x + row[i - 1].w); if (g > 0) gaps.push(g); }
        const g = modeGap(gaps);
        if (g != null) {
          if (L && Math.abs((X - (L.x + L.w)) - g) <= tol) {
            out.x = L.x + L.w + g;
            out.guides.push({ t: 'gap', o: 'h', x1: L.x + L.w, x2: out.x, y: Y + n.h / 2, val: g });
            out.note = 'ระยะห่างเท่ากับระยะที่ใช้อยู่ในแถวนี้ ' + Math.round(g) + ' หน่วย';
          } else if (R && Math.abs((R.x - (X + n.w)) - g) <= tol) {
            out.x = R.x - g - n.w;
            out.guides.push({ t: 'gap', o: 'h', x1: out.x + n.w, x2: R.x, y: Y + n.h / 2, val: g });
            out.note = 'ระยะห่างเท่ากับระยะที่ใช้อยู่ในแถวนี้ ' + Math.round(g) + ' หน่วย';
          }
        }
      }
    }
    // ระยะเท่ากันแนวตั้ง กล่องที่อยู่คอลัมน์เดียวกัน คือมีช่วงแนวนอนซ้อนทับกัน
    const X2 = out.x;
    const col = others.filter(o => o.x < X2 + n.w && o.x + o.w > X2).sort((a, b) => a.y - b.y);
    if (col.length) {
      const Y2 = out.y;
      let U = null, D = null;
      for (const o of col) {
        if (o.y + o.h <= Y2 + tol && (!U || o.y + o.h > U.y + U.h)) U = o;
        if (o.y >= Y2 + n.h - tol && (!D || o.y < D.y)) D = o;
      }
      if (U && D) {
        const ideal = (U.y + U.h + D.y - n.h) / 2;
        if (Math.abs(ideal - Y2) <= tol) {
          out.y = ideal;
          const gap = (D.y - (U.y + U.h) - n.h) / 2;
          const xx = X2 + n.w / 2;
          out.guides.push({ t: 'gap', o: 'v', y1: U.y + U.h, y2: out.y, x: xx, val: gap });
          out.guides.push({ t: 'gap', o: 'v', y1: out.y + n.h, y2: D.y, x: xx, val: gap });
          out.note = 'ระยะบนและล่างเท่ากัน ' + Math.round(gap) + ' หน่วย';
        }
      }
    }
    return out;
  }
  function drawGuides(gs) {
    const box = document.getElementById('guides');
    if (!box) return;
    if (!gs || !gs.length) { box.innerHTML = ''; return; }
    const k = Math.max(UI.view.k, 0.05);
    const sw = 1.2 / k, tick = 7 / k, fs = 12 / k, pad = 26 / k;
    box.innerHTML = gs.map(g => {
      if (g.t === 'v') return `<line class="gline" x1="${g.at}" y1="${g.a - pad}" x2="${g.at}" y2="${g.b + pad}" stroke-width="${sw}"></line>`;
      if (g.t === 'h') return `<line class="gline" x1="${g.a - pad}" y1="${g.at}" x2="${g.b + pad}" y2="${g.at}" stroke-width="${sw}"></line>`;
      if (g.o === 'h') {
        const mid = (g.x1 + g.x2) / 2;
        return `<g><line class="gapline" x1="${g.x1}" y1="${g.y}" x2="${g.x2}" y2="${g.y}" stroke-width="${sw}"></line>
          <line class="gapline" x1="${g.x1}" y1="${g.y - tick}" x2="${g.x1}" y2="${g.y + tick}" stroke-width="${sw}"></line>
          <line class="gapline" x1="${g.x2}" y1="${g.y - tick}" x2="${g.x2}" y2="${g.y + tick}" stroke-width="${sw}"></line>
          <text class="gaptxt" x="${mid}" y="${g.y - tick * 1.6}" font-size="${fs}" text-anchor="middle">${Math.round(g.val)}</text></g>`;
      }
      const midy = (g.y1 + g.y2) / 2;
      return `<g><line class="gapline" x1="${g.x}" y1="${g.y1}" x2="${g.x}" y2="${g.y2}" stroke-width="${sw}"></line>
        <line class="gapline" x1="${g.x - tick}" y1="${g.y1}" x2="${g.x + tick}" y2="${g.y1}" stroke-width="${sw}"></line>
        <line class="gapline" x1="${g.x - tick}" y1="${g.y2}" x2="${g.x + tick}" y2="${g.y2}" stroke-width="${sw}"></line>
        <text class="gaptxt" x="${g.x + tick * 1.6}" y="${midy}" font-size="${fs}" dominant-baseline="middle">${Math.round(g.val)}</text></g>`;
    }).join('');
  }
  // จัดแนวและกระจายระยะกล่องพี่น้อง แบบคำสั่ง align และ distribute ของโปรแกรมเขียนผัง

    const n = UI.sel ? MODEL.byId[UI.sel] : null;
    if (!n) { toast('ยังไม่ได้เลือกกล่อง กดกล่องที่ต้องการก่อน แล้วจึงสั่งจัดแนวหรือกระจายระยะ', true); return; }
    if (!n.parent || !MODEL.byId[n.parent]) { toast('กล่องนี้เป็นกล่องบนสุดของผัง ไม่มีกล่องพี่น้องให้จัดแนว', true); return; }
    const sibs = MODEL.byId[n.parent].ukids.slice().sort((a, b) => a.x - b.x);
    if (sibs.length < (mode === 'dist' ? 3 : 2)) {
      toast(mode === 'dist' ? 'ต้องมีกล่องพี่น้องอย่างน้อยสามกล่องจึงกระจายระยะได้' : 'ต้องมีกล่องพี่น้องอย่างน้อยสองกล่องจึงจัดแนวได้', true);
      return;
    }
    pushHist();
    const k = scopeKey();
    S.pos[k] = S.pos[k] || {};
    let msg;
    if (mode === 'align') {
      for (const s of sibs) { s.y = n.y; S.pos[k][s.id] = { x: s.x, y: s.y }; }
      msg = 'จัดแนวกล่องพี่น้อง ' + sibs.length + ' กล่อง ให้ขอบบนตรงกัน';
    } else {
      const first = sibs[0], last = sibs[sibs.length - 1];
      const span = (last.x + last.w) - first.x;
      const used = sibs.reduce((a, s) => a + s.w, 0);
      const gap = (span - used) / (sibs.length - 1);
      let cx = first.x;
      for (const s of sibs) { s.x = cx; cx += s.w + gap; S.pos[k][s.id] = { x: s.x, y: s.y }; }
      msg = 'กระจายระยะกล่องพี่น้อง ' + sibs.length + ' กล่อง ให้ห่างเท่ากัน ' + Math.round(gap) + ' หน่วย';
    }
    dirty++;
    LOG.unshift({ t: nowStr(), msg });
    renderHeader();
    render();
    toast(msg);
  }
  function toWorld(ev, svg) {
    const r = svg.getBoundingClientRect();
    return { x: (ev.clientX - r.left - UI.view.tx) / UI.view.k, y: (ev.clientY - r.top - UI.view.ty) / UI.view.k };
  }
  function bind() {
    const svg = document.getElementById('chartSvg');
    if (!svg || svg._bound) return;
    svg._bound = true;
    svg.addEventListener('pointerdown', ev => {
      const tg = ev.target.closest('[data-tg]');
      if (tg && !UI.linkMode) {
        const id = tg.getAttribute('data-tg');
        if (UI.folded[id]) delete UI.folded[id]; else UI.folded[id] = true;
