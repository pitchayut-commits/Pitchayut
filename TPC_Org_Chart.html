  // ตรวจจากข้อมูลจริง ไม่ใช่จากกล่องที่มองเห็นบนจอ หน่วยปลายทางจึงอยู่นอกขอบเขตผังที่เปิดอยู่ได้
  function reparent(childId, parentId) {
    if (!childId || !parentId || childId === parentId) { render(); return; }
    const pu = IDX[parentId];
    if (!pu) { toast('กล่องพนักงานเป็นหัวหน้าสังกัดไม่ได้ ต้องเลือกกล่องหน่วยงาน', true); render(); return; }
    const emp = EIDX[childId];
    if (emp) {
      pushHist();
      emp.unit = parentId;
      commit('ย้าย ' + emp.name + ' ไปสังกัด ' + pathOf(parentId));
      return;
    }
    const cu = IDX[childId];
    if (!cu) { render(); return; }
    if (cu.level === 'company') { toast('กล่องบริษัทเป็นรากของผัง ย้ายไปสังกัดหน่วยอื่นไม่ได้', true); render(); return; }
    if (isAncestor(childId, parentId)) { toast('ย้ายไม่ได้ เพราะ ' + pu.name + ' อยู่ใต้ ' + cu.name + ' อยู่แล้ว จะเกิดสายวนกลับ', true); render(); return; }
    if (cu.parent === parentId) { render(); return; }
    pushHist();
    cu.parent = parentId;
    relevel(childId);
    const kill = new Set([childId, ...descend(childId)]);
    for (const k in S.pos) for (const key of Object.keys(S.pos[k])) {
      if (String(key).split(':').some(x => kill.has(x))) delete S.pos[k][key];
    }
    commit('เชื่อมสายบังคับบัญชาใหม่ ' + cu.name + ' ไปอยู่ใต้ ' + pu.name);
  }

  /* ---------- ส่งออกรูปภาพ ---------- */
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function exportPng() {
    if (!MODEL) MODEL = build();
    const b = bbox(), pad = 48, sc = 2;
    const W = Math.ceil((b.w + pad * 2) * sc), H = Math.ceil((b.h + pad * 2) * sc);
    if (W * H > 90e6) { toast('ผังกว้างเกินกว่าจะทำเป็นรูปเดียวได้ ลองเลือกดูเฉพาะฝ่าย แล้วส่งออกใหม่', true); return; }
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
    c.scale(sc, sc);
    c.translate(pad - b.x1, pad - b.y1);
    c.strokeStyle = '#b9c9bb'; c.lineWidth = 2;
    for (const seg of allSegs()) {
      c.beginPath();
      seg.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
      c.stroke();
    }
    for (const n of MODEL.nodes) {
      const s = n.style;
      roundRect(c, n.x, n.y, n.w, n.h, 12);
      c.fillStyle = s.fill; c.fill();
      c.strokeStyle = s.stroke; c.lineWidth = 1.5; c.stroke();
      // กรอบชั้นในของกล่องหัวหน้างาน ต้องวาดให้เหมือนที่เห็นบนจอ
      if (n.kind === 'emp' && n.ukids.length > 0) {
        roundRect(c, n.x + 4, n.y + 4, n.w - 8, n.h - 8, 9);
        c.strokeStyle = s.stroke; c.lineWidth = 1; c.stroke();
      }
      const total = n.nameLines.length * (s.fs + 4) + n.subLines.length * (s.ss + 4);
      let ty = n.y + n.h / 2 - total / 2 + s.fs;
      c.textAlign = 'center'; c.textBaseline = 'alphabetic';
      c.fillStyle = s.ink; c.font = fontStr(s.fs, 700);
      for (const l of n.nameLines) { c.fillText(l, n.x + n.w / 2, ty); ty += s.fs + 4; }
      ty += 2;
      c.fillStyle = s.sink; c.font = fontStr(s.ss, 500);
      for (const l of n.subLines) { c.fillText(l, n.x + n.w / 2, ty); ty += s.ss + 4; }
      if (n.kind === 'unit') {   // ตัวเลขกำลังคนมุมขวาบน เหมือนที่เห็นบนจอ
        c.textAlign = 'right'; c.textBaseline = 'middle';
        c.fillStyle = (n.cntPlan != null && n.cntNow < n.cntPlan) ? '#b8412e' : '#3c5a42';
        c.font = fontStr(11, 700);
        c.fillText(n.cntPlan == null ? String(nf(n.cntNow)) : nf(n.cntNow) + '/' + nf(n.cntPlan),
          n.x + n.w - (n.hasKids ? 30 : 9), n.y + 15);
        c.textBaseline = 'alphabetic';
      }
    }
    cv.toBlob(bl => {
      FZ.download('ผังองค์กร TPC_' + stamp() + '.png', bl);
      toast('ส่งออกรูปภาพแล้ว');
    }, 'image/png');
  }
  function titleText() {
    const r = IDX[scopeRoot()];
    return 'ผังองค์กร ' + (UI.scope === 'all' ? 'บริษัท ไทยโพลีเอสเตอร์ จำกัด' : r.name) + ' ระดับ ' + depthTh();
  }
  function depthTh() {
    return UI.depth === 'division' ? 'ฝ่าย' : UI.depth === 'section' ? 'ส่วนงาน' : UI.depth === 'department' ? 'แผนก' : 'รายบุคคล';
  }

  /* ---------- ส่งออก PPTX ---------- */
  function exportPptx() {
    if (!MODEL) MODEL = build();
    const b = bbox();
    const SW = 1280, SH = 720, M = 46, TOP = 74;
    const sc = Math.min((SW - M * 2) / Math.max(b.w, 1), (SH - TOP - M) / Math.max(b.h, 1));
    const ox = (SW - b.w * sc) / 2 - b.x1 * sc;
    const oy = TOP - b.y1 * sc;
    const X = v => ox + v * sc, Y = v => oy + v * sc;
    const shapes = [];
    shapes.push({
      type: 'text', x: M, y: 24, w: SW - M * 2, h: 40, algn: 'l',
      lines: [{ t: titleText(), sz: 1800, b: true, color: '17491D' }]
    });
    for (const seg of allSegs()) {
      for (let i = 1; i < seg.length; i++) {
        shapes.push({ type: 'line', x1: X(seg[i - 1][0]), y1: Y(seg[i - 1][1]), x2: X(seg[i][0]), y2: Y(seg[i][1]), stroke: 'B9C9BB' });
      }
    }
    for (const n of MODEL.nodes) {
      const s = n.style;
      const lines = n.nameLines.map(t => ({ t, sz: Math.max(700, Math.round(s.fs * sc * 75)), b: true, color: s.ink.replace('#', '').toUpperCase() }))
        .concat(n.subLines.filter(x => x).map(t => ({ t, sz: Math.max(600, Math.round(s.ss * sc * 75)), b: false, color: s.sink.replace('#', '').toUpperCase() })));
      shapes.push({
        type: 'rect', x: X(n.x), y: Y(n.y), w: n.w * sc, h: n.h * sc,
        fill: s.fill.replace('#', '').toUpperCase(), stroke: s.stroke.replace('#', '').toUpperCase(), lines
      });
      // กรอบชั้นในของกล่องหัวหน้างาน ให้เหมือนที่เห็นบนจอและในรูปภาพ
      if (n.kind === 'emp' && n.ukids.length > 0) {
        shapes.push({
          type: 'rect', x: X(n.x) + 4 * sc, y: Y(n.y) + 4 * sc, w: (n.w - 8) * sc, h: (n.h - 8) * sc,
          fill: null, stroke: s.stroke.replace('#', '').toUpperCase(), lines: []
        });
      }
      if (n.kind === 'unit') {
        shapes.push({
          type: 'text', x: X(n.x) + n.w * sc - 46 * sc, y: Y(n.y) + 2, w: 42 * sc, h: 16 * sc, algn: 'r',
          lines: [{ t: n.cntPlan == null ? String(nf(n.cntNow)) : nf(n.cntNow) + '/' + nf(n.cntPlan),
            sz: Math.max(600, Math.round(11 * sc * 75)), b: true,
            color: (n.cntPlan != null && n.cntNow < n.cntPlan) ? 'B8412E' : '3C5A42' }]
        });
      }
    }
    shapes.push({
      type: 'text', x: M, y: SH - 34, w: SW - M * 2, h: 24, algn: 'l',
      lines: [{ t: 'แหล่งข้อมูล ' + S.meta.srcEmp + ' และ ' + S.meta.srcChart, sz: 900, b: false, color: '566058' }]
    });
    const bytes = FZ.pptxWrite([{ shapes, k: 9525 }]);
    FZ.download('ผังองค์กร TPC_' + stamp() + '.pptx', bytes, 'application/vnd.openxmlformats-officedocument.presentationml.presentation');
    toast('ส่งออก PowerPoint แล้ว กล่องและเส้นแก้ไขได้ในโปรแกรม');
  }

  /* ---------- ส่งออกผังเป็น Excel ---------- */
  function exportXlsx() {
    if (!MODEL) MODEL = build();
    const rows = [['ระดับ', 'ชื่อกล่อง', 'ชื่ออังกฤษ', 'สังกัดเหนือขึ้นไป', 'เส้นทางเต็ม', 'รายเดือน', 'รายวัน', 'รวม']];
    for (const n of MODEL.nodes) {
      const p = n.parent ? MODEL.byId[n.parent] : null;
      if (n.kind === 'emp') {
        const e = n.ref;
        rows.push(['พนักงาน', e.name, e.code, p ? p.ref.name : '', pathOf(e.unit), e.type === 'm' ? 1 : 0, e.type === 'd' ? 1 : 0, 1]);
      } else {
        const t = totals(n.ref.id);
        rows.push([LEVEL_TH[n.level], n.ref.name, n.ref.en || '', p ? p.ref.name : '', pathOf(n.ref.id, true), t.m, t.d, t.t]);
      }
    }
    const bytes = FZ.xlsxWrite([{ name: 'ผังองค์กร', rows }]);
    FZ.download('ผังองค์กร TPC_' + stamp() + '.xlsx', bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('ส่งออกผังเป็น Excel แล้ว');
  }

  function autoLayout() {
    const k = scopeKey();
    if (S.pos[k] && Object.keys(S.pos[k]).length) { pushHist(); delete S.pos[k]; dirty++; LOG.unshift({ t: nowStr(), msg: 'จัดผังอัตโนมัติใหม่ ' + titleText() }); }
    render(); fit(); renderHeader();
    toast('จัดผังอัตโนมัติแล้ว');
  }

  function foldAll(on) {
    if (!MODEL) MODEL = build();
    if (!on) { UI.folded = {}; render(); fit(); toast('กางกล่องทั้งหมดแล้ว'); return; }
    const keep = scopeRoot();
    let n2 = 0;
    for (const u of S.units) if (u.id !== keep && kids(u.id).length) { UI.folded[u.id] = true; n2++; }
    render(); fit();
    toast('พับกล่องแล้ว ' + nf(n2) + ' กล่อง กดเครื่องหมายบวกที่มุมกล่อง เพื่อกางทีละกล่อง');
  }
  /* ---------- โหมดเต็มจอ ---------- */
  function fullBox() { return document.querySelector('.canvas-box'); }
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFull() {
    const box = fullBox();
    if (!box) return;
    if (isFull()) {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
      return;
    }
    const req = box.requestFullscreen || box.webkitRequestFullscreen;
    if (!req) { toast('เบราว์เซอร์นี้ไม่รองรับโหมดเต็มจอ ให้กดปุ่ม F11 แทน', true); return; }
    Promise.resolve(req.call(box)).catch(() => toast('เปิดเต็มจอไม่ได้ ให้กดปุ่ม F11 แทน', true));
  }
  function onFullChange() {
    const b = document.getElementById('c-fullscr');
    if (b) b.textContent = isFull() ? 'ออกจากเต็มจอ' : 'เต็มจอ';
    setTimeout(() => { if (UI.tab === 'chart') { render(); fit(); } }, 120);
  }
  document.addEventListener('fullscreenchange', onFullChange);
  document.addEventListener('webkitfullscreenchange', onFullChange);

  return { render, fit, zoom, bind, exportPng, exportPptx, exportXlsx, autoLayout, arrange, foldAll, titleText, hintText, setLinkMode, toggleFull, paintAnchors, build: () => (MODEL = build()) };
})();

/* ---------------- ภาพรวม ---------------- */
function renderOverview() {
  const m = S.emps.filter(e => e.type === 'm').length;
  const d = S.emps.filter(e => e.type === 'd').length;
  const wait = S.emps.filter(e => !e.unit).length;
  const divs = divisionsSorted();
  const secs = S.units.filter(u => u.level === 'section').length;
  const deps = S.units.filter(u => u.level === 'department').length;
  const groups = S.units.filter(u => u.level === 'group');
  let rows = '';
  for (const g of groups) {
    const gd = divs.filter(x => x.parent === g.id);
    if (!gd.length) continue;
    rows += `<tr><td colspan="5" style="background:var(--ground);font-weight:700;color:var(--accent-dark)">${esc(g.name)} <span class="label" style="display:inline">(${esc(g.en)})</span></td></tr>`;
    for (const dv of gd) {
      const t = totals(dv.id);
      rows += `<tr class="clickable" data-div="${dv.id}"><td>${esc(dv.name)}${dv.en && dv.en !== dv.name ? ` <span class="label" style="display:inline">${esc(dv.en)}</span>` : ''}</td>
        <td class="num">${nf(t.m)}</td><td class="num">${nf(t.d)}</td><td class="num"><b>${nf(t.t)}</b></td>
        <td class="label">${t.t === 0 ? 'ยังไม่มีพนักงานในไฟล์รายชื่อ' : ''}</td></tr>`;
    }
  }
  const assignedD = d - wait;
  document.getElementById('view').innerHTML = `
  <div class="stack">
    <div class="kpis">
      <div class="kpi lead"><div class="kpi-value">${nf(m + d)}</div><div class="kpi-label">พนักงานทั้งหมดตามไฟล์ 18 ส.ค. 2569 (คน)</div></div>
      <div class="kpi"><div class="kpi-value">${nf(m)}</div><div class="kpi-label">รายเดือน (คน)</div></div>
      <div class="kpi"><div class="kpi-value">${nf(d)}</div><div class="kpi-label">รายวัน (คน)</div></div>
      <div class="kpi warn"><div class="kpi-value">${nf(wait)}</div><div class="kpi-label">รายวันที่ยังไม่จับคู่สังกัด (คน)</div></div>
    </div>
    <div class="card">
      <h2 class="card-title">กำลังคนรายฝ่าย</h2>
      <div class="label" style="margin-bottom:12px">โครงสร้างปัจจุบัน ฝ่าย ${nf(divs.length)} ส่วนงาน ${nf(secs)} แผนก ${nf(deps)} นับจากสังกัดปัจจุบันในเครื่องมือนี้ รวมหน่วยย่อยทุกชั้น กดที่แถวเพื่อเปิดผังของฝ่ายนั้น พนักงานรายวันที่ยังไม่จับคู่สังกัด ${nf(wait)} คน ยังไม่ถูกนับในตาราง จับคู่แล้ว ${nf(assignedD)} คน</div>
      <div class="tbl-wrap" style="max-height:none"><table>
        <thead><tr><th>ฝ่าย</th><th class="num">รายเดือน</th><th class="num">รายวัน</th><th class="num">รวม</th><th>หมายเหตุ</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr style="font-weight:700"><td>รวมที่มีสังกัดแล้ว</td><td class="num">${nf(m)}</td><td class="num">${nf(assignedD)}</td><td class="num">${nf(m + assignedD)}</td><td></td></tr></tfoot>
      </table></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap">
        <h2 class="card-title" style="margin:0">ข้อสังเกตคุณภาพข้อมูลจากไฟล์ต้นทาง</h2>
        <button id="ov-note" aria-pressed="${UI.showNote}">${UI.showNote ? 'ซ่อนข้อมูล' : 'แสดงข้อมูล'}</button>
      </div>
      ${UI.showNote ? '<div style="margin-top:12px">' + qualityHtml() + '</div>'
      : '<div class="label" style="margin-top:8px">ซ่อนไว้อยู่ กดปุ่ม แสดงข้อมูล เพื่อดูรายการที่ต้องระวังจากไฟล์ต้นทาง</div>'}
    </div>
  </div>`;
  document.getElementById('ov-note').onclick = () => { UI.showNote = !UI.showNote; renderOverview(); };
  document.querySelectorAll('[data-div]').forEach(tr => tr.onclick = () => {
    UI.tab = 'chart'; UI.scope = tr.dataset.div; UI.sel = tr.dataset.div; UI.depth = 'department';
    renderAll(); setTimeout(() => CH.fit(), 40);
  });
}
function qualityHtml() {
  const noCode = S.emps.filter(e => e.type === 'm' && !e.code);
  const wait = S.emps.filter(e => !e.unit).length;
  const caseDup = {};
  for (const u of S.units) {
    if (u.level === 'company' || u.level === 'group') continue;
    const k = (u.parent || '') + '|' + u.name.toLowerCase();
    (caseDup[k] = caseDup[k] || []).push(u);
  }
  const dups = Object.values(caseDup).filter(a => a.length > 1 && new Set(a.map(x => x.name)).size > 1);
  const raw = new Set();
  for (const e of S.emps) for (const b of e.b) if (b) raw.add(b);
  const norm = {};
  for (const b of raw) { const k = b.replace(/\s+/g, ' ').trim(); (norm[k] = norm[k] || []).push(b); }
  const bossVar = Object.values(norm).filter(a => a.length > 1);
  const items = [];
  items.push('พนักงานรายวัน ' + nf(wait) + ' คน ช่องฝ่าย ส่วนงาน แผนก และหัวหน้างานในไฟล์ยังว่าง จึงตั้งเป็นสถานะรอจับคู่สังกัด ให้จับคู่เองที่แท็บ จับคู่สังกัดรายวัน');
  if (noCode.length) items.push('พนักงานรายเดือนไม่มีรหัสพนักงานในไฟล์ ' + noCode.length + ' คน ได้แก่ ' + noCode.map(e => e.name).join(', '));
  if (dups.length) items.push('ชื่อหน่วยงานในสังกัดเดียวกันที่สะกดต่างกันเฉพาะตัวพิมพ์ ' + dups.map(a => a.map(x => x.name).join(' กับ ')).join(' และ ') + ' หากเป็นหน่วยเดียวกัน ใช้ปุ่มย้ายสมาชิกทั้งหมดแล้วลบหน่วยที่ว่าง');
  if (bossVar.length) items.push('ชื่อหัวหน้างานที่สะกดต่างกันเฉพาะช่องว่าง ' + bossVar.map(a => a.join(' กับ ')).join(' และ ') + ' แสดงตามไฟล์ ไม่ได้แก้ให้');
  const planned = S.units.filter(u => u.plan != null && u.plan !== '').length;
  items.push('อัตรากำลังตามแผนไม่มีในไฟล์ต้นทาง จึงต้องกรอกเอง ตอนนี้กรอกแล้ว ' + nf(planned) + ' หน่วย จากทั้งหมด ' + nf(S.units.length) + ' หน่วย กรอกทีละหน่วยที่ปุ่ม แก้ชื่อ ในผัง หรือกรอกทั้งชุดในไฟล์งาน Excel คอลัมน์ อัตรากำลังตามแผน แล้วนำเข้ากลับ');
  return '<ol class="loglist">' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ol>';
}

          <button id="c-in" aria-label="ขยาย">ขยาย</button>
          <button id="c-out" aria-label="ย่อ">ย่อ</button>
        </div>
      </div>
      <div class="hint" id="chartHint"></div>
    </div>
    <aside class="chart-side">
      <div class="card side-sum" id="chartSum"></div>
      <div class="card" id="chartPanel"></div>
    </aside>
  </div>`;
  const v = document.getElementById('view');
  renderChartSum();
  v.querySelector('#chartTag').textContent = CH.titleText();
  v.querySelector('#c-help').onclick = chartHelp;
  v.querySelector('#c-scope').onchange = e => { UI.scope = e.target.value; UI.sel = null; if (UI.scope === 'all' && UI.depth === 'emp') UI.depth = 'division'; renderChart(); setTimeout(() => CH.fit(), 30); };
  v.querySelector('#c-depth').onchange = e => {
    UI.depth = e.target.value;
    if (UI.depth === 'emp' && UI.scope === 'all') { toast('โหมดภาพรวมทุกระดับ มีพนักงานเกือบพันคน ผังจะกว้างมาก ใช้ปุ่ม พับทุกกล่อง แล้วค่อยกางเฉพาะกิ่งที่ต้องการดู'); }
    CH.render(); CH.fit();
  };
  v.querySelector('#c-full').onclick = () => {
    UI.scope = 'all'; UI.depth = 'emp'; UI.folded = {}; UI.sel = null;
    toast('โหมดภาพรวมทุกระดับ แสดงตั้งแต่ฝ่าย ส่วนงาน แผนก ถึงรายชื่อพนักงาน ผังจะกว้างมาก ใช้ปุ่ม พับทุกกล่อง ช่วยย่อได้');
    renderChart(); setTimeout(() => CH.fit(), 40);
  };
  v.querySelector('#c-save').onclick = saveLayout;
  const bu = v.querySelector('#c-undo2');
  bu.disabled = !HIST.length;
  bu.onclick = () => { if (!HIST.length) { toast('ยังไม่มีรายการให้เลิกทำ', true); return; } undo(); };
  v.querySelector('#c-revert').onclick = revertSaved;
  v.querySelector('#c-link').onclick = () => CH.setLinkMode(!UI.linkMode);
  v.querySelector('#chartHint').textContent = CH.hintText();
  v.querySelector('#c-guide').onclick = () => {
    UI.guides = !UI.guides;
    const b = v.querySelector('#c-guide');
    b.setAttribute('aria-pressed', String(UI.guides));
    b.textContent = 'เส้นไกด์';
    toast(UI.guides ? 'เปิดเส้นไกด์แล้ว ลากกล่องเข้าใกล้กล่องอื่นจะดูดเข้าแนวและบอกระยะให้' : 'ปิดเส้นไกด์แล้ว ลากกล่องได้อิสระโดยไม่มีการดูดเข้าแนว');
  };
  v.querySelector('#c-foldall').onclick = () => CH.foldAll(true);
  v.querySelector('#c-openall').onclick = () => CH.foldAll(false);
  v.querySelector('#c-align').onclick = () => CH.arrange('align');
  v.querySelector('#c-dist').onclick = () => CH.arrange('dist');
  v.querySelector('#c-auto').onclick = () => CH.autoLayout();
  v.querySelector('#c-fullscr').onclick = () => CH.toggleFull();
  v.querySelector('#c-fit').onclick = () => CH.fit();
  v.querySelector('#c-in').onclick = () => CH.zoom(1.2);
  v.querySelector('#c-out').onclick = () => CH.zoom(1 / 1.2);
  v.querySelector('#c-png').onclick = () => CH.exportPng();
  v.querySelector('#chartTag').textContent = CH.titleText();
  v.querySelector('#c-ppt').onclick = () => CH.exportPptx();
  v.querySelector('#c-xls').onclick = () => CH.exportXlsx();
  CH.bind();
  CH.render();
  if (!UI.view._init) { UI.view._init = true; setTimeout(() => CH.fit(), 30); }
}

/* แถบสรุปข้างผัง บอกว่ากำลังเปิดผังของหน่วยใด และหน่วยนั้นมีอะไรอยู่บ้าง */
function renderChartSum() {
  const box = document.getElementById('chartSum');
  if (!box) return;
  const wait = S.emps.filter(e => !e.unit).length;
  let title, sub, items;
  if (UI.scope === 'all') {
    const t = totals(rootId());
    items = [
      ['พนักงานที่มีสังกัดแล้ว', nf(t.t) + ' คน'],
      ['รายเดือน', nf(t.m) + ' คน'],
      ['รายวัน', nf(t.d) + ' คน'],
      ['ฝ่าย', nf(S.units.filter(u => u.level === 'division').length) + ' หน่วย'],
      ['ส่วนงาน', nf(S.units.filter(u => u.level === 'section').length) + ' หน่วย'],
      ['แผนก', nf(S.units.filter(u => u.level === 'department').length) + ' หน่วย'],
    ];
    title = 'ผังทั้งบริษัท';
    sub = S.meta.company;
  } else {
    const u = IDX[UI.scope];
    if (!u) { box.innerHTML = '<div class="label">ขอบเขตผังที่เลือกไว้ถูกลบไปแล้ว กดเลือกขอบเขตใหม่ที่แถบด้านบน</div>'; return; }
    const t = totals(u.id);
    const hd = unitHead(u.id);
    items = [
      ['พนักงานรวมทุกหน่วยย่อย', nf(t.t) + ' คน'],
      ['รายเดือน', nf(t.m) + ' คน'],
      ['รายวัน', nf(t.d) + ' คน'],
      ['หน่วยย่อยทุกชั้น', nf(descend(u.id).length) + ' หน่วย'],
      ['หัวหน้าหน่วยตามไฟล์', hd.label ? hd.label.replace('หัวหน้าหน่วย ', '') : 'ยังระบุไม่ได้จากไฟล์'],
    ];
    title = LEVEL_TH[u.level] + ' ' + u.name;
    sub = pathOf(u.id, true);
  }
  box.innerHTML = `<div class="overline">ขอบเขตผังที่เปิดอยู่</div>
    <h3 class="card-title" style="margin-bottom:4px">${esc(title)}</h3>
    <div class="label" style="margin-bottom:12px">${esc(sub)}</div>
    <dl class="sumlist">${items.map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join('')}</dl>
    ${wait ? `<div class="label" style="margin-top:12px">พนักงานรายวันที่ยังไม่จับคู่สังกัด ${nf(wait)} คน ยังไม่ปรากฏในผัง</div>` : ''}
    ${UI.scope === 'all' ? '' : '<div style="margin-top:12px"><button id="sum-all">กลับไปผังทั้งบริษัท</button></div>'}`;
  const back = box.querySelector('#sum-all');
  if (back) back.onclick = () => { UI.scope = 'all'; UI.sel = null; if (UI.depth === 'emp') UI.depth = 'division'; renderChart(); setTimeout(() => CH.fit(), 30); };
}

/* ---------------- รายชื่อพนักงาน ---------------- */
function renderEmps() {
  const divs = divisionsSorted();
  const q = UI.empQ.trim().toLowerCase();
  let list = S.emps.filter(e => {
    if (UI.empType !== 'all' && e.type !== UI.empType) return false;
    if (UI.empStatus === 'wait' && e.unit) return false;
    if (UI.empStatus === 'assigned' && !e.unit) return false;
    if (UI.empDiv !== 'all') {
      if (!e.unit) return false;
      const dv = ancestorAt(e.unit, 'division');
      if (!dv || dv.id !== UI.empDiv) return false;
    }
    if (q) {
      const hay = (e.name + ' ' + e.code + ' ' + e.pos + ' ' + e.legacy + ' ' + (e.unit ? pathOf(e.unit) : '') + ' ' + e.b.join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const key = UI.empSort.key, dir = UI.empSort.dir;
  list.sort((a, b) => {
    let x, y;
    if (key === 'unit') { x = a.unit ? pathDiv(a.unit) : ''; y = b.unit ? pathDiv(b.unit) : ''; }
    else if (key === 'no') { x = (a.type === 'm' ? 0 : 1) * 100000 + (a.no || 0); y = (b.type === 'm' ? 0 : 1) * 100000 + (b.no || 0); }
    else if (key === 'b0') { x = a.b[0] || ''; y = b.b[0] || ''; }
    else { x = a[key] == null ? '' : a[key]; y = b[key] == null ? '' : b[key]; }
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return String(x).localeCompare(String(y), 'th') * dir;
  });
  const ar = k => UI.empSort.key === k ? (UI.empSort.dir === 1 ? ' ก-ฮ' : ' ฮ-ก') : '';
  const rows = list.map(e => `<tr class="clickable" data-emp="${e.id}">
    <td>${esc(e.code) || '<span class="label" style="display:inline">ไม่มีรหัส</span>'}</td>
    <td>${esc(e.name)}</td>
    <td><span class="pill ${e.type}">${e.type === 'm' ? 'รายเดือน' : 'รายวัน'}</span></td>
    <td>${esc(e.pos)}</td>
    <td>${e.unit ? esc(pathDiv(e.unit)) : `<span class="pill wait">รอจับคู่สังกัด</span><br><span class="label" style="display:inline">สังกัดเดิม ${esc(e.legacy)}</span>`}</td>
    <td>${esc(e.b[0])}</td><td>${esc(e.b[1])}</td><td>${esc(e.b[2])}</td><td>${esc(e.b[3])}</td>
    <td>${esc(e.start)}</td></tr>`).join('');
  document.getElementById('view').innerHTML = `
  <div class="card">
    <div class="filters">
      <div><label for="f-q">ค้นหา</label><input id="f-q" style="width:280px" placeholder="ชื่อ รหัส ตำแหน่ง หน่วยงาน หรือหัวหน้า" value="${esc(UI.empQ)}"></div>
      <div><label for="f-type">ประเภท</label><select id="f-type"><option value="all">ทั้งหมด</option><option value="m" ${UI.empType === 'm' ? 'selected' : ''}>รายเดือน</option><option value="d" ${UI.empType === 'd' ? 'selected' : ''}>รายวัน</option></select></div>
      <div><label for="f-div">ฝ่าย</label><select id="f-div"><option value="all">ทุกฝ่าย</option>${divs.map(d => `<option value="${d.id}" ${UI.empDiv === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
      <div><label for="f-status">สถานะสังกัด</label><select id="f-status"><option value="all">ทั้งหมด</option><option value="assigned" ${UI.empStatus === 'assigned' ? 'selected' : ''}>มีสังกัดแล้ว</option><option value="wait" ${UI.empStatus === 'wait' ? 'selected' : ''}>รอจับคู่สังกัด</option></select></div>
      <button id="f-clear">ล้างตัวกรอง</button>
      <button id="f-add">เพิ่มพนักงาน</button>
      <button id="f-imp" class="primary">นำเข้ารายชื่อจาก Excel</button>
      <button id="f-tpl">ดาวน์โหลดแม่แบบ Excel</button>
    </div>
    <div class="label" style="margin-bottom:12px">พบ ${nf(list.length)} คน จากทั้งหมด ${nf(S.emps.length)} คน กดหัวตารางเพื่อเรียงลำดับ กดที่แถวเพื่อแก้ไข</div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th class="sortable" data-sort="code">รหัส${ar('code')}</th>
        <th class="sortable" data-sort="name">ชื่อ นามสกุล${ar('name')}</th>
        <th class="sortable" data-sort="type">ประเภท${ar('type')}</th>
        <th class="sortable" data-sort="pos">ตำแหน่ง${ar('pos')}</th>
        <th class="sortable" data-sort="unit">สังกัดปัจจุบัน${ar('unit')}</th>
        <th class="sortable" data-sort="b0">ผู้บังคับบัญชาโดยตรง คนที่ 1${ar('b0')}</th>
        <th>ผู้บังคับบัญชาชั้นถัดไป คนที่ 2</th>
        <th>ผู้บังคับบัญชาชั้นถัดไป คนที่ 3</th>
        <th>ผู้บังคับบัญชาชั้นถัดไป คนที่ 4</th>
        <th class="sortable" data-sort="start">เข้างาน${ar('start')}</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
  const v = document.getElementById('view');
  v.querySelector('#f-q').oninput = e => { UI.empQ = e.target.value; renderEmps(); };
  v.querySelector('#f-type').onchange = e => { UI.empType = e.target.value; renderEmps(); };
  v.querySelector('#f-div').onchange = e => { UI.empDiv = e.target.value; renderEmps(); };
  v.querySelector('#f-status').onchange = e => { UI.empStatus = e.target.value; renderEmps(); };
  v.querySelector('#f-clear').onclick = () => { UI.empQ = ''; UI.empType = 'all'; UI.empDiv = 'all'; UI.empStatus = 'all'; renderEmps(); };
  v.querySelector('#f-add').onclick = () => empForm(null, null);
  v.querySelector('#f-imp').onclick = () => IO.pickImport('emps');
  v.querySelector('#f-tpl').onclick = () => IO.template('emps');
  v.querySelectorAll('[data-emp]').forEach(el => el.onclick = () => empForm(el.dataset.emp));
  v.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (UI.empSort.key === k) UI.empSort.dir *= -1; else { UI.empSort.key = k; UI.empSort.dir = 1; }
    renderEmps();
  });
  const i = v.querySelector('#f-q');
  i.focus(); i.setSelectionRange(i.value.length, i.value.length);
}

/* ---------------- จับคู่สังกัดรายวัน ---------------- */
function renderMatch() {
  const daily = S.emps.filter(e => e.type === 'd');
  const wait = daily.filter(e => !e.unit);
  const done = daily.length - wait.length;
  const groups = {};
  for (const e of wait) (groups[e.legacy] = groups[e.legacy] || []).push(e);
  let keys = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b, 'th'));
  const q = UI.matchQ.trim().toLowerCase();
  if (q) keys = keys.filter(k => k.toLowerCase().includes(q));
  if (UI.matchSel && !groups[UI.matchSel]) UI.matchSel = keys[0] || null;
  if (!UI.matchSel) UI.matchSel = keys[0] || null;
  const sel = UI.matchSel ? groups[UI.matchSel] : [];
  const pct = daily.length ? Math.round(done / daily.length * 100) : 0;
  document.getElementById('view').innerHTML = `
  <div class="stack">
    <div class="card">
      <h2 class="card-title">ความคืบหน้าการจับคู่สังกัดพนักงานรายวัน</h2>
      <div class="label" style="margin-bottom:12px">ไฟล์ต้นทาง 18 ส.ค. 2569 ยังไม่ระบุฝ่าย ส่วนงาน แผนก และหัวหน้างานของพนักงานรายวันทั้งหมด หน้านี้ให้เลือกกลุ่มสังกัดเดิมทางซ้าย แล้วมอบหมายเข้าหน่วยงานใหม่ทางขวา เครื่องมือจะไม่จับคู่ให้เองเพื่อกันการเดาผิด หรือจะนำเข้าผลจับคู่ทั้งชุดจากไฟล์ Excel ก็ได้ วิธีที่เร็วที่สุดคือกด ดาวน์โหลดแม่แบบ Excel แล้วกรอกในชีท จับคู่ตามสังกัดเดิม ซึ่งกรอกแถวเดียวได้ทั้งกลุ่ม</div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:220px"><div class="bar-out"><div class="bar-in" style="width:${pct}%"></div></div></div>
        <div class="body-sm"><b>จับคู่แล้ว ${nf(done)}</b> จาก ${nf(daily.length)} คน (ร้อยละ ${pct}) เหลือ <b>${nf(wait.length)}</b> คน</div>
        <button id="mt-imp" class="primary">นำเข้าผลจับคู่จาก Excel</button>
        <button id="mt-tpl">ดาวน์โหลดแม่แบบ Excel</button>
      </div>
    </div>
    <div class="match-grid">
      <div class="card">
        <h3 class="card-title">กลุ่มสังกัดเดิมที่ยังไม่จับคู่ (${nf(keys.length)} กลุ่ม)</h3>
        <input id="m-q" placeholder="ค้นหาชื่อสังกัดเดิม" style="width:100%;margin-bottom:12px" value="${esc(UI.matchQ)}">
        <div class="lg-list">${keys.map(k => `<button class="lg-item" aria-pressed="${UI.matchSel === k}" data-lg="${esc(k)}"><span>${esc(k)}</span><span class="cnt">${nf(groups[k].length)} คน</span></button>`).join('') || '<div class="label">ไม่พบกลุ่มที่ค้าง หรือจับคู่ครบแล้ว</div>'}</div>
      </div>
      <div class="card">${UI.matchSel ? `
        <h3 class="card-title">มอบหมายกลุ่ม ${esc(UI.matchSel)} (${nf(sel.length)} คน)</h3>
        <div class="member-list" id="m-members">${sel.map(e => `<label><input type="checkbox" data-mm="${e.id}" checked> <span>${esc(e.code)} ${esc(e.name)} <span class="label" style="display:inline">${esc(e.pos)}</span></span></label>`).join('')}</div>
        <div style="display:flex;gap:8px;margin:12px 0"><button class="link" id="m-all">เลือกทั้งหมด</button><button class="link" id="m-none">ไม่เลือกเลย</button></div>
        <div id="m-cascade"></div>
        <div class="frow" style="margin-top:12px"><div class="full"><label for="m-boss">ผู้บังคับบัญชาโดยตรง คนที่ 1 ของคนกลุ่มนี้ (ไม่บังคับ)</label><input id="m-boss" list="bosslist" style="width:100%" placeholder="เว้นว่างได้"></div></div>
        <div style="display:flex;justify-content:flex-end"><button class="primary" id="m-assign">มอบหมายคนที่เลือกเข้าหน่วยนี้</button></div>`
      : '<div class="label">เลือกกลุ่มสังกัดเดิมจากรายการด้านซ้าย</div>'}</div>
    </div>
  </div>${datalists()}`;
  const v = document.getElementById('view');
  const mq = v.querySelector('#m-q');
  mq.oninput = e => { UI.matchQ = e.target.value; renderMatch(); };
  mq.focus(); mq.setSelectionRange(mq.value.length, mq.value.length);
  v.querySelector('#mt-imp').onclick = () => IO.pickImport('match');
  v.querySelector('#mt-tpl').onclick = () => IO.template('match');
  v.querySelectorAll('[data-lg]').forEach(el => el.onclick = () => { UI.matchSel = el.dataset.lg; renderMatch(); });
  if (UI.matchSel) {
    const casc = makeCascade(v.querySelector('#m-cascade'), null, 'หน่วยงานปลายทาง (เลือกฝ่ายเป็นอย่างน้อย)');
    v.querySelector('#m-all').onclick = () => v.querySelectorAll('[data-mm]').forEach(c => c.checked = true);
    v.querySelector('#m-none').onclick = () => v.querySelectorAll('[data-mm]').forEach(c => c.checked = false);
    v.querySelector('#m-assign').onclick = () => {
      const target = casc.get();
      if (!target) { toast('ยังไม่ได้เลือกหน่วยงานปลายทาง', true); return; }
      const ids = [...v.querySelectorAll('[data-mm]')].filter(c => c.checked).map(c => c.dataset.mm);
      if (!ids.length) { toast('ยังไม่ได้เลือกพนักงาน', true); return; }
      const boss = v.querySelector('#m-boss').value.trim();
      pushHist();
      for (const id of ids) { const e = EIDX[id]; e.unit = target; if (boss) e.b[0] = boss; }
      commit('จับคู่สังกัด ' + ids.length + ' คน จากกลุ่ม ' + UI.matchSel + ' เข้า ' + pathOf(target));
    };
  }
}

      ${e && e.legacy ? `<div class="full"><label>สังกัดเดิมตามไฟล์ (อ่านอย่างเดียว)</label><input value="${esc(e.legacy)}" readonly style="width:100%;background:var(--ground)"></div>` : ''}

      <div><label for="e-b1">ผู้บังคับบัญชาชั้นถัดไป คนที่ 2</label><input id="e-b1" list="bosslist" value="${esc(e ? e.b[1] : '')}" style="width:100%"></div>
      <div><label for="e-b2">ผู้บังคับบัญชาชั้นถัดไป คนที่ 3</label><input id="e-b2" list="bosslist" value="${esc(e ? e.b[2] : '')}" style="width:100%"></div>
      <div><label for="e-b3">ผู้บังคับบัญชาชั้นถัดไป คนที่ 4</label><input id="e-b3" list="bosslist" value="${esc(e ? e.b[3] : '')}" style="width:100%"></div>
    </div>${datalists()}

      <div class="right"><button id="e-cancel">ปิด</button><button class="primary" id="e-save">${isNew ? 'เพิ่มพนักงาน' : 'บันทึกการแก้ไข'}</button></div></div>`);
  const casc = makeCascade(m.querySelector('#e-cascade'), e ? e.unit : presetUnit, 'สังกัด (เว้นว่างทุกช่องคือยังไม่จับคู่)');

    pushHist(); S.emps = S.emps.filter(x => x.id !== e.id); closeModal(); commit('ลบพนักงาน ' + e.name);
  });
  m.querySelector('#e-save').onclick = () => {
    const name = m.querySelector('#e-name').value.trim();

function unitForm(unitId, parentId) {

  const p = parentId ? IDX[parentId] : null;
  const m = openModal(`
    <h2>${u ? 'แก้ชื่อหน่วย ' + esc(u.name) : 'เพิ่มหน่วยใหม่ใต้ ' + esc(p.name)}</h2>
    <div class="frow">
      <div class="full"><label for="u-name">ชื่อหน่วย (ภาษาไทยนำ)</label><input id="u-name" value="${esc(u ? u.name : '')}" style="width:100%"></div>
      <div class="full"><label for="u-en">ชื่อภาษาอังกฤษ (ไม่บังคับ)</label><input id="u-en" value="${esc(u ? u.en : '')}" style="width:100%"></div>
      <div class="full"><label for="u-plan">อัตรากำลังตามแผน (คน) เว้นว่างได้ถ้ายังไม่มีแผน ใส่แล้วกล่องจะแสดงเป็น จำนวนจริง ทับ ตามแผน</label>

      <div class="full"><label style="display:flex;gap:8px;align-items:center;cursor:pointer">
        <input type="checkbox" id="u-staff" ${u && u.staff ? 'checked' : ''} style="width:18px;height:18px;min-height:0">

    </div>
    <div class="mfoot"><div class="right"><button id="u-cancel">ปิด</button><button class="primary" id="u-save">${u ? 'บันทึก' : 'เพิ่มหน่วย'}</button></div></div>`);
  m.querySelector('#u-cancel').onclick = closeModal;
  m.querySelector('#u-save').onclick = () => {
    const name = m.querySelector('#u-name').value.trim();
    const en = m.querySelector('#u-en').value.trim();
    if (!name) { toast('ต้องมีชื่อหน่วย', true); return; }
    pushHist();
    const staff = m.querySelector('#u-staff').checked;
    const planRaw = m.querySelector('#u-plan').value.trim();
    if (planRaw !== '' && !(Number(planRaw) >= 0)) { toast('อัตรากำลังตามแผนต้องเป็นตัวเลขจำนวนคน หรือเว้นว่างไว้', true); return; }
    const plan = planRaw === '' ? undefined : Math.round(Number(planRaw));
    if (u) {
      const old = u.name; u.name = name; u.en = en; u.staff = staff || undefined; u.plan = plan;
      closeModal(); commit('แก้ไขหน่วย ' + old + (old === name ? '' : ' เป็น ' + name) + (staff ? ' และตั้งให้ห้อยข้างแกนกลาง' : ''));
    }
    else {
      const nu = { id: newUnitId(), name, en, level: childLevel(p.level), parent: p.id, src: 'user', ord: 95, staff: staff || undefined, plan };
      S.units.push(nu); UI.sel = nu.id; closeModal(); commit('เพิ่มหน่วย ' + name + ' ใต้ ' + p.name);
    }
  };
}
function moveMembers(unitId) {
  const u = IDX[unitId];
  const members = empsOf(unitId);
  const m = openModal(`
    <h2>ย้ายสมาชิกทั้งหมดของ ${esc(u.name)}</h2>
    <div class="label" style="margin-bottom:12px">ย้ายเฉพาะสมาชิกที่สังกัดหน่วยนี้ตรง ${nf(members.length)} คน ไม่รวมสมาชิกของหน่วยย่อย ใช้สำหรับรวมหน่วยที่ซ้ำกันหรือยุบหน่วย</div>
    <div id="mm-cascade"></div>
    <div class="mfoot"><div class="right"><button id="mm-cancel">ปิด</button><button class="primary" id="mm-save">ย้ายสมาชิก ${nf(members.length)} คน</button></div></div>`);
  const casc = makeCascade(m.querySelector('#mm-cascade'), null, 'หน่วยปลายทาง');
  m.querySelector('#mm-cancel').onclick = closeModal;
  m.querySelector('#mm-save').onclick = () => {
    const t = casc.get();
    if (!t) { toast('ยังไม่ได้เลือกหน่วยปลายทาง', true); return; }
    if (t === unitId) { toast('หน่วยปลายทางซ้ำกับหน่วยเดิม', true); return; }
    pushHist();
    for (const e of members) e.unit = t;
    closeModal(); commit('ย้ายสมาชิก ' + members.length + ' คน จาก ' + u.name + ' ไป ' + pathOf(t));
  };
}

/* ============================================================
   นำเข้าและส่งออกด้วย Excel ทั้งหมด ไฟล์งานเต็ม รายชื่อพนักงาน และผลจับคู่สังกัด
   ============================================================ */
const IO = (function () {
  const SH_UNIT = 'หน่วยงาน', SH_EMP = 'พนักงาน', SH_POS = 'ตำแหน่งกล่องในผัง', SH_MATCH = 'จับคู่สังกัด', SH_HELP = 'วิธีใช้';
  const H_UNIT = ['รหัสหน่วย', 'ชื่อหน่วย', 'ชื่ออังกฤษ', 'ระดับ', 'รหัสหน่วยเหนือ', 'ลำดับแสดง', 'ที่มาของหน่วย', 'ห้อยข้างแกนกลาง', 'อัตรากำลังตามแผน'];
  const H_EMP = ['รหัสภายใน', 'ลำดับตามไฟล์', 'รหัสพนักงาน', 'ชื่อ นามสกุล', 'ประเภท', 'ตำแหน่ง', 'วันที่เข้างาน',
    'สังกัดเดิมตามไฟล์', 'รหัสหน่วยสังกัด', 'เส้นทางสังกัด',
    'ผู้บังคับบัญชาโดยตรง คนที่ 1', 'ผู้บังคับบัญชาชั้นถัดไป คนที่ 2', 'ผู้บังคับบัญชาชั้นถัดไป คนที่ 3', 'ผู้บังคับบัญชาชั้นถัดไป คนที่ 4'];
  const H_POS = ['ขอบเขตผัง', 'รหัสกล่อง', 'ตำแหน่งแนวนอน', 'ตำแหน่งแนวตั้ง', 'ด้านที่ต่อเส้น'];
  const H_MATCH = ['รหัสพนักงาน', 'ชื่อ นามสกุล', 'สังกัดเดิมตามไฟล์', 'ฝ่าย', 'ส่วนงาน', 'แผนก', 'ผู้บังคับบัญชาโดยตรง คนที่ 1'];
  const SH_GRP = 'จับคู่ตามสังกัดเดิม';
  const H_GRP = ['สังกัดเดิมตามไฟล์', 'จำนวนคน', 'ฝ่าย', 'ส่วนงาน', 'แผนก', 'ผู้บังคับบัญชาโดยตรง คนที่ 1'];
  // รวมพนักงานที่ยังไม่มีสังกัด ตามชื่อสังกัดเดิมในไฟล์ต้นทาง กรอกครั้งเดียวได้ทั้งกลุ่ม
  function pendingGroups() {
    const m = {};
    for (const e of S.emps) {
      if (e.unit) continue;
      const k = String(e.legacy || '').trim();
      (m[k] = m[k] || []).push(e);
    }
    return Object.keys(m).map(k => ({ key: k, list: m[k] }))
      .sort((a, b) => b.list.length - a.list.length || a.key.localeCompare(b.key, 'th'));
  }

  const LV_TH2EN = { 'บริษัท': 'company', 'กลุ่มสาย': 'group', 'ฝ่าย': 'division', 'ส่วนงาน': 'section', 'แผนก': 'department' };
  let mode = null;

  function unitRows() {
    return [H_UNIT].concat(S.units.map(u => [u.id, u.name, u.en || '', LEVEL_TH[u.level], u.parent || '', u.ord || 99, u.src || '', u.staff ? 'ใช่' : '', u.plan == null || u.plan === '' ? '' : u.plan]));
  }
  function empRows() {
    return [H_EMP].concat(S.emps.map(e => [e.id, e.no == null ? '' : e.no, e.code, e.name,
      e.type === 'm' ? 'รายเดือน' : 'รายวัน', e.pos, e.start, e.legacy,
      e.unit || '', e.unit ? pathOf(e.unit, true) : 'รอจับคู่สังกัด',
      e.b[0], e.b[1], e.b[2], e.b[3]]));
  }
  function posRows() {
    const rows = [H_POS];
    for (const k in S.pos) for (const id in S.pos[k]) { const v = S.pos[k][id] || {};
      rows.push([k, id, Math.round(v.x || 0), Math.round(v.y || 0), v.s || '']); }
    return rows;
  }
  function helpRows(kind) {
    const base = [['วิธีใช้ไฟล์นี้'], ['']];

  /* ---------- เลือกไฟล์ ---------- */
  function pickImport(m) { mode = m; document.getElementById('fileIn').click(); }

  function header(rows) { return (rows[0] || []).map(x => String(x || '').trim()); }
  function colOf(hdr, name) { return hdr.indexOf(name); }
  function cellAt(row, i) { return i < 0 ? '' : String(row[i] == null ? '' : row[i]).trim(); }

  async function handleFile(file) {
    let book;
    try {
      const buf = await file.arrayBuffer();
      book = await FZ.xlsxRead(buf);
    } catch (err) {
      if (String(err.message) === 'NO_DECOMPRESS') {
        toast('เบราว์เซอร์รุ่นนี้อ่านไฟล์ Excel ไม่ได้ ต้องใช้ Chrome หรือ Edge รุ่นปี 2565 ขึ้นไป', true);
      } else {
        toast('อ่านไฟล์ไม่สำเร็จ ไฟล์นี้ไม่ใช่ไฟล์ Excel ที่ถูกต้อง (.xlsx)', true);
      }
      return;
    }
    const byName = {};
    for (const s of book) byName[s.name.trim()] = s.rows;
    try {
      if (mode === 'work') importWork(byName);
      else if (mode === 'emps') importEmps(byName);
      else importMatch(byName);
    } catch (err) {
      toast('นำเข้าไม่สำเร็จ ' + err.message, true);
    }
  }

  /* ---------- นำเข้าไฟล์งานเต็ม ---------- */
  function importWork(byName) {
    const ur = byName[SH_UNIT], er = byName[SH_EMP];
    if (!ur || !er) throw new Error('ไฟล์นี้ไม่มีชีท ' + SH_UNIT + ' และ ' + SH_EMP + ' จึงไม่ใช่ไฟล์งานของเครื่องมือนี้');
    const uh = header(ur), eh = header(er);
    for (const need of ['รหัสหน่วย', 'ชื่อหน่วย', 'ระดับ', 'รหัสหน่วยเหนือ']) if (colOf(uh, need) < 0) throw new Error('ชีท ' + SH_UNIT + ' ขาดคอลัมน์ ' + need);
    for (const need of ['รหัสภายใน', 'ชื่อ นามสกุล', 'ประเภท']) if (colOf(eh, need) < 0) throw new Error('ชีท ' + SH_EMP + ' ขาดคอลัมน์ ' + need);
    const ci = n => colOf(uh, n), ce = n => colOf(eh, n);
    const units = [];
    for (let i = 1; i < ur.length; i++) {
      const r = ur[i];
      const id = cellAt(r, ci('รหัสหน่วย'));
      if (!id) continue;
      units.push({
        id, name: cellAt(r, ci('ชื่อหน่วย')), en: cellAt(r, ci('ชื่ออังกฤษ')),
        level: LV_TH2EN[cellAt(r, ci('ระดับ'))] || 'department',
        parent: cellAt(r, ci('รหัสหน่วยเหนือ')) || null,
        ord: parseInt(cellAt(r, ci('ลำดับแสดง'))) || 99,
        src: cellAt(r, ci('ที่มาของหน่วย')) || 'user',
        staff: cellAt(r, ci('ห้อยข้างแกนกลาง')) === 'ใช่' ? true : undefined,
        plan: cellAt(r, ci('อัตรากำลังตามแผน')) === '' ? undefined : (Number(cellAt(r, ci('อัตรากำลังตามแผน'))) >= 0 ? Math.round(Number(cellAt(r, ci('อัตรากำลังตามแผน')))) : undefined),
      });
    }
    if (!units.length) throw new Error('ชีท ' + SH_UNIT + ' ไม่มีข้อมูล');
    const uset = new Set(units.map(u => u.id));
    const roots = units.filter(u => !u.parent);
    if (roots.length !== 1) throw new Error('ต้องมีหน่วยรากเพียงหน่วยเดียว แต่ไฟล์นี้มี ' + roots.length + ' หน่วยที่ไม่ระบุหน่วยเหนือ');
    for (const u of units) if (u.parent && !uset.has(u.parent)) throw new Error('หน่วย ' + u.name + ' ระบุหน่วยเหนือเป็น ' + u.parent + ' ซึ่งไม่มีในชีท ' + SH_UNIT);
    const map = {}; units.forEach(u => map[u.id] = u);
    for (const u of units) { let c = u, n = 0; while (c.parent) { c = map[c.parent]; if (++n > 20) throw new Error('พบสายบังคับบัญชาวนกลับที่หน่วย ' + u.name); } }
    const emps = [];
    for (let i = 1; i < er.length; i++) {
      const r = er[i];
      const id = cellAt(r, ce('รหัสภายใน'));
      const name = cellAt(r, ce('ชื่อ นามสกุล'));
      if (!id && !name) continue;
      const un = cellAt(r, ce('รหัสหน่วยสังกัด'));
      emps.push({
        id: id || ('e' + (900000 + i)), no: parseInt(cellAt(r, ce('ลำดับตามไฟล์'))) || null,
        code: cellAt(r, ce('รหัสพนักงาน')), name,
        type: cellAt(r, ce('ประเภท')) === 'รายวัน' ? 'd' : 'm',
        pos: cellAt(r, ce('ตำแหน่ง')), start: cellAt(r, ce('วันที่เข้างาน')),
        legacy: cellAt(r, ce('สังกัดเดิมตามไฟล์')),
        unit: un && uset.has(un) ? un : null,
        b: [1, 2, 3, 4].map(k => cellAt(r, ce(H_EMP[9 + k]))),
      });
    }
    if (!emps.length) throw new Error('ชีท ' + SH_EMP + ' ไม่มีข้อมูล');
    const pos = {};
    const pr = byName[SH_POS];
    if (pr && pr.length > 1) {
      const ph = header(pr);
      const a = colOf(ph, 'ขอบเขตผัง'), b = colOf(ph, 'รหัสกล่อง'), c = colOf(ph, 'ตำแหน่งแนวนอน'), d = colOf(ph, 'ตำแหน่งแนวตั้ง');
      const e = colOf(ph, 'ด้านที่ต่อเส้น');   // ไฟล์รุ่นเก่าไม่มีคอลัมน์นี้ อ่านได้เป็นค่าว่าง
      for (let i = 1; i < pr.length; i++) {
        const k = cellAt(pr[i], a), id = cellAt(pr[i], b);
        if (!k || !id) continue;
        const rec = { x: parseFloat(cellAt(pr[i], c)) || 0, y: parseFloat(cellAt(pr[i], d)) || 0 };
        const sd = e >= 0 ? String(cellAt(pr[i], e) || '').trim() : '';
        if (['t', 'r', 'b', 'l'].indexOf(sd) >= 0) rec.s = sd;
        (pos[k] = pos[k] || {})[id] = rec;
      }
    }
    pushHist();
    applyStaffDefault(units);
    S.units = units; S.emps = emps; S.pos = pos; S.meta.root = roots[0].id;
    UI.scope = 'all'; UI.sel = null; UI.matchSel = null; UI.view._init = false;
    commit('นำเข้าไฟล์งาน หน่วยงาน ' + units.length + ' หน่วย พนักงาน ' + emps.length + ' คน');
  }

  /* ---------- นำเข้ารายชื่อพนักงาน ---------- */
  function importEmps(byName) {
    const er = byName[SH_EMP];
    if (!er) throw new Error('ไฟล์นี้ไม่มีชีทชื่อ ' + SH_EMP + ' กดปุ่ม ดาวน์แบบแม่แบบ Excel เพื่อดูรูปแบบที่ถูกต้อง');
    const eh = header(er);
    for (const need of ['รหัสพนักงาน', 'ชื่อ นามสกุล', 'ประเภท']) if (colOf(eh, need) < 0) throw new Error('ชีท ' + SH_EMP + ' ขาดคอลัมน์ ' + need);
    const ce = n => colOf(eh, n);
    const byCode = {};
    for (const e of S.emps) if (e.code) byCode[e.code] = e;
    const upd = [], add = [], skip = [];
    const staged = [];
    for (let i = 1; i < er.length; i++) {
      const r = er[i];
      const code = cellAt(r, ce('รหัสพนักงาน'));
      const name = cellAt(r, ce('ชื่อ นามสกุล'));
      if (!code && !name) continue;
      if (/^ตัวอย่าง/.test(code)) { skip.push('แถว ' + (i + 1) + ' เป็นแถวตัวอย่างในแม่แบบ'); continue; }
      if (!name) { skip.push('แถว ' + (i + 1) + ' ไม่มีชื่อพนักงาน'); continue; }
      const tRaw = cellAt(r, ce('ประเภท'));
      if (tRaw && tRaw !== 'รายเดือน' && tRaw !== 'รายวัน') { skip.push('แถว ' + (i + 1) + ' ช่องประเภทเป็น ' + tRaw + ' ซึ่งไม่ใช่ รายเดือน หรือ รายวัน'); continue; }
      const un = cellAt(r, ce('รหัสหน่วยสังกัด'));
      staged.push({ i, code, name, tRaw, un, r });
    }
    if (!staged.length) {
      report('ผลการนำเข้ารายชื่อพนักงาน', [
        ['ปรับปรุงข้อมูลเดิม', '0 คน'], ['เพิ่มพนักงานใหม่', '0 คน'], ['ข้ามไป', skip.length + ' แถว'],
      ], skip.length ? skip : ['ชีท ' + SH_EMP + ' ไม่มีแถวข้อมูล มีแต่หัวคอลัมน์']);
      return;
    }
    pushHist();
    const uset = new Set(S.units.map(u => u.id));
    for (const st of staged) {
      const ex = st.code ? byCode[st.code] : null;
      const b = [1, 2, 3, 4].map(k => cellAt(st.r, ce(H_EMP[9 + k])));
      const vals = {
        code: st.code, name: st.name,
        type: st.tRaw === 'รายวัน' ? 'd' : 'm',
        pos: cellAt(st.r, ce('ตำแหน่ง')),
        start: cellAt(st.r, ce('วันที่เข้างาน')),
        legacy: cellAt(st.r, ce('สังกัดเดิมตามไฟล์')),
      };
      if (st.un && uset.has(st.un)) vals.unit = st.un;
      if (b.some(x => x)) vals.b = b;
      if (ex) { Object.assign(ex, vals); upd.push(st.code); }
      else {
        S.emps.push({ id: newEmpId(), no: null, unit: null, b: ['', '', '', ''], legacy: '', ...vals });
        add.push(st.code || st.name);
      }
    }
    commit('นำเข้ารายชื่อจาก Excel ปรับปรุง ' + upd.length + ' คน เพิ่มใหม่ ' + add.length + ' คน', true);
    report('ผลการนำเข้ารายชื่อพนักงาน', [
      ['ปรับปรุงข้อมูลเดิม', upd.length + ' คน'],
      ['เพิ่มพนักงานใหม่', add.length + ' คน'],
      ['ข้ามไป', skip.length + ' แถว'],
    ], skip);
  }

  /* ---------- นำเข้าผลจับคู่สังกัด ---------- */
  function importMatch(byName) {
    const mr = byName[SH_MATCH] || [[]];
    const gr = byName[SH_GRP];
    if (!byName[SH_MATCH] && !gr) throw new Error('ไฟล์นี้ไม่มีชีทชื่อ ' + SH_MATCH + ' หรือ ' + SH_GRP + ' กดปุ่ม ดาวน์โหลดแม่แบบ Excel เพื่อดูรูปแบบที่ถูกต้อง');
    const mh = header(mr);
    if (byName[SH_MATCH]) for (const need of ['รหัสพนักงาน', 'ฝ่าย']) if (colOf(mh, need) < 0) throw new Error('ชีท ' + SH_MATCH + ' ขาดคอลัมน์ ' + need);
    const cm = n => colOf(mh, n);
    const byCode = {};
    for (const e of S.emps) if (e.code) byCode[e.code] = e;
    const divByName = {};
    for (const u of S.units) if (u.level === 'division') divByName[u.name.trim()] = u;
    const staged = [], skip = [];
    for (let i = 1; i < mr.length; i++) {
      const r = mr[i];
      const code = cellAt(r, cm('รหัสพนักงาน'));
      if (!code) continue;
      if (/^ตัวอย่าง/.test(code)) { skip.push('แถว ' + (i + 1) + ' เป็นแถวตัวอย่างในแม่แบบ'); continue; }
      const e = byCode[code];
      if (!e) { skip.push('แถว ' + (i + 1) + ' ไม่พบรหัสพนักงาน ' + code + ' ในทะเบียน'); continue; }
      const dvn = cellAt(r, cm('ฝ่าย'));
      const dv = divByName[dvn];
      if (!dv) { skip.push('แถว ' + (i + 1) + ' ชื่อฝ่าย ' + (dvn || 'ว่าง') + ' ไม่ตรงกับฝ่ายที่มีอยู่ จึงข้ามไป ไม่เดาให้'); continue; }
      staged.push({ e, dv, sec: cellAt(r, cm('ส่วนงาน')), dep: cellAt(r, cm('แผนก')), boss: cellAt(r, cm('ผู้บังคับบัญชาโดยตรง คนที่ 1')) });
    }
    // ชีทจับคู่ตามสังกัดเดิม กรอกแถวเดียวได้ทั้งกลุ่ม
    let gRows = 0;
    if (gr && gr.length > 1) {
      const gh = header(gr);
      const cg = n2 => colOf(gh, n2);
      if (cg('สังกัดเดิมตามไฟล์') < 0 || cg('ฝ่าย') < 0) throw new Error('ชีท ' + SH_GRP + ' ขาดคอลัมน์ สังกัดเดิมตามไฟล์ หรือ ฝ่าย');
      const already = new Set(staged.map(x => x.e.id));
      const byLegacy = {};
      for (const e of S.emps) {
        if (e.unit || already.has(e.id)) continue;
        const k = String(e.legacy || '').trim();
        (byLegacy[k] = byLegacy[k] || []).push(e);
      }
      for (let i = 1; i < gr.length; i++) {
        const r = gr[i];
        const key = cellAt(r, cg('สังกัดเดิมตามไฟล์'));
        if (!key) continue;
        const dvn = cellAt(r, cg('ฝ่าย'));
        if (!dvn) { skip.push('ชีท ' + SH_GRP + ' แถว ' + (i + 1) + ' สังกัดเดิม ' + key + ' ยังไม่กรอกช่องฝ่าย จึงข้ามไป'); continue; }
        const dv = divByName[dvn];
        if (!dv) { skip.push('ชีท ' + SH_GRP + ' แถว ' + (i + 1) + ' ชื่อฝ่าย ' + dvn + ' ไม่ตรงกับฝ่ายที่มีอยู่ จึงข้ามไป ไม่เดาให้'); continue; }
        const list = byLegacy[key];
        if (!list || !list.length) { skip.push('ชีท ' + SH_GRP + ' แถว ' + (i + 1) + ' สังกัดเดิม ' + key + ' ไม่มีพนักงานที่ยังรอจับคู่แล้ว'); continue; }
        const sec = cellAt(r, cg('ส่วนงาน')), dep = cellAt(r, cg('แผนก')), boss = cellAt(r, cg('ผู้บังคับบัญชาโดยตรง คนที่ 1'));
        for (const e of list) staged.push({ e, dv, sec, dep, boss });
        gRows++;
        byLegacy[key] = [];
      }
    }
    if (!staged.length) {
      report('ผลการนำเข้าการจับคู่สังกัด', [
        ['จับคู่สำเร็จ', '0 คน'], ['สร้างหน่วยใหม่ตามไฟล์', '0 หน่วย'], ['ข้ามไป', skip.length + ' แถว'],
      ], skip.length ? skip : ['ชีท ' + SH_MATCH + ' ไม่มีแถวข้อมูล มีแต่หัวคอลัมน์']);
      return;
    }
    pushHist();
    const created = [];
    function findOrCreate(parentId, name, lvl) {
      const found = kids(parentId).find(k => k.name.trim() === name);
      if (found) return found.id;
      const nu = { id: newUnitId(), name, en: '', level: lvl, parent: parentId, src: 'user', ord: 95 };
      S.units.push(nu);
      reindex();
      created.push(name + ' ใต้ ' + IDX[parentId].name);
      return nu.id;
    }
    let n = 0;
    for (const st of staged) {
      let target = st.dv.id;
      if (st.sec) target = findOrCreate(target, st.sec, 'section');
      if (st.dep) target = findOrCreate(target, st.dep, 'department');
      st.e.unit = target;
      if (st.boss) st.e.b[0] = st.boss;
      n++;
    }
    commit('นำเข้าผลจับคู่สังกัดจาก Excel ' + n + ' คน', true);
    report('ผลการนำเข้าการจับคู่สังกัด', [
      ['จับคู่สำเร็จ', n + ' คน'],
      ['มาจากชีทจับคู่ตามสังกัดเดิม', gRows + ' แถว'],
      ['สร้างหน่วยใหม่ตามไฟล์', created.length + ' หน่วย'],
      ['ข้ามไป', skip.length + ' แถว'],
      ['ยังรอจับคู่อีก', S.emps.filter(e => !e.unit).length + ' คน'],
    ], created.map(c => 'สร้างหน่วย ' + c).concat(skip));
  }

  function report(title, pairs, details) {
    const m = openModal(`<h2>${esc(title)}</h2>
      <table style="margin-bottom:16px">${pairs.map(p => `<tr><td>${esc(p[0])}</td><td class="num"><b>${esc(p[1])}</b></td></tr>`).join('')}</table>
      ${details && details.length ? `<div class="notebox" style="margin-bottom:12px">รายการที่ต้องดู ${details.length} รายการ</div>
      <div class="tbl-wrap" style="max-height:260px"><table><tbody>${details.map(d => `<tr><td>${esc(d)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="label">ไม่มีรายการที่ต้องดูเพิ่ม</div>'}
      <div class="mfoot"><div class="right"><button class="primary" id="r-ok">รับทราบ</button></div></div>`);
    m.querySelector('#r-ok').onclick = closeModal;
  }

  return { exportWork, template, pickImport, handleFile };
})();

/* ===== 90-app.js ===== */
/* ============================================================
   ส่วนหัว แท็บ และการประกอบหน้า
   ============================================================ */
const TABS = [['chart', 'ผังองค์กร'], ['overview', 'ภาพรวมกำลังคน'], ['emps', 'รายชื่อพนักงาน'], ['match', 'จับคู่สังกัดรายวัน']];

function renderHeader() {
  const chip = document.getElementById('chip');
  if (dirty > 0) { chip.className = 'chip dirty'; chip.textContent = 'แก้ไขแล้ว ' + nf(dirty) + ' รายการ ยังไม่ได้ส่งออกไฟล์งาน'; }
  else { chip.className = 'chip clean'; chip.textContent = 'ไม่มีการแก้ไขค้าง'; }
  document.getElementById('btn-undo').disabled = !HIST.length;
}
function renderTabs() {
  const wait = S.emps.filter(e => !e.unit).length;
  document.getElementById('tabs').innerHTML = TABS.map(([k, t]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${UI.tab === k}">${t}${k === 'match' && wait ? `<span class="badge">${nf(wait)}</span>` : ''}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; renderAll(); });
}
function renderAll() {
  renderHeader();
  renderTabs();
  // แท็บผังองค์กรเป็นชิ้นงานหลัก จึงขยายพื้นที่หน้าจอให้กว้างกว่าแท็บอื่น
  document.body.classList.toggle('chart-mode', UI.tab === 'chart');
  if (UI.tab === 'overview') renderOverview();
  else if (UI.tab === 'chart') renderChart();
  else if (UI.tab === 'emps') renderEmps();
  else renderMatch();
}

document.getElementById('btn-export').onclick = () => IO.exportWork();
document.getElementById('btn-import').onclick = () => IO.pickImport('work');
document.getElementById('btn-undo').onclick = undo;
document.getElementById('btn-reset').onclick = () => confirmBox(
  'ล้างการแก้ไขทั้งหมดในรอบนี้ แล้วกลับเป็นข้อมูลตามไฟล์ต้นทาง 18 ส.ค. 2569 ใช่หรือไม่', () => {
    pushHist();
    const c = clone(ORIGINAL);
    S.units = c.units; S.emps = c.emps; S.pos = {}; S.meta = c.meta;
    UI.scope = 'all'; UI.sel = null; UI.matchSel = null; UI.view._init = false;
    commit('คืนค่าข้อมูลต้นฉบับทั้งหมด');
  });
document.getElementById('fileIn').addEventListener('change', ev => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (f) IO.handleFile(f);
});
document.getElementById('overlay').addEventListener('click', ev => { if (ev.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });
window.addEventListener('beforeunload', ev => { if (dirty > 0) { ev.preventDefault(); ev.returnValue = ''; } });
window.addEventListener('resize', () => { if (UI.tab === 'chart') CH.render(); });

document.getElementById('subline').textContent =
  S.meta.company;
document.getElementById('foot').textContent =
  'แหล่งข้อมูล ' + S.meta.srcEmp + ' และ ' + S.meta.srcChart + ' ' + S.meta.note +
  ' ข้อมูลพนักงานเป็นข้อมูลส่วนบุคคล ใช้ภายในงานบุคคลของผู้จัดทำเท่านั้น ตามกฎหมายคุ้มครองข้อมูลส่วนบุคคล (PDPA)' +
  ' การแก้ไขทั้งหมดอยู่ในหน่วยความจำของหน้านี้ ก่อนปิดหน้าให้กดปุ่ม ส่งออกไฟล์งาน (Excel) เพื่อเก็บไว้นำเข้าครั้งหน้า';

reindex();
renderAll();

</script>
